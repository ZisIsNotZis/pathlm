  # ==================== F2
  - id: F2-return-channel
    axis: F
    title: 回传通道
    claim: 一轮的结果以什么形式回到下一轮——决定重复能否带来新信息。
    options: [direct（原样回传）, linear 投影, soft 单纯形再量化, hard 离散重嵌, 部分状态掩码, verifier 反馈]
    judge: 每轮 bpc 边际 + 校准（ECE）+ 是否结构性 no-op
    cost: 13M 单臂 ~25 min
    status: judged
    verdict: 直接回传是固定点（结构性 no-op）；软回传有 OOD 污染；离散回传必须门控。
    local:
      tax: "通道税在 F1 的 C 族内（+0.146…+0.178）"
      benefit: "hard 回传 + mixture 投票消除灾难（C5 −1.3pp vs R1 −4.6pp）；mixture 保持 init 质量永久下限（凸包安全）"
      failure:
        - "direct 重入 = 固定点（M0 实测，结构性 no-op）——「无传输的重入无价值」是全项目第一条铁律"
        - "soft 回传 OOD 污染三度复现（见 H2）"
        - "D1 gauge bug：direct/linear mixture 测到的是 ~30× rescale 而非 latent mean（修复后 r2 单调 2.71→1.936；pre-fix 发散至 95.2）"
        - "逐位置状态掩码不省算力（需稀疏 gather/scatter）→ 逐位置门控 latent 版此路不通"
      evidence: [".scratch/02-engine-m0/evidence/REPORT.md @27418ae", ".scratch/11-retry-matrix-validity/VERDICTS.md @d6a9898", ".scratch/12-overnight/evidence @216a00a", ".scratch/13-four-experiments/evidence @9abc181"]

  # ==================== F3
  - id: F3-stopping
    axis: F
    title: 停止条件
    claim: 何时停止迭代——固定、门控、收敛还是预算求解。
    options: [固定轮数, prob0 门控（逐 token）, 收敛判据（Δ 小）, 预算求解器（多货币）]
    judge: 质量-成本前沿 + 门控选择性（按置信分桶的每 FLOP 收益）
    cost: 13M 单臂 ~25–40 min（含校准）
    status: judged
    verdict: 选择性问题（愿景核心命题）获证；预算求解器端到端建成。
    local:
      tax: "分配器本身不额外加税（单轮 mixture == overwrite，设计保证）"
      benefit: "分配选择性：按 prob0 只对最低 15% 开第二轮，INT2 +0.0211 vs 均匀 −0.0193；C1M +0.1284 vs +0.0570（2.2 倍）；收益集中在中低置信带（+0.04~+0.06），高置信带 ≈0/负；严格占优点复现（0.635 fwd/tok @2.0502 vs plain 1.0 @2.0545）；成本模型预测误差 ≤±13%"
      failure:
