      tax: "形态税 +0.6786（13M 首验）→ matched-step 真税 +0.3295 @12k → 100M +0.4362（同引擎干净归属：形态 96% / 引擎 4% / 配方 ≈0）"
      benefit: "tf@4 0.9726、tf@6 0.9946；d6−d12 = 0.0003（半栈 ≈ 全栈）；exit-4 3.1× 墙钟、uniform-exit 1.8×；逐 token 变深度 + 不重 prefill 已实现并逐位测试（max|Δlogit| 9.2e-5）"
      failure:
        - "**端到端实测（ticket 38-W2，真 checkpoint、800/800 token 与贪心逐位相同）**：**深度草稿台提速是真的，但省的是延迟不是算力**——同缓存机械下普通全栈 88.21 tok/s → 深度草稿 **163.83 tok/s（1.86×）**；对仓库原解码器路径 43.77 → **3.74×**（其中 2.02× 属实现层差异，已用 `plain_cache_full` 臂剥离）。**接受率代理是准的但它只量链子第一环**：实测汇总 0.9423 vs TF 代理 0.9694（高估 2.7pp），而**第 1 位真实 0.9704 ≈ 代理 0.9694**，偏差全在链的第 2/3/4 位（0.953/0.935/0.911）。**分级验证（d4→d6→全栈）不值得**：发出流与单级逐 token 相同、只省 0.9% 算力、墙钟反而慢 13%。**双口径分歧**：等效 layer-position/token 8.45 vs 8.00（+5.6%）⇒ **墙钟正收益、FLOPs 负收益**；真 FLOP 杠杆是「直接退 4 层」（4.00/token 半价），用 2.11× FLOPs 把质量买回全栈"
        - "浅层监督加权 sweep 全败且单调反向（w 越低 depth-L 越差 2.45→2.73）→「监督稀释」不是主因，浅层全深度监督是表示正则"
