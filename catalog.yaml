    title: 精度（修饰符）
    claim: 哪些部分必须高精度——决定机制能否稳定训练。
    options: [bf16 autocast（主体）, fp32 读出/损失头（本项目）, 全 fp32, 量化内核（见 R1）]
    judge: 训练稳定性（发散 → 必须可失败地抓）
    cost: 与实验同价
    status: judged
    verdict: reward/判据类损失必须 float32 + pre-step grad-norm gate。
    local:
      tax: "—"
      benefit: "fp32 readout 头是 prob0/传输/提交的地基；强制 fp32 让深度 logits 稳定"
      failure:
        - "bf16 autocast 下的 negative/reward 项两次发散（capped −JS 多样性压力）→ 必须 float32 + pre-step grad-norm gate"
      evidence: [".scratch/09-m3-interactions/evidence @39b1838"]
    notes: 这是「稳定性工程」定律（playbook 第 5 条）的出处。

  - id: P3-param-insertion-init
    axis: P
    title: 参数插入与初始化（修饰符）
    claim: 新参数插在哪、初始化成什么——决定「恒等起步」能否成立。
    options: [无, 恒等初始化 adapter（proj-fill，本项目）, 负偏置门（carry 初始化）, LoRA / 低秩适配器, prefix / prompt 参数]
    judge: 起步是否严格等价于基线（逐位还原）+ 最终质量
    cost: 13M 单臂 ~15–25 min
    status: judged
    verdict: 恒等初始化 adapter 在 13M matched-step 族内最优——「从基线出发学 remap」是对的。
    local:
      tax: "proj-fill 1.8356 < fill 1.8582 < nofill 1.9438（族内最优，全深度逐深度支配 fill）"
      benefit: "恒等初始化不消耗随机数 → 同 seed 下与 fill 臂逐位一致（可严格对照）；carry 门 bias = σ(−2)≈0.12 起步（恒等近似 + 梯度可流）；**单边零**是通用的安全恒等起步写法（输出侧置零 + 输入侧随机）"
      failure:
        - "proj-fill 只在 13M matched-step 验证过，未上 100M"
        - "**恒等初始化 ≠ 零初始化**：全零初始化在乘性结构上是**鞍点**（两端梯度同时为 0）→ 干预系统性失效而测试全绿（详见 W4 的 12k 死干预事件与 SCHEMA §10 干预活性判据）"
        - "契约里写「建议零初始化或极小值」这类把初始化取值判断下放给执行者的措辞会埋坑：必须给定值或给定判据"
      evidence: [".scratch/23-depth-ar/evidence @6b27b5e", ".scratch/23-depth-ar/issues @1586745", "axes/W-width/W4-readout-geometry/experiments/2610-gated-readout-13m-depthar/zero-init-saddle/ @cba2f39"]

