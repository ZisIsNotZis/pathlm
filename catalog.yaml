        - "依赖曲线实测（ticket 31-I）：单距离曲线在 d≥32 上贡献 ≤0.004；但**累计不免费**——只保留最近 32/64/128/192 个位置分别 +0.212/+0.081/+0.020/+0.004 bpc（主 Agent ERRATA：单点曲线不得累加外推）"
