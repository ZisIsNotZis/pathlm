  - id: P5-loss-weighting
    axis: P
    title: 损失权重与调度（修饰符）
    claim: 多目标损失如何加权与调度。
    options: [等权（v1）, 浅层降权 sweep, 退火（末段收紧）, 梯度裁剪/范数门]
    judge: 目标量 + 税 + 稳定性
    cost: 13M 单臂 ~25 min
    status: judged
    verdict: 浅层降权单调反向；退火是当前最优配方的组成部分。
    local:
      tax: "浅层降权全败且单调反向（w∈{1,0.1,0.02,退火}：depth-L 2.45→2.57→2.73）→ 浅层全深度监督是表示正则而非稀释主因"
      benefit: "退火（末 25% 线性 1.0→0.3、final 2×→1.0）使 C 配方成为族内最优（1.8429）"
      failure:
        - "「降低浅层权重以提高最终质量」是错的（全败）"
      evidence: [".scratch/23-depth-ar/evidence @b8c9f86", ".scratch/25-tax-attribution/evidence @2e86924"]

