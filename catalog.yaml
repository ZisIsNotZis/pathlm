    local:
      tax: "consistency loss 中性（IX4 1.6589 ≈ C1 1.6549）；BF16 下 reward 类损失两次发散 → 必须 float32 + pre-step grad-norm gate"
      benefit: "M0 微小模型上 consistency 收紧估计（cosine 0.9525→0.9882）"
      failure:
        - "consistency loss 在真实规模不改善聚合质量（中性）→「让组合被训练出来」的既有手段无效"
        - "negative/reward 项在 bf16 autocast 下不稳定（两次发散教会）"
      evidence: [".scratch/02-engine-m0/evidence/REPORT.md @27418ae", ".scratch/04-m1-runs/evidence @e38349f"]
    deps: [H3-composition, A9-old-info-retention, C6-depth-supervision]
    notes: |
      **修正（ticket 34-B 情报，2026-10-01）：这条路业界已有成熟前例，不是空白格。**
      压缩/重建类训练信号：Compressive Transformer（2019 的 compression loss）、
      AutoCompressors / ICAE / RECOMP / 500xCompressor 类重建或蒸馏目标；DMC 报告 KV 压缩
      需配继续预训练。（均标 `记忆·未核`——本环境联网不可用，需查原文；
      见 `axes/M-carrier/M1-carrier-type/experiments/2617-prior-art-memory/PRIOR_ART.md`。）
      ⇒ 我们的增量只能是 **13M + 局部先验抗性任务（SCHEMA §19）+ 单因素受控 + 源对照臂**，
      **不得**再声称「无人占位」。
      （业界多数压缩工作不报「可重建性」⇒ 带检索腿的判据仍是我们的增量。）

  # ==================== M1
  - id: M1-carrier-type
    axis: M
    title: 状态载体类型
    claim: 跨步信息存在哪里。
    options: [KV cache（本项目唯一）, 递归状态（SSM/RNN）, 显式记忆槽, 外部存储（检索）, 权重（fast-weight）, 无]
    judge: 保留（needle 消融）+ 内存/步长 + 吞吐
    cost: 13M 单臂 ~25–40 min
    status: partial
    verdict: 只有 KV 载体；**ticket 34 造出「不靠语言先验」的长程天平并给出关键诊断：我们 13M 主干的长程能力是「分任务型」的——关联回忆 0.0061、变距离回忆 0.005–0.010（≈或低于 chance）⇒ 检索类彻底缺席；复制 0.1333（距离 223 仍 0.118，毁源→0.0125）与 induction 0.0586（毁源→chance）⇒ 真实但弱。**载体是「能否丢/重算」的决定因素。
    local:
      tax: "—（KV 为基底）"
      benefit: "per-layer KV + 位置散点填充实现了「变深度 + 不重 prefill」（与并行 forward 逐位一致）"
      failure:
        - "早期缓存 bug：逐位置早退导致 per-layer cache 长度失步（已修为 per-layer 位置列表；持续单测）"
        - "**长程检索能力缺席（ticket 34-A 仪器实测）**：关联回忆 0.0061、变距离回忆六档 0.005–0.010，均≈或低于 chance 且无距离依赖 ⇒ 此前所有「没搬」读数，至少相当部分来自**模型本来就没有该能力**，而非「机制搬不动」（SCHEMA §19）"
        - "**仪器落地（`tools/evalkit/longrange_tasks.py`）**：四任务 + chance/局部先验基线 + 距离曲线 + `recall_under_visibility`（复用 retention 掩码）+ 毁源对照臂；自证：局部先验基线 0.0098–0.0217（chance 上限 0.0469）、毁源/打乱答案均掉回 chance、前向逐位一致"
        - "不确定项：induction 每点 n=128 不支持斜率；assoc/var 低分含分布外成分（**不得**外推成「训练也学不会」）；copy 13% 的机制未定位"
      evidence: [".scratch/03-engine-m1/issues @e38349f", "axes/M-carrier/M1-carrier-type/experiments/2617-longrange-task-battery/analysis.md @ticket34", "axes/M-carrier/M1-carrier-type/experiments/2617-prior-art-memory/PRIOR_ART.md @ticket34"]
    deps: [M2-carrier-compression, A9-old-info-retention, F1-iteration-object]

