# Research Wiki 目录枚举（完备性依据）
#
# 这是本仓库「目录完备」的唯一来源：catalog.yaml 枚举的每一格都必须有实体目录与
# README.md（由 tools/build_wiki.py 生成）。内容层的回填（本地实测/失败路径）
# 以本站的 `local:` 块为源，生成的页面只是它的可读渲染。
#
# 轴 = 改变路径空间的独立决策；修饰符 = 不改变路径空间、只改变实现/成本/条件。
# 判据见 SCHEMA.md；方法学见 docs/methodology.md。
#
# 状态取值：
#   stub       未做（本地无数据）——必须给预测与判决实验设计
#   partial    部分做过（只覆盖了部分选项）
#   judged     已判（有本地数据 + 判据 + 证据）
#   falsified  已否证（本地数据明确否定）
#   reference  参照线（先验是行业已有结论，我们没做）

version: 1
project:
  name: PathLM Research Wiki
  one_liner: LM 算力路径设计空间的完备目录 + 单实验 Playbook
  scope: 只做单轴单格实验，基底恒为 stock 对照；不做组合实验（组合留白是显式声明）。
  baseline_13m: B0 = 1.5074 bpc（1.1 epoch 快照；4.4 epoch 渐近 1.3459）
  baseline_100m: B0_100M = 1.4612 bpc（同 token 预算 98.3M = 1.09 epoch）
  variance: nondeterminism 0.0019 / 种子散布 ≤0.0138 → Δ < 0.014 不可排序
  repo_note: 权重（*.pt）与 data/ 不入库；实验目录只放 MODEL.md（哈希+体积+生成命令）。

axes:
  # ============================================================ A
  - id: A
    dir: A-mixing
    title: 序列混合机制
    primitive: II（沿序列推进）
    claim: 一个位置从哪里、以什么算子、按什么寻址方式取信息。
    definition: |
      这条轴决定「一个 token 能看见谁、用什么算子合并、怎么定位」。它同时是
      长上下文成本所在（可见范围）与质量所在（算子表达力）。
    subdims: |
      A1 因果性 · A2 全注意力基线 · A3 窗口/锚点/sink · A4 软距离惩罚 ·
      A5 膨胀跨步窗 · A6 混合算子 · A7 寻址方式 · A8 位置语义 ·
      A9 旧信息处理 · A10 压缩触发与优先级
    local_summary: |
      本地覆盖了「窗口 + 锚点 + 软距离惩罚」这一族（X1/X2/X3）。核心结论：
      丢前缀在 bpc 上很便宜（+0.058~0.121 @13M），但检索当场归零（beyond 0.4%）；
      软距离惩罚是唯一改善 clean bpc 的元素（−0.007），但它不创造保留——
      窗口外 90.3% 的「命中」是局部补全，是最典型的假保留陷阱。
      压缩/摘要/递归/检索式载体在本项目零经验（M 轴亦然）。

  # ============================================================ C
  - id: C
    dir: C-vertical
    title: 垂直机制（深度）
    primitive: I（在同一状态上多花算力）
    claim: 同一位置的算力如何沿「层」组织——跑几层、怎么连、怎么共享、怎么精化。
    definition: |
      这条轴是「Pro 当 Flash 用」的实现地：逐 token 变深度、层间拓扑、权重共享、
      精化算子、以及训练期深度分布（哪条路径被监督）。
    subdims: |
      C1 跑几层 · C2 选哪些层与顺序 · C3 层间拓扑 · C4 权重共享 ·
      C5 精化算子 · C6 训练深度分布
    local_summary: |
      深度自适应形态（ticket 23–25）在本轴上是本项目最厚的资产：
      逐 token 变深度 + 全深度并行监督 + carry 门 + 随机退出深度；
      出口资产 tf@4 0.9726、d6−d12 0.0003、exit-4 3.1× 墙钟，
      代价是同引擎形态税 +0.4362 @100M（96% 干净归属）。
      元素税定律在本轴同样成立：skip +0.175、层序重排 +0.545（最贵）。
      层间拓扑（C3）与权重共享（C4）本地零经验——这是最便宜的真空白。

  # ============================================================ H
  - id: H
    dir: H-horizon
    title: 视界（一次前向产生几个位置）
    primitive: II（沿序列推进） × 头
    claim: 一次前向预测几个未来位置、这些位置在训练时被什么内容填充、输出如何组合与验证。
    definition: |
      MTP 族。本轴的核心不是「质量」（满深度与半栈答案的差距仅 0.0003），
      而是成本：草稿从哪来、接受率多高、验证多贵。
    subdims: |
      H1 每步输出位置数 · H2 训练内容填充 · H3 组合方式 ·
      H4 头与主干关系 · H5 验证机制
    local_summary: |
      税效比全项目最好的一条：n_mtp 1→2 税 +0.041、2→3 +0.0166（递减），
      换 Medusa 批量验证 1.68–1.90× @13M；@100M 墙钟塌到 1.15–1.29×
      （前向 compute-bound），只剩 FLOPs 口径。历史否证：朴素概率复合是
      数学错误（CE 3.96 vs 1.58）；条件链 deploy 0.547 < direct 0.560
      （草稿质量瓶颈，~31% 草稿错误）；consistency loss 中性。
      冻结主干只训头（H4）实测 @100M 零税 → 最便宜的真空白。

  # ============================================================ W
  - id: W
    dir: W-width
    title: 宽度
    primitive: I（在同一状态上多花算力） × 参数
    claim: 每 token 激活多少参数/通道、参数如何组织成专家、读出几何如何。
    definition: |
      宽度轴的两个方向截然不同：减宽 = 减容量（付质量），
      稀疏宽 = 保容量减计算（MoE 族）。读出几何决定「计算空间」与
      「读出可见空间」是否耦合。
    subdims: W1 激活宽度 · W2 专家化 · W3 KV 头共享 · W4 读出几何 · W5 容量-计算
    local_summary: |
      本地只做了「减通道」这一个方向，且结论是负的：结构切分读出（只读前 360 维）
      使模型把状态能量整体迁出读出子空间（切片能量 0.85→0.026→≈0），
      clean 2.1475、恢复 −50.4%。用户本地独立实验（减宽）同样「效果微妙」。
      专家化、KV 头共享、非线性读出全是零经验。

  # ============================================================ F
  - id: F
    dir: F-iteration
    title: 迭代
    primitive: I（在同一状态上多花算力）
    claim: 对什么重复、用什么通道回传、何时停、靠什么训练信号让重复有效。
    definition: |
      与深度同属原语 I；区别在于重复的对象（同 token 状态 / 同段 / 整段 /
      候选集 / 隐式推理步 / 权重）。回传通道决定「重复能否带来新信息」。
    subdims: F1 迭代对象 · F2 回传通道 · F3 停止条件 · F4 训练信号
    local_summary: |
      回环时代的主战场，已收口：直接重入是固定点（结构性 no-op）；
      6 个 latent 回传 cell 跨度仅 0.011 bpc < 种子散布 0.0138 → 全部排序撤回；
      可靠的是「多一遍有价值，回传几何无价值」；soft 回传三度复现 OOD 污染。
      保留的有效资产：选择性门控成立（低置信 15% 开火 +0.128 vs 均匀 +0.057），
      预算求解器与双货币记账建成。去噪整段 / 隐式推理步 / 权重迭代零经验。

  # ============================================================ M
  - id: M
    dir: M-carrier
    title: 状态载体
    primitive: II（沿序列推进） × 记忆
    claim: 跨步信息存在哪里、怎么压、跨步假设是什么。
    definition: |
      载体决定「能否丢、能否重算、能否检索」。KV cache 只是众多载体之一；
      载体选择直接决定部署内存与保留能力。
    subdims: M1 载体类型 · M2 载体压缩 · M3 跨步假设
    local_summary: |
      本地只有 KV 载体（+ eviction 压缩）。递归状态 / 显式记忆槽 / 外部存储 /
      权重载体全零经验——这是「右移压缩」主线的落点。

  # ============================================================ G
  - id: G
    dir: G-policy
    title: 策略与调度
    primitive: 横切（I 与 II 之上）
    claim: 谁选路径、用什么货币记账、观测什么信号、怎么校准、多线如何并行。
    definition: |
      横切轴。任何「路径空间」都需要一个选择器与一个计价方式；
      本轴记录已建成的分配器（Slider）与已测的信号与障碍。
    subdims: G1 选择器 · G2 货币 · G3 观测信号 · G4 校准 · G5 并行多线
    local_summary: |
      前置条件已证：prob0 校准 ECE 0.002–0.011 跨规模存活；选择性成立
      （低置信 15% 开火把重试从 −0.019 翻成 +0.021 / C1M +0.128，2.2 倍）；
      三信号监测栈（prob0 + 路径分歧 js AUC 0.66–0.69 + 重复率 AUC 0.9815）。
      已测障碍（多线调度的真问题）：共享 trunk 的 voter 太相关（集成增益
      +0.0008~+0.0015 可忽略）；确定性路径 K-path 集成恰得 0；多样性必须练进去。

  # ============================================================ R
  - id: R
    dir: R-references
    title: 参照线（必须打败的基线）
    primitive: 横切
    claim: 每条创新线面对的现成行业答案——不打败它，创新就没有意义。
    definition: |
      参照线不是「我们做的「轴」，而是「我们必须超越的对手」。它们决定了
      每条创新线的判据线：例如右移压缩必须打败「就用个窗口」（其 bpc 代价
      仅 +0.058~0.121）。
    subdims: R1 量化 · R2 蒸馏 · R3 剪枝稀疏 · R4 窗口+KV量化+检索 · R5 best-of-n+verifier · R6 MoE · R7 既有早退实现
    local_summary: |
      本地对 R4 的窗口部分与 R5 的集成部分有侧证（X2/X3、TTS），
      其余为行业口径。这些线本地零经验，但决定所有创新线的判据线。

  # ============================================================ P
  - id: P
    dir: P-modifiers
    title: 修饰符（不是轴）
    primitive: 横切（不改变路径空间）
    claim: 只改变实现/成本/条件的决策：精度、条件化信号、参数插入与初始化、归一化位置、损失权重、数据构造。
    definition: |
      修饰符可以作用在任意轴上，因此不是轴；但它们决定实验口径与可比性，
      所以必须成页（否则无法复现别人的实验）。
    subdims: P1 精度 · P2 条件化信号 · P3 参数插入与初始化 · P4 归一化位置 · P5 损失权重 · P6 数据构造
    local_summary: |
      本地踩过两个坑（已上升为定律）：bf16 autocast 下的 reward/consistency 项
      必须 float32 + pre-step grad-norm gate（两次发散）；读出必须 fp32 头。
      正资产：carry 门负偏置初始化（恒等起步）、proj-fill 的逐层恒等初始化
      adapter（13M 族内最优 1.8356 vs fill 1.8582 vs nofill 1.9438）。
      无 final LayerNorm 是同空间前提的一部分。

grids:
  # ==================== A1
  - id: A1-causality
    axis: A
    title: 因果性
    claim: 一个位置允许看见哪些方向的位置——决定「序」是不是前提。
    options:
      - 全因果（standard AR）
      - 块因果（chunk 内双向，chunk 间因果）
      - 段内双向（span bidirectional）
      - 全序无关（order-free，扩散族前提）
    judge: bpc + 任务对「序」的依赖度（消融：打乱输入顺序测质量退化）
    cost: 13M 单臂 ~5–25 min
    status: stub
    industry: |
      扩散 LM（LLaDA/SEDD 系）报告并行解码与可编辑性优势，但困惑度/长文本质量
      仍普遍逊于 AR；块因果与段内双向在检索/摘要类任务上常见。
    local: {}          # 见下方 C2：我们的「层序 shuffle」属 C2，不属本格
    notes: |
      重要区分：本项目测过的「序无关」是层的执行顺序（shuffle-locality，
      属 C2），不是注意力因果性。本格本地无数据——不要误引 shuffle 的 +0.545。

  # ==================== A2
  - id: A2-full-attention
    axis: A
    title: 全注意力基线
    claim: 不做任何可见性约束时的锚点质量。
    options: [全因果 softmax 注意力（无窗、无偏置、无锚）]
    judge: clean bpc（对照锚点）
    cost: 13M 单臂 ~5 min
    status: judged
    verdict: 基底成立，外部锚在公开数字范围内。
    local:
      tax: "—（锚点本身）"
      benefit: "13M B0 = 1.5074 bpc（1.1 epoch 快照）/ 1.3459（4.4 epoch 渐近）；100M B0 = 1.4612（1.09 epoch）"
      failure: []
      evidence:
        - "archive/legacy-docs/findings.md @5495a3b"
        - ".scratch/04-m1-runs/evidence/B0 @e38349f"
        - ".scratch/24-depth-ar-100m/evidence @7cdcdaa"
    notes: |
      所有税的基准。引用任何税之前必须确认对照口径（快照 / 渐近 / matched-step）
      与引擎（同引擎税才是干净归属，见 24b）。

  # ==================== A3
  - id: A3-window-anchor
    axis: A
    title: 窗口 / 锚点 / sink
    claim: 用硬性窗口限制可见范围，把「前缀可丢」变成结构事实。
    options:
      - 滑动窗口（window = k）
      - 窗口 + 锚点槽（前 anchors 个位置永不被驱逐）
      - 窗口 + sink token（attention sink 式保留首 token）
      - 窗口 + 稀疏全局 token（每隔 k 个位置保留一个）
    judge: "KV 消融保留曲线（真删位置 j 的 KV 测损伤）——不是窗口外答对率"
    cost: 13M 单臂 ~15–25 min
    status: judged
    verdict: 丢前缀的代价**由距离与预算共同决定、并不便宜**（见 ERRATA：只保留最近 32 个 = +0.212 bpc）；锚点通道是真产物（76.8→93.3%）；检索腿显示「低损伤 ≠ 保住了」。
    local:
      tax: "+0.121（原 X2 口径）/ +0.058（needle v2 重设计后——改善是测量不是机制）"
      benefit: "ring-buffer 解码免重 prefill；锚点通道 needle 76.8%（+距离惩罚后 93.3%）"
      failure:
        - "needle v1 设计（随机填充单 needle）信号饥饿，全桶测到 0.0 → v2 重设计才可测（假失败的教训：先修测量再判机制）"
        - "beyond-window 桶召回 0.4%（X2v2）——信息是真的丢了，这是设计不是 bug；对抗性误解：不要用窗口外命中率证明保留"
        - "损坏 × 精确复制三路豁免全败（无豁免 0.016 / 锚区豁免 0.033 / 任务级豁免 0.035，且 clean bpc 1.680→1.997）"
      evidence:
        - ".scratch/07-x1-x3/evidence @7b47555"
        - ".scratch/05-m1-followup/evidence @480d50b"
        - ".scratch/13-four-experiments/evidence @9abc181"
    deps: [A4-soft-distance-penalty, M2-carrier-compression, G1-selector]
    notes: |
      这是最接近「右移压缩」的已测机制，也是它的价格上界：
      丢掉整个左前缀只花 +0.06~0.12 bpc。任何压缩/摘要求设计必须打败
      「就用个窗口」——而窗口的 bpc 代价几乎为零。

  # ==================== A4
  - id: A4-soft-distance-penalty
    axis: A
    title: 软距离惩罚（ALiBi 式加性偏置）
    claim: 用可微的距离先验替代硬窗口，让长程依赖「变贵」而非「不可能」。
    options:
      - 固定加性偏置 −w·log(1+d)（本项目实现，w = 0.1）
      - 可学习距离偏置（每 head 一个参数化函数）
      - 相对位置编码（ALiBi / T5 bias 族）
      - 距离衰减乘子（热度式）
    judge: clean bpc（税）+ per-head 平均注意距离遥测（某些 head 必须保持长程）
    cost: 13M 单臂 ~25 min
    status: judged
    verdict: 唯一改善 clean bpc 的元素，但不创造保留——它改变使用率，不改变依赖是否为零。
    local:
      tax: "−0.0068（1.5006 vs B0 1.5074，唯一负税元素）"
      benefit: "锚点通道 76.8% → 93.3%；与驱逐组合共 +0.0043"
      failure:
        - "假保留陷阱：X3 的 beyond-window 命中 90.3%（对照 X2v2 0.4%）不是抗驱逐召回，而是被惩罚训成强 local LM 后用局部统计补全——bpc 改善与长程检索退化可以同时发生（enwik8 局部统计极强）"
        - "全 head 被一起推向局部（per-head 距离 26–43，均值 ~33，无 head 保持长程分工）→ 想「专门写右」需要分工，全局 bias 长不出分工"
        - "注意力偏置只改「从哪读」，不改「写到哪」——信息仍留在原位置的残差里，没有搬运通道"
      evidence:
        - ".scratch/07-x1-x3/evidence/attn_dist_telemetry.json @7b47555"
    deps: [A3-window-anchor, A9-old-info-retention]
    notes: |
      本格是全项目最重要的方法学教训：局部先验会让模型「不需要」信息，
      这与「保住了」在指标上无法区分。任何保留声明必须用 KV 消融判据。

  # ==================== A5
  - id: A5-dilated-window
    axis: A
    title: 膨胀 / 跨步窗
    claim: 用固定稀疏模式覆盖更远范围而省算力。
    options: [跨步(k, stride s), 膨胀(dilation d), 分层（局部密集 + 每 k 一个全局）, 学习式块选择]
    judge: bpc + 远程检索保留（KV 消融）
    cost: 13M 单臂 ~25 min
    status: stub
    industry: Longformer/BigBird 式稀疏模式；现代长上下文多用块稀疏 + 学习式选择（NSA/MoBA）。
    local: {}
    notes: 本地零经验。与 A6 学习式 top-k 算子的边界：固定模式 vs 内容选择。

  # ==================== A6
  - id: A6-mixing-operator
    axis: A
    title: 混合算子
    claim: 用什么算子合并被看见的信息（不改变可见集合，只改变合并方式与成本）。
    options:
      - softmax 注意力（本项目基底）
      - Top-K 稀疏注意力（内容选择式，NSA/MoBA 族）
      - 线性注意力 / kernel 化
      - SSM / 递归扫描（Mamba/RWKV 族）
      - 卷积（局部固定核）
      - 池化（PoolFormer 式无参数混合）
      - MLP-Mixer（token 维全连接混合）
      - 傅里叶 / 全局变换（FNet 族）
    judge: bpc + 长上下文吞吐 + 内存（三段：质量 / 算力 / 内存）
    cost: 13M 单臂 ~25–60 min（内容 top-k 实测步时是全注意力的 2.2×，预算须按实测估）
    status: judged
    verdict: 内容选择式 Top-K 稀疏注意力在 **T=256 上净亏**：质量越删越差（k=32 越界有害、k=64 只在噪声带内），成本**实测上升** 2.2×（慢且更占显存）——稀疏的收益要到长上下文才可能出现。
    local:
      tax: "k=32 Δ = **−0.0166**（越 0.014 界，配对 20/20 批同向，t=−7.7）；k=64 Δ = **−0.0095**（带内但配对可检出，16/20，t=−4.1）；基线 full 1.5304（同配置历史 1.5287 / 重跑 1.5279）；剂量单调（k 越小越差）"
      benefit: "理论：保留键数 −87.5%/−75%、注意力 FLOPs −43.75%/−37.5%（QKᵀ 因内容选择不可省）、整模型每 token FLOPs −6.25%/−5.36%、**KV 缓存 −0%**（结构性）"
      failure:
        - "**成本实测量反方向**：整模型一步 24.34 → 54.02/54.76 ms（**2.22×/2.25× 慢**），进程峰值显存 1.47 → 2.55/2.57 GB（1.7×）；孤岛参考实现（真稀疏 gather）仍 1.63×/2.13× ⇒ 「T=256 净开销」是结论而非实现 bug"
        - "**质量也越界**：k=32 的 Δ 达 −0.0166（>0.014），k=64 仅落在噪声带内（−0.0095）；两臂 loss 斜率同方法可比（0.0025/0.0037/0.0031，极差 0.0012）⇒ 水平差不是收敛差"
        - "交叉点只有公式外推（注意力占比 14.3%@256 → 72.7%@4096），**长 T 端未实测**；2× 训练点未做 ⇒ 限快照口径"
        - "**线性注意力（ticket 33-R）：干预在当前实装下不可行**——三次尝试分别在 step 800/~500/400 停摆（faulthandler 栈落在 `loss.backward()`；停摆前 `den_min` 触 clamp 下限 1e-6、`phi_min` 触 0、gnorm 尖峰 5065.9 vs 基线 0.4–0.8）；5 次诊断二分（chunk 32/64/256 × eps × expandable_segments）全部跑完 ⇒ **非确定性运行时停摆**，不是确定性 bug。执行者拒绝削步数/换算子救场，如实记不可行"
        - "线性注意力的**成本交叉点已实测**（理论与实测并报）：理论 MACs/token/层 131072 → 49664（分块 −62.1%）/ 16896（流式 −87.1%）、推理缓存 T=256 时 −93.6%；**实测整模型 ms/step 比值 2.58@256 → 2.35@512 → 1.74@1024 → 1.53@2048（2048 内未回本）**；注意力子层孤岛在 T=1024 首次反超（0.96×）、T=2048 为 0.68×；峰值显存 1.41–1.47×（涨）"
      evidence2: "axes/A-mixing/A6-mixing-operator/experiments/2616-linear-attention-13m/analysis.md @ticket33"
      evidence: ["axes/A-mixing/A6-mixing-operator/experiments/2614-topk-sparse-attn-13m/analysis.md @ticket31"]
    industry: |
      长上下文吞吐上稀疏/线性/SSM 明显占优；短上下文质量上偏差不一，
      混合架构（注意力 + SSM 层交替，Jamba/Zamba 式）成为主流折中。
      **本地实测为其补上「T=256 时净亏」的下界**：稀疏算子必须先跨过注意力占比的交叉点。
    notes: |
      首探只测了「内容选择式 top-k」；未测位置式/块级稀疏、线性注意力、SSM、池化算子，
      也未测长 T（≥2048）质量是否回本。下一步的自然入口是「把 T 拉长到注意力真正成为瓶颈」。

