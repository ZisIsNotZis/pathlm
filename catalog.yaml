  - id: H3-composition
    axis: H
    title: 多位置预测的组合方式
    claim: 直接头与多跳组合如何合并——这是用户提出的「自门控非线性组合」所在格。
    options:
      - 只用直接头
      - 链式条件（concat+proj，DeepSeek 式）
      - 朴素概率乘积
      - DP lattice 置信加权（设计 §5 已定义，从未端到端测量）
      - "自门控选组合深度（一次跳 k vs 跳 1 走 k 次，由 sigmoid 门决定）"
      - beam 多线 + 重排
    judge: 同 FLOPs 的质量（等算力对照）+ 草稿接受率 + 组合置信度的校准（ECE）
    cost: 13M 单臂 ~25–30 min
    status: todo
    verdict: "**已有**：**本格命题限于「冻结表征上的重复潜在映射与门控」**：direct `T(h)` / composed `T(T(h))` / gated 混合，全部只被 CE(t+2) 监督。它**不回答**用户要的概率路径组合问题（`p(x_{N+2}|h)=Σ_z p(z|h)p(x_{N+2}|h,z)` vs `p_direct`）——`T∘T` 既非「N+1 再加一」、也非「直接 N+2」、更非两者的概率混合（无概率、第一遍不受 N+1 监督）。下述结论**只对该受限命题成立**，不得用作「先 N+1 再 N+2 被否证」。**在该受限命题下被判负**：门控混合 0.4738 仅比直跳 0.4672 高 +0.0020（<0.014 噪声带），且等参数无门对照 0.4785 更高 ⇒ 增益归容量不归门控；门不是「选择」而是**坍缩到连跳**（96.7% 位置 g≈0.82，被压掉的直跳分支只训到 0.262 vs 单训 0.467）。**本格命题的正式回答由 Spec 三臂给出**：`2631-spec-three-arms`（唯一变量 = 第 N+2 草稿位的分布来源：`direct` 从同一状态一次直接出 / `combined` 两条分布按概率混合 λ=0.5 / `chain` 先出 N+1 再以之为条件出 N+2）在 13.4M×2 seed 与 53.9M×1 seed 上一致给出 **direct ≈ combined（配对差 95% CI 含 0，不可排序）> chain（显著更差）**；53.9M 点 α₁/α₂|₁ = **0.844/0.872（direct）· 0.829/0.853（combined）· 0.657/0.826（chain）**、τ = **1.58/1.54/1.20**、tok/fwd = **2.58/2.54/2.20**、墙钟加速比 = **1.58/1.57/1.39**、每 token 算力 **R=(1+γ)/(1+τ) = 1.163/1.183/1.364**（53.9M 点；**均 >1 即净亏**，臂序 direct<combined<chain；旧「等效算力净账 c₃/(tok/fwd) = 0.48/0.49/0.56」把**墙钟比当算力比**，是**符号级错误，已撤回**）；三臂发出流与原生贪心**逐位相同**（门禁 9/9）。**2613 是背景实验**：它测的是冻结表征上的重复潜在映射 T∘T 与门控，回答的不是本命题。**α₁ 差的归因由 `2632-alpha1-attribution` 给出**（同一 checkpoint、只换 N+2 头/条件、不重训）：三臂**共用一份 checkpoint**（发出流逐位相同）⇒ **既非独立训练漂移、也非「chain 目标把头带坏」**；在**真实文本前缀**上 `chain` 的 N+2 草稿与模型自身 AR 输出的**一致率反而更高**（0.842/0.871/0.852，direct 0.677/0.706/0.693，CI 不重叠），2631 的「direct > chain」只在**模型自生成的长循环前缀**上出现 ⇒ **该排序是 regime 依赖的**；`chain` 头本身不差（喂真 `t_{N+1}` 时对真 t+2 准确率 0.59–0.61 > direct 0.45–0.47），代价来自**部署条件（喂模型自己的 argmax）**——条件错时 chain 的真 t+2 质量从 0.67 崩到 0.09（direct 0.64→0.21）。**尚缺（待立项）**：树/多候选（`2632` 的 top-k 召回显示同 K 下不改排序）、温度>0 拒绝采样、无 chain 损失消融（判 ②）、把 `chain2` 换成独立条件块、100M。"
    local:
      tax: "（头机制，挂冻结主干：零税；头的税见 H1）"
      benefit: "省算力：等效 1.95×（H4 口径）；门是可观测量（g 分布 + 逐桶命中单调 0.17→0.68）。**部署口径（`2631-spec-three-arms`）**：direct 路线 tok/fwd **2.58**、墙钟加速比 **1.58×**（只作相对排序，绝对水平受外部占用抬高）、每 token 算力 **R=1.163（净亏）**（53.9M 点；旧 `c₃/(tok/fwd)=0.48` 口径已撤回）"
      failure:
