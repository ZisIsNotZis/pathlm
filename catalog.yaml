      failure:
        - "驱逐 × 复制目标冲突（三路豁免全败，见 A3）"
        - "**保留曲线天平已建成并补了检索腿**（ticket 31-I + 32-M，`tools/evalkit/retention.py`）：三条曲线严格单调、同 seed 重跑最大差 4.94e-07；单距离曲线 d=1 +3.245 / d=8 +0.090 / d=16 +0.017 / 恰在 d=32 ≤+0.004 ⇒ 代价由「离查询多近」决定，几乎与内容无关"
        - "**ERRATA（主 Agent，2026-09-30）：单距离曲线不得当可加外推。** 原入账「安全丢弃半径 d*≈32（d≥32 全丢 <0.014）」是**错的**——把距离 ≥32 的 KV **全部**丢掉（只保留最近 32 个）实测累计 **+0.212 bpc（单点读数的 15 倍）**；只保留最近 64/128/192 分别为 +0.081/+0.020/+0.004。⇒ **左前缀并不便宜**：尾部仍有可观依赖总量；「丢最远 16–32 个」只在极短预算下才近似免费"
        - "**检索腿（ticket 32-M）**：基线召回 68.68%（契约指定的 v2 构造在本 checkpoint 只有 1.5% ⇒ 按契约先修构造，改真实文本短语针 v3）；两腿同向（Pearson −0.472，39/39 配置）但动态范围有限，主判据（低损伤且召回掉 >30pp）未达成；`lru:k=256` 独立复现「低损伤 ≠ 保住了」（bpc 伤害最低 +0.0885 而召回 4.5→22.8pp）"
        - "**该仪器只量「依赖」不量「保留」**（SCHEMA §17 第 10 条）：低损伤也可能是模型本来就不用它——X3「假保留」的另一面。检索腿已排进 ticket 32 契约 M"
      evidence: [".scratch/07-x1-x3/evidence @7b47555", "axes/M-carrier/M2-carrier-compression/experiments/2614-kv-ablation-retention-13m/analysis.md @c39dc88"]
    deps: [A3-window-anchor, W3-kv-head-sharing]

  # ==================== M3
  - id: M3-cross-step-assumption
    axis: M
    title: 跨步假设
    claim: 相邻 token 之间的状态关系——每 token 独立算，还是段级递归。
    options: [每 token 独立（标准 AR）, 段级递归（Transformer-XL 式）, 全量重算]
    judge: 质量 + 内存 + 不重 prefill 能力
    cost: 13M 单臂 ~25–40 min
    status: judged
    verdict: 有界内存的价签已测两档：**窗口 192 的训练税 −0.0028（近零）**、窗口 32 为 +0.0866；但 192 档**本就没有头寸**（未重训限制到 192 只 +0.0029），真正的「训练补回」只在 32 档被测到（+0.1495 → +0.0866，补回 42%）。**窗口外信息仍是「丢了」不是「搬了」**。
    local:
      tax: "窗口 192 训练税 **−0.002813**（1.483569 → 1.480756；重跑 +0.000673 ⇒ 只能报「近零」不能报「更好」）；窗口 32 训练税 **+0.086566**；评测期（全注意力模型）recent:d = 32/64/128/192 → **+0.211815 / +0.080508 / +0.020065 / +0.004175**；带 8 锚点的同族口径 +0.149528 / +0.059563 / +0.014677 / +0.002851"
      benefit: "有界内存的**两档价签**：限制到 192 几乎免费；限制到 32 要付 +0.087。解析 KV 位置 256 → 200（−21.9%），实测显存不下降（分开报）。步时 1.05×（600 步实测）"
      failure:
        - "**限制可见范围不会让信息右移**（检索腿）：窗口外整桶召回 0.475954 vs 同掩码无记忆地板 0.444444（+3.2pp < 10pp 门槛）；拆开后**整段都在窗口外的 494 根差恰好 0.000**，那 +3.2pp 全部来自尾巴仍有 1–6 字符在窗内的 109 根（+17.4pp）；窗内阳性对照 +28.2pp ⇒ 是「丢了」不是「搬了」"
        - "**不得用两点定趋势**：训练侧只有 32 与 192 两点，悬崖形状/位置**不可判定**（SCHEMA §17.11）；要定位须再补 64/128 两个训练点"
        - "训练侧 run-to-run 噪声 0.003486 与「税 ≈0」同量级 ⇒ 只能报近零"
        - "无 ring-buffer 实现 ⇒ 不主张实测显存/算力收益；未跑 24k 点"
      evidence: ["axes/M-carrier/M3-cross-step-assumption/experiments/2616-window192-trained-13m/analysis.md @774fcb9", "axes/A-mixing/A9-old-info-retention/experiments/2615-window-trained-retention-13m/analysis.md @ticket32"]

  # ==================== G1
  - id: G1-selector
    axis: G
    title: 路径选择器
    claim: 谁决定这条路怎么走。
    options: [固定（架构决定）, 输入无关阈值, 逐 token 阈值（prob0 门控）, 学习门（carry gate）, 离线求解器（Slider）, 在线多线调度器]
    judge: 每 FLOP 边际收益 + 选择器的校准（ECE）+ 开火率可预测性
    cost: 13M 单臂 ~25–40 min
    status: judged
    verdict: 前五种已建成或已测；在线多线调度器是空白（且障碍已测，见 G5）。
    local:
      tax: "—（选择器本身不加税）"
      benefit: "Slider 端到端：校准（fire split gap ≤0.004）→ 双货币成本模型（预测 ≤±13%）→ 求解器 → 验证解码 → 在线代理（TF 窗口 ECE 0.0011–0.0079）；严格占优点复现"
      failure:
        - "在线质量代理在自由生成段失效（prob0 压天花板）"
        - "门控重试质量杠杆 @100M 消失（τ 轴平坦 ±0.002）"
      evidence: [".scratch/15-slider-rung3/evidence @257b6ec", ".scratch/17-slider-at-scale/evidence @25704b8", ".scratch/14-allocator/evidence @9954425"]

  # ==================== G2
  - id: G2-currency
    axis: G
    title: 记账货币
    claim: 算力/收益用什么计价。
    options: [forwards（每 token 前向次数）, FLOPs（等价 width-1 单位）, 墙钟, 内存, 延迟分位]
    judge: 同一机制在不同货币下的结论是否分歧（分歧即必须双报）
    cost: 与实验同价（不额外训练）
    status: judged
    verdict: 双货币必须双报——本项目多次出现口径分歧。
    local:
      tax: "—"
      benefit: "同一机制两口径分歧实例：spec 在 forwards 口径 0.55–0.70、FLOPs 口径 ≥1.23；@100M 墙钟 k=2 1.15–1.29× 而 FLOPs 口径有利；深度自适应 C 配方按 FLOPs 口径 122.8 vs 112.9 tok/s"
      failure:
        - "单货币记账会得出相反结论（spec 墙钟收益消失 vs FLOPs 收益仍在）"
        - "「逐位相等」是 13M 规模性质，@100M fp 平局翻转（1/400 token）"
      evidence: [".scratch/15-slider-rung3/evidence @257b6ec", ".scratch/20-spec-scale/evidence @a864bcf", ".scratch/25-tax-attribution/evidence @2e86924"]

  # ==================== G3
  - id: G3-signal
    axis: G
    title: 观测信号
    claim: 用什么信号判断「这个 token 难不难 / 这段生成好不好」。
    options: [prob0, 路径分歧度（js）, 重复率（distinct-2）, 深度置信, 未校准 logit gap]
    judge: AUC / ECE / 与真实错误率的分层单调性 / 零额外前向
    cost: 纯推理，分钟级
    status: judged
    verdict: 三信号正交监测栈成形；生成段没有单一信号够用。
    local:
      tax: "—"
      benefit: "prob0 管 token 对错（ECE 0.002–0.011，跨规模存活）；路径分歧 js 管语义分歧（AUC 0.66–0.69 > prob0 0.58–0.62；生成段 real 0.0114 < corrupt 0.0250 < random 0.0390；注入剂量单调）；distinct-2 管塌缩（AUC 0.9815，与 js 正交 rank_corr 0.14）"
      failure:
        - "prob0 在自由生成段压天花板（TF 窗口 ECE 0.0011–0.0079 但生成段分不开 real/random）"
        - "js 在吸引子塌缩窗双向失灵（假阴 js=0 与假阳 js=0.373 并存）"
        - "greedy 生成有全局重复偏置 → 监测参考水平必须相对化"
      evidence: [".scratch/22-gen-quality/evidence @c6c356f"]
    deps: [G1-selector, G4-calibration]

  # ==================== G4
  # ==================== G4
  - id: G4-calibration
    axis: G
    title: 校准
    claim: 置信信号是否可信——决定阈值策略与在线代理的有效性。
    options: [无, ECE gate（训练期验证）, 温度/在线重校准]
    judge: ECE（分桶）+ 阈值开火率可预测性 + 跨 profile 阈值迁移
    cost: 纯推理，分钟级
    status: judged
    verdict: 校准跨规模存活是本项目最稳的资产之一。
    local:
      tax: "—"
      benefit: "prob0 ECE 0.002–0.011（M0）→ ≤0.0091（100M）；fire 曲线 split gap ≤0.004；TF 窗口在线代理 ECE 0.0011–0.0079"
      failure:
        - "阈值跨 profile 需重校准（probe vs dense 两 profile）"
        - "token retry 的 argmax re-embed 会把 ECE 从 0.001 推到 0.015（量化掉不确定性）"
      evidence: [".scratch/02-engine-m0/evidence/REPORT.md @27418ae", ".scratch/16-rung4-scale/evidence @c520d65", ".scratch/15-slider-rung3/evidence @257b6ec"]

  # ==================== G5
  - id: G5-parallel-lines
    axis: G
    title: 并行多线机制
    claim: 如何同时推进多条概率线并合并——引擎与调度的核心格。
    options: [单线（贪心）, beam search, 多路共享主干, 去相关 voter（显式训练多样性）, verifier 重排]
    judge: 质量增益（同 FLOPs）+ 线间相关度 + 每线边际收益曲线
    cost: 13M 纯推理分钟级–单臂 25 min（若需训练多样性）
    status: judged
    verdict: 共享主干的多线几乎不增益——瓶颈是相关性，不是算力。
    local:
      tax: "多样性压力 mech 的税 +0.023（capped −JS）"
      benefit: "去相关 voter 有效：DIVL1（capped −JS + float32 + pre-step grad-norm gate）同时改善 baseline 与集成斜率（−0.062 > −0.047，上限 +0.023）"
      failure:
        - "共享 trunk 的 voter 太相关：集成增益仅 +0.0008~+0.0015（可忽略）"
        - "确定性路径 checkpoint 的 K-path 集成恰好得 0——beam search 产出的多线正落在这个死区"
        - "深度集成失败：置信头只排序深度、不排序逐 token 可靠性"
      evidence: [".scratch/08-tts-probe/evidence @aa97bcf", ".scratch/09-m3-interactions/evidence @39b1838", ".scratch/02-engine-m0/evidence/REPORT.md @27418ae"]
    deps: [G1-selector, C6-depth-supervision, F1-iteration-object]
    notes: |
      「多线并行调度」的第一个问题不是引擎复杂度，是去相关从哪来。
      本地已有答案方向：去相关来自 transports/depths，而不是 trunk 本身；
      且多样性必须练进去。

  # ==================== R1..R7
  - id: R1-quantization
    axis: R
    title: 量化
    claim: 用更低比特换内存/带宽/算力——「Pro 当 Flash 用」的现成答案。
    options: [权重 int8/int4, KV cache 量化, 激活量化, 混合精度]
    judge: 质量损失 × 内存/吞吐（双边前沿）
    cost: 纯推理，分钟级
    status: reference
    industry: 工业界标准做法；「Pro 当 Flash 用」的最强基线。任何 L1/L2 线必须打败它或与之复合。
    local:
      tax: "**int8 KV：Δbpc +0.00015（近无损）**，每位置 12288 → 6144 字节（−50%）；**int4 KV：+0.0457**（3.3× 噪声带），3072 字节（−75%）；fp16 基线 1.483571"
      benefit: "参照线数字：**任何「省内存/丢信息」的主张，至少要打败 int8 KV 的近无损 −50%**；int4 的代价 +0.0457 是另一条可比的价签"
      failure:
        - "内存数字是**解析** KV 占用（部署口径）；评测期实现立即反量化，故 GPU 实测峰值不随档下降——已在 analysis 标注，未当作「实测内存下降」上报"
      evidence: ["axes/R-references/R1-quantization/experiments/2614-kv-quant-eval-13m/analysis.md @ticket31"]
    notes: |
      本地现在有了 KV 量化的价签（int8 近无损 / int4 +0.046）。权重与激活量化仍未测；
      量化与「丢 KV」两条路线可直接比较（丢最远 16–32 个位置 ≈ 免费，见 M2 的保留曲线）。

  - id: R2-distillation
    axis: R
    title: 蒸馏
    claim: 用大模型训练小模型——Flash 的另一条现成来源。
    options: [logit 蒸馏, 中间层蒸馏, 数据蒸馏/合成]
    judge: 小模型质量 vs 训练成本
    cost: 与训练同价
    status: reference
    industry: 事实标准（小模型），与本项目「同参数等智商」命题直接竞争。
    local: {}

  - id: R3-pruning-sparsity
    axis: R
    title: 剪枝 / 结构化稀疏
    claim: 删参数/删结构换速度。
    options: [非结构化剪枝, 结构化剪枝（层/头/通道）, 稀疏激活训练]
    judge: 同 FLOPs 质量
    cost: 13M 单臂 ~25 min
    status: reference
    industry: 结构化剪枝已成熟但收益依赖任务；与 W5「容量-计算」分类直接相关。
    local:
      tax: "本地侧证：结构化约束（只读前 360 维）→ 恶化 −50.4%（W1）"
      benefit: "—"
      failure:
        - "减结构 = 减容量，模型会绕开被约束的子空间"
      evidence: [".scratch/25-tax-attribution/evidence @2e86924"]

  - id: R4-window-kv-quant-retrieval
    axis: R
    title: 窗口注意力 + KV 量化 + 检索
    claim: 长上下文的现成组合拳——右移压缩必须打败的对手。
