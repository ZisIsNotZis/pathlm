  # ==================== C5
  - id: C5-refinement-operator
    axis: C
    title: 精化算子
    claim: 每层如何把状态往前推一步。
    options: [残差 + MLP（标准）, 携带门乘 delta（h+g⊙Refine(h)，本项目）, 并行支路 + Merge（MoD 式）, 条件化（AdaLN / 时间步条件）]
    judge: 深度-bpc 曲线单调性 + 出口质量 + 税
    cost: 13M 单臂 ~25 min
    status: judged
    verdict: 携带门是形态税的承载者之一，也是「任意深度可读」的结构来源。
    local:
      tax: "carry 门 + 填充 + 退出堆栈合计是形态税的主体（同引擎 +0.4362 @100M）"
      benefit: "门行为健康（浅层开、深层微开；@100M 全层从 carry 初始化收小）；门=逐通道，天然给出「哪些通道在精化」的可观测性"
      failure:
        - "「渐进开门」在 100M 未出现（门从 0.119 收小，等权/2× 同款，非配方现象）→ 结构假设之一未兑现"
        - "stop-grad 浅头（probe 式）恶化至 2.7129、浅层门不再打开 → 浅头 stop-grad 化被排除"
      evidence: [".scratch/23-depth-ar/evidence @1586745", ".scratch/24-depth-ar-100m/evidence @7725891", ".scratch/25-tax-attribution/evidence @2e86924"]
    deps: [C1-layers-per-token, H2-training-fill]

  # ==================== C6
  - id: C6-depth-supervision
    axis: C
    title: 训练期深度分布与监督密度
    claim: 训练时让哪些深度被监督——决定哪些深度在推理时可用。
    options: [仅最终深度, 全深度并行监督（等权/加权）, 随机退出深度（本项目）, 退火课程（末段收紧）]
    judge: 出口资产（tf@k 接受率）+ 税 + 中间深度可读性
    cost: 13M 单臂 ~25 min；100M ~32–70 min
    status: judged
    verdict: 出口资产只能由深度维监督造出来——这是本项目最有迁移价值的一条结论。
    local:
      tax: "全深度等权 +0.067（13M）；dense 0.2 剂量的税为负（EX2 1.6097 vs 无 dense 1.6698，aux 起正则作用）"
      benefit: "形态臂 tf@4 0.97 / tf@6 0.99；退火配方 C 等效验证吞吐 122.8 vs A 112.9 tok/s（+9%）"
      failure:
        - "纯 dense trunk（无深度监督）没有任何浅层截断资产：tf@4 仅 0.120（vs 形态臂 0.97）"
        - "dense 全深度监督杀 retry 精炼（ticket 14 ALLOC）：整形与自适应是同一梯度的两面，两全证伪"
        - "剂量响应随规模变化：dense 0.2 在 13M 温和、@100M corrupt 崩溃（+1.73）"
      evidence: [".scratch/14-allocator/evidence @9954425", ".scratch/18-exit-probe/evidence @83bf1ac", ".scratch/21-exit-at-scale/evidence @9fe4cf1", ".scratch/24-depth-ar-100m/evidence @7725891"]
    deps: [C1-layers-per-token, F1-iteration-object]

  # ==================== H1
  - id: H1-outputs-per-pass
    axis: H
    title: 每步输出位置数
    claim: 一次前向为几个未来位置产出预测——决定草稿的宽度。
    options: [1（纯 AR）, k（MTP，本项目 n_mtp 1→3）, 整段（扩散式并行）]
    judge: 税 + 草稿接受率 + 端到端 tok/s（forwards/FLOPs/墙钟三口径）+ 逐位一致（验证正确性）
    cost: 13M 单臂 ~25–30 min；100M ~32 min
    status: judged
    verdict: 全项目税效比最好的机制；但墙钟收益是 13M/launch-bound 现象。
    local:
      tax: "n_mtp 1→2 +0.041（B2 1.5481）；2→3 +0.0166（B3 1.5604 vs B2fresh 1.5438，递减）"
      benefit: "Medusa 批量验证 1.68–1.90× tok/s @13M；@100M 接受级联稳定（a₂ 0.80、a₃|a₂ 0.767↑、2.4 tok/fwd）"
      failure:
        - "@100M 墙钟收益消失（前向 compute-bound）：k=2 仅 1.15–1.29×、k=1 转负——「spec 逐位 == 贪心」是 13M 规模性质"
        - "fp 平局翻转首现（top-2 gap 0.008，1/400 token）→ 逐位相等不能作为跨规模的正确性判据"
        - "node-k 概率朴素复合是数学错误（CE 3.96 vs 1.58，见 H3）"
      evidence: [".scratch/10-gap-sweep/evidence/B2 @57d64a7", ".scratch/13-four-experiments/evidence/mtp3 @9abc181", ".scratch/20-spec-scale/evidence @a864bcf"]
    metrics:
      - "解决什么：草稿从哪来（视界轴的成本问题）"
      - "代价：Δ clean bpc（同尺寸同 token 预算）"
      - "有效性：vs 冻结主干直接头 / vs 同尺寸 dense"
      - "收益（用法 1）：spec 草稿——等效验证吞吐（FLOPs 口径）与墙钟 tok/s"
      - "收益（用法 2）：逐 token 算力分配信号——门控后每 FLOP 边际收益"
      - "可控性：头置信度的 ECE（能否用置信决定是否验证）"
      - "副产品：多位置的互验能力（位置 i 与 i+1 互相校验）"
    deps: [H3-composition, H5-verification, C1-layers-per-token]

  # ==================== H2
  - id: H2-training-fill
    axis: H
    title: 训练时未来位置的内容填充
    claim: 右侧（未来/已退出）位置在训练时被什么内容填充。
    options:
      - 不存在（纯 AR 无右侧）
      - PAD / [mask]
      - 错误 token
      - self-fill（用自己上一轮的预测 / 已退出位置的冻结表征）
      - 软 latent（Σp·E，soft 提交）
      - 随机 latent
      - 纯噪声（去噪式）
    judge: 税 + 出口/填入位置的可读性 + 提交质量（rescore）
    cost: 13M 单臂 ~15–25 min
    status: judged
    verdict: 保留式填充（self-fill）胜出；PAD 与错误 token 都更贵；软提交有 OOD 污染。
    local:
      tax: "mask/wrong-token 替换 +0.059 / +0.127；embedding noise ±0.000；纯噪声 latent +0.063；self-fill（fill）1.8582 vs nofill 1.9438（+0.0856）"
      benefit: "proj-fill（逐层恒等初始化 adapter + fill）1.8356 = 13M matched-step 族内最优（全深度逐深度支配 fill）"
      failure:
        - "首验判「填充是负分量 +0.167」→ 23e matched 步数下反转：是欠拟合伪影 + 对照混淆（当时 nofill 臂同时无随机退出）"
        - "soft 提交 OOD 污染 context 三度复现（rescore 峰值：6.9 vs hard 1.2 首验；8.42 vs 0.79 @100M；C 臂 3.36 vs 0.74）→ soft 默认待重验"
      evidence: [".scratch/06-m2-sweep/evidence @a03a579", ".scratch/23-depth-ar/evidence @6b27b5e", ".scratch/24-depth-ar-100m/evidence @7cdcdaa"]
    deps: [C1-layers-per-token, H5-verification, P1-precision]

  # ==================== H3
  - id: H3-composition
    axis: H
    title: 多位置预测的组合方式
    claim: 直接头与多跳组合如何合并——这是用户提出的「自门控非线性组合」所在格。
    options:
      - 只用直接头
      - 链式条件（concat+proj，DeepSeek 式）
      - 朴素概率乘积
      - DP lattice 置信加权（设计 §5 已定义，从未端到端测量）
      - "自门控选组合深度（一次跳 k vs 跳 1 走 k 次，由 sigmoid 门决定）"
      - beam 多线 + 重排
    judge: 同 FLOPs 的质量（等算力对照）+ 草稿接受率 + 组合置信度的校准（ECE）
    cost: 13M 单臂 ~25–30 min
    status: judged
    verdict: 自门控组合**被实测否决为主张**：门控混合 0.4738 仅比直跳 0.4672 高 +0.0020（<0.014 噪声带），且等参数无门对照 0.4785 更高 ⇒ 增益归容量不归门控；门不是「选择」而是**坍缩到连跳**（96.7% 位置 g≈0.82，被压掉的直跳分支只训到 0.262 vs 单训 0.467）。
    local:
      tax: "（头机制，挂冻结主干：零税；头的税见 H1）"
      benefit: "省算力：等效 1.95×（H4 口径）；门是可观测量（g 分布 + 逐桶命中单调 0.17→0.68）"
      failure:
        - "**主判据未过**：gated 0.4738 vs 阈值 max(direct 0.4672, composed 0.4718)+0.014 = 0.4858 ⇒ Δ = +0.0020"
        - "草稿接受率 0.6113（< 0.90）⇒ 不可作草稿"
        - "**等参数无门对照 direct_eq（394,496 参数，与 gated 逐位相同）反而最高 0.4785** ⇒ 那 +0.0020 归容量、不归门控结构（SCHEMA §15）"
        - "门**坍缩到单支**：起点 g≡0.5 → 均值 0.82（96.7% 位置偏两跳），被抑制的直跳分支退化到 0.262（单独训练为 0.467）⇒ 不是「选择组合深度」而是「偏好一支」"
        - "2× 训练（4000 步）后 Δ = +0.0042 仍 < 0.014；快照口径（四臂同窗斜率 −0.060~−0.069/1k 仍在下降）"
        - "契约缺陷（主 Agent 认领）：sigmoid 门 + 单边零 + 「起步等价 direct 或 composed」三者不可兼得（σ(0)=0.5）"
      evidence: [".scratch/12-overnight/evidence @216a00a", ".scratch/04-m1-runs/evidence @e38349f", "axes/H-horizon/H3-composition/experiments/2613-self-gated-composition-13m/analysis.md @15eeac0"]
    metrics:
      - "解决什么：多跳组合是否有结构优势（用户新设计）"
      - "代价：Δ clean bpc（同尺寸同 token 预算）；附加头参数量"
      - "有效性：等 FLOPs 判决——1 次前向 + 跳跃头预测 t+2 vs 2 次前向"
      - "收益（用法 1）：质量——同算力下的 argmax 命中率（已有锚：56% vs 69%）"
      - "收益（用法 2）：草稿——条件接受率（已有锚：65.8% / 给定 t+1 正确 77.3%）"
      - "可控性：组合深度选择的置信校准（ECE）"
      - "副产品：组合深度的可解释分布（模型偏好一跳还是两跳）"
    deps: [H1-outputs-per-pass, F4-training-signal, G1-selector]
    notes: |
      空白格（用户新设计）。等 FLOPs 的判决实验：1 次前向 + 跳跃头预测 t+2
      vs 2 次前向推到 t+2（已有数字：跳跃头 55.97% / 条件接受 65.8%，
      连跑两次 ≈ node-1 68.8% → 跳跃头以一半算力买到约 81% 准确率）。
      质量头寸已被花掉（d6−d12 = 0.0003）→ 组合的价值应在成本分配而非质量。

  # ==================== H4
  - id: H4-head-trunk-relation
    axis: H
    title: 头与主干的关系
    claim: 额外的头（MTP/读出头/判断头）是联合训练还是挂在冻结主干上。
    options: [联合训练, 冻结主干只训头, 共享 embedding（tied）, 独立解码头]
    judge: 税（挂头是否扰动主干）+ 头自身质量 + 校准
    cost: 13M 单臂 ~5–25 min；冻结主干可复用已有 checkpoint → 单臂 ~5 min
    status: judged
    verdict: 挂头零税坐实（Δbpc = 0.0000）。按修正后的诚实口径（vs 1-step AR 两次前向，只替换紧邻位置）**判中性**：对手 54.89%（≥ 算术下界 0.4822 ✓ 对账过），跳跃头 46.67% = 对手的 **85%**（预登记成功线 90% 未过，落 [0.80,0.90) 中性带）；**草稿接受率仅 0.5998**（< 0.90 未过）。等效加速 **1.95×** 真实，但质量缺口使其不足以单独替代两次前向。
    local:
      tax: "probe 式头 @100M ≈0（1.5928 vs 1.5871）；停梯度使浅层读出贵（13M depth6 +0.93）；冻结主干挂跳跃头 13M：Δbpc = **0.0000**（1.4836→1.4836，冻结断言通过）"
      benefit: "保 retry（−0.0098）且门控更强（−0.029 @100M）；MTP 头是 d×d 变换、无 vocab 参数（~free 的基础设施）；宽头 ECE 0.0064 ≤0.01 且 10 桶严格单调（0.073→0.982）可作分配信号"
      failure:
        - "probe 式头改善 retry 但浅层读出质量贵 → 「保 retry」与「exit 质量」是同一梯度的两面（与 C6 同一条定律）"
        - "**冻结主干上跳跃头质量不可达**：t+2 0.4667（宽头 0.5081）< 0.81×0.6934；决策树排除 off-by-one（shift 单测 + oracle 恒等式）/ 冻结失败（Δbpc=0 且 grad is None）/ 头映射（直接 t+1 0.6951 ≈ 主干 0.6934）/ 步数与容量（宽头仅 +4.1pp）→ 归因**设计无效**：冻结表征只被 t+1 目标塑形，t+2 映射不可达（回环时代 joint 的 55.97% 是表征可用性差异）"
        - "对照臂构造错误（已撤回，主 Agent 复核 + ERRATA，2026-09-30）：所谓两次前向 deploy 臂把整段上下文替换为模型自预测（xp[:,1:] = L[:,:-1].argmax(-1)），再用真值打分 → 量的是「假上下文猜真值」这个不可能任务（0.3128），不是 AR 两次前向。正确的 1-step AR 对照只替换紧邻位置，算术下界 = 0.6934×0.6953 = 0.4822，下一批重测（ticket 29）"
        - "判据取向被用户否决（2026-09-30）：oracle 是作弊基线、不得作判据；改判口径 = vs 1-step AR 两次前向 + 草稿接受率 vs 主干自身输出（SCHEMA §11）。原预登记判据（0.81×oracle）保留为历史记录、不追溯修改"
        - "修正后实测（ticket 29）：诚实对手 1-step AR = **0.5489**（只替换紧邻位置，≥ 算术下界 0.4822）；跳跃头 0.4667 = 85%（中性带）；**草稿接受率 0.5998** ⇒ 作草稿质量不足；等效加速 1.95× 但需接受率门控；两 seed 比值 0.8533/0.8469（极差 0.0064）"
        - "对照 3（联合臂）口径缺陷：lr 3e-4 把主干改坏（bpc 1.48→1.85），非干净对照，仅记录"
      evidence: [".scratch/18-exit-probe/evidence @83bf1ac", ".scratch/21-exit-at-scale/evidence @9fe4cf1", "axes/H-horizon/H4-head-trunk-relation/experiments/2610-frozen-trunk-jumphead-13m/analysis.md @1181cd4", "axes/H-horizon/H4-head-trunk-relation/experiments/2611-jumphead-ar-control-13m/analysis.md @2f25fec"]
    deps: [C1-layers-per-token, W4-readout-geometry, H3-composition]
    notes: |
      最便宜的真空白：拿一个冻结的 stock 小模型只训跳跃头，
      可一次排 3–5 个变体，且完全不需要训练主干。
      13M 首验（ticket 28）：零税坐实，但**质量头寸不存在**——若再判，应**预登记 deploy rollout
      为对手**（oracle 作上界附报），并考虑 H3 的联合/自门控组合路线（表征可用性才是瓶颈）。

  # ==================== H5
  - id: H5-verification
    axis: H
    title: 验证机制
    claim: 草稿如何被验证——决定 spec 的正确性与成本。
    options: [不验证, 批量验证（一次前向验证全部草稿）, 置信门控验证, 全深度重打分（定稿不变量）]
    judge: 逐位一致（vs 贪心）+ 端到端 tok/s + 质量不劣
    cost: 13M 单臂 ~25 min（含 5 个可失败单测）
    status: judged
    verdict: 批量验证可用且逐位一致；定稿不变量（全深度重打分）是本形态的正确性保障。
    local:
      tax: "验证本身不额外加税（复用同一次前向）"
      benefit: "Medusa 批量验证逐位 == 逐位置贪心（强制全接受/强制拒绝/窗口驱逐三个专门测试）；稳态 2.40 tok/fwd"
      failure:
        - "@100M 逐位一致失效（fp 平局翻转，1/400 token）→ 正确性判据必须按规模设定"
        - "exit × spec 在本引擎不可组合（批量验证必须全深度，逐位置深度会使缓存失步）"
      evidence: [".scratch/13-four-experiments/evidence/mtp3 @9abc181", ".scratch/20-spec-scale/evidence @a864bcf"]
    deps: [H1-outputs-per-pass, C1-layers-per-token]

  # ==================== W1
  - id: W1-active-width
    axis: W
    title: 激活宽度
    claim: 每个 token 是否可以用更少的通道/宽度跑完。
    options: [全宽, 减宽（训练时或推理时裁通道）, 随机宽度（width dropout）]
    judge: 同参数量下 clean bpc + 状态能量在保留子空间中的分布（workspace 探针）
    cost: 13M 单臂 ~25 min；100M ~35 min
    status: judged
    verdict: 减宽 = 减容量，不买灵活性；结构化约束会把状态能量赶出被约束子空间。
    local:
      tax: "结构切分读出（只读前 360 维，@100M）clean 2.1475、同引擎税 +0.6662、恢复 −50.4%"
      benefit: "（无）"
      failure:
        - "机制探针显示模型把状态能量整体迁出读出子空间：切片能量 depth0 0.85 → depth2 0.026 → ≈0；null 能量 100% 但 functional_dirs=176（workspace 被真用、读出空间被放弃）"
        - "门动力学反转（layer 3–11 p90=1.0 vs 正常臂全层 ≤0.07）、depth 曲线尾部倒退（d7→d12 +0.012）"
        - "tied 表不对称漂移（读出梯度只打 E[:, :360]）：输入态能量比 0.85 vs 随机基线 0.50"
        - "用户本地独立实验（减宽）同样「效果微妙」——与本文结论一致：减容量不买灵活性"
      evidence: [".scratch/25-tax-attribution/evidence @2e86924"]
    deps: [W4-readout-geometry, W5-capacity-vs-compute]

  # ==================== W2
  - id: W2-expertization
    axis: W
    title: 专家化（MoE）
    claim: 用稀疏路由把「参数量」与「每 token FLOPs」解耦。
    options: [无（稠密）, MoE top-k 路由, 激活更少专家（top-1）, 激活更小专家（细粒度专家）, 共享专家 + 路由专家]
    judge: 同 FLOPs 的质量（主）+ 负载均衡 + 路由稳定性 + 内存
    cost: 13M 单臂 ~25–40 min（路由器需要至少 2–4 专家才可判）
    status: stub
    industry: |
      MoE 是「同 FLOPs 更多参数」唯一被大规模验证的路线（Mixtral/DeepSeek-MoE 系，
      细粒度专家 + 共享专家成为主流配方）。负载均衡与路由坍缩是主要工程风险。
    local: {}
    notes: 本地零经验。「激活更小专家而非更大专家」是用户提出的子问题（细粒度专家），与行业趋势一致。

  # ==================== W3
  - id: W3-kv-head-sharing
    axis: W
    title: KV 头共享
    claim: 用更少的 KV 头降低推理内存/带宽。
    options: [MHA（本项目）, MQA（1 个 KV 头）, GQA（G 个 KV 头）, MLA（低秩压缩 KV）]
    judge: 质量（bpc）+ KV 内存 + 长上下文吞吐
    cost: 13M 单臂 ~25 min
    status: judged
    verdict: "参考线已补齐**：GQA（KV −75%）实测 damage **+0.0143**、同 seed 重跑 +0.0139（**跨在门槛两侧**，散度仅 0.0004 ⇒ 依预登记规则该臂判读作废、**不写入「近无损」参照线**）；MQA（−87.5%）为 +0.0118（形式进门槛，但与 GQA 只差 0.0025 ≪ 0.014 ⇒ **不可相互排序**）。同 −75% 档位下 **GQA 比 int4 KV 便宜 ≈3.2×**。"
    local:
      tax: "clean bpc：mha **1.4820** / gqa **1.4963**（damage +0.0143）/ gqa 重跑 1.4959（+0.0139）/ mqa **1.4938**（+0.0118）"
      benefit: "解析 KV 内存 12288 → **3072 B/位置（−75.00%）** / **1536 B（−87.50%）**（与预登记数值逐位一致）；参照线对照：int8 −50%/+0.00015（近无损）、int4 −75%/+0.0457 ⇒ **同 −75% 档 GQA 便宜 ≈3.2×**"
      failure:
        - "**GQA 跨门槛、判定分裂**：+0.0143 与重跑 +0.0139 分居 0.014 两侧 ⇒ 按预登记规则该臂判读作废，**不写入近无损参照线**（机器可读 verdict 曾与规则相反，已由主 Agent 修正）"
        - "MQA 与 GQA 差异 0.0025 ≪ 0.014 ⇒ 不可相互排序"
        - "缺等参数对照臂（代价混着 −8.75%/−10.25% 容量差）；无 2× 训练点；n=1 种子；长上下文吞吐未测"
      evidence: ["axes/W-width/W3-kv-head-sharing/experiments/2616-gqa-mqa-13m/analysis.md @ticket33"]
    industry: KV 内存降数倍、质量近无损，GQA/MQA/MLA 已被全行业采纳。
    deps: [M2-carrier-compression, A3-window-anchor]

  # ==================== W4
  - id: W4-readout-geometry
    axis: W
    title: 读出几何
    claim: 状态到 token 概率的映射——决定「计算空间」与「读出可见空间」是否耦合。
    options:
      - tied 线性（U = Eᵀ，本项目基底）
      - 解绑线性（独立 unembed）
      - "gated 残差读出（h·Eᵀ + SiLU-gate(h)·W，保线性桥）"
      - 纯 MLP 读出
      - 低秩读出
    judge: clean bpc（税）+ workspace 探针（null 能量占比 / functional_dirs）+ 校准（ECE）+ 传输与提交机制是否仍可用
    cost: 13M 单臂 ~15–25 min
    status: judged
    verdict: 读出几何**可以**解耦（prob0/提交/传输不受损，同空间前提不冲突），但**增量归因于「读出重参数化 + 额外 2d² 参数」，不是非线性本身**：等参数纯线性对照 Δ=−0.0888 与 gated 的 −0.0812 **不可排序**（差 0.0076 < 0.014）；且增益随训练缩小（12k −0.0812 → 24k −0.0463，缩 43%，两臂仍未收敛）⇒ 更像**收敛加速/容量效应**而非最终质量提升。**不采纳为质量机制**；保留为「读出重参数化」候选，待更长训练与更大尺寸确认。
    local:
      tax: "**读出重参数化 Δ clean bpc −0.0812**（gated，12k）/**−0.0888**（等参数纯线性对照，12k）→ 二者不可排序（差 0.0076 < 0.014）⇒ 归因容量/重参数化；**24k 复测 Δ = −0.0463（缩减 43%）**；tied 线性 = 基底；切分式紧凑读出 = 负结果（见 W1）"
      benefit: "tf@4 0.9694 → **0.9680**（≥0.95 保持）、tf@6 0.9938 → 0.9933；ECE 0.0066 → **0.0051**；null 能量占比 0.2703 → **0.1952**（读出面看到更多状态，−7.5pp）；全深度逐深度支配 A 臂；参数量仅 +2·d² = **131072**（可 scale，非 vocab×hidden）"
      failure:
        - "**零初始化是鞍点**（首轮 12k 干预恒为 0、fro=0，实测 Δ 仅为重跑噪声）：g(h)=h+silu(W1h)⊙(W2h) 在 W1=W2=0 处 ∂L/∂W1 = ∂L/∂W2 = 0；正确做法 = **单边零**（W1~N(0,0.02)/W2=0：严格恒等起步且 ∂L/∂W2 = silu(W1h)⊗h ≠ 0，200 步即逃逸）"
        - "vocab×hidden 的 MLP 读出**不可 scale**（真词表 100k+ 是瓶颈）→ 只作对照臂，不采纳"
        - "**增益来源不是非线性**：等参数纯线性对照（h' = h + P·(Q h)，2d² 参数）Δ = −0.0888 与 gated 的 −0.0812 不可排序 ⇒ 非线性无额外贡献，增益来自读出重参数化/容量（SCHEMA §15 归因规则）。"
        - "**增益随训练缩减**：Δ 12k −0.0812 → 24k −0.0463（缩 43%）；两臂 24k 仍未收敛（末 25% 窗斜率均 ≈ −0.011/1k）⇒ 快照口径，疑为收敛加速而非最终质量。"
        - "**不可迁移到普通 dense 模型**：同一读出重参数化在 stock dense 上 Δ = −0.0055（seed0）/ −0.0026（seed1），两 seed 同号且都远小于 0.014 ⇒ 只在本形态有效（差距 16×）。机制证据：dense 上读出变换相对幅度仅 0.6–1.2%（本形态 164–170%），Q 的 fro 从 5.13 被训练收缩到 0.86 → **模型主动不用这块自由度** ⇒ 该增益是**补本形态的读出缺陷**，不是通用改进（SCHEMA §15）。"
        - "**单 seed、单配置（13M / 8L）**：量级与规模外推未做（按 methodology §10 需多档次小实验拟合）"
        - "宽度约束是硬的：d=256 / V=205 时 null 空间仅 62 维、功能性读取 26 条；d=128 < V 时结构性为 0（无余量）"
        - "结构性切分（只读前 r 维）→ 能量迁出读出子空间（W1）"
      evidence: [".scratch/23-depth-ar/evidence @1586745", ".scratch/25-tax-attribution/evidence @2e86924", "axes/W-width/W4-readout-geometry/experiments/2610-gated-readout-13m-depthar/analysis.md @cba2f39", "axes/W-width/W4-readout-geometry/experiments/2611-equalparams-linear-control-13m/analysis.md @2f25fec", "axes/W-width/W4-readout-geometry/experiments/2612-gated-readout-24k-13m/analysis.md @2f25fec", "axes/W-width/W4-readout-geometry/experiments/2613-readout-reparam-dense-13m/analysis.md @15eeac0"]
    metrics:
      - "解决什么：计算空间与读出可见空间的耦合（宽度约束的来源）"
      - "代价：Δ clean bpc（同尺寸同 token 预算）；读出参数量"
      - "有效性：vs tied 线性读出（同尺寸对照）"
      - "收益（用法 1）：质量——税收回多少"
      - "收益（用法 2）：workspace 自由度——null 能量占比 / functional_dirs"
      - "可控性：prob0 校准是否仍可用（ECE）；软提交是否仍凸包安全"
      - "副产品：出口资产（tf@k）是否保持"
    deps: [W1-active-width, A9-old-info-retention, H4-head-trunk-relation]
    notes: |
      用户新想法所在格：读出不必线性映射到 unembedding 空间；SwiGLU/SiLU +
      线性残差可保住 tied 桥（prob0/传输/提交仍走线性路径），只把质量读出解耦。
      澄清：soft commit 的凸包安全不依赖读出线性度（Σp·E 恒在凸包内）；
      真正会断的是「概率 = 状态在 embedding 基下的坐标」这一语义、
      linear transport 的投影语义、以及 tied 表的梯度对称。

  # ==================== W5
  - id: W5-capacity-vs-compute
    axis: W
    title: 容量-计算分离
    claim: 哪些宽度侧干预是「减容量」（付质量）、哪些是「保容量减计算」。
    options: [容量削减（减宽/剪枝/裁头）, 保容量减计算（稀疏激活/专家路由/条件计算）]
    judge: 同 FLOPs 的质量 + 同参数量的 FLOPs
    cost: 13M 单臂 ~25 min
    status: judged
    verdict: 减容量不买灵活性；买灵活性必须走保容量减计算。
    local:
      tax: "容量削减：负结果（W1 −50.4%）"
      benefit: "—"
      failure:
        - "把「减宽」当作灵活性来源是类别错误：它减容量，不减每 token 的固定成本结构"
      evidence: [".scratch/25-tax-attribution/evidence @2e86924"]

  # ==================== F1
  - id: F1-iteration-object
    axis: F
    title: 迭代对象
    claim: 重复施加在什么之上。
    options:
      - 同 token 状态（latent retry，本项目）
      - 同段多遍（AR 多轮）
      - 整段去噪（扩散式并行）
      - 候选集（best-of-n）
      - "隐式推理步（latent CoT / pause token，无输出监督）"
      - "权重（fast-weight / TTT）"
    judge: 税 + 每轮边际收益曲线 + 成本（forwards/FLOPs）
    cost: 13M 单臂 ~25–40 min
    status: partial
    verdict: 前两项已收口；后四项零经验。
    local:
      tax: "latent retry C 族 1.6535–1.6856 vs B0 1.5074 = +0.146…+0.178（10–100× 任何测得底）"
      benefit: "门控重试在修复侧有真价值：低置信 15% 开火把 r1→r2 从 −0.0193 翻到 +0.0211（C1M +0.1284）；12 层上 retry 更值（L-loop × depth 协同）"
      failure:
