name: wiki

# Research Wiki 的格式闸门：目录完备 / 模板完备 / 证据锚点 / 生成物一致。
# 只依赖 PyYAML（不装 torch，保证秒级反馈）。
on:
  push:
    paths: ["catalog.yaml", "axes/**", "tools/**", "archive/legacy-experiments.yaml", "INDEX.md", "SCHEMA.md"]
  pull_request:
    paths: ["catalog.yaml", "axes/**", "tools/**", "archive/legacy-experiments.yaml", "INDEX.md", "SCHEMA.md"]

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: 目录生成物与 catalog 一致
        run: python3 tools/build_wiki.py --check
      - name: 历史实验映射一致
        run: python3 tools/backfill_legacy.py --check
      - name: SCHEMA 校验（完备/模板/证据）
        run: python3 tools/check_schema.py
