# 研究项 SSOT（Backlog）：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "9.1"
axis: "9 Backlog（不删，移出主线）"
title: "调度 / 选择器（原 G 轴）"
dir: "axes/9-backlog/9.1-selector-scheduling"

purpose: "普通 decoder 对每个输入花固定算力（全深度、全 token）；本项要解决的是「如何按预算把算力 / 路径分配给每个位置，使同一预算下的序列级质量最高」——把质量-算力前沿相对最优固定路径上移，而不是把调度工具做得可预测。"
innovation: "相对普通 decoder-only transformer 的「固定全深度、固定路径执行」，加一个轻量选择器：用 prob0 / 路径分歧度（js）/ 重复率（distinct-2）/ 深度置信等便宜信号给每个位置打分，按预算把深度或路径分配给该位置。改动量级：新增一个只读各层 hidden 的线性 / 非线性头（零额外前向，成本见 cost_model），不动主干参数。"
expected_effect: "在给定算力预算下，序列级质量落在最优固定路径之上（前沿上移）——即「低置信位置每 FLOP 的边际收益更高」这一假设成立时。"
sota_baseline: "ACT（Graves 2016）、MoD（Raposo 2024，逐 token 路由 + 容量约束）、CALM（Schuster 2022，置信早退）、LayerSkip（Elhoushi 2024，早退训练 + 自投机）、MoE 路由、选择性预测 / 级联（SelectiveNet）、温度缩放校准（Guo 2017）——「按预算分配算力」机制本身不是本仓发明。本地对手 = 既有早退实现参照线 `axes/7-references/experiments/R7-existing-early-exit/2623-standard-early-exit-13m`（CALM / LayerSkip / MoD 13M 实测）；台账 `axes/7-references/README.md`。业界条目来源按 `axes/G-policy/PRIOR_ART.md` 标 `记忆·未核`，只作设计方向、不作判据。"
gap: "业界选择器多在单信号（置信 / 熵）上，且常在「工具自洽」口径（成本预测准、开火率可预测）上收口；本项要检验的是「多信号正交栈 + 预算求解器」在同平均算力下能否真的把前沿相对最优固定路径上移。本仓已实测该核心假设在 100M 失效（选择性门控低置信带价值 ≤0.001），故本项先停在 Backlog：要移出必须先给出可证伪的新目的与判据。"
method: "单因素：固定基底与预算，只改选择信号的组合与分配算法（预算求解器）。臂 = {固定全深度, 输入无关阈值, 逐 token 阈值（prob0 门控）, 学习门, 离线求解器（Slider）}；信号维 = {prob0, js, distinct-2, 深度置信}；对照含「同预算最优固定路径」包络、oracle 上界、随机（零假设）。"
validation: "端到端：对照 = 同算力预算的**最优固定路径**（不是 oracle，也不是工具自洽 KPI）+ oracle 上界 + 随机零假设 + 既有早退参照线（R7）；客观判据 = 同预算下的**序列级** bpc / perplexity（该涨）+ 选择是否命中「难」位置的分桶单调性（该涨）+ 每 token 平均 layer-passes（该跌）；口径 = 等效理论算力（layer-passes / FLOPs / tokens-per-forward），禁墙钟。该涨：选择臂相对同预算最优固定路径的序列级质量；该跌：每 token 平均 layer-passes；必须不变：因果性（无未来泄漏）与选择器活性（干预必须真开火，`SCHEMA.md` §10）。"
objective_criteria: "该涨：同预算下序列级质量（相对最优固定路径，须越本格自测噪声门限才算可排序）；该跌：每 token 平均 layer-passes；必须不变：因果性与「同批内最长路径」的 pipelining 语义；必须报：校准误差（ECE，越低越好）与选择器开火率（作活性对照，不当结论）。"
falsification: "若选择器核心假设（低置信位置每 FLOP 边际收益更高）在大规模失效（已观测：100M 上门控重试质量杠杆 τ 轴平坦 ±0.002、低置信带价值 ≤0.001），或唯一「收益」只是方差带内（Δbpc 落本格噪声门限内）不可排序，或收益只在自造货币（forwards）成立而在 FLOPs 口径净亏 ⇒ 判为工具 KPI 而非研究结论，维持 Backlog。"
cost_model: "等效理论量：选择器头每步只读已有 hidden，零额外前向（tokens-per-forward 不变）；被分配深度 d 的位置支付 d 次 layer-pass，故总 layer-passes/token = Σd_i/N。考虑 pipelining：按 token 变深度时同批内最长路径决定前向次数，收益体现在平均 layer-passes；报账时 forwards 与 FLOPs 双报、以 FLOPs 为主。（代价一律按等效理论量计。）"

