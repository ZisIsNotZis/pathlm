# 研究项 SSOT 示例（Backlog）：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "9.1"
axis: "9 Backlog（不删，移出主线）"
title: "调度 / 选择器（原 G 轴）"
dir: "axes/9-backlog/9.1-selector-scheduling"

purpose: "按预算把算力/路径分配给每个 token 或位置（谁走哪条路），使同一预算下的质量最高。"
innovation: "相对普通 decoder-only transformer 的「固定全深度、固定宽度执行」，加一个轻量选择器：用 prob0 / 分歧度 / 重复率等信号给每个位置打分，按预算分配深度或路径。改动量级：新增一个读各层 hidden 的线性/非线性头（零额外前向，成本见下）。"
expected_effect: "在给定算力预算下有可排序的质量前沿上移（相对最优固定路径）。"
sota_baseline: "MoD（Mixture-of-Depths）式按 token 分配算力；CALM 早退门控。见 axes/7-references/README.md。"
gap: "业界的选择器多在单信号上；本项要检验「多信号正交栈 + 预算求解器」在同预算下是否真的上移前沿，而不是只把工具 KPI 做好看。"
method: "单因素：固定基底与预算，只改选择信号的组合与分配算法（预算求解器）。"
validation: "端到端：对照 = 同预算的**最优固定路径**（不是 oracle，也不是工具自洽 KPI）；客观判据 = 同算力预算下的序列级 bpc/perplexity + 选择是否真的命中了「难」位置；口径 = 等效理论算力（layer-passes / tokens-per-forward），禁墙钟。"
objective_criteria: "该涨：同预算下的序列级质量（相对最优固定路径）；该跌：无；必须报：校准误差（ECE，越低越好）与选择器的活性量。"
falsification: "若选择器的核心假设在大规模失效（已观测：100M 上选择性假设失效），或唯一「收益」只是方差带内（Δ<本格自测噪声门限）不可排序 ⇒ 判为工具 KPI 而非研究结论，维持 Backlog。"
cost_model: "等效理论量：选择器头每步只读已有 hidden，零额外前向（tokens-per-forward 不变）；被分配深度 d 的位置支付 d 次 layer-pass，故总 layer-passes/token = Σ d_i / N。考虑 pipelining：按 token 变深度时同批内最长路径决定前向次数，收益体现在平均 layer-passes。（代价一律按等效理论量计）。"

