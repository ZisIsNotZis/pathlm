# 研究项 SSOT（Backlog）：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "9.2"
axis: "9 Backlog（不删，移出主线）"
title: "迭代精化的其余（原 F 轴剩余）"
dir: "axes/9-backlog/9.2-iteration-refinement"

purpose: "普通 decoder 每 token 只把一遍固定算力花在一套层上（固定深度、每层独立权重）；本项要解决「多花一遍算力值不值」的问题——在同一状态上重复施加算子、并配一个让重复有效的训练信号，能否在不加参数的前提下换到质量 / 修复损坏输入，而不是罗列有哪几种回传方式。"
innovation: "相对普通 decoder-only transformer 的「一遍、固定深度」，引入三件配套：① 一个携带状态（carried state）+ 每轮注入新信息的算子（无注入的重入退化为固定点 / 固定点迭代，是 Universal Transformer / DEQ 的公论）；② 一个决定何时停 / 是否值得再来一遍的判据；③ 一个训练侧辅助目标补「写-读」梯度缺口（且必须配显式载体才成立）。改动量级：轮间共享同一套层（不随轮数增参），代价按轮数线性增加 layer-passes。"
expected_effect: "同参数下用更多算力换质量（把「Pro 当 Flash 用」反过来），或用于损坏 / 低质输入的修复；判据是质量-算力前沿相对「同算力加深度 / 加参数」的位置。"
sota_baseline: "同状态重复 = Universal Transformer（Dehghani 2018）/ recurrent-depth（2024）/ Huginn；回传 / 门控 = DEQ、gated recurrence；压缩训练信号 = Compressive Transformer compression loss（Rae 2019）/ AutoCompressors / ICAE / RECOMP / DMC；停止 = ACT（Graves 2016）/ PonderNet / CALM（2022）——本项机制整条都在既有名单上。本地对手 = 既有早退实现参照线 `axes/7-references/experiments/R7-existing-early-exit/2623-standard-early-exit-13m`（深度 / 自适应算力侧）与载体线 `axes/1-time/1.1.4.1-explicit-memory/`（信息右移侧）。业界条目来源按 `archive/wiki-legacy/axes/F-iteration/PRIOR_ART.md` 标 `记忆·未核`，只作设计方向、不作判据。"
gap: "原 F 轴（F2 / F4）没有目的、没有可判定判据、也没与 SOTA 对齐；本项增量只能是「13M + 局部先验抗性任务（`SCHEMA.md` §19）+ 单因素受控 + 显式载体 × 训练信号的等参数对照」，**不是首创**。另：F2 的机制主题只存在于上一时代引擎（现共享底座 `pathlm/depth_ar.py` 无 retry 站），F4 的主判据腿是本仓已**永久降级**的分布外腿（`SCHEMA.md` §17.18）——两项在能重做前不进主线。"
method: "单因素、两组：① 回传通道臂 = {direct, linear, soft, hard} × {有 / 无外部注入}；② 训练信号臂 = {无（纯 CE）, consistency, reconstruction / sufficiency} × {有 / 无显式载体}。基底恒为 stock decoder-only；F2 需先在能跑该干预的底座上重建（现共享底座无 retry 站）。"
validation: "端到端：对照 = 全量标准模型（归一为 100%）+ **同算力加深度** + **同参数加宽 / 加层** + **不迭代但同 FLOPs** 三类；客观判据 = 质量-算力前沿是否上移（该涨）+ 目标量（组合一致性 / 重建质量，该涨）+ 主任务质量不反噬（必须不变）；口径 = 等效理论算力（FLOPs / layer-passes / tokens-per-forward），禁墙钟。该涨：同算力下的序列级质量 / 目标能力（相对同算力加深度）；该跌：无（多花算力是该范式的定义性质，不是亏损发现）；必须不变：主任务质量与因果性。"
objective_criteria: "该涨：同算力预算下相对「同算力加深度」的序列级质量 / 目标能力；该跌：无（代价轴如实报）；必须不变：辅助 / 重复损失不得反噬主任务质量；必须报：每轮边际——但须用可分辨的单位，**不得**用落在噪声带内的 bpc 边际（`docs/methodology.md` 方差带 0.014，训练侧 bpc 噪声 ~0.0156 已超带）。"
falsification: "若「无注入的重入」在任何规模都无新信息（信息论意义，不是「结构性 no-op」的口头铁律），或辅助训练信号在**分布内**腿上也测不出效应（效应 < 该腿重跑方差，参考 F4 旧腿 n=3 极差 10.84pp ≥ 3pp 效应），或重复算力被「同算力加深度」严格支配 ⇒ 判该算力路径不值、维持 Backlog。另：机制归属错（F2 属深度 / 选择器、F4 属信息右移）时，按归属改挂而非留在此处。"
cost_model: "等效理论量：重复 r 轮的 layer-passes/token = r·L（L = 层数；轮间共享同层、不增参）；tokens-per-forward 不变（除非整段迭代）。考虑 pipelining：轮间有数据依赖、不可与层内流水重叠，故 r 轮的端到端顺序深度 = r·L；对照「同算力加深度」用 r·L 层单遍，FLOPs 按层数线性。报账双列：重复臂 vs 同算力加深度臂。"

