# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "2.3.1"
axis: "2 深度轴"
title: "逐层容量变化：前大后小 / 逐渐放大"
dir: "axes/2-depth/2.3.1-layer-capacity"

purpose: "普通 decoder-only transformer 每层容量相同，但浅层与深层承担的角色不同（浅层建表征、深层做组合/抽象）；本项要问：在**总参数固定**时，把容量按深度重分配（前大后小 / 逐渐放大）能否提高质量。"
innovation: "相对普通 decoder-only transformer 的均匀层容量，让每层的容量（d_model / MLP 隐藏宽 / 注意力头数）按深度变化——前大后小（宽浅壳）或逐渐放大（先窄后宽）。改动量级：总参数量固定，只在层间重分配；每 token 的 layer-passes 仍为 L。"
expected_effect: "（a）同总参数下把容量放到最需要的深度，clean bpc 相对 uniform 可排序下降；（b）暴露出「深度形状」是否是一个独立于宽度的设计维度。"
sota_baseline: "非均匀深度容量的既有工作（金字塔 / hourglass / 深度方向宽度 schedule 的 transformer 变体）；本地零经验（MAPPING §2 无旧格）。本地锚 = stock uniform 全深度（归一为 100%）。"
gap: "本仓零经验。与 `3.1.2` 逐层宽度变化的边界：本项判**深度形状**（哪层大哪层小、总参数固定）对质量-代价，`3.1.2` 判宽度轴定义下的金字塔/沙漏读数；两者在实现上重叠，已由 integrator 核对表述不矛盾。本项只做沿深度的容量重分配，纯宽度轴读数归 3.1.2。"
method: "单因素：固定总参数与训练预算，只改每层容量随深度的分布。臂 = {uniform（stock）, 前大后小（线性/阶梯递减）, 逐渐放大（递增）, hourglass（中段大）}。基底恒为 stock decoder-only；各臂总参数逐位对齐。"
validation: "端到端：对照 = stock uniform 全深度（归一为 100%）；客观判据 = clean bpc（序列级，该跌/可排序，须越 0.014 噪声带）+ 每层容量分布（作对照列）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变：总参数量（各臂逐位相等，否则不是同预算比较）。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
objective_criteria: "该跌：clean bpc（序列级，相对 stock uniform）；必须不变：总参数量（所有臂逐位相等）与因果性；必须报：每层容量分布（作对照列）。"
falsification: "若非均匀容量在固定总参数下相对 uniform 的 clean bpc 不越噪声带（0.014）⇒ 判逐层容量变化在本尺度不是独立有增益的维度，并入 3.1.2 的宽度轴读数。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
failure_analysis: "本项 `falsification` 预登记条件成立（非均匀容量在固定总参数下相对 uniform 不越噪声带/更差 ⇒ 逐层容量变化在本尺度不是独立有增益的维度），status = 被否证。归因区分：**设计问题（主因）**：本尺度 L=8 太浅，且监督只在最终深度（stock AR、仅末深度 CE，无中间深度监督），深度形状缺少着力面——更深或配深度监督时是否仍无增量本实验未覆盖；本实现只重分配 FFN 隐藏宽（`d_model` 逐层不变、注意力头数不变），干预面比「逐层 d_model 宽度」窄。**结构问题（已排除）**：等预算门（P4）、引擎等值门（P5）、活性门（P6）全过——逐层隐藏维逐位等于 schedule、逐层 FFN 相对幅度 > 0（非死路径），显式 uniform schedule 与引擎缺省逐位一致 ⇒「更差」不是接线错误、不是死路径、不是不同预算造成的假差异。`front-big` 名义越带 1.6×10⁻⁶（方向为更差）+ `growing` 不越带 ⇒ 两臂都无正面增益，实质条件成立；字面「不越噪声带」一项由 `growing` 单独满足。**innovation 本身失败（未主张）**：本项只到「本尺度无净增量」，不主张逐层容量变化在任何尺度失败；跨轴同尺度旁证（2641，n=2，PYR/APYR vs uniform）同得 H0，方向一致但不作本项判据。"
conclusion: "本地实测已有明确结论（三臂全部训完并落盘；臂完整性 as of 2026-10-14T22:53:04+08:00 = `results.json` 的 `generated_at`）：在总参数与每 token FFN 算力逐位相等的固定预算下，逐层 FFN 隐藏宽的非均匀分配相对 stock uniform **无正面增益**。clean bpc：`uniform` 1.5291、`front-big` 1.5431（Δ = bpc_uniform − bpc_front-big = −0.0140，逐窗 5/5 为负、窗间 SE 0.0031，全精度 −0.0140016 名义略超带 1.6×10⁻⁶、按 4dp 报数则恰落在带界 ⇒ 判「可排序更差（边界）」）、`growing` 1.5309（Δ = −0.0018、窗间 SE 0.0018 ⇒ 「不可排序（H0）」）。三臂等 FFN 预算门（Σh = 8192、FFN 参数 4 204 544、每 token FFN MACs 4 194 304 逐位相等；解析式与实测互核）、引擎等值门（显式 uniform schedule == 引擎缺省 `--mlp-mult 4`，state_dict + 前向逐位一致）、活性（逐层隐藏维 == schedule、逐层 FFN 相对幅度 > 0）全过。**字面读法**：milestone 验收（各臂总参数逐位相等 + 非均匀差异二分明确）**成立**；**实质读法（C2）**：非均匀臂均未被 uniform 支配、未提供净增量 ⇒ **实质否证**。结论只在本尺度（8 层 / d256 / 12k 步 / 仅最终深度 CE）内成立，不外推；`hourglass` 臂未列，seed=1 未跑。独立复核见 `conclusion_review`（第 1 轮 fresh 复核 PASS）。"
conclusion_review: "本项无旧格、本仓零经验。结论基于三臂本地实测（判据与基线按 docs/research-schema.md 预登记，判据线 P1–P6 未改），把「总参数 / FFN 预算逐位相等」钉死以防把参数量或算力优势误读为深度形状优势。`experiments/2655-layer-capacity-13m/` 三臂均通过 CLI `--mlp-hidden-sched` 表达（引擎 E2，提交 4638882；共享代码未改）。判词：`front-big` 可排序更差（边界）、`growing` 不可排序（H0）⇒ 预登记否证条件成立。跨轴旁证（3.1.4 / 2641，同引擎同配方、等 FFN 预算、n=2）同得 H0，方向一致，但「跨轴证据能否作本项终局判据 / 2.3.1 与 3.1.4 是否同题」属框架性取舍，已上报 Main，本目录不自行合并或改名。**第 1 轮独立复核（fresh 上下文）判 PASS**（判词见 `.scratch/61-axis2-depth/TICKET.md` §9.18「复核记录（本轮）」；本轮为 WP-2652/2655 的第 1 轮独立复核，`docs/research-schema.md` §11.3）；其 non-blocking N1–N3 本轮已处置：N1（「越带 vs falsification」措辞：`failure_analysis` 补「`front-big` 名义越带 1.6×10⁻⁶ 且方向为更差 + `growing` 不越带 ⇒ 字面『不越带』由 `growing` 单独满足」）、N2（根目录重复产物 `uniform-s0-{gate_log.jsonl,shared_results.json,train_log.jsonl}` 已从树中移除：经 `cmp` 验证与 `runs/uniform-s0-12k/` 下同名文件逐字节相同，内容未失）、N3（`TICKET §9.12`/`§9.15` 的陈旧行属 lead 的文件，本 writer 不动、已回报）。"
