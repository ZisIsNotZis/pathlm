# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "2.3.1"
axis: "2 深度轴"
title: "逐层容量变化：前大后小 / 逐渐放大"
dir: "axes/2-depth/2.3.1-layer-capacity"

purpose: "普通 decoder-only transformer 每层容量相同，但浅层与深层承担的角色不同（浅层建表征、深层做组合/抽象）；本项要问：在**总参数固定**时，把容量按深度重分配（前大后小 / 逐渐放大）能否提高质量。"
innovation: "相对普通 decoder-only transformer 的均匀层容量，让每层的容量（d_model / MLP 隐藏宽 / 注意力头数）按深度变化——前大后小（宽浅壳）或逐渐放大（先窄后宽）。改动量级：总参数量固定，只在层间重分配；每 token 的 layer-passes 仍为 L。"
expected_effect: "（a）同总参数下把容量放到最需要的深度，clean bpc 相对 uniform 可排序下降；（b）暴露出「深度形状」是否是一个独立于宽度的设计维度。"
sota_baseline: "非均匀深度容量的既有工作（金字塔 / hourglass / 深度方向宽度 schedule 的 transformer 变体）；本地零经验（MAPPING §2 无旧格）。本地锚 = stock uniform 全深度（归一为 100%）。"
gap: "本仓零经验。与 `3.1.2` 逐层宽度变化的边界：本项判**深度形状**（哪层大哪层小、总参数固定）对质量-代价，`3.1.2` 判宽度轴定义下的金字塔/沙漏读数；两者在实现上重叠，已由 integrator 核对表述不矛盾。本项只做沿深度的容量重分配，纯宽度轴读数归 3.1.2。"
method: "单因素：固定总参数与训练预算，只改每层容量随深度的分布。臂 = {uniform（stock）, 前大后小（线性/阶梯递减）, 逐渐放大（递增）, hourglass（中段大）}。基底恒为 stock decoder-only；各臂总参数逐位对齐。"
validation: "端到端：对照 = stock uniform 全深度（归一为 100%）；客观判据 = clean bpc（序列级，该跌/可排序，须越 0.014 噪声带）+ 每层容量分布（作对照列）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变：总参数量（各臂逐位相等，否则不是同预算比较）。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
objective_criteria: "该跌：clean bpc（序列级，相对 stock uniform）；必须不变：总参数量（所有臂逐位相等）与因果性；必须报：每层容量分布（作对照列）。"
falsification: "若非均匀容量在固定总参数下相对 uniform 的 clean bpc 不越噪声带（0.014）⇒ 判逐层容量变化在本尺度不是独立有增益的维度，并入 3.1.2 的宽度轴读数。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
failure_analysis: ""
conclusion: ""
conclusion_review: "本项无旧格、本仓零经验，status = 进行中（`uniform` 臂已训完并落盘，两个非均匀臂待跑）。判据与基线按 docs/research-schema.md 预登记（对照 + 客观判据 + 口径 + 否证条件），把「总参数量逐位对齐」钉死以防把参数量优势误读为深度形状优势。**当前本地事实**：`experiments/2655-layer-capacity-13m/` 三臂均通过 CLI `--mlp-hidden-sched` 表达（引擎 E2，提交 4638882；共享代码未改）；等预算门实测通过——三臂 Σh = 8192、FFN 参数 4 204 544、总参数 6 962 688、每 token FFN MACs 4 194 304 **逐位相等**（解析值与实测值两条路径互核）；引擎等值门通过——显式 uniform schedule 与引擎缺省（`--mlp-mult 4`）的 state_dict 与前向**逐位一致**（单测钉住 + 必红探针）；活性通过——逐层隐藏维 == schedule、每层 FFN 相对幅度 > 0.47。`uniform` 臂 clean bpc = **1.5291**（同配方历史锚：2613 sequential-s0 1.5254、差 +0.0037；2641 U4-s0 1.5314、差 −0.0023，均 <0.005）。**主判据未测**：`front-big` / `growing` 相对 `uniform` 的配对 Δbpc 未跑成（共享 4090 被外部任务持续占用、等锁未取到；等效成本 2 × 98.3M token 已登记），故本项尚无可下判词。独立复核未做。"
experiments:
  - "axes/2-depth/2.3.1-layer-capacity/experiments/2655-layer-capacity-13m"
  - "axes/2-depth/2.3.1-layer-capacity/experiments/2655-layer-capacity-13m/analysis.md"
argument: "均匀容量默认「所有深度同等重要」；本项检验该假设。判据必须钉在「固定总参数」上，否则无法把「重分配」与「单纯加参数」区分开。本 WP 的选择是把「固定预算」做成**逐位相等**的两条独立账（Σ_h = 8192 ⇒ FFN 参数与每 token FFN MACs 逐位相等），并用引擎等值门（显式 uniform schedule == 引擎缺省，逐位）把「开关本身是否改变别的东西」排除——这两条都是可失败的检查（`smoke.py` 各带必红探针）。它与宽度轴的 3.1.2 是同一族问题的两个记账面，故把边界写进 gap、由 integrator 统一。可读副产品：层间不等宽会使各层 FLOPs 不同，层间流水的最慢层决定节拍——每层 FFN MACs 分布已逐层落盘（4 194 304 总量在两臂间不变，只是分布不同）。"
gaps:
  - "本仓零经验：需先做最小判决（13M、同总参数、{uniform, 前大后小, 逐渐放大, hourglass} 四臂，clean bpc）——**本轮做了 3 臂中的 uniform，`front-big` / `growing` 未测，hourglass 未列**"
  - "主判据未测：`front-big` / `growing` 相对 `uniform` 的配对 Δbpc（0.014 带，限配对 Δ、≥5 窗口）未有读数；等效成本 2 × 98.3M token 已登记"
  - "与 3.1.2 逐层宽度变化的边界已由 integrator 核对为不矛盾（按轴分工各记一面）"
  - "逐层容量 schedule 与 2.1.1 早退的联合（浅层容量是否影响可截断性）未测"
  - "n=1（seed=0）：任何判词只能到「可排序 / 不可排序」二分，不支撑 trend；seed=1 未跑"
cost_model: "等效理论量：各臂总参数量固定，每 token 的 layer-passes 仍为 L，总 FLOPs 近似不变（只把每层乘加规模在层间重分配）；tokens-per-forward 每步 1。考虑 pipelining：非均匀层宽使各层计算量不同，层间流水的最慢层决定节拍，须以每层 FLOPs 分布（而非任何时间量）评估。"

