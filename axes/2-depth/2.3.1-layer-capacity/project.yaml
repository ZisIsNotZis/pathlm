argument: "均匀容量默认「所有深度同等重要」；本项检验该假设。判据必须钉在「固定总参数」上，否则无法把「重分配」与「单纯加参数」区分开。本 WP 把「固定预算」做成**逐位相等**的两条独立账（Σ_h = 8192 ⇒ FFN 参数与每 token FFN MACs 逐位相等），并用引擎等值门（显式 uniform schedule == 引擎缺省，逐位）把「开关本身是否改变别的东西」排除——这两条都是可失败的检查（`smoke.py` 各带必红探针）。**终局读数**：两种非均匀分配都未越噪声带取得正面增益（`front-big` 更差 0.0140、`growing` 不可分 0.0018），「均匀容量默认所有深度同等重要」这一被挑战的假设**未被推翻**——在本尺度，深度形状不是可兑现的独立增益维度。它与宽度轴的 3.1.2 是同一族问题的两个记账面，故把边界写进 gap、由 integrator 统一。可读副产品：层间不等宽使各层 FLOPs 不同，层间流水的最慢层决定节拍——每层 FFN MACs 分布已逐层落盘（4 194 304 总量在三臂间不变，只是分布不同）。"
gaps:
  - "本仓零经验：最小判决（13M、同总参数、{uniform, 前大后小, 逐渐放大}，clean bpc）已做——三臂全部训完；`hourglass`（中段大）臂未列"
  - "主判据已出读数：`front-big` 更差 0.0140（边界）、`growing` 不可排序 0.0018 ⇒ 非均匀无正面增益"
  - "本实现只重分配 FFN 隐藏宽；逐层 `d_model` / 注意力头数逐位不变（后者属 2.3.2 轴）。在更深（>8 层）或配中间深度监督时是否仍无增量，未测"
  - "与 3.1.2 逐层宽度变化的边界已由 integrator 核对为不矛盾（按轴分工各记一面）"
  - "跨轴旁证：3.1.4 / 2641（同引擎同配方、等 FFN 预算、n=2）同得 H0 —— 跨轴证据能否作本项终局判据 / 2.3.1 与 3.1.4 是否同题，属框架性取舍，已上报 Main 待裁决"
  - "逐层容量 schedule 与 2.1.1 早退的联合（浅层容量是否影响可截断性）未测"
  - "n=1（seed=0）：判词只到「可排序 / 不可排序」二分，不支撑 trend；seed=1 未跑"
cost_model: "等效理论量：各臂总参数量固定，每 token 的 layer-passes 仍为 L，总 FLOPs 近似不变（只把每层乘加规模在层间重分配）；tokens-per-forward 每步 1。考虑 pipelining：非均匀层宽使各层计算量不同，层间流水的最慢层决定节拍，须以每层 FLOPs 分布（而非任何时间量）评估。"

