argument: "`2613` 与 `2651` 的层间拓扑实验（同引擎、同配方，唯一科学变量 = 层间接法；`2651` 相对 `2613` 的唯一变量 = seed 0→1）给出：`dense` 臂的层权确实被学起（α fro 3.3049、偏离恒等起步 1.3615、浅层被放大 2.36×）但质量中性（s0 Δ = −0.0008，|Δ| < 0.014）且逐深度可读性不改善（中间深度更差），这排除了「干预没生效」的替代解释 ⇒ 在本尺度判「密集跨层线性聚合无净增量」。同组对照 2.2.4 并行子层与 2.2.2 注意力聚合用于区分「线性加权和」与「内容相关聚合」的增量。"
gaps:
  - "n≥2 seed 复核未完成：seed=1（2651）只完成基线 `sequential`，`parallel`/`parallel-dual-ln`/`dense` 三臂因跨轴 GPU 锁饥饿未跑（等效成本 = 每臂 98.3M token、三臂合计 294.9M token，未消耗）；本项判决为 n=1，此为该判决唯一可被推翻的路径"
  - "13M/12k 单快照：更大规模点（milestone 要求）与 24k 收敛点未跑（55-review：快照不能当渐近结论）"
  - "dense 的层权无单纯形约束（≠ 原论文严格凸组合语义），与 DenseFormer 的严格对照未做"
  - "与 2.2.2 层间 causal attention 的同预算对照未做（WP2）"
  - "dense 的「中间深度更差」（depth 1–7 Δ = +0.226…+0.544）与 2.2.1 残差形式 / 2.1.1 早退的耦合未做联合检验"
cost_model: "等效理论量：每 token 的 layer-passes 仍为 L（层数不变）；层间学习加权和每层对 l 个历史层输出做加权求和 ⇒ 每 token 额外 ≈ Σ_l l·d = O(L²·d) FLOPs（相对单残差基线），可用缓存历史层输出降为 O(L·d) 存储开销；tokens-per-forward 每步 1。考虑 pipelining：层间加权和使每层依赖其全部历史层，增加层间串行依赖（不利于跨层流水），该依赖须与单残差对照量化。"

