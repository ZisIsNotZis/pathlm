# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "2.2.3"
axis: "2 深度轴"
title: "层间学习加权和（DenseFormer 式）"
dir: "axes/2-depth/2.2.3-learned-layer-sum"

purpose: "普通 decoder-only transformer 每层只接上一层（单残差），深层的表示被逐层串联挤压；本项要问：把每层的输入换成对**之前所有层输出**的学习加权和（DenseFormer 式密集跨层聚合），能否在可接受的代价下提高质量。"
innovation: "相对普通 decoder-only transformer 的单残差，每层的输入 = Σ_j α_{l,j}·h_j（j < l，对全部历史层输出的学习加权和），权重起步接近恒等（只选紧邻上一层，逐位等价于 stock）随后自行学习。改动量级：新增每层一组层权（≈ L(L+1)/2 个标量，本实验 36 个，相对主干参数近零）。"
expected_effect: "（a）缓解逐层串联的信息瓶颈，让深层直接复用浅层表示；（b）若有效应体现为 clean bpc 相对单残差的可排序下降；（c）代价是每层对全部历史层加权（额外 O(L·d) 每层，可缓存）；把代价放进以 stock 单残差全深度为 100% 的质量-代价前沿。"
sota_baseline: "DenseFormer（2023，对历史层输出做学习加权和）；本地锚 = 旧格 C3 实测（dense 臂 −0.0008 中性，n=1）与 stock 单残差全深度（13M 参照 1.5254，历史同配置 1.5287）。"
gap: "旧格 C3 是「手段枚举、无目的」（55-review C-P10），且用**质量面零区分度**的并列判据 `tf@4 ≥ 0.95`（对 stock dense 形态不可达，同配置 dense tf@4 = 0.444）、n=1 seed、13M/12k 快照就判 `judged`。本项增量 = 把目的写成质量-代价前沿、判据钉在可排序的 clean bpc 与逐深度可读性上，补 n≥2 与更大规模复核；把「加权和升级成 causal attention」的假设交给 2.2.2。"
method: "单因素：固定宽度/层数/训练预算，只改层间聚合方式。臂 = {stock 单残差, 层间学习加权和（DenseFormer 式）, 对照臂 2.2.4 并行子层 / 2.2.2 层间 causal attention}。基底恒为 stock decoder-only；等参数对照须齐。"
validation: "端到端：对照 = stock 单残差全深度（归一为 100%）+ 同预算固定深度；客观判据 = clean bpc（序列级，该跌，须越 0.014 噪声带才算可排序）+ 逐深度 bpc（中间深度可读性，该跌）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变：参数量（额外 36 个层权须报告并计代价）、因果性、层权活性（排除「干预没生效」）。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
objective_criteria: "该跌：clean bpc（序列级，相对 stock 单残差）与逐深度 bpc；必须报：额外层权参数与每 token 额外加权 FLOPs（代价列）；必须不变：因果性、等参数对照的参数量；活性：层权确实被学起（本实验 fro 3.305、第 1 层输入放大 2.36×、36 个权重全非零）。"
falsification: "若层间学习加权和相对 stock 单残差的 clean bpc 不越噪声带（0.014），且逐深度可读性无改善 ⇒ 判密集跨层线性聚合在本尺度无净增量；若优势只在 n=1 seed 出现、扩 seed 后消失 ⇒ 判为噪声。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
failure_analysis: "归因（先区分设计 / 结构 / innovation）：①**结构问题（主因）**：本尺度 L=8 太浅、且 stock 形态只有最终深度监督，「逐层串联的信息瓶颈」这一 DenseFormer 要缓解的条件在本尺度不成立——层间加权和自由地改变了中间层表示（s0 中间深度 bpc 全部高于基线，depth 1–7 的 Δ = +0.226…+0.544，而 s0↔s1 基线的中间深度换 seed 散度为 0.006–0.121（depth 1–7；0.010 是 depth 0 的值，非中间深度）⇒ 方向一致、量级在噪声之上，逐深度倍率 2.5–46 倍），最终靠后续层重新学回 parity（depth 8 Δ = −0.0008），说明该机制在本尺度没有可兑现的净增量。②**设计问题（次因、可修、非主因）**：本实现的 α 无单纯形约束（≠ DenseFormer 严格凸组合语义），且无中间深度监督约束层间混合；但干预活性成立（α fro 3.3049、absmax 2.3615、36 权全非零、第 1 层输入放大 2.36×），故 null **不能**归因于「干预没生效」。③**非 innovation 本身失败**：DenseFormer 族在更大规模有已报告增益（见 sota_baseline / prior art），本项只判「13M/12k 本尺度无净增量」，更大规模与带中间监督的复核未做（见 gaps）。④**非实现/口径/统计假象**：s0 与 s1 的评测口径由引擎等值门钉住（`run.py::remeasure_s0` 逐位复现 2613 记录，`[s0] remeasured all_bitwise_equal=True`）；参数量账逐位核对通过（parallel −4096 / parallel-dual-ln 0 / dense +36）；n=1 是已如实登记的边界（见 gaps）。"
conclusion: "在 13M / 12k 步 / 98.3M token / matched-step 快照 + 0.014 bpc 带（限配对 Δ、≥5 窗口）下：层间学习加权和（`dense` 臂）相对 stock 单残差（`sequential`）**无可排序差异**（s0 配对 Δ = −0.0008，|Δ| ≪ 带 且 ≪ 换 seed 噪声 0.0034）；且**逐深度可读性无改善**（s0 中间深度实测更差：depth 1–7 的 Δ = +0.226/+0.544/+0.448/+0.312/+0.206/+0.257/+0.279，仅 depth 8 回到 −0.0008）⇒ 按本项 falsification 两条件，密集跨层线性聚合**在本尺度无净增量**。干预确曾生效（α fro 3.3049、36 权全非零、浅层输入放大 2.36×），排除「干预没生效」。**臂完整性（as of 2026-10-14T22:34+08:00）**：s1（seed=1）四臂只完成基线 `sequential`（1.5288），`parallel`/`parallel-dual-ln`/`dense` 三臂因跨轴 GPU 锁饥饿未跑（等效成本 = 每臂 98.3M token、三臂合计 294.9M token，未消耗），故本判为 **n=1**、尺度受限。字面（预登记判据线）：不越 0.014 带 ⇒「无差异」成立；实质（falsification 全条件）：不越带且逐深度无改善 ⇒ 本机制在本尺度无净增量、提案被否证。证据：`experiments/2651-inter-layer-topology-s1-13m/analysis.md` 与 `experiments/2613-inter-layer-topology-13m/analysis.md`。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
conclusion_review: "status = 被否证：本项在 13M/12k 尺度的机制判决由预登记 falsification 直接给出（不越带且逐深度无改善 ⇒ 无净增量），失败归因按 结构问题（主因）/ 设计问题（次因、可修、非主因）/ 非 innovation 本身失败 分开并给证据。判定边界：n=1（seed=1 三臂因跨轴锁饥饿未跑，等效成本 294.9M token），WP1 的 n≥2 与更大规模复核列入 gaps，是该判决唯一可被推翻的路径。新读数「dense 的中间深度更差」与 2.2.1 残差形式 / 2.1.1 早退的耦合未做。独立复核未做。"
