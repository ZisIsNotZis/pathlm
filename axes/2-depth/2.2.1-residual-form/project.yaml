  - "axes/2-depth/2.2.1-residual-form/experiments/2652-residual-form-13m/analysis.md"
argument: "残差是深度轴的「连接语法」：早退（2.1.x）问「要不要跑这层」，本项问「跑完之后怎么把结果接回主线」。两者耦合——残差形式决定中间层状态是否已接近可用，从而影响可截断性。本地实测把这条耦合量化了：残差写法在**终质维**（clean bpc）不可排序（三形式配对 Δ 全 < 0.014），但在**可截断性维**（逐深度 bpc 的中间深度）确实移动——post-LN 把中间深度读出大幅推差（depth 1 的 bpc 4.95→10.13），固定 1/√(l+1) 缩放把它小幅推好（+0.06…+0.47，代价终质 −0.0103），门控只有 |Δ|≤0.0864 的微小扰动。因此「靠换残差写法改善可截断性」在 pre-LN 单残差之外没有正向头寸（pre-LN 已是这条线上较好的那个），且 post-LN 的中间深度退化部分来自 tied 读出（无 final LN）看到的残差流量级被归一（stream_rms≈0.87 vs base 1.5–2.1）这一预登记混杂。判据必须同时看质量（bpc）与深度可读性（逐深度 bpc），否则会把「深层更好」误当成「可截断」。"
gaps:
  - "单 seed（s0）：本 WP 预算内四臂各一次，n≥2 跨 seed 复现未做；逐深度形状差异（尤其 post-LN）的稳健性待 s1 复核"
  - "无独立等参数对照臂：契约 §4-P6 选定「额外参数 ≤0.1% ⇒ 直接与 base 比」，gated 仅 +16 参数（0.00023%）；『gated 的带内差异是否可能来自那 16 个参数』这一未剥离项保留"
  - "post-LN 的读出尺度混杂未剥离：stream_rms_by_layer≈0.87（base 1.5–2.1），中间深度变差可能部分来自 tied 读出（无 final LN）的输入量级改变，未做『加 final LN』的对照臂"
  - "残差形式与 2.1.1 early exit 的联合（可截断性端到端）未测：本项只读『逐深度 bpc』代理"
  - "『残差随深度衰减』形式未单列：本项 scaled 是固定 1/√(l+1) 缩放，未测 α^l 式衰减变体"
  - "不越尺度外推：单任务（enwik8 字符级）+ 13M/12k + dense/sequential 单轴单格；post-norm / 缩放残差在大规模（≥100M）的稳定性未测"
cost_model: "等效理论量：pre/post-norm 与 ReZero 标量门不改每 token 的 layer-passes（= L）与 per-layer FLOPs 主项；门控残差每层加 ≤ d 参数的乘加（每 token 额外 ≈ L·d FLOPs，占比 <1%）。tokens-per-forward 每步 1。考虑 pipelining：残差形式不改变每步计算图结构，故不影响流水并行度；代价体现在参数量与逐深度可读性上。"

