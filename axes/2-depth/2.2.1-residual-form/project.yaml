  - law: 10
    change: "残差换成 post-LN（相对 stock pre-LN 单残差）"
    touches_trunk: true
    metric: "clean bpc Δ（实验 − stock；正 = 更差）"
    delta: "+0.0026"
    delta_direction: arm_minus_comparator
    comparator: "stock pre-LN 单残差"
    scale: "13M / L=8 / 12k 步 / 98.3M token 快照（2652）"
    boundary: "|Δ| < 0.014 ⇒ 终质维不可排序（不是「无效应」）；可截断性维越带且方向与预登记相反，post-LN 让中间深度读出更差"
    source: "axes/2-depth/2.2.1-residual-form/experiments/2652-residual-form-13m/analysis.md"
experiments:
