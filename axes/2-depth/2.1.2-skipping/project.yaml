argument: "跳层与逐 token 早退是同一目的（省算力）的两种手段：早退是「某 token 提前停」（layer-passes 按 token 变），跳层是「所有 token 都跳过同一批层」（layer-passes 按层数变）。旧 C2 的「元素税定律」（破坏 identity/order 的贵，保留/标记 identity 的近免费）是有用的观测，但其 p_skip 口径是逐序列而非逐 token、跨旧 M2 引擎，不能直接当本项结论。判据必须钉在序列级 bpc 与 layer-passes/token 上，并把「训练/评测跳层分布一致」列为必须不变项，否则报的是训练分布外的崩点而非机制结论。"
gaps:
  - "无 depth-ar 引擎的跳层重测：旧税数字来自旧 M2 引擎、p_skip 逐序列（C-P09）"
  - "无逐 token layer dropout 版本：旧 p_skip 对整条路径丢同一批层，不是「每个 token 独立跳」"
  - "无与 2.1.1 逐 token 早退的同预算比较"
  - "旧 C2 只有 self-review（user approved self-review in lieu），需独立复核"
  - "未跑臂的等效算力成本：每臂 12k 步 × bs32 × seq256 = 98.3M token，四个未跑臂合计 393.2M token（与姊妹项 2.2.2 / 2.3.2 同账）"
  - "实装未过活性门：冒烟已取锁运行（run_log.txt:5 = 2026-10-14T22:37:39）——`stock` / `skip-mid` / `layers6` 活性门过（lp = 8.0 / 6.0 / 6.0），`layerdrop-pt` 实测 lp 8.0 ≠ 设计 7.2（run_log.txt:2194，断言 run.py:451）⇒ 按 `2654/README.md` §4-P1 该臂作废，须先在 CPU 上修接线/记账再排 GPU"
cost_model: "等效理论量：每 token 的 layer-passes = L − 被跳层数（逐 token layer dropout 时按该 token 实际跳过的层数计），总账 = Σ(L − skip_i)/N；tokens-per-forward 每步 1（跳层不改该量）。考虑 pipelining：固定跳同一批层时整批同步省该批层的计算与 KV；逐 token 独立跳时同批内最长路径决定前向次数，收益体现在平均 layer-passes 与批内跳过层的占比。跳过的层不产生该层的 KV。"

