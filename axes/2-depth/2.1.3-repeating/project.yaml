# 研究项 SSOT（Backlog）：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "2.1.3"
axis: "2 深度轴"
title: "repeating 循环 transformer：多算力换少参数"
dir: "axes/2-depth/2.1.3-repeating"

purpose: "在参数量/显存受限时，用「同一组层参数被重复前向多次」换取更大的有效深度——即用可变的算力（layer-passes/token）换参数量效率；本项先判定这条路径是否值得立项。"
innovation: "相对普通 decoder-only transformer 的「每层一组独立参数、只前向一次」，让同一组层参数被重复前向 n 次（Universal Transformer 式循环深度）。改动量级：参数量 ≈ 单组层参数（远小于 n 层独立参数），layer-passes/token 随重复次数 n 线性上升。"
expected_effect: "（a）在给定参数量下拿到更大的有效深度；（b）用可变的重复次数换取推理期算力弹性；（c）代价是算力（layer-passes/token）随 n 上升，且循环共享可能训练更难、易不稳。"
sota_baseline: "Universal Transformer（Dehghani 2018，循环深度 + ACT）、递归/循环深度一族。本地零经验（MAPPING §1 无旧格实验；旧格 C4 权重共享的 `记忆·未核` 结论不可当基线）。"
gap: "本格已有本地实测（`experiments/2691-repeating-vs-dense-13m`：四臂、同算力与同参数两对照、一次重复层位诊断）。此前零经验。且出资人 C4 批注明确指出「不省计算、只省显存的路子研究意义不大——未来是 MoE 这种不 care 显存、省计算的路线」。故本项列 Backlog 的前提是**先论证它是否可能改变「某算力路径值不值」的判断**：只有在「参数量/显存是硬约束、且循环深度相对同参数非共享 dense 有可排序质量优势」时，才值得移出 Backlog。"
method: "单因素：固定层宽/总参数预算，只改「层参数是否共享、重复几次」。臂 = {stock 独立层, 全共享循环 n∈{2,4,8}, 部分共享（每 k 层一组）}。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 同参数量 non-shared dense 与同 FLOPs 的独立层基线（归一为 100%）+ Universal Transformer 报告口径；客观判据 = 同 layer-passes 预算下的序列级 perplexity（该涨/不跌，须越 0.014 噪声带）+ 达到同等质量所需参数量（该跌）+ 训练稳定性（必须不变，不得崩）；口径 = layer-passes/token 与参数量，**墙钟不进判据**。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
objective_criteria: "该跌：达到同等序列级质量所需参数量；该涨/该降：同 layer-passes 预算下的序列级质量（该涨，相对同参数非共享 dense）；必须报：layer-passes/token（随 n 上升的代价列）；必须不变：训练不崩、因果性。"
falsification: "若在固定参数量下循环深度相对同参数量非共享 dense 的序列级质量无可排序改善，或在同 layer-passes 预算下始终更差、训练不稳定 ⇒ 判本路径不改变「某算力路径值不值」的判断，维持 Backlog，不立项。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
failure_analysis: "本项主假设（用算力换参数的循环深度可能改变「某算力路径值不值」的判断）被本地证据否证（`experiments/2691-repeating-vs-dense-13m`，四臂、配对 20 窗口）。按四类分开：①**结构问题（主因，可测）**：同参数、同算力下把重复从「整栈两遍」换成「只重复后半段」（`repeat2x-tail`）差 +0.001023（0.014 带内、两半反号），而两者相对同算力 12 层稠密都差 −0.039009 / −0.040033（2.79 / 2.86 倍带）⇒ 亏损与重复层位无关，属于「6 组参数的容量不足以替代 12 组独立层函数」：每多一次传递买到约 0.0035 bpc（0.021021 / 6），而每多一组独立参数买到约 0.0102 bpc（0.061054 / 6），前者是后者的 34.4%。②**设计问题（本实验未测，登记为 gap）**：循环臂**没有步嵌入**（`README.md` §2 设计条件 4），第几遍只能靠残差流分辨；若「重复更难优化」而非「6 组参数不够」，本实验不能排除这一半（正弦步嵌入 0 参数、学习步嵌入 ≈1.5k 参数，单臂 ≈8 min GPU）；只有 n=2 一个重复次数点、同 lr 调度未扫描。训练随机性已由 seed 1 复本覆盖（两条主判同号且都越带），不是缺口。③**非 innovation 本身失败**：同参数下循环确实买到可排序质量（+0.021021，1.50 倍带），机制是活的（恒等调度与 stock 逐位等值、重复相对只跑前缀的最终 logits 偏差 0.3221 / 0.3878），训练未崩（`grad_skips = 0`）；被否证的是它的**价值主张**（相对同算力稠密更值），不是「重复前向没用」。④**非实现/口径/统计假象**：P0 用本实验评测代码重评历史锚得 1.52804、与 `2654` 落盘值差 0.0；等参数臂同 seed 初始化逐位相同（`state_dict` 哈希相同）、参数量逐位相同；层调用次数逐前向等于设计（6 / 12 / 12 / 12）；逐窗口配对 SE 0.0021–0.0026，两条越带 Δ 是 SE 的 8.2–16.6 倍、两半样本同向。"
conclusion: "在 13M / 12k 步（98.3M token）/ T=256 / enwik8 / seed 0 这一格，四臂从零训练、同评测入口（`experiments/2691-repeating-vs-dense-13m`）：**问一（同每 token 算力 10,909,184 MACs）** 循环臂 `repeat2x`（6 组参数跑 12 次，5,251,584 参数）clean bpc **1.541260**，12 层稠密 **1.501228**，配对逐窗口 Δ = **−0.040033**（SE 0.002412、两半 −0.042215 / −0.037850，越 0.014 带 **2.86 倍**）⇒ **循环更差，可排序**：同算力下多给参数（1.98 倍）买到可排序更好的质量，**「参数才是瓶颈」被否证**。**问二（同参数 5,251,584）** 循环臂比 6 层稠密（**1.562282**）好 **+0.021021**（SE 0.002159、两半 +0.022401 / +0.019642，越带 **1.50 倍**）⇒ 那 6 次额外传递不是白花，但只买到「把 6 组换成 12 组、同样 12 次传递」所买到的 **34.4%**（0.021021 / 0.061054），剩余差距在本刻度可排序。**归因（诊断臂）**：同参数、同算力下「只重复后半段」与「整栈重复一遍」差 **+0.001023（带内 0.07 倍、两半还反号）**，而两者相对 12 层稠密都差 ≈0.039–0.040（同向越带）⇒ 亏损不来自重复的层位，而来自「只有 6 组参数」这一事实；即**层间异质性（12 组独立层函数）在同算力下是必需的，重复传递替代不了它**。代价列：同算力下循环臂的峰值训练显存是 12 层稠密的 **0.939 倍**（1283.5 / 1366.3 MB），同参数下是 6 层稠密的 1.78 倍；墙钟只申报（7.78 / 8.42 / 5.47 min）、不进判据。训练未崩：四臂 `grad_skips = 0`、gnorm max 5.52–15.18。**两 seed 复本（n=2）**：同一设计换种子 1 后，问一 **−0.038268**（SE 0.002318、两半 −0.036973 / −0.039564、2.73 倍带）、问二 **+0.024240**（SE 0.002369、两半 +0.025842 / +0.022639、1.73 倍带）、诊断腿 **−0.002174**（带内、两半 −0.003641 / −0.000708、符号与 seed 0 的 +0.001023 相反但两 seed 都不可排序）⇒ 两条主判**两 seed 同号且都越带**（n=2），「重复只买到换新层收益的 34.4% / 38.8%（均值 36.6%）」在第二个种子上成立；跨 seed 的读数漂移 0.0028–0.0060（小于种子散布上界 0.0138，但与被判效应 0.021–0.024 同量级，故两 seed 同向这句话必要）。**验收并列读法**：milestone 预登记文字（同参数下相对非共享稠密有跨带的可排序优势 ⇒ 才考虑移出 Backlog）**字面成立**（+0.021021，1.50 倍带）；但其价值主张（改变「某算力路径值不值」的判断）按 `falsification` 的第二分支（同 layer-passes 预算下更差）**被否证** ⇒ 维持 Backlog，不立项。本格读数**不是**「循环深度无效」：同参数下它是正收益，只是这笔账在同算力对照下更贵。"
conclusion_review: "**自评（writer，非独立验收）**：判词与盘上读数逐项核对过——四臂 `clean_bpc` 与 `results.json::arm_summary` 逐位一致；两条越带 Δ 的窗口间 SE 与两半样本同向；参数/MACs/显存/墙钟各自带键路径；归因只用了同参数同算力的诊断臂，未越出本刻度。**边界如实登记**：训练随机性已由 seed 1 复本覆盖（两条主判同号且都越带，n=2），但仍只测 n=2 一个重复次数点、无步嵌入、只到 13M / 12k / T=256，结论不外推；「34.4% 边际兑换率」是由两点差算出的**推断**（来源：`dense6` / `dense12` / `repeat2x` 的最终读数），不是多点拟合。**已知缺陷（不改判据、只披露）**：`results.json::arms.*.shared_train.gnorm_skipped_steps` 读错了训练器键名（真名 `grad_skips`）⇒ 该字段恒为 null，真值在 `runs/<臂>-12k-s0/results.json::gnorm_monitor`。**fresh 独立复核未派**（本格 writer 自跑、自判）：复核排在 writer 停止之后，需要独立上下文只看落盘产物。"
