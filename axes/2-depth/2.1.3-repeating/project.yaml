argument: "论证链：先把机制做成**同参数**与**同算力**两个都能进场的形态——6 组参数重复两遍，参数与 6 层稠密逐位相同（同 seed 初始化也逐位相同），每 token 解析 MACs 与 12 层稠密逐位相同（传递次数与读出个数都相同）——再让两问各自对上一个从零训练、同 token 预算、同评测入口的对照臂。问二（同参数）先确认「重复不是白花」；问一（同算力）再确认它是否改变质量-代价前沿的位置。两条读数方向相反：同参数 +0.021、同算力 −0.040，于是「是不是重复本身有税」必须再切一刀：诊断臂把重复挪到后半段、保持同参数同算力，结果与整栈重复不可分辨（+0.001，带内）⇒ 亏损跟着「参数组数」走，不跟着「层被调用几次」。最后用逐深度 bpc 曲线确认中间读出的非单调性只是「第二遍在移动表示」的观察（不是判据），并用 P0 重评历史锚把评测仪器钉在可比位置。"
gaps:
  - "步嵌入臂（本设计未加）：`repeat2x` + 正弦步嵌入（0 参数）或学习步嵌入（≈1.5k 参数），各 1 臂 ≈8 min GPU —— 分开「重复更难优化」与「6 组参数不够」；须新契约（新干预开关）"
  - "第二个重复次数点：`repeat3x`（18 次传递，≈12 min）与 `repeat4x`（24 次，≈16 min）配 `dense18`（≈14 min），把 34.4% 的边际兑换率从两点推断变成多点实测"
  - "推理侧的口径未测：本实验只测训练期峰值显存与解析每 token MACs；「重复次数在推理期可调」这个卖点需要解码器侧实现（新开关）+ 长序列实测"
  - "优化器/步数未扫描：所有臂同 12k 步同 lr 调度，循环臂每参数被更新 12 次 ⇒「参数利用更充分」的假设在本格没有独立的优化器对照"
  - "与 2.2.5 权重共享 同题风险：两者判据都是「同参数量相对非共享 dense 的可排序质量优势」且都不省 FLOPs；两格 `gaps` 互指、**不合并**（61-F4 裁决）：二者都不改变「某算力路径值不值」的判断；本格已给出同算力对照的读数，2.2.5 仍缺同算力腿；见 .scratch/61-axis2-depth/TICKET.md §8 F4（已裁决）"
cost_model: "等效理论量：参数量 ≈ 单组层参数；每 token 的 layer-passes = n ×（单组层数），随重复次数 n 线性上升（tokens-per-forward 每步 1）。考虑 pipelining：循环次数 n 固定时各 token 路径等长，批处理不改；其代价完全体现在 layer-passes/token 与参数量的权衡上。"

