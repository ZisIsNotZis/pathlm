# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "2.1.1"
axis: "2 深度轴"
title: "early exit（最重要）"
dir: "axes/2-depth/2.1.1-early-exit"

purpose: "普通 decoder-only transformer 对每个 token 都跑满 L 层，而 token 难度并不一样（常见续写几乎确定、困难 token 才需要满深度）；本项要把「要不要多算」按 token 决定，在**降低算力**（每 token layer-passes）的同时保住**序列级**质量——即让同一模型「Pro 当 Flash 用」。"
innovation: "相对普通 decoder-only transformer 的「每 token 固定跑满 L 层、只监督最终深度」，给每个 token 一个退出决策：逐层读出（或专用置信头）达标即在第 k 层停，k 以外的层不再对该 token 计算；浅层退出位置在深层 KV 里用该 token 退出时的冻结表征经本层投影填充（fill / proj-fill）。改动量级：读出头/门相对主干近零额外参数量（本仓实验形态与同尺寸 stock 参数同为 6.96M），推理期每 token 的 layer-passes 由常量 L 变成变量 d_i；训练期需深度维监督。"
expected_effect: "（a）推理期每 token 的 layer-passes 由 L 降到平均 d_i < L，长序列解码算力随平均深度线性下降；（b）在同一模型内把「按需算力」做成能力——质量-代价前沿应相对「固定全深度」与「同预算固定深度」上移；（c）代价是浅层出口的表示能力与异构深度下 KV 语义会带来质量损失，需把它放到以 stock 全深度为 100% 的前沿上量化。"
sota_baseline: "自适应算力一族：ACT（Graves 2016）、Universal Transformer（Dehghani 2018）、CALM（Schuster 2022，逐 token 置信早退）、LayerSkip（Elhoushi 2024，早退训练 + 自投机）、Mixture-of-Depths（Raposo 2024，逐 token 路由 + 容量约束）——「逐 token 变深度」机制本身不是本仓发明。本地对手 = R7 参照线 `axes/7-references/experiments/R7-existing-early-exit/2623-standard-early-exit-13m`（本仓按 CALM/LayerSkip/MoD 实现、13M 实测）；基线 = 同尺寸 stock 全深度（归一为 100%；13M 13M dense 参照 1.5254–1.5287 bpc，100M 同引擎 dense 1.9175）。"
gap: "本仓的增量只能落在 (a) 更干净的**算力-质量代价账**（现有证据多用单 token 代理与墙钟，真正的 layer-passes/token 与序列级质量从未同框）、(b) **异构深度下 KV 的语义**（fill / proj-fill vs no-fill 的质量代价从未测）、(c) 与**更浅 dense / MoD** 这种真正省算力的对手正面对比。本项不是重造轮子：机制对齐 CALM/LayerSkip/MoD，要在它们的可比口径下说清「我们的税」值不值。"
method: "单因素：固定基底（同尺寸 stock depth-ar / dense），只改**退出策略与深度监督配方**。臂 = {stock 全深度, 固定前缀退 k 层, 逐 token 门控退出（读出 top-1 概率阈值扫描 / 专用 conf 头）, 异构深度 KV 语义（fill / proj-fill / no-fill）, 深度监督配方（等权 / additive λ 剂量 / 同份额控制）}。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 同尺寸 stock 全深度（归一为 100%）+ R7 标准早退实现（CALM / LayerSkip / MoD，13M 实测）；客观判据 = **序列级** perplexity / 自回归一致率（对齐全深度，该不跌，须越 0.014 噪声带才算可排序）+ 每 token 平均 layer-passes 与跳过层数占比（该跌）+ 相对同预算最优固定深度的序列级质量（该涨）；口径 = layer-passes/token 等等效理论量，**墙钟不进判据**；必须不变 = 因果性；当策略宣称保质量（如自投机）时，发出的贪心流须与全深度逐 token 相同。 序列级口径（61-F1 裁决确认）= teacher-forcing 在线决策下的整段 bpc（保留 depth_curve 作自洽锚点）。 判据带（C1 裁决）：以逐窗口配对 SE（≤0.008）为本格主判、跨格 0.014 bpc 带（限配对 Δ、≥5 窗口）为参考；一致率类指标走配对 bootstrap，不跨量纲借用 0.014。"
objective_criteria: "该跌：每 token 平均 layer-passes 与跳过层数占比（相对全深度）；该不跌/可排序：序列级 perplexity 与自回归一致率（相对全深度，须越 0.014 噪声带）；该涨：相对同预算最优固定深度的序列级质量（前沿上移）；必须不变：因果性单测、退出策略声明保质量时的发出流逐 token 一致。"
falsification: "若在真正的算力口径（layer-passes/token）下没有任何一条逐 token 门控策略能同时做到「算力显著低于 L」与「序列级质量不越噪声带」；或退出预测头/读出概率与实际「退对了没有」不校准（ECE 高）使门控不可用；或异构深度 KV 的 fill 近似质量代价吃掉全部算力收益 ⇒ 判逐 token 早退这一手段/形态在本尺度不成立。 用哪个带（C1 裁决）：以本格配对带（逐窗口 SE ≤0.008）为主判、跨格 0.014 bpc 带为参考；一致率类走配对 bootstrap，不借用 0.014。"
failure_analysis: "本项主假设（逐 token 按需深度能在省算力的同时保住序列级质量、并把质量-代价前沿抬到「同算力固定截断」之上）在 13M / enwik8 / 1 epoch 快照这一格被本地证据否证（`experiments/2631-pertoken-exit-seqlevel`，8.16 万预测位置、配对设计）。失败归因按四类分开：①**结构问题（主因）**：该 checkpoint 的深度曲线在第 3 层后极平（depth 3 = 1.8863、depth 8 = 1.8582，只差 0.028 bpc），「按需少跑几层」能撬动的质量空间 ≈ 0，而逐位置门控要求每个位置独立付浅层读出的税（第 1 层退出的位置 bpc 0.53 → 0.79）。同位置配对显示损伤 100% 来自早退位置自己的读出（分桶分解与总 Δ 的算术闭合（恒等式，仅用于确认归因口径）），**跑到满深度的位置没有被毒害**（d8 桶 +0.0033（逐窗口 SE 0.0012；两半样本 +0.0020/+0.0045））⇒ 不是异构深度上下文/填充的问题（no-fill 反而更差 0.024–0.051；结构零假设 prescribed-4 fill vs no-fill Δ = 0.000000）。②**设计问题（次因、可修）**：训练配方（`exit_mode=uniform` 逐位置**随机**退出 + 等权深度监督）与推理门控不一致，读出头不是为「被门控选中的位置」优化的 ⇒ 记入 WP6（策略感知训练），不据此判机制本身死。③**非 innovation 本身失败**：容量约束路由（MoD 式：整批每层放行固定比例 token，保住 dense 批处理）本实验未测，见 gaps；逐 token 变深度机制本身在业界有已验证形态（CALM / LayerSkip / MoD）。④**非实现/口径/统计假象**：承载体与批量逐层、并行 forward 三方逐位一致（单测）；`prescribed-k` 逐步复现历史 `depth_curve[k]`（Δbpc 7e-06…4.6e-05，浮点噪声内重合）；深度置换对照更差（+0.095 / +0.080）排除「选位错」；逐窗口配对 SE ≤ 0.008，省 ≥25% 档超出量 0.84–18.5 倍噪声带（其中 τ=0.3/0.6 为 8.3–18.5×）。"
conclusion: "在 13M / enwik8 / 1 epoch 快照 / 逐位置随机退出配方这一格上：逐 token 门控退出的**质量-代价前沿被同算力固定截断支配**——省 ≥25% 算力的档位比同算力「固定退前 k 层」差 **0.0117–0.2593 bpc（0.84–18.5 倍噪声带）**（τ=0.95 属省 20% 档、超出 0.0035 = 0.25 倍；τ=0.9 时 5.967 层 Δ=+0.0120，**连 prescribed-4 的 4.000 层 Δ=+0.0046 都不如**：少用两层反而更好），省 6–12% 的档位（τ=0.99 / 0.999）与固定前缀打平（超出 ≈ 0）⇒ 门控**从未显著**超过同算力固定截断，也从未在「省得多」的地方保住质量（唯一未被支配的档是 τ=0.999 与 `τ=0.999-min4`：省 4.5–6.5%、Δ 与全深度不可分）。字面上预登记验收（至少一条策略省算力且 Δ ≤ 0.014）在 τ ≥ 0.99 成立，但那正是几乎全深度、省的是零头的地方 ⇒ 实质判决 = 否证（对照 falsification ②）。顺带测到两条新事实：(a) **异构深度上下文的代价 ≤ 0.005 bpc**（同位置配对；该 checkpoint 训练时见过随机退出，故对混合深度鲁棒；no-fill 反而更差 0.024–0.051）——直接回答旧格留下的一个未测子问题；(b) 退出读出的 top-1 概率对**正确性**校准良好（ECE_true ≤ 0.030、深度 ≥ 3 时最大 0.0051），对「退得安不安全」（是否与全深度 argmax 一致）严重失准（ECE_tf 0.20–0.37 且方向为低估）⇒ 拿 tf@k 反推「可以放心退」站不住（C-P02 被量化）。交付物：逐 token 退出进生产解码器（`DepthARDecoder.step_auto`）+ `pathlm/exit_policy.py`（策略 / 序列级口径 / 校准表 / 算力账）+ 19 条单测 + 本实验的完整序列级证据包。 验收并列读法（C2 裁决）：milestone 预登记文字（至少一条策略省算力且 Δ ≤ 0.014）**字面成立**（τ≥0.99 省 6–12%、Δ ≤ 0.0002）；其实质（不被同算力固定截断支配）**否证**（省 ≥25% 档超出 0.0117–0.2593 bpc）。 判据带（C1 裁决）：以本格配对带（逐窗口 SE ≤0.008）为主判、跨格 0.014 bpc 带为参考；一致率类走配对 bootstrap，不借用 0.014。"
conclusion_review: "**独立复核 round 1（revision `233e978`；fresh 独立上下文 subagent，非本项 writer；报告 `.scratch/61-axis2-depth/REVIEW-1.md`）判词**：四个范围块（逐 token 退出实现 / 19 条单测 / 2631 实验协议与数字 / 10 份 `role_map` 与 SSOT 字段）判「成立」；`status = 被否证` 判「双向诚实、无谎报 PASS/FAIL、归因分类合规」；前沿折线插值经其独立验算为凸曲线、弦在图上 ⇒ **对门控保守**，且主结论另有一条**不依赖插值**的直接对撞（τ=0.9 用 5.967 层比 prescribed-4 的 4.000 层还差 0.0074 bpc）。**它提了 1 条 blocking**：正文两处把「异构深度上下文的代价 ≤ 0.003 bpc」写紧了（同位置配对实测 +0.003296，同一文件另一处自己写的是 +0.0033）；同族副例「ECE_true ≤ 0.005（深度≥3）」而 depth 3 实测 0.0051。**13 条 non-blocking**：Δ/超出量区间与限定词不符、分桶『逐位闭合』实为算术恒等式却被当佐证、`dominated_by_fixed` 忽略横轴（可被更贵的固定臂判成支配）、历史 `tf_acceptance` 是**另一样本**（seed 3 vs 2）、『逐位重合』实为 Δbpc ≤ 4.6e-05、『从未超过』应为『从未显著超过』、校准表漏 depth 5 行、生成一致率区间漏 0.711、解码器填充无视 `proj_fill` 与 `fill_kv=False`（本实验未触发）、REVIEW 路径悬空引用、臂数 11 实为 14、`run_log.txt` 追加模式会混两次流水、`generate_with_exit` 的 `depths` 语义标注偏差。**处置（round-2 独立复核判 BLOCK；属 blocking 的 B1–B4 均为文本级账实不符，本收口轮已逐条修，见 `.scratch/61-axis2-depth/REVIEW-2.md`）**：blocking 数字按实测改写并补**逐窗口 SE（0.0012）与两半样本（+0.0020/+0.0045）**；`_layer_kv` 改为经 `kv_adapters`（proj_fill 非恒等时不再静默错语义）+ 新增 `_missing_mask` 让 no-fill 语义在解码器里成立；`dominated_by_fixed` 加横轴条件；`run_log.txt` 改覆盖模式、臂数改 14、删重复字段；正文措辞按建议收紧。**残余缺口（如实登记）**：round 1 只有只读工具、**未运行任何命令**（pytest / 变异测试 / 重跑 / summary --check 全未跑），故「单测能失败」与「数字可复现」由本轮 writer **自测**补齐（6 处变异全部被抓红；实验重跑数字一致；`summary.py --check` OK）——**自测不是独立验收**；round 2（有 shell 的 fresh 复核）已返回（`.scratch/61-axis2-depth/REVIEW-2.md`）：**科学结论与运行证据 PASS**（19/834 测试、4 处变异全红、重跑 `results.json` 逐位复现、`summary --check` OK 均由该轮独立复现），**处置落盘自洽性 BLOCK**（B1–B4，文本级，本收口轮已修）。"
