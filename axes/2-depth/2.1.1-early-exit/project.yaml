# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "2.1.1"
axis: "2 深度轴"
title: "early exit（最重要）"
dir: "axes/2-depth/2.1.1-early-exit"

purpose: "普通 decoder-only transformer 对每个 token 都跑满 L 层，而 token 难度并不一样（常见续写几乎确定、困难 token 才需要满深度）；本项要把「要不要多算」按 token 决定，在**降低算力**（每 token layer-passes）的同时保住**序列级**质量——即让同一模型「Pro 当 Flash 用」。"
innovation: "相对普通 decoder-only transformer 的「每 token 固定跑满 L 层、只监督最终深度」，给每个 token 一个退出决策：逐层读出（或专用置信头）达标即在第 k 层停，k 以外的层不再对该 token 计算；浅层退出位置在深层 KV 里用该 token 退出时的冻结表征经本层投影填充（fill / proj-fill）。改动量级：读出头/门相对主干近零额外参数量（本仓实验形态与同尺寸 stock 参数同为 6.96M），推理期每 token 的 layer-passes 由常量 L 变成变量 d_i；训练期需深度维监督。"
expected_effect: "（a）推理期每 token 的 layer-passes 由 L 降到平均 d_i < L，长序列解码算力随平均深度线性下降；（b）在同一模型内把「按需算力」做成能力——质量-代价前沿应相对「固定全深度」与「同预算固定深度」上移；（c）代价是浅层出口的表示能力与异构深度下 KV 语义会带来质量损失，需把它放到以 stock 全深度为 100% 的前沿上量化。"
sota_baseline: "自适应算力一族：ACT（Graves 2016）、Universal Transformer（Dehghani 2018）、CALM（Schuster 2022，逐 token 置信早退）、LayerSkip（Elhoushi 2024，早退训练 + 自投机）、Mixture-of-Depths（Raposo 2024，逐 token 路由 + 容量约束）——「逐 token 变深度」机制本身不是本仓发明。本地对手 = R7 参照线 `axes/R-references/R7-existing-early-exit/experiments/2623-standard-early-exit-13m`（本仓按 CALM/LayerSkip/MoD 实现、13M 实测）；基线 = 同尺寸 stock 全深度（归一为 100%；13M 13M dense 参照 1.5254–1.5287 bpc，100M 同引擎 dense 1.9175）。"
gap: "本仓的增量只能落在 (a) 更干净的**算力-质量代价账**（现有证据多用单 token 代理与墙钟，真正的 layer-passes/token 与序列级质量从未同框）、(b) **异构深度下 KV 的语义**（fill / proj-fill vs no-fill 的质量代价从未测）、(c) 与**更浅 dense / MoD** 这种真正省算力的对手正面对比。本项不是重造轮子：机制对齐 CALM/LayerSkip/MoD，要在它们的可比口径下说清「我们的税」值不值。"
method: "单因素：固定基底（同尺寸 stock depth-ar / dense），只改**退出策略与深度监督配方**。臂 = {stock 全深度, 固定前缀退 k 层, 逐 token 门控退出（读出 top-1 概率阈值扫描 / 专用 conf 头）, 异构深度 KV 语义（fill / proj-fill / no-fill）, 深度监督配方（等权 / additive λ 剂量 / 同份额控制）}。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 同尺寸 stock 全深度（归一为 100%）+ R7 标准早退实现（CALM / LayerSkip / MoD，13M 实测）；客观判据 = **序列级** perplexity / 自回归一致率（对齐全深度，该不跌，须越 0.014 噪声带才算可排序）+ 每 token 平均 layer-passes 与跳过层数占比（该跌）+ 相对同预算最优固定深度的序列级质量（该涨）；口径 = layer-passes/token 等等效理论量，**墙钟不进判据**；必须不变 = 因果性；当策略宣称保质量（如自投机）时，发出的贪心流须与全深度逐 token 相同。"
objective_criteria: "该跌：每 token 平均 layer-passes 与跳过层数占比（相对全深度）；该不跌/可排序：序列级 perplexity 与自回归一致率（相对全深度，须越 0.014 噪声带）；该涨：相对同预算最优固定深度的序列级质量（前沿上移）；必须不变：因果性单测、退出策略声明保质量时的发出流逐 token 一致。"
falsification: "若在真正的算力口径（layer-passes/token）下没有任何一条逐 token 门控策略能同时做到「算力显著低于 L」与「序列级质量不越噪声带」；或退出预测头/读出概率与实际「退对了没有」不校准（ECE 高）使门控不可用；或异构深度 KV 的 fill 近似质量代价吃掉全部算力收益 ⇒ 判逐 token 早退这一手段/形态在本尺度不成立。"
failure_analysis: ""
conclusion: ""
conclusion_review: "本项按 55-review C-PROBLEMS 重写后 status = 进行中：旧格把它写成「本轴最厚资产、已实现」，但其核心命题（降算力 + 保**序列级**质量）**从未端到端检验**——公开的「收益」tf@4 是单 token 自洽代理（depth-k argmax == depth-L argmax，非正确性），逐 token 门控退出的自回归序列级结果从未跑（C-P01/C-P02）。另三处硬伤已改入正文：① 逐 token 退出门控**不在**能跑本线 checkpoint 的 depth-ar 生产解码器里（`DepthARDecoder.step(inp, forced_depth)` 只支持固定退出深度），只在旧引擎 `pathlm/decode.py` 与参照实验 `2623/exit_policies.py`——旧格「引擎已具备」是把两代引擎混为一谈（C-P03）；② 代价口径自相矛盾的卖点（exit-4 3.1× 墙钟）已剔除，墙钟不进判据（C-P04）；③ 「出口资产只能由深度监督造出」的对照证据不成立（0.12 是未训练 tied 读出 proxy，正确对照 `23d-H1-12k` 的 tf@4 从未跑，C-P13），故只作 WP 待办。独立复核未做。"
