argument: "把命题从「单 token 出口够不够准」改成「逐 token 早退能否在不掉序列级 perplexity 的前提下省算力」（C-P01/C-P02）。逻辑链：tf@4 高（0.9726）只说明浅层 argmax 与深层 argmax 自洽，而训练对每个深度都做监督，等于把「浅层模仿深层」直接训进目标，近同义反复；一条长度 N 的序列要整段一致需单 token 一致率 ≈ p^N（depth-4 p=0.973、N=100 ⇒ ≈6.5%），故单 token 代理不足以证明质量不掉。已有 e2e 只有三种（固定退 4 层、均匀随机退、CALM 平均退），且 CALM 来自 R7 参照线 13M 而非本项判据实验；2621 的「深度草稿 + 全栈验证」是自投机解码（保序列准确率、发出流逐 token 相同），但按 layer-position/token 口径 8.45 vs 8.00（+5.6%）**更贵**，不是早退、不省算力。故本项主判据（逐 token 门控的自回归序列级结果）待 WP1 补跑。"
gaps:
  - "主判据未测（WP1）：逐 token 门控退出的自回归序列级 perplexity/一致率 vs 全深度 + 每 token layer-passes/跳过占比，从未跑"
  - "退出预测头校准未验（WP1）：已测 ECE 只是输出头 prob0，conf/读出概率与实际「退对了没有」的校准未测"
  - "异构深度 KV 语义的质量代价未测（WP2）：fill vs proj-fill vs no-fill 的序列级差未量"
  - "缺真正的省算力对手（C-P12）：没有同预算「更浅 dense / 深度剪枝 / MoD」对照点，无法回答「要省一半算力该选自适应深度还是直接训小模型」"
  - "深度监督对照缺口（C-P13）：`23d-H1-12k`（dense trunk + 全深度 aux）的 tf@4 从未跑，C6「出口资产只能由深度监督造出」的对照缺失"
  - "规模与复本：主结论多在 13M 单 epoch 快照、n=1 seed；100M 只 1.09 epoch"
cost_model: "等效理论量：每 token 的 layer-passes = 该 token 实际通过的层数 d_i（stock = L，固定退 k = k，逐 token 门控 = 实测平均退出深度），总账 = Σ d_i / N；tokens-per-forward 每步 1（早退不改该量，自投机分支 γ>1 时另计）。考虑 pipelining：按 token 变深度时同批内最长路径决定批的前向次数，收益体现在平均 layer-passes 与批内被跳过层的比例；异构深度下被跳过 token 仍需在深层 KV 里保留（fill/proj-fill 的额外投影开销按位置计，量级 O(退出位置数 × 每层投影 FLOPs)）。"

