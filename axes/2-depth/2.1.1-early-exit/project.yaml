argument: "命题按复核意见改成序列级（teacher-forcing、逐位置**在线**退出决策下的整段 bpc），并在 WP1（2631）实测。逻辑链：①**承载体先行**——逐 token 退出进生产解码器（`step_auto`），与批量逐层 `exit_policy.score_stream`、并行 `forward(exit_depths=D)` 三方逐位一致（单测），可判据的记录不会被『引擎做不到』污染；②**口径自洽**——`prescribed-k`（全体位置退到 k 层）逐步复现历史 `depth_curve[k]`（2..8 在浮点噪声内重合，Δbpc 7e-06…4.6e-05，非 bitwise），所以本口径是既有判据的严格扩展（加入了异构深度填充代价），不是另起一套量；③**主判据**——同算力比较用固定前缀折线（prescribed-2..7 + 全深度）：门控省 ≥25% 算力时超出固定前缀 0.0117–0.2593 bpc（0.84–18.5 倍噪声带；τ=0.95 属省 20% 档、超出 0.0035），省 ≤12% 时打平 ⇒ 无净增量；④**归因**——同位置配对（每桶与全深度基线在**同一批位置**的 CE）显示损伤全部来自早退位置自己的读出（加权 +0.12046 ≈ 总 Δ +0.120461），跑到满深度的位置只差 +0.0033；深度置换对照更差（+0.095/+0.080）排除选位错；no-fill 更差（+0.051/+0.024）排除填充伪影；结构零假设（prescribed-4 在 fill/no-fill 下 Δ=0.000000）证明开关只影响混合深度；⑤**校准**——top-1 概率对正确性校准良好（ECE_true ≤ 0.030）但对「是否与全深度一致」失准（ECE_tf 0.20–0.37），故 tf@k 不能当『可以放心退』的依据。"
gaps:
  - "策略感知训练未做（WP6，可能反转本结论）：训练期退出监督与推理门控一致（confidence-target / policy-conditioned）而非均匀随机退出；13M 双臂 × 同 token 预算 × n≥2，需 GPU 训练"
  - "缺真正的省算力对手（WP5 / C-P12）：同 token 预算训练的更浅 dense（L=4 / L=6）未训——本实验只证明「门控不如同算力截断」，未回答「截断 vs 直接训小模型」"
  - "异构深度 KV 三语义只测两语义（WP2）：proj-fill 未测；已测 fill vs no-fill = fill 更好 0.024–0.051（该臂是语义迁移臂）"
  - "自由生成质量未测：只测了「发出流与全深度贪心流逐 token 一致率 28–71%」这一诊断列，未测生成段 rescore bpc 与塌缩指标"
  - "规模与复本：13M、单 checkpoint、1 epoch 快照、评测样本单一口径（seed=2）；100M checkpoint（tf@4=0.9726）可复用但未跑；L=16（更深曲线是否仍平坦）未测"
  - "深度监督对照缺口（C-P13，属 WP3）：`23d-H1-12k`（dense trunk + 全深度 aux）的 tf@4 从未跑"
cost_model: "等效理论量：每 token 的 layer-passes = 该 token 实际通过的层数 d_i（stock = L，固定退 k = k，逐 token 门控 = 实测平均退出深度），总账 = Σ d_i / N；tokens-per-forward 每步 1（早退不改该量，自投机分支 γ>1 时另计）。考虑 pipelining：按 token 变深度时同批内最长路径决定批的前向次数，收益体现在平均 layer-passes 与批内被跳过层的比例；异构深度下被跳过 token 仍需在深层 KV 里保留（fill/proj-fill 的额外投影开销按位置计，量级 O(退出位置数 × 每层投影 FLOPs)）。"

