# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "2.2.2"
axis: "2 深度轴"
title: "用 causal attention 代替残差"
dir: "axes/2-depth/2.2.2-attention-residual"

purpose: "普通 decoder-only transformer 只靠一条残差把上一层的结果接到下一层，深层是「逐层串联」；本项要问：让每一层直接对**之前所有层的输出**做一次 causal attention 聚合（而不是只接上一层），能否提高质量/正确率——这是出资人 C3 批注明确提出的设计。"
innovation: "相对普通 decoder-only transformer 的「h_{l+1} = h_l + sublayer(h_l)」，把层间连接换成「h_{l+1} = Attn(h_0..h_l) + sublayer(·)」：把各历史层的输出 stack 起来做一次 **causal attention** 聚合（Hyper-Connections / feedback transformer 式跨层注意力）。改动量级：层间注意力每层 O(L·d) 参数/计算（可跨层共享），额外 FLOPs 与层数 L 成正比，须与同参数/同 FLOPs 的单残差基线对照。"
expected_effect: "（a）每层可直接读取所有历史层的表示，缓解逐层串联的信息瓶颈；（b）应提高质量/正确率（出资人提出的诉求）；（c）代价是额外的层间注意力算力与参数，且需与 2.2.3 的「学习加权和」（无 attention 的线性聚合）区分——本项是更贵的注意力版，必须先证它值那份额外算力。"
sota_baseline: "Hyper-Connections（2024）、Feedback Transformer（2020）等跨层注意力一族；本地最近的对照 = 旧格 C3 实测的**层间学习加权和**（DenseFormer 式，无 attention 的线性聚合，−0.0008 中性，见 `2.2.3`）。stock 单残差全深度（归一为 100%）。"
gap: "出资人 C3 批注提出的设计（把之前各层结果 stack 起来做 causal attention）**从未测**——旧格 C3 `README` 自认「未测：跨层注意力」，却被判 `judged`（55-review C-P10：没测对的东西就下了结论）。本项增量 = 真正实装并测这个假设，并把它与 2.2.3 的线性学习加权和正面对撞，回答「attention 聚合是否值那份额外算力」。"
method: "单因素：固定宽度/层数/训练预算，只改层间聚合的连接方式。臂 = {stock 单残差, 层间 causal attention（对历史层输出做注意力聚合）, 对照臂 2.2.3 线性学习加权和}。基底恒为 stock decoder-only；等参数/等 FLOPs 对照须齐（层间注意力的额外参数与算力须报告并剥离）。"
validation: "端到端：对照 = stock 单残差全深度（归一为 100%）+ 2.2.3 的线性学习加权和（同预算）+ 等参数对照臂；客观判据 = clean bpc（序列级，该跌，须越 0.014 噪声带才算可排序）+ 额外参数与额外 FLOPs（必须报，作代价列）；口径 = matched-step / 同 token 预算，**墙钟不进判据**。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
objective_criteria: "该跌：clean bpc（序列级，相对 stock 单残差与 2.2.3 线性聚合）；必须报：层间注意力的额外参数与每 token 额外 FLOPs（代价列，须与质量收益同框）；必须不变：因果性（层间注意力不得看到当前层之后的信息）、等参数对照的参数量。"
falsification: "若层间 causal attention 相对 stock 单残差与 2.2.3 线性聚合在 clean bpc 上不越噪声带，或优势全由额外参数/额外算力解释（等参数或同算力对照下消失）⇒ 判用 causal attention 代替残差在本尺度无净增量，应退化为 2.2.3 的线性聚合或并入之。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
failure_analysis: ""
conclusion: ""
conclusion_review: "本项无旧格、本仓零经验，尚无本地判决，故 status = 进行中（实现与门已完成，判决待两臂训练）。判据与基线按 docs/research-schema.md 预登记（对照 + 客观判据 + 口径 + 否证条件）；把「等参数/同算力对照」与「层间因果性」钉死，以防把额外算力买到的小幅改善误读为连接方式本身的优势。**当前本地事实**：层间 causal attention 聚合已在实验内实装（`experiments/2653-interlayer-attn-13m/interlayer_attn.py`，复用引擎 `topology=dense` 的前向路径，不改共享代码）；等值门（把层维权重强制成「只取紧邻上一层」时前向/损失与 stock 单残差**逐位一致**，探针：不强制时必须不同）、活性门（k ≥ 2 的层权重非退化：`w_immediate_prev < 1`、熵 > 0）、参数账（额外参数 = +8（scalar，与 2.2.3 的 dense +36 同量级）/ +196 616（qkv），与解析值一致）均已实测落盘；两臂的 clean bpc 与配对 Δbpc 未测（本轮共享 4090 被外部任务占用，等锁未取到；等效成本 2 × 98.3M token 已登记）。独立复核未做。"
experiments:
  - "axes/2-depth/2.2.2-attention-residual/experiments/2653-interlayer-attn-13m"
  - "axes/2-depth/2.2.2-attention-residual/experiments/2653-interlayer-attn-13m/analysis.md"
argument: "把出资人的 C3 批注转成可证伪命题：跨层注意力与 2.2.3 的线性学习加权和价差在「聚合函数是否有内容相关权重（q·kᵀ）」与「额外算力」上。已实测的价差（等效理论量，解析且与实测参数一致）：`attn-scalar`（q/k/v 恒等 + 每层一个温度 τ）额外参数 +8、每 token 层间聚合额外 18 432 MACs（= stock 每层注意力 3 145 728 MACs/token 的 +0.59%）；`attn-qkv`（可学习共享 W_q/W_k/W_v + τ）额外参数 +196 616、额外 5 261 312 MACs/token（+167.3%）。故「内容相关权重是否值那份额外算力」在本尺度有一个可读的价签：scalar 臂与 2.2.3 的 dense（+36 参数）几乎同价，qkv 臂要贵约 2.7 万倍的参数与约 1.7 倍的注意力算力。旧 C3 的 dense 学习加权和已测到中性（−0.0008），故本项的核心对照就是「把加权和升级成 causal attention 是否能越过那条中性线」。缺口：机制性事实「层间聚合的起点并不等于 stock 起点」已如实落盘（`q = h_{k−1}` 与 key 里的自相似使起点处权重即已偏离「只取上一层」，k ≥ 2 的层熵 ≈ 1.6–2.1），因此结论只能来自训练后的 B 表。"
gaps:
  - "本仓零经验：跨层注意力从未实装（旧 C3 自认未测，C-P10）——**本轮已实装并过等值门/活性门/参数账，训练判决未做**"
  - "两臂（attn-scalar / attn-qkv）的 clean bpc 与相对 stock / 相对 dense 的配对 Δbpc 未测（等锁未取到 GPU；等效成本 2 × 98.3M token）"
  - "qkv 臂的相对增益是否覆盖其 +3d² 参数与 +167.3% 注意力算力未测（须以相对 scalar 臂的增量为归因基线）"
  - "n≥2 与长度/层数外推未测"
  - "基线复用（2613 s0 的 sequential / dense）已备齐 SCHEMA §9 三条等值证明的 ①② 面（实现层逐位单测 + 配置逐字段对照），③口径标注已写进 analysis.md；若出现不等字段则回退自包含双跑"
cost_model: "等效理论量：每 token 的 layer-passes 仍为 L（层数不变），但每层额外一次对 L 个历史层的 causal attention ⇒ 每 token 额外 ≈ L（层）× O(L·d) FLOPs（层间注意力），相对单残差基线为 O(L²·d) 的额外项；层间注意力可用低秩/共享投影降本。tokens-per-forward 每步 1。考虑 pipelining：层间注意力把「当前层依赖其全部历史层」，增加层间串行依赖（不利于跨层流水），该依赖须与 2.2.3 的线性聚合对照量化。"

