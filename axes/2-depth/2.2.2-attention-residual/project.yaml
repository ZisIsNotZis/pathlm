    boundary: "额外 196 616 参数、每 token 额外 5 261 312 MACs（+167.3%）换来越带变差；标量温度臂落带内但层 2–3 退化成 one-hot（活性门未过）⇒ 无信号不等于机制无效"
    source: "axes/2-depth/2.2.2-attention-residual/experiments/2653-interlayer-attn-13m/analysis.md"
