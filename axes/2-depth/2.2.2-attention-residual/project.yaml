# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "2.2.2"
axis: "2 深度轴"
title: "用 causal attention 代替残差"
dir: "axes/2-depth/2.2.2-attention-residual"

purpose: "普通 decoder-only transformer 只靠一条残差把上一层的结果接到下一层，深层是「逐层串联」；本项要问：让每一层直接对**之前所有层的输出**做一次 causal attention 聚合（而不是只接上一层），能否提高质量/正确率——这是出资人 C3 批注明确提出的设计。"
innovation: "相对普通 decoder-only transformer 的「h_{l+1} = h_l + sublayer(h_l)」，把层间连接换成「h_{l+1} = Attn(h_0..h_l) + sublayer(·)」：把各历史层的输出 stack 起来做一次 **causal attention** 聚合（Hyper-Connections / feedback transformer 式跨层注意力）。改动量级：层间注意力每层 O(L·d) 参数/计算（可跨层共享），额外 FLOPs 与层数 L 成正比，须与同参数/同 FLOPs 的单残差基线对照。"
expected_effect: "（a）每层可直接读取所有历史层的表示，缓解逐层串联的信息瓶颈；（b）应提高质量/正确率（出资人提出的诉求）；（c）代价是额外的层间注意力算力与参数，且需与 2.2.3 的「学习加权和」（无 attention 的线性聚合）区分——本项是更贵的注意力版，必须先证它值那份额外算力。"
sota_baseline: "Hyper-Connections（2024）、Feedback Transformer（2020）等跨层注意力一族；本地最近的对照 = 旧格 C3 实测的**层间学习加权和**（DenseFormer 式，无 attention 的线性聚合，−0.0008 中性，见 `2.2.3`）。stock 单残差全深度（归一为 100%）。"
gap: "出资人 C3 批注提出的设计（把之前各层结果 stack 起来做 causal attention）**从未测**——旧格 C3 `README` 自认「未测：跨层注意力」，却被判 `judged`（没测对的东西就下了结论）。本项增量 = 真正实装并测这个假设，并把它与 2.2.3 的线性学习加权和正面对撞，回答「attention 聚合是否值那份额外算力」。"
method: "单因素：固定宽度/层数/训练预算，只改层间聚合的连接方式。臂 = {stock 单残差, 层间 causal attention（对历史层输出做注意力聚合）, 对照臂 2.2.3 线性学习加权和}。基底恒为 stock decoder-only；等参数/等 FLOPs 对照须齐（层间注意力的额外参数与算力须报告并剥离）。"
validation: "端到端：对照 = stock 单残差全深度（归一为 100%）+ 2.2.3 的线性学习加权和（同预算）+ 等参数对照臂；客观判据 = clean bpc（序列级，该跌，须越 0.014 噪声带才算可排序）+ 额外参数与额外 FLOPs（必须报，作代价列）；口径 = matched-step / 同 token 预算，**墙钟不进判据**。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
objective_criteria: "该跌：clean bpc（序列级，相对 stock 单残差与 2.2.3 线性聚合）；必须报：层间注意力的额外参数与每 token 额外 FLOPs（代价列，须与质量收益同框）；必须不变：因果性（层间注意力不得看到当前层之后的信息）、等参数对照的参数量。"
falsification: "若层间 causal attention 相对 stock 单残差与 2.2.3 线性聚合在 clean bpc 上不越噪声带，或优势全由额外参数/额外算力解释（等参数或同算力对照下消失）⇒ 判用 causal attention 代替残差在本尺度无净增量，应退化为 2.2.3 的线性聚合或并入之。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
failure_analysis: "归因（先区分设计 / 结构 / innovation）：①**设计问题（主因、可修）**：`attn-scalar` 的参数化自带自相似——`q = h_{k−1}` 而 key 里恰好也有 `h_{k−1}`，训练把 `τ` 压小、注意力变尖 ⇒ 浅层（源只有 2–3 个）塌成 one-hot（层 2 = 熵 0.00 / `w_immediate_prev` 1.00、层 3 = 0.03 / 0.994），等价于退回 stock 残差；因此该臂的 P2 活性门**未过**，其 −0.0082 是「部分退化为 stock + 部分混合」的读数，不能读成「跨层混合无收益」的干净证据。②**结构问题（次因）**：本尺度 L=8、只有 8 个源且只监督最终深度，`attn-qkv` 的中间深度 bpc 明显更差且非单调（depth 3 反弹到 5.9630），最终深度 −0.0177 ⇒ 多付的 3d² 投影（+196 616 参数、+167.3% 注意力算力）在本预算买不到可利用的跨层信息。③**非 innovation 本身失败**：Hyper-Connections / Feedback Transformer 族在更大规模或不同任务上有已报告结果，本项只判「13M/12k、seed=0 本尺度无净增量」，n≥2 与长度/层数外推未做（见 gaps）。④**非实现/口径/统计假象**：等值门（one-hot 强制 ⇒ 前向与 loss 与 stock 逐位一致，探针证明不强制时必须不同）、层索引因果单测（聚合对 `states[k]` 及之后不可见）、参数账（+8 / +196 616 与解析值一致）三关皆过；两条评测路径逐臂一致（`clean_bpc_two_paths_agree = true`）；末 25% 窗 loss 斜率 0.00039（scalar）/ 0.00296（qkv）nats/千步 ⇒ 差异不是「没收敛」造成的。⑤**幅度与噪声**：scalar 的 |Δ| = 0.0082 < 0.014 带 ⇒ 不可排序；qkv 的 −0.0177 只越带 26%，其窗口级 SE = 0.0116 与带同量级，故「更差」的证据强度依赖这条带，n≥2 才能压稳。"
conclusion: "在 13M / 12k 步 / 98.3M token / seed=0 的 matched-step 快照 + 0.014 bpc 带（限配对 Δ、≥5 窗口）下：把层间接法换成层间 causal attention **没有净增量**。`attn-scalar`（q/k/v 恒等 + 每层一个温度 `τ`，额外 8 个参数、每 token 额外 18 432 MACs = 注意力的 +0.59%）clean bpc = 1.5336，相对 stock 单残差 1.5254 的 Δ = −0.0082（|Δ| < 0.014 ⇒ 不可排序），但其层 2–3 训练后退化成 one-hot（P2 活性门未过），故这条中性读数是「部分层已不做跨层聚合」的结果；`attn-qkv`（可学习共享 `W_q/W_k/W_v` + `τ`，额外 196 616 个参数、额外 5 261 312 MACs = +167.3%）clean bpc = 1.5431，Δ = −0.0177（越带、方向为「更差」）⇒ 内容相关权重（q·kᵀ）那份额外算力在本尺度不值。相对 2.2.3 的线性学习加权和（`dense` = 1.5246）两臂同样为 −0.0090 / −0.0185。⇒ 按预登记 falsification （不越噪声带 ⇒ 判在本尺度无净增量、应退化为 2.2.3 的线性聚合）：本项假设**被本地证据否证**，证据形态是「一臂落带内（且活性门未过）+ 一臂显著更差」，不是「两臂都不可排序」。n = 1 seed（s0），不越尺度外推。证据：`experiments/2653-interlayer-attn-13m/results.json`（`P1_verdict` / `P1_deltas_vs_baselines` / `P2_liveness`）、`experiments/2653-interlayer-attn-13m/analysis.md`（B 表）。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
conclusion_review: "本项零经验的判决已下：status = 被否证（预登记 falsification 的直接推论——层间 causal attention 相对 stock 单残差与 2.2.3 线性聚合在 clean bpc 上不越噪声带或方向为更差 ⇒ 判在本尺度无净增量、应退化为线性聚合）。**当前本地事实**：①层间 causal attention 聚合已在实验内实装（`experiments/2653-interlayer-attn-13m/interlayer_attn.py`，复用引擎 `topology=dense` 的前向路径，不改共享代码），等值门（one-hot 强制 ⇒ 前向/损失与 stock 逐位一致，带「不强制时必须不同」的必红探针）、活性门、参数账（+8 / +196 616，含额外 MACs 18 432 / 5 261 312）三关皆过；②两臂（`attn-scalar` / `attn-qkv`，seed=0、12000 步、各 98.3M token）已训练并评测，P1 判词：scalar −0.0082 不可排序、qkv −0.0177 反向可分（`results.json::P1_verdict`）；③判据线 P1–P6 与臂定义在整个过程中**未改**。第 1 轮独立复核（fresh 上下文，判词见 `.scratch/61-axis2-depth/TICKET.md` §9.18）判 PASS，其 non-blocking N1–N3 已处置（N1 参数倍率 2.7 万 → 2.5 万倍；N2 活性区间限定词与 `smoke_report.json` 对齐；N3 `2653/README.md` 落盘清单删去不存在的 `run_log.txt`）。B 表读数落盘后的这一版判词**尚待新一轮 fresh 复核**；n≥2 与长度/层数外推列入 gaps。"
