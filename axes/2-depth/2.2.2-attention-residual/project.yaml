  - "axes/2-depth/2.2.2-attention-residual/experiments/2653-interlayer-attn-13m/analysis.md"
argument: "把出资人的 C3 批注转成可证伪命题：跨层注意力与 2.2.3 的线性学习加权和价差在「聚合函数是否有内容相关权重（q·kᵀ）」与「额外算力」上。已实测的价差（等效理论量，解析且与实测参数一致）：`attn-scalar`（q/k/v 恒等 + 每层一个温度 τ）额外参数 +8、每 token 层间聚合额外 18 432 MACs（= stock 每层注意力 3 145 728 MACs/token 的 +0.59%）；`attn-qkv`（可学习共享 W_q/W_k/W_v + τ）额外参数 +196 616、额外 5 261 312 MACs/token（+167.3%）。故「内容相关权重是否值那份额外算力」在本尺度有一个可读的价签：scalar 臂与 2.2.3 的 dense（+36 参数）几乎同价，qkv 臂要贵约 2.5 万倍的参数（196 616 / 8 = 24 577）与约 1.7 倍的注意力算力。旧 C3 的 dense 学习加权和已测到中性（−0.0008），故本项的核心对照就是「把加权和升级成 causal attention 是否能越过那条中性线」。缺口：机制性事实「层间聚合的起点并不等于 stock 起点」已如实落盘（`q = h_{k−1}` 与 key 里的自相似使起点处权重即已偏离「只取上一层」，k ≥ 5 的层熵 ≈ 1.6–2.1（层 2–4 更低，熵 0.69–1.38）），因此结论只能来自训练后的 B 表。"
gaps:
  - "n≥2 未做：本项只有 seed=0 一条 seed，而两臂的 Δ 都在 0.014 带附近（scalar −0.0082、qkv −0.0177，后者的窗口级 SE 0.0116 与带同量级）⇒ 补 seed=1 才能把 qkv 的「更差」压稳（成本 = 2 × 98.3M token）"
  - "`attn-scalar` 的 P2 活性门未过（层 2–3 训练后塌成 one-hot），其 −0.0082 是「部分退化为 stock + 部分混合」的读数；拆开自相似（`q` 换成对紧邻上一层单独加一个投影）或给 `τ` 加上下界属新机制，需新预登记，不在本项判据内"
  - "qkv 的额外算力收益边界未单独剥离：本项只报绝对 Δ 与解析代价列（+196 616 参数 / +167.3% 注意力 MACs），未做等参数臂把参数账与聚合方式解耦"
  - "n≥2 与长度/层数外推未测"
  - "基线复用（2613 s0 的 sequential / dense）已备齐 SCHEMA §9 三条等值证明的 ①② 面（实现层逐位单测 + 配置逐字段对照），③口径标注已写进 analysis.md；若出现不等字段则回退自包含双跑"
cost_model: "等效理论量：每 token 的 layer-passes 仍为 L（层数不变），但每层额外一次对 L 个历史层的 causal attention ⇒ 每 token 额外 ≈ L（层）× O(L·d) FLOPs（层间注意力），相对单残差基线为 O(L²·d) 的额外项；层间注意力可用低秩/共享投影降本。tokens-per-forward 每步 1。考虑 pipelining：层间注意力把「当前层依赖其全部历史层」，增加层间串行依赖（不利于跨层流水），该依赖须与 2.2.3 的线性聚合对照量化。"

