  acceptance: "同参数量与同读出对齐；latent 回归臂相对离散跳头的 τ / tokens-per-forward 差可分（τ / tokens-per-forward 等率类走 prompt 聚类配对 bootstrap 95% CI 不含 0 为主判；0.014 bpc 带只用于 bpc 口径、不跨量纲借用——C1 裁决）或明确「无差别」；(i) 直接发 / (ii) 当草稿再验证 两条路径各作一臂、分开报代价（63-F4 裁决）；结论停在「该尺度下回归式值不值」，不外推。"

