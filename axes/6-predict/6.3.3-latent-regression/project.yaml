# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "6.3.3"
axis: "6 预测轴"
title: "latent regression 批量生成（估计得贪心）"
dir: "axes/6-predict/6.3.3-latent-regression"

purpose: "逐 token 自回归每步只产 1 个位置、顺序前向次数等于生成长度；多位置预测（6.2）用**离散**跳头并行出 k 个位置。本项要判定「一次前向先回归出 k 个未来位置的连续隐状态（latent）、再各自取贪心解（估计得贪心）」这条**回归式**批量生成路线，能否把顺序前向次数压到 1/k，以及它相对全因果 AR 与相对离散草稿的质量-代价位置。"
innovation: "相对普通 decoder-only transformer 的逐位置离散 AR 目标，在**冻结**主干上加 k 个变换头（每个 d×d），一次前向从同一位置的主干隐状态 `h_i` 产出未来 k 个位置的表征 `z_j`，再各自经**共享** tied 读出（`logits_j = z_j @ E^T`，E = 主干 embed 权重、两臂共用）取 argmax（贪心）；训练目标 = 对未来位置真值 token 的 CE + **latent 匹配监督项** `λ · MSE(z_j, h_true_{i+1+j})`（把 `z_j` 拉向主干在位置 i+1+j 的真实隐状态）。**机制限定（本仓实测可核，2660 的 L0）**：在共享 tied 读出 + 同参数量下，λ=0 的「回归臂」与「离散分类臂」**数学等价且同种子逐位相同**（同一条代码路径、同参数量）⇒ 本项实际改变的自由度只有**监督目标**（latent 匹配监督 vs 纯 CE），**不是**「回归输出 vs 分类输出」两套参数化；故结论表述为「latent（隐状态）匹配监督有独立增益」。改动量级：额外 k 个 d×d 变换（量级 k×d×d 参数，与挂 k 个独立离散头同参数量级）、主干与读出共享、主干冻结不动（实测 13M 档挂头 Δbpc = 0.0000，冻结断言 `grad is None` 通过）。"
expected_effect: "（a）tokens-per-forward = k，每 token 的主干等效 FLOPs 降到 ≈ L/k（回归头分摊 ≈ d·d 每 token），顺序前向次数由 T 降到 T/k；（b）质量代价 = 一次回归出的 k 个 latent 无法互条件（与 chain 式逐位置条件相反），须与 6.2 的离散 direct / chain / 概率加权三臂在同一 checkpoint 风格下同框；（c）与离散跳头的差别是「回归到连续隐状态再贪心」还是「直接分类到词表」，须用同参数量对照把两者的增益分开。"
sota_baseline: "并行多位置预测族：Medusa 多头、Gloeckle 2024（Meta MTP）、Stern 2018（blockwise parallel decoding）与特征级草稿 EAGLE（外部条目来源标 `记忆·未核`，只作设计方向、不作判据；情报入口 `archive/wiki-legacy/axes/H-horizon/PRIOR_ART.md`）。本地对手 = 6.2 的离散跳头三臂 `axes/6-predict/6.2-speculative-decoding/experiments/2631-spec-three-arms`（direct / chain / 概率加权组合）；基线 = 同尺寸 stock 全因果 AR（归一为 100%）。"
gap: "本仓零经验（MAPPING §2 无旧格）。增量 = 把「latent 回归一次出 k 个位置」与「离散跳头」（6.2）、「K 步去噪」（6.3.1）、「一次填空」（6.3.2）放在同一质量-代价前沿上，判定回归式批量生成在 τ / 质量上的位置，并用**同参数量对照**把两者的增益分开——**本仓实测的限定**：在共享 tied 读出 + 同参数量下两臂**数学等价且同种子逐位相同**（2660 的 L0）⇒ 该对照真正分开的是**监督目标**（latent 匹配监督 vs 纯 CE），见 `innovation` 的机制限定；不是重造多位置预测结构本身。"
method: "单因素：固定冻结主干与共享读出，只改「未来 k 个位置的产出方式」。臂 = {stock 全因果 AR 逐 token（对照）, latent 回归 k∈{2,4} + 贪心读出, 离散跳头 k∈{2,4}（6.2 同参数量对照）, 回归 + 离散组合}。基底恒为 stock decoder-only；读出在整个对照里保持共享。臂含两条判据路径（63-F4 裁决）：(i) latent 回归 + 直接发（估计得贪心，无接受率）与 (ii) latent 回归 + 当草稿再验证（有接受率）各作一臂。"
validation: "端到端：对照 = 同尺寸 stock 全因果 AR（归一为 100%）+ 离散跳头同参数量臂；客观判据 = tokens-per-forward 与平均接受长度 τ（该涨）+ 序列级质量与草稿接受率（该不跌，须越 0.014 噪声带才算可排序）+ 每 token 等效 FLOPs（代价轴，如实报）；口径 = 等效理论量（FLOPs / layer-passes / tokens-per-forward，考虑 pipelining），禁墙钟；必须不变 = 读出共享、冻结断言（主干 grad is None）。两条路径（(i) 直接发 / (ii) 当草稿再验证）各作一臂、分开报代价（63-F4 裁决）。 判据带（C1 裁决）：τ / tokens-per-forward 等率类指标走配对 bootstrap / Wilson 95% CI 为主判；序列级 bpc 差用 0.014 bpc 带（限配对 Δ、≥5 窗口）、不跨量纲借用。"
objective_criteria: "该涨：tokens-per-forward 与平均接受长度 τ；该不跌：序列级 bpc 与草稿接受率（相对全因果 AR 与同参数量离散跳头，须越 0.014 噪声带才算可排序）；必须报：每 token 等效 FLOPs（≈ L/k + d·d）；必须不变：读出共享、冻结主干断言（grad is None）。必须并行记（63-F4 裁决）：(i) 直接发（无接受率，每 token 主干 FLOPs ≈ L/k）与 (ii) 当草稿再验证（有接受率，每 token 主干 FLOPs ≈ (1+k)/k×L ≈ L）两条各作一臂、分开报代价。 用哪个带（C1 裁决）：bpc 口径用 0.014 bpc 带（限配对 Δ、≥5 窗口）；τ / 草稿接受率等率类指标走 prompt 聚类配对 bootstrap / Wilson 95% CI、**不跨量纲借用** 0.014。"
falsification: "若 latent 回归臂在同参数量离散跳头对照下，既不涨 tokens-per-forward / τ（不越噪声带），质量又不优于离散跳头 ⇒ 判「回归到连续 latent 再贪心」相对直接分类在本尺度没有独立增益；若质量越带恶化且提高 k 更差 ⇒ 判该回归式批量生成在本尺度不成立。 63-F4 裁决：(i) 直接发 与 (ii) 当草稿再验证 两条路径各作一臂、分开报代价，判据分别适用。 用哪个带（C1 裁决）：τ / tokens-per-forward 等率类指标走配对 bootstrap / Wilson 95% CI 为主判；序列级 bpc 差用 0.014 bpc 带（限配对 Δ、≥5 窗口）、不跨量纲借用。"
failure_analysis: "路径 (i)（估计得贪心、一次前向直接发 k 个位置、不验证）在本尺度**手段不成立**；归因 = **设计问题为主 + 结构问题次之**。设计问题：「不验证直接发」这一出口设计把 k 个位置的预测误差直接写进上下文并逐轮累积（实测真值锚 Δ = +1.1701…+5.0708 bpc，且 `lat_k2_lam1` 的流最长连续相同 token 平均 ≈137，即进入重复退化）。结构问题：一次回归出的 k 个 latent 无法互相条件（与 chain 式逐位置条件相反），且共享 tied 读出下两臂同参数化 ⇒ 独立自由度只有监督目标，λ·MSE 只能缓解、不能消除该累积误差。**不是**「latent（隐状态）匹配监督本身失败」（WP1 已证它在 teacher-forced 命中率 +0.031、草稿接受率 +0.092 上有独立增益）。"
conclusion: "本地读数（WP1 最小判决；冻结主干 `2631-spec-three-arms/train/13m_s0` + `13m_s1` 复现点，char enwik8，同参数量 / 同 tied 共享读出（embed sha256 566ec50c… + da5b5d33…）/ 同训练预算 3000 步 Adam lr1e-3 batch4096 数据序 seed2660、头种子 {0,1}）：(a) **实现保真（L0）**——`lat_k2_lam0` 与 `disc_k2` 同种子**逐位相同**（命中率 / CE / 头权重），冻结断言（主干 `requires_grad=False` 且 backward 后 `.grad is None`）通过，两臂共用同一份 tied 读出；(b) **路径 (i) 直接发（估计得贪心）成立**：加上「回归到主干未来真值隐状态」的辅助项（λ·MSE(z_j, h_true_{i+1+j})）后，t+2 teacher-forced 命中率从 `disc_k2` **0.4572**（种子 0）/ 0.4573（种子 1）抬到 λ=1.0 的 **0.4878** / **0.4892**（13m_s0；配对聚类 bootstrap 95% CI：种子 0 Δ=**+0.0306** [+0.0285, +0.0326]、种子 1 Δ=**+0.0319** [+0.0296, +0.0343]、跟种子合并 Δ=**+0.0313** [+0.0296, +0.0330]）、λ=0.1 的 0.4688 / 0.4685（合并 Δ=+0.0114 [+0.0101, +0.0127]）；13m_s1 复现 **+0.0329**（CI [+0.0312, +0.0345]）；k=4 同向（+0.0284，CI [+0.0268, +0.0302]），而 `disc_k4` ≈ `disc_k2` ⇒ **增益来自监督项而不是头数**。参照量级：同主干自身 t+1 命中率 `ar_t1` = **0.6714** [0.6688, 0.6740] ⇒ 一次前向直接发 2 个位置的质量代价明确（0.488 / 0.366 vs 0.671），而代价面 = 每 token 主干等效 FLOPs ≈ L/k（k=2 时 ≈ 0.5×）。(c) **路径 (ii) 当草稿再验证（63-F4 第二臂）成立**：用该头第 1 个变换头的 argmax 当位置 N+2 草稿、走生产 `decode_spec`（保真硬门：同 harness 的 `repro_direct1` 与 2640 `direct1` 逐 prompt 逐轮 accepts **逐位相同**，α₁ 0.802243 / τ 1.453619），`lat_k2_lam1` α₁ = **0.7337**（s0）/ **0.7537**（s1）vs `disc_k2` 0.6421 / 0.6682 ⇒ Δα₁ = **+0.0916** CI [+0.0525, +0.1310]、Δτ = **+0.1464** CI [+0.0971, +0.1973]（s1 同向：+0.0855 / +0.1375）；代价面 = 主干等效 FLOPs ≈ (1+k)/k·L ≈ L。(d) **机制归因（对 6.3.3 标题式描述的可核限定）**：在**共享 tied 读出 + 同参数量**下 λ=0 的两臂**数学等价且实测逐位相同** ⇒ 「回归到连续 latent 再贪心」与「直接分类到词表」不是两套参数化，本实验的独立自由度只是**监督目标**（把 `z_j` 拉向主干未来真值隐状态）；因此本尺度成立的结论应表述为「**latent（隐状态）匹配监督**带来独立增益（t+2 命中率 +0.031，相对提升约 +6.8%；草稿接受率 +0.092）」，**不是**「回归机制优于分类机制」。(e) 未测：只有 13M 冻结主干一种规模、无低局部先验对照、与 6.2 主干内联合训练头（α₁ 0.802）的差距（本轮冻结特征训头整体弱于它，−0.069…−0.160，因训练 regime 不同**不作判据**）、与 6.3.1/6.3.2 的边界未同框。 (f) **路径 (i)（估计得贪心、不验证）的 free-run 序列级质量代价明确（WP2 / `2670-freerun-bpc-13m`）**：在冻结主干上按「自己发出的 token 在自家预测分布下的 NLL」计 bpc，`ar` 逐 token 贪心 = 0.504356（13m_s0）/ 0.489330（13m_s1）；一次前向直接发 2 个位置的 `disc_k2` 自评 Δbpc = **+0.7389** [+0.5745, +0.8918]（13m_s0 种子合并）/ **+0.9195** [+0.7927, +1.0555]（13m_s1），`lat_k2_lam1`（λ=1.0 的 latent 匹配监督）把差缩小到 **+0.4289** [+0.2817, +0.5867] / **+0.1633** [−0.0443, +0.4052]——**除 13m_s1 的 latent 臂外，全部 CI 不含 0 且越 0.014 bpc 带**。**外部真值锚**（另一主干 node-1 的 teacher-forced bpc，复核 N1 要求补）下 Δ 更大且同向：`disc_k2` **+4.1541 / +5.0708**、`lat_k2_lam1` **+1.2611 / +1.1701**（真实 enwik8 续写同口径 1.6040 / 1.6027）⇒ 自评口径**低估**而非高估代价；客观退化统计显示候选臂的流明显退化（`lat_k2_lam1` 最长连续相同 token 均值 99.8–153.8（四个窗口），`disc_k2` 3.8–59，`ar` 仅 2.04）⇒ 该路径在本尺度**质量面不成立**，milestone 的可用形态是路径 (ii)「当草稿再验证」（代价 ≈ L）。代价面：路径 (i) tokens-per-forward = 2、每 token 主干等效 layer-passes ≈ 6.0（`ar` = 1 / 12）。故 status = 已完成（milestone 的判据齐备：WP1 给出 (i)/(ii) 两路径的可分读数，WP2 补齐序列级 bpc 并给出真值锚；剩余未测项见 gaps）。"
conclusion_review: "自评：WP1（`2660`）与 WP2（`2670`）两条读数互不冲突——**latent（隐状态）匹配监督**在 teacher-forced 命中率（+0.031）与草稿接受率（Δα₁ +0.0916 / Δτ +0.1464）上有独立增益，而路径 (i)「一次前向直接发 k 个位置、不验证」在序列级质量面不成立（真值锚 Δ +1.1701…+5.0708 bpc，远超 0.014 带，且有重复退化）。**当前（最后一轮）独立复核判词**：`.scratch/63-axis6-predict/REVIEW-C2-FINAL.md`（fresh、未参与写作、只读、带 shell）对**本项的返工**判 **VERDICT: PASS**——上一轮 `REVIEW-C2-633.md` 的 FAIL（B1 与 (f)/gaps 矛盾的「未测」旧话、N2 真值锚下界、N3 退化统计格式、N4 措辞指代、I3/I4/I5）已逐条返工并经该轮核验到位、未引入新矛盾。**残余缺口（如实登记）**：WP1 的历轮复核者（B1/B2/B3）无 shell，其执行类验收由 writer 与 axis6-lead 自跑；路径 (i) 只测 k=2、只有 13M 一种规模、真值锚用同族主干当 scorer（同族偏差未剥离）——见 `gaps`。**判据带（C1 裁决）**：bpc 口径用 0.014 bpc 带（限配对 Δ、≥5 窗口）；τ / 接受率等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用。历轮判词与处置过程见 `.scratch/63-axis6-predict/TICKET.md`。"
