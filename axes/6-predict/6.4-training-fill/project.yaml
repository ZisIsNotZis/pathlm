# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "6.4"
axis: "6 预测轴"
title: "训练时未来位置的填充语义：pad / self-fill / 错误 token"
dir: "axes/6-predict/6.4-training-fill"

purpose: "变深度 / 重入自回归与多位置预测要一次前向为「未来 / 已退出」位置产出预测，这些位置在训练时**没有真 token 可喂**，必须被某种内容占位。本项要判定哪种填充语义（pad / self-fill / 错误 token）能让这些位置的表征**可读**（能作草稿 / 出口），且不把分布外内容注入上下文。"
innovation: "相对普通 decoder-only transformer（每个位置都用真 token 做 teacher forcing），改变「未来 / 已退出位置的输入内容」：pad / mask、错误 token、self-fill（用自己上一轮预测或已退出位置的冻结表征）、proj-fill（逐层恒等初始化 adapter 把冻结表征投回主干输入空间）。改动量级：proj-fill 的逐层 adapter 近零额外参数（恒等初始化，量级每层 <1% d）；pad / 错误 token 零额外参数。"
expected_effect: "（a）让变深度 / 重入 AR 的右侧位置表征可用（出口 / 草稿可读），否则该形态无从谈起；（b）填错内容会把分布外噪声注入上下文（软提交 rescore 爆表即现象）；（c）须把填充语义的质量代价放到以无填充与全因果 stock 为对照的前沿上量化。"
sota_baseline: "主流 MTP 训练**不填充**右侧——DeepSeek-V3 MTP 用独立顺序头直接预测 t+1/t+2 目标、Medusa 头直接拟合并行草稿；填空 / 去噪目标（FIM、masked-token 预测、掩码扩散）用 [mask] / 噪声填充但动机是补齐而非 MTP。本地锚 = 同引擎 ragged nofill 与 stock 全因果 AR（归一为 100%）。情报 `archive/wiki-legacy/axes/H-horizon/PRIOR_ART.md`（外部条目来源标 `记忆·未核`）。"
gap: "业界系统比较「self-fill / proj-fill / mask / 错误 token / 软 latent」这组填充方案的税**未找到**直接前例。本仓增量 = 同引擎、同 seed、matched-step 的单因素扫描 + 「proj-fill（逐层恒等初始化 adapter）最优、全深度逐深度支配 fill」的受控结论 + 「软提交 OOD 污染」三度复现 + 首验「填充是负分量 +0.167」被 matched-step 检验反转的纠错；不重造填充机制本身。"
method: "单因素：固定引擎 / seed / matched-step，只改填充语义。臂 = {无填充（ragged nofill）, pad / mask, 错误 token, self-fill（用自己上一轮预测 / 已退出位置的冻结表征）, proj-fill（逐层恒等初始化 adapter）, 软 latent（Σp·E）, 纯噪声 latent}。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 无填充（ragged nofill）与 stock 全因果 AR（归一为 100%）；客观判据 = clean bpc（质量税，该跌 / 该不跌）+ 填入位置的可读性（出口 / 草稿命中，该涨）+ 提交质量（rescore，软提交 OOD 污染该低）；口径 = matched-step / 同 token 预算，禁墙钟；必须报活性 = 填充位置占比与 adapter 是否真被用到。"
objective_criteria: "该跌：各填充语义相对无填充的 clean bpc（税，须越 0.014 噪声带才算可排序）+ 软提交的 rescore 峰值（OOD 污染该低）；该涨：填入位置的可读性（出口 / 草稿命中）；必须不变：非填充位置的 teacher forcing 语义（不污染主干 clean 分布）；必须报：填充位置占比与 adapter 活性。 用哪个带（C1 裁决）：bpc 口径用 0.014 bpc 带（限配对 Δ、≥5 窗口）；rescore 峰值 / 命中率等率类指标走配对 bootstrap / Wilson 95% CI、**不跨量纲借用** 0.014。"
falsification: "若 proj-fill / self-fill 相对无填充的 clean bpc 优势全由额外参数解释（等参数对照后消失），或「软提交 OOD 污染」不可复现 ⇒ 判填充语义在本尺度不是独立有增益的维度。"
failure_analysis: "非「本项手段失败」：填充语义的主体结论（fill > nofill 可复现、软提交污染等参数成立）成立。唯一未复现的是 **proj-fill 相对 fill 的排序**（12k 档 −0.0226 vs 2k 快照 +0.0218…+0.0297，符号相反）——归因 = **训练步数/收敛阶段效应（规模—regime 效应，不是设计失败也不是 innovation 失败）**：proj-fill 的逐层恒等初始化 adapter 需要从 fill 出发学习 remap，短步数下收益来不及出现；证据 = 同一协议只改步数即翻转、且两种子同向。**下一步**：在 12k 档重跑 proj-fill 的第二个 seed 以判该排序是否在收敛刻度上稳定（成本 ≈10 min GPU）。"
conclusion: "已有本地读数（旧格 H2 迁入，已归位并写明目的）：保留式填充（self-fill）1.8582 胜 ragged nofill 1.9438（+0.0856，>0.014 可排序）；proj-fill（逐层恒等初始化 adapter）1.8356 = 同协议 matched-step（实测 6.96M）族内最优且全深度逐深度支配 fill；mask / 错误 token 替换分别 +0.059 / +0.127（更贵）；软 latent（Σp·E）提交有 OOD 污染（rescore 峰值三度复现：首验 6.9 vs hard 1.2、@100M 8.42 vs 0.79、C 臂 3.36 vs 0.74）；embedding noise ±0.000。⇒ 本尺度下「未来 / 已退出位置的填充语义」是独立有影响的一维，且「不注入分布外内容」比「填得看起来像」更重要（软提交 OOD 污染）。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。 Phase C 补测（WP1b + WP2，`experiments/2672-fill-n2-13m`）：**(f) n≥2 复本（2k 步快照口径，臂间同刻度）**——`fill` 优于 `nofill` 在 seed {0,1} 上都成立（depth-8 bpc 2.7995 vs 2.8770 与 2.7580 vs 2.8221，Δ = −0.0775 / −0.0641，符号一致、极差 0.0134，方向与 12k 档 −0.0856 一致）⇒ **fill > nofill 可复现**；**(g) proj-fill 的排序依赖训练步数**——同一快照刻度下 `projfill` 反而略差于 `fill`（Δ = +0.0297 / +0.0218，两种子同向），与 12k 档的「proj-fill 更优（−0.0226）」**符号相反** ⇒ 该排序**不得从 2k 快照外推到 12k，反之亦然**；**(h) 软提交 OOD 污染在等参数剥离下成立（WP2）**——同一 checkpoint 只改提交规则，soft 的 rescore 峰值一致远高于 hard：Δ(soft−hard) 逐臂（seed0/seed1）= fill +3.8325/+6.2138、nofill +5.8908/+6.5625、projfill +6.2739/+4.7332（权重逐位相同 ⇒ **容量不再是解释**）。本项的**规模标签按落盘实测更正**：既有 23e 协议与 2672 的实测参数量 = 6,962,688（≈6.96M，d=256/L=8/h=8/mlp_mult=4），milestone 原文的「13M」是措辞误标、不改判据。"
conclusion_review: "自评：本项已收口（旧格 H2 的 12k 读数 + Phase C 的 2672 快照复本与等参数剥离）。主体结论（fill > nofill、软提交污染）在两种子 / 多种 checkpoints 上一致；唯一未复现的是 proj-fill 相对 fill 的排序，归因为训练步数效应并已登记下一步最小实验。**当前（最后一轮）独立复核判词**：`.scratch/63-axis6-predict/REVIEW-C1-64.md`（fresh、未参与写作、只读）判 **VERDICT: PASS**（blocker 0 · normal 2 · info 3）：normal-2（交付目录名与契约 §6 不一致，仅命名）与 normal-1（辅助 `*.nohup.log` 里有墙钟，非判据区）已记入 `gaps`；info-3 指出「注入分布外内容」的机制措辞强于直接测量（本项只测到 rescore 峰值差，未做嵌入层分布检验），已在 `gaps` 记为未测项。复核者亲自执行了臂级 bpc 与 Δ 的独立复算、6 个 run 与既有 23e 的 config 对平（除 `steps` 外无差异）、rescore 表复算、`summary.py --check` 与越界检查。**残余缺口**：快照口径（2k 步）与 12k 档不可比；proj-fill 的 12k 第二 seed 未跑；pad/mask、错误 token、软 latent 三臂仍只有旧读数、不在本轮 n≥2 复本内——见 `gaps`。历轮过程见 `.scratch/63-axis6-predict/TICKET.md`。"
