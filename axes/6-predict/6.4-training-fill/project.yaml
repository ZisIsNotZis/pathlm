argument: "填什么内容不是「审美」而是可测的质量项：无填充让右侧位置的输入与训练分布不一致，填错内容直接注入离群向量（软提交 OOD 污染三度复现即活证）。逻辑链：proj-fill 用逐层恒等初始化 adapter 把冻结表征投回主干输入空间，与 nofill 相比全深度逐深度支配，说明「填对语义」是正分量；而首验「填充是负分量 +0.167」经 matched 步数检验为欠拟合伪影 + 对照混淆（当时 nofill 臂同时无随机退出），说明口径不对齐会给出反向结论。"
gaps:
  - "仅 13M（12k matched）+ 部分 @100M 点；填充语义对照无 n≥2 复本"
  - "软提交 OOD 污染有复现但未做等参数剥离（adapter 容量 vs 填充语义）"
  - "pad / 错误 token 的「更贵」只有一处读数，未在多 seed 复核"
  - "填充语义与多位置预测（6.2）/ 整段并行生成（6.3）的耦合未测（组合默认留白）"
cost_model: "等效理论量：pad / 错误 token / self-fill 不改每 token 的 layer-passes（= L）与每层 FLOPs 主项；proj-fill 的逐层 adapter 额外参数量级每层 <1% d，每 token 额外 ≈ L·d FLOPs；tokens-per-forward 每步 1（填充不改该量）。考虑 pipelining：填充位置占比决定被填位置的同批并行度。"

