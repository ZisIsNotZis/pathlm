# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "6.4"
axis: "6 预测轴"
title: "训练时未来位置的填充语义：pad / self-fill / 错误 token"
dir: "axes/6-predict/6.4-training-fill"

purpose: "变深度 / 重入自回归与多位置预测要一次前向为「未来 / 已退出」位置产出预测，这些位置在训练时**没有真 token 可喂**，必须被某种内容占位。本项要判定哪种填充语义（pad / self-fill / 错误 token）能让这些位置的表征**可读**（能作草稿 / 出口），且不把分布外内容注入上下文。"
innovation: "相对普通 decoder-only transformer（每个位置都用真 token 做 teacher forcing），改变「未来 / 已退出位置的输入内容」：pad / mask、错误 token、self-fill（用自己上一轮预测或已退出位置的冻结表征）、proj-fill（逐层恒等初始化 adapter 把冻结表征投回主干输入空间）。改动量级：proj-fill 的逐层 adapter 近零额外参数（恒等初始化，量级每层 <1% d）；pad / 错误 token 零额外参数。"
expected_effect: "（a）让变深度 / 重入 AR 的右侧位置表征可用（出口 / 草稿可读），否则该形态无从谈起；（b）填错内容会把分布外噪声注入上下文（软提交 rescore 爆表即现象）；（c）须把填充语义的质量代价放到以无填充与全因果 stock 为对照的前沿上量化。"
sota_baseline: "主流 MTP 训练**不填充**右侧——DeepSeek-V3 MTP 用独立顺序头直接预测 t+1/t+2 目标、Medusa 头直接拟合并行草稿；填空 / 去噪目标（FIM、masked-token 预测、掩码扩散）用 [mask] / 噪声填充但动机是补齐而非 MTP。本地锚 = 同引擎 ragged nofill 与 stock 全因果 AR（归一为 100%）。情报 `archive/wiki-legacy/axes/H-horizon/PRIOR_ART.md`（外部条目来源标 `记忆·未核`）。"
gap: "业界系统比较「self-fill / proj-fill / mask / 错误 token / 软 latent」这组填充方案的税**未找到**直接前例（55-review PRIOR_ART §H2）。本仓增量 = 同引擎、同 seed、matched-step 的单因素扫描 + 「proj-fill（逐层恒等初始化 adapter）最优、全深度逐深度支配 fill」的受控结论 + 「软提交 OOD 污染」三度复现 + 首验「填充是负分量 +0.167」被 matched-step 检验反转的纠错；不重造填充机制本身。"
method: "单因素：固定引擎 / seed / matched-step，只改填充语义。臂 = {无填充（ragged nofill）, pad / mask, 错误 token, self-fill（用自己上一轮预测 / 已退出位置的冻结表征）, proj-fill（逐层恒等初始化 adapter）, 软 latent（Σp·E）, 纯噪声 latent}。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 无填充（ragged nofill）与 stock 全因果 AR（归一为 100%）；客观判据 = clean bpc（质量税，该跌 / 该不跌）+ 填入位置的可读性（出口 / 草稿命中，该涨）+ 提交质量（rescore，软提交 OOD 污染该低）；口径 = matched-step / 同 token 预算，禁墙钟；必须报活性 = 填充位置占比与 adapter 是否真被用到。"
objective_criteria: "该跌：各填充语义相对无填充的 clean bpc（税，须越 0.014 噪声带才算可排序）+ 软提交的 rescore 峰值（OOD 污染该低）；该涨：填入位置的可读性（出口 / 草稿命中）；必须不变：非填充位置的 teacher forcing 语义（不污染主干 clean 分布）；必须报：填充位置占比与 adapter 活性。"
falsification: "若 proj-fill / self-fill 相对无填充的 clean bpc 优势全由额外参数解释（等参数对照后消失），或「软提交 OOD 污染」不可复现 ⇒ 判填充语义在本尺度不是独立有增益的维度。"
failure_analysis: ""
conclusion: "已有本地读数（旧格 H2 迁入，按 55-review H-I7 归位并写明目的）：保留式填充（self-fill）1.8582 胜 ragged nofill 1.9438（+0.0856，>0.014 可排序）；proj-fill（逐层恒等初始化 adapter）1.8356 = 13M matched-step 族内最优且全深度逐深度支配 fill；mask / 错误 token 替换分别 +0.059 / +0.127（更贵）；软 latent（Σp·E）提交有 OOD 污染（rescore 峰值三度复现：首验 6.9 vs hard 1.2、@100M 8.42 vs 0.79、C 臂 3.36 vs 0.74）；embedding noise ±0.000。⇒ 本尺度下「未来 / 已退出位置的填充语义」是独立有影响的一维，且「不注入分布外内容」比「填得看起来像」更重要（软提交 OOD 污染）。"
conclusion_review: "本项按 55-review H-PROBLEMS H-I7 重写后 status = 进行中：旧格 H2 的目的（服务变深度 AR / reentry 的右侧位置语义）没写清，且被并进「视界（一次前向产生几个位置）」当作 spec 加速的一条；本项把它归到预测轴的**训练时填充语义**上并把目的写明。结论本身（self-fill / proj-fill 胜 ragged nofill、mask / 错误 token 更贵、软提交 OOD 污染三度复现）是本仓受控实验读数，未被 55-review 质疑。判据以 matched-step / 同 token 预算记，墙钟不进判据。**尚未达到本项 milestone（13M matched-step n≥2）**：WP1 仍在进行中、WP2 未开始，填充语义对照无 n≥2 复本，故 status 记「进行中」而非「已完成」。独立复核未做。"
