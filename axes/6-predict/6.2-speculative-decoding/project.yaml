# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "6.2"
axis: "6 预测轴"
title: "多位置预测 = 投机解码"
dir: "axes/6-predict/6.2-speculative-decoding"

purpose: "自回归逐 token 解码每生成 1 个 token 就要跑 1 次完整前向（1 次全权重访存 + 1 次顺序依赖），生成长度 T 就要 T 次顺序前向，长序列解码被「顺序前向次数」卡住。本项要压低**每 token 顺序前向次数**、抬高**平均接受长度 τ**，并把质量代价放到以全因果 stock 为 100% 的质量-代价前沿上。"
innovation: "相对普通 decoder-only transformer（一次前向只产 1 个位置、逐 token 前向），在**冻结主干**上挂轻量草稿头，一次并行产出 k 个未来位置的预测（草稿），再由全深度**批量验证**一次校验多草稿、按拒绝点截断（无损性）；草稿可用**概率多候选 / 树** + 路径概率加权组合来抬高 τ。改动量级：草稿头是 d×d 变换、无 vocab 参数（近零额外参数；本仓 13M 实测冻结主干挂头 Δbpc = 0.0000）；验证复用同一次全深度前向；每 token 等效 FLOPs = (1+γ)/(1+τ)。"
expected_effect: "（a）每 token 顺序前向次数由 1 降到 1/(1+τ)，即 tokens-per-forward 上升（2520 的 γ=2 点：2.37–2.40；部署三臂在 2631 为 2.07–2.58）；（b）在**冻结主干 + 树 / 多候选 + 置信加权**这条免费路线上 τ 抬高而质量不掉（Δbpc ≈ 0）；（c）代价 = 用**更多并行 FLOPs** 换**更少顺序前向**（R=(1+γ)/(1+τ) > 1 是范式的定义性质，不是亏损发现），因此必须把 τ / tokens-per-forward（硬指标）与每 token 等效 FLOPs（代价轴）**分开报**，并放进质量-代价前沿。"
sota_baseline: "Leviathan/Chen 2023（投机解码 + 无损性定理）、Stern 2018（blockwise parallel decoding）、Medusa 2024（冻结主干 + 多头 + 树注意力验证）、EAGLE（特征级草稿）、Gloeckle 2024（Meta MTP）、DeepSeek-V3 MTP。本地对手 = 既有早退实现参照线 `axes/7-references/experiments/R7-existing-early-exit/2623-standard-early-exit-13m`；基线 = 同尺寸 stock 全因果逐 token 贪心（归一为 100%；13M B0 = 1.5074 bpc 快照）。台账 `axes/7-references/README.md`；情报 `archive/wiki-legacy/axes/H-horizon/PRIOR_ART.md`（外部条目来源标 `记忆·未核`，只作设计方向、不作判据）。"
gap: "业界已做透「冻结主干挂头 + 多头 + 树注意力批量验证」（Medusa / EAGLE）与无损性定理，本项**本质是重造 Medusa**（既有情报登记的最高风险项）。本仓增量只能落在三处：(a) 在 13M/53.9M 上把 **τ / tokens-per-forward（硬指标）与每 token 等效 FLOPs（代价轴）分开量化**（业界多报加速比、少报「草稿从哪儿来的税」与代价轴）；(b) 把出资人设计的**概率多候选 + 树 + 路径概率加权组合**从「单 argmax + 固定 λ=0.5」补回来并端到端测（本仓当时把它简化掉了）；(c) 在**冻结主干的免费路线**上测（旧主线误用联合训练的 +0.041 税，顶掉了「MTP 应免费」这一有本地证据的前提）。"
method: "单因素：固定基底（同尺寸 stock 主干）与协议（γ），只改**草稿来源与组合方式**。草稿臂 = {direct 单 argmax 直接头, chain 条件链（DeepSeek 式 concat+proj）, 概率加权组合（按路径概率 (p₊₁·p₊₁|₊₁·v₊₁|₊₁ + p₊₂·v₊₂)/(p₊₁·p₊₁|₊₁ + p₊₂) 加权）, 树 / 多候选草稿（beam / DP lattice + 重排 + 树注意力验证）}；主干关系臂 = {冻结主干只训头（Medusa-1 路线）, 联合训练（Medusa-2 路线）}。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 同尺寸 stock 全因果逐 token 贪心（归一为 100%）+ 诚实对手「1-step AR 两次前向」（只替换紧邻位置；oracle 只作上界附报、不作判据，harness/SCHEMA.md §11）；客观判据 = 平均接受长度 τ 与 tokens-per-forward（该涨）+ 序列级 bpc 与草稿接受率（该不跌；bpc 口径用 0.014 bpc 带、限配对 Δ、≥5 窗口，草稿接受率走配对 bootstrap / Wilson 95% CI）+ 每 token 等效 FLOPs R=(1+γ)/(1+τ)（代价轴，如实报、不设「该跌」）；口径 = 等效理论量（FLOPs / layer-passes / tokens-per-forward，考虑 pipelining），**墙钟不进判据**；必须不变 = 发出流与目标模型逐步贪心一致（无损性不变量）。 判据带（C1 裁决）：接受率 / τ 类走配对 CI（prompt 聚类 bootstrap），不跨量纲借用 0.014；多候选 / 树结论须附等 FLOPs 对照臂或注明不可得（63-F2）。"
objective_criteria: "该涨：平均接受长度 τ 与 tokens-per-forward（相对 γ=1 基线）；该不跌：冻结主干挂头后的主干 clean bpc（Δbpc ≈ 0，与 stock 全因果同级）与草稿接受率（须越 0.014 噪声带才算可排序）；必须不变：发出流与目标模型逐步贪心一致（无损性）——13M 是逐位相等硬门禁，更大规模已知会有 float 平局翻转（@100M enwik8_k2 记到 1 次：级联 68 token），此时按「与逐步贪心的分歧率有界」判、逐位相等不作跨规模判据；必须如实报：每 token 等效 FLOPs R=(1+γ)/(1+τ)（>1 是范式定义性质）。**不得**把「R>1」当判据——τ ≤ γ ⇒ R ≥ 1 按构造恒成立，不可证伪。 用哪个带（C1 裁决，`harness/research-schema.md` §12.1）：bpc 口径用 0.014 bpc 带（限配对 Δ、≥5 窗口）；τ / 草稿接受率等率类指标走 prompt 聚类配对 bootstrap / Wilson 95% CI、**不跨量纲借用** 0.014。"
falsification: "若在**冻结主干 + 树 / 多候选 + 置信加权**这条免费路线上，没有任何配置能把 τ 抬到显著高于单 argmax 直接头（超过预登记接受率门 / 0.014 噪声带）且质量不越带 ⇒ 判「概率多候选 / 树 + 置信加权组合」（6.2.2）在本尺度不成立；若冻结主干挂头本身扰动主干（Δbpc 越带）⇒ 判「草稿头应免费」（6.2.1）的前提失败；若温度>0 与 batch>1 下 τ 排序翻覆、给不出稳定结论 ⇒ 判该尺度下 τ 不可作硬指标。 用哪个带（C1 裁决）：接受率 / τ 类按 prompt 聚类配对 bootstrap 95% CI 不含 0 为主判，0.014 bpc 带只作参考（不得跨量纲借用）；多候选 / 树结论须附等 FLOPs 对照臂，本引擎 `n_mtp=3` 上限下不可得则如实注明（63-F2 裁决）。"
failure_analysis: ""
conclusion: "本地读数（旧格 H1/H3/H4/H5 迁入 + 6.2.2 新补跑；旧口径已修正）：(a) **草稿头零税**——冻结 13M 主干挂跳跃头 Δbpc = 0.0000（1.4836→1.4836，冻结断言 grad is None 通过），坐实「应免费、不动主干」；(b) **顺序前向次数确实降**——tokens-per-forward 2.37–2.40（2520 的 γ=2 点：13M enwik8 2.3952 / 100M random 2.3669 / 100M enwik8 2.3952；2631 部署三臂在 13.4M/53.9M 另为 2.07–2.58），τ 随 γ 上升；(c) **每 token 等效 FLOPs 恒 > 1**（R = 1.065–1.268，13M/100M 都 >1）——这是范式定义性质（用更多并行算力换更少顺序前向），**不是「亏损发现」**；旧格把解析恒真的 R>1 当主判据已剔除；(d) **单候草稿组合**：部署 regime 下 direct ≈ combined（配对差 95% CI 含 0，不可排序）> chain（显著更差，τ 1.58/1.54/1.20 @53.9M），但在完全 in-distribution 的真实文本前缀上 chain 反而更高 ⇒ 该排序是**前缀 regime 依赖**的（单候草稿下的这个排序不适用于多候选 / 树，见 (g)）；(e) **批量验证**在 13M 可用且发出流与逐步贪心逐位一致，@100M enwik8_k2 记到 **1 次 fp 平局翻转**（首错位 169、级联 68 token、翻转处 top-2 gap 0.0079 > 预登记的 1e-3 并列容差，两轮复跑逐值相同）使逐位相等不可作跨规模判据；(f) 旧头条「恒为算力亏损」「税效比全项目最好」两个口径均已判定错误（前者 R>1 解析恒真、后者依赖本机不可稳定复现的墙钟），不再采纳；(g) **多候选 / 树（WP 6.2.2 主判）成立**：在 3 个已训练 checkpoint（13.4M × 2 seed + 53.9M × 1）的**冻结主干**上，把位置 N+2 的草稿从「单个 argmax」换成「K 个自带概率的候选一次前向批量精确验证」（`tree_union2` / `tree_direct_k2` / `tree_qpw_k2` / `tree_topk4`，K = 1.5/2/2/4）后，α₁ 相对**该 checkpoint 实测最强单臂**抬 13m_s0 **+0.0618…+0.1269**、13m_s1 **+0.0638…+0.1123**、53m_s0 **+0.0905**（该 ckpt 只跑了 `tree_direct_k2`），τ 同步抬 **+0.109…+0.236**，按 prompt 聚类的**配对** bootstrap 95% CI **全部不含 0**；K 越大 τ 越高（排序 topk4 > direct_k2 ≳ union2 稳定）；全部臂 × 3 ckpt × 12 prompt 的发出流**逐位 == native 贪心**（无损性不变量未破）。**代价**：R = K·(1+γ)/(1+τ) 从单臂 1.16–1.24 抬到 1.73–2.36（union2 / K=2）/ 4.45–4.51（K=4），即用约 1.9×（union2/K=2）到 3.7×（K=4）并行 FLOPs 换 τ，**边际收益随 K 递减**——这是「用并行算力换顺序前向次数」的代价面，如实报、不作判据；且该倍数是本实现「K 行平铺」（每轮 3K 个主干位置）的上界，节点共享树（≈2K+1 个位置）下约高 1.2–1.33×。(h) **路径概率加权组合（出资人原式）在本尺度不产生可测收益**：`combo_pw`（w=p₁[v1]·p(chain2)/p(node2) 加权）与 `combined_fixed`（固定 λ=0.5）的 Δα₁ = −0.0048（13m_s0）/ +0.0039（13m_s1），配对 CI 含 0 ⇒ 否证「加权 vs 等权在本尺度有差」；两臂逐轮草稿分歧率 ~5.7%/5.8%（确不同），但该差别落在接受率噪声带内——**不得**读成「组合无价值」（旧 2631 的该读法已判答非所问）。(i) 剩余未测：温度>0 / batch>1 的稳健性点、二级条件树（位置 N+3 以被接受的候选为条件，需新条件头 + 重训，属共享引擎改动，已上报）、53.9M 只跑 3 臂、无低局部先验对照任务、带驱逐（window>0）的树验证未实装（见 (j)）、对抗臂未在 53.9M 跑。故 status = 进行中（主判据已答，milestone 输出包未齐）。 (j) **批量验证是无损的真验证，且「多塞候选很快划不来」（WP 6.2.3）**：在 13m_s0 / 13m_s1 的冻结主干上把位置 N+2 的候选集换成对抗性集合——随机候选 α₁ = 0.0185（13m_s0，Wilson 95% [0.0138, 0.0248]；13m_s1 0.0212 [0.0161, 0.0279]）、概率最低 4 个候选 α₁ = 0.0（Wilson 上界 0.0016），与均匀随机假接受率 4/206 ≈ 0.0194 同量级，且两者发出流仍**逐位 == native 贪心**；同一候选抄 4 份（`dup_k4`）与 K=1 走 K 行树机制（`single_k1_ctl`）的逐轮 accepts 与 `combo_pw` **逐个相同**（退化等价）⇒ 接受判据确为「候选 == 目标模型该位置 argmax」的真验证，重复 / 对抗候选都不产生假接受；三条 bookkeeping 变异（行↔候选错位 / 回写错行 / 无条件接受）全部抓红并逐字节还原。**代价面**（等价理论量、不作判据）：同一 `pw_mix.q` 候选族下 K=1/2/4/8 的 τ = 1.4323/1.5481/1.6586/1.7358（已分别达 τ 上界 `oracle_accept` 1.7672 的 0.811/0.876/0.939/0.982），α₁ = 0.8000/0.8667/0.9317/0.9785（K=4→8 Δα₁ = +0.0467，配对 95% CI [+0.0296, +0.0629] 不含 0，即 α₁ 未饱和），每 token 等效 FLOPs R = K·(1+γ)/(1+τ) = 1.233/2.355/4.514/8.773 ⇒ 边际 Δτ/ΔK = 0.1158（K=1→2）/ 0.0552（2→4）/ **0.0193（4→8）**，K=4→8 的边际 < 预登记阈值 0.5×0.1158 = 0.0579 ⇒ **判「K>4 的验证开销不划算（边际收益降到约 1/6）」**；在硬指标（每 token 顺序前向次数 = 1/(1+τ)，K=1→8 时 0.411→0.365）上验证只加并行行、**不吞** τ 收益——τ 的上限由**候选集覆盖率**（K=4 已达 0.939）而非验证行数决定。独立复核见 `.scratch/63-axis6-predict/REVIEW-B1.md`。 验收并列读法（C2 裁决）：milestone 预登记文字（免费路线 τ 显著高于单 argmax + 质量不越带）**字面成立**（树臂 α₁ +0.06…+0.13、配对 CI 不含 0、无损性未破）；其实质（不被同算力最强单臂支配）**成立**（同 checkpoint 实测最强单臂被树臂超越），但以 K 倍并行 FLOPs 换 τ（代价面如实报、不作判据）。 判据带（C1 裁决）：接受率 / τ 类走 prompt 聚类配对 bootstrap 95% CI 不含 0 为主判；0.014 bpc 带只作参考、不跨量纲借用。"
conclusion_review: "本项按既有情报清单重写后 status = 进行中：旧格把「每步输出位置数」这一**手段**当 topic（H-F01）、把解析恒真的 R>1 当主判据（H-F03）、并用联合训练的 +0.041 税顶掉「MTP 免费」前提（H-F04），三处已改入正文；H3 的核心设计（概率多候选 + 树 + 置信加权）被简化成单 argmax + 固定 λ=0.5、树 / 多候选整条未做（H-F02/H-F05），已由 WP 6.2.2 补回并端到端判（见 (g)/(h)）。**独立复核**（fresh reviewer，未参与写作，`.scratch/63-axis6-predict/REVIEW-1.md`）：判**无 blocker**、4 条 normal（10 倍数值错 / 代价口径未披露 / 本文件与新读数不自洽 / 正文带日期流水）+ 1 条 info（探针 CI 用 overall n），四条已逐条修入（本文件即 F3 的修）。复核者自述其上下文**无 shell**，故变异 / 自写复算 / git 越界与预登记不变性四项未自跑；这四项已由轴 lead 代跑补齐（`mutation_report` 3/3 抓红 + 逐字节还原、22 条单测通过、两套独立复算逐值一致、`git diff 01d25ff..HEAD -- pathlm docs tools` 为空、预登记契约只在一次入库且 mtime 早于开跑）——见 `.scratch/63-axis6-predict/TICKET.md` §9。自评与复核均认为：主判结论（树抬 τ、加权无增益）站得住，但强度受三处限制：单一任务（enwik8 char 级、温度 0、B=1）、γ=2、且免费路线的树用 K 倍并行 FLOPs。**复核 #2**（fresh、带 shell，`.scratch/63-axis6-predict/REVIEW-2.md`）在本 revision（HEAD `21f390d`）上判 **VERDICT: PASS**：复核 #1 的 4 条 normal + 1 条 info 均已正确修入；自跑项（22 单测 / 变异 3/3 抓红 + 逐字节还原 / 离线重算逐字节确定 / 无越界 / 4 个关键文件哈希）与独立复算（臂级 α₁/τ 逐位、配对 CI 逐值）全绿；仅剩 info 级建议（其中「WP acceptance 与 gaps 的节点共享树口径」与「`mutation_report` 写入逐次运行耗时」两条已修入）。（WP 6.2.3 的 Phase B 复核见下句。） **WP 6.2.3 复核**：`REVIEW-B1.md`（fresh、只读、无 shell）判 **PASS（OK with notes）**（blocker 0 · normal 2 · info 5）；`REVIEW-B3.md` 在同一 revision（HEAD `0c4dc01`）上判 **FAIL**，但**明确声明无 blocker 级科学缺陷**，FAIL 的两条理由 = 该复核上下文无 shell（执行类验收不可执行）+ 2 条文档/元数据级缺陷（均已修：2650 的 `results.json::config.budget_min` 恢复为实际运行值 25.0 并另立 `budget_min_contract=15.0`；`2650/README.md` §8 压成指向工单的一行指针）；它同时**逐值核过结论 (j) 的全部数字**（τ / α₁ / R / Δτ/ΔK / 阈值 / Δα₁ CI / Wilson 全部对得上）。**残余证据缺口**：B1/B3 两轮复核者都**没有 shell**，故 pytest（11 passed）/ mutate（3/3 抓红 + 逐字节还原）/ `summary.py --check` / 2640 文件 sha256 / `git` 区间检查这些执行类验收由 axis6-lead 自跑（见 TICKET.md §B5 的命令与输出），**不是** fresh 复核者的独立见证；未做第 4 轮复核（时间盒 / ≤2 轮约束）。"
