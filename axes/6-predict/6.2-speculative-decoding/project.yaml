# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "6.2"
axis: "6 预测轴"
title: "多位置预测 = 投机解码"
dir: "axes/6-predict/6.2-speculative-decoding"

purpose: "自回归逐 token 解码每生成 1 个 token 就要跑 1 次完整前向（1 次全权重访存 + 1 次顺序依赖），生成长度 T 就要 T 次顺序前向，长序列解码被「顺序前向次数」卡住。本项要压低**每 token 顺序前向次数**、抬高**平均接受长度 τ**，并把质量代价放到以全因果 stock 为 100% 的质量-代价前沿上。"
innovation: "相对普通 decoder-only transformer（一次前向只产 1 个位置、逐 token 前向），在**冻结主干**上挂轻量草稿头，一次并行产出 k 个未来位置的预测（草稿），再由全深度**批量验证**一次校验多草稿、按拒绝点截断（无损性）；草稿可用**概率多候选 / 树** + 路径概率加权组合来抬高 τ。改动量级：草稿头是 d×d 变换、无 vocab 参数（近零额外参数；本仓 13M 实测冻结主干挂头 Δbpc = 0.0000）；验证复用同一次全深度前向；每 token 等效 FLOPs = (1+γ)/(1+τ)。"
expected_effect: "（a）每 token 顺序前向次数由 1 降到 1/(1+τ)，即 tokens-per-forward 上升（本仓 13M/100M 实测 2.37–2.40）；（b）在**冻结主干 + 树 / 多候选 + 置信加权**这条免费路线上 τ 抬高而质量不掉（Δbpc ≈ 0）；（c）代价 = 用**更多并行 FLOPs** 换**更少顺序前向**（R=(1+γ)/(1+τ) > 1 是范式的定义性质，不是亏损发现），因此必须把 τ / tokens-per-forward（硬指标）与每 token 等效 FLOPs（代价轴）**分开报**，并放进质量-代价前沿。"
sota_baseline: "Leviathan/Chen 2023（投机解码 + 无损性定理）、Stern 2018（blockwise parallel decoding）、Medusa 2024（冻结主干 + 多头 + 树注意力验证）、EAGLE（特征级草稿）、Gloeckle 2024（Meta MTP）、DeepSeek-V3 MTP。本地对手 = 既有早退实现参照线 `axes/7-references/experiments/R7-existing-early-exit/2623-standard-early-exit-13m`；基线 = 同尺寸 stock 全因果逐 token 贪心（归一为 100%；13M B0 = 1.5074 bpc 快照）。台账 `axes/7-references/README.md`；情报 `axes/H-horizon/PRIOR_ART.md`（外部条目来源标 `记忆·未核`，只作设计方向、不作判据）。"
gap: "业界已做透「冻结主干挂头 + 多头 + 树注意力批量验证」（Medusa / EAGLE）与无损性定理，本项**本质是重造 Medusa**（55-review H-PROBLEMS §0 的最高风险项）。本仓增量只能落在三处：(a) 在 13M/53.9M 上把 **τ / tokens-per-forward（硬指标）与每 token 等效 FLOPs（代价轴）分开量化**（业界多报加速比、少报「草稿从哪儿来的税」与代价轴）；(b) 把出资人设计的**概率多候选 + 树 + 路径概率加权组合**从「单 argmax + 固定 λ=0.5」补回来并端到端测（本仓当时把它简化掉了）；(c) 在**冻结主干的免费路线**上测（旧主线误用联合训练的 +0.041 税，顶掉了「MTP 应免费」这一有本地证据的前提）。"
method: "单因素：固定基底（同尺寸 stock 主干）与协议（γ），只改**草稿来源与组合方式**。草稿臂 = {direct 单 argmax 直接头, chain 条件链（DeepSeek 式 concat+proj）, 概率加权组合（按路径概率 (p₊₁·p₊₁|₊₁·v₊₁|₊₁ + p₊₂·v₊₂)/(p₊₁·p₊₁|₊₁ + p₊₂) 加权）, 树 / 多候选草稿（beam / DP lattice + 重排 + 树注意力验证）}；主干关系臂 = {冻结主干只训头（Medusa-1 路线）, 联合训练（Medusa-2 路线）}。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 同尺寸 stock 全因果逐 token 贪心（归一为 100%）+ 诚实对手「1-step AR 两次前向」（只替换紧邻位置；oracle 只作上界附报、不作判据，SCHEMA.md §11）；客观判据 = 平均接受长度 τ 与 tokens-per-forward（该涨）+ 序列级质量与草稿接受率（该不跌，须越 0.014 噪声带才算可排序）+ 每 token 等效 FLOPs R=(1+γ)/(1+τ)（代价轴，如实报、不设「该跌」）；口径 = 等效理论量（FLOPs / layer-passes / tokens-per-forward，考虑 pipelining），**墙钟不进判据**；必须不变 = 发出流与目标模型逐步贪心一致（无损性不变量）。"
objective_criteria: "该涨：平均接受长度 τ 与 tokens-per-forward（相对 γ=1 基线）；该不跌：冻结主干挂头后的主干 clean bpc（Δbpc ≈ 0，与 stock 全因果同级）与草稿接受率；必须不变：发出流逐位 == 目标模型逐步贪心（无损性）；必须如实报：每 token 等效 FLOPs R=(1+γ)/(1+τ)（>1 是范式定义性质）。**不得**把「R>1」当判据——τ ≤ γ ⇒ R ≥ 1 按构造恒成立，不可证伪（55-review H-F03）。"
falsification: "若在**冻结主干 + 树 / 多候选 + 置信加权**这条免费路线上，没有任何配置能把 τ 抬到显著高于单 argmax 直接头（超过预登记接受率门 / 0.014 噪声带）且质量不越带 ⇒ 判「概率多候选 / 树 + 置信加权组合」（6.2.2）在本尺度不成立；若冻结主干挂头本身扰动主干（Δbpc 越带）⇒ 判「草稿头应免费」（6.2.1）的前提失败；若温度>0 与 batch>1 下 τ 排序翻覆、给不出稳定结论 ⇒ 判该尺度下 τ 不可作硬指标。"
failure_analysis: ""
conclusion: "已有本地读数（旧格 H1/H3/H4/H5 迁入，按 55-review 修正旧口径）：(a) **草稿头零税**——冻结 13M 主干挂跳跃头 Δbpc = 0.0000（1.4836→1.4836，冻结断言 grad is None 通过），坐实「应免费、不动主干」；(b) **顺序前向次数确实降**——tokens-per-forward 2.37–2.40（13M 与 100M），τ 随 γ 上升；(c) **每 token 等效 FLOPs 恒 > 1**（R = 1.065–1.268，13M/100M 都 >1）——这是范式定义性质（用更多并行算力换更少顺序前向），**不是「亏损发现」**；旧格把解析恒真的 R>1 当主判据已剔除；(d) **草稿组合**：部署 regime 下 direct ≈ combined（配对差 95% CI 含 0，不可排序）> chain（显著更差，τ 1.58/1.54/1.20 @53.9M），但在完全 in-distribution 的真实文本前缀上 chain 反而更高 ⇒ 该排序是**前缀 regime 依赖**的，且预登记 cross-K 判据（chain@4 ≥ direct@1）已触发「树可能翻转」，**完整树 / 多候选实验尚未做**；(e) **批量验证**在 13M 可用且发出流与逐步贪心逐位一致，@100M fp 平局翻转（1/400 token）使逐位相等不可作跨规模判据；(f) 旧头条「恒为算力亏损」「税效比全项目最好」两个口径均已判定错误（前者 R>1 解析恒真、后者依赖本机不可稳定复现的墙钟），不再采纳。**主判据（冻结主干 + 树 / 多候选 + 置信加权下 τ 抬多少、质量是否越带）待 6.2.2 补跑**，故 status = 进行中。"
conclusion_review: "本项按 55-review H-PROBLEMS 重写后 status = 进行中：旧格把「每步输出位置数」这一**手段**当 topic（H-F01）、把解析恒真的 R>1 当主判据（H-F03）、并用联合训练的 +0.041 税顶掉「MTP 免费」前提（H-F04），三处已改入正文；H3 的核心设计（概率多候选 + 树 + 置信加权）被简化成单 argmax + 固定 λ=0.5、树 / 多候选整条未做（H-F02/H-F05），故把它立为本项 WP `6.2.2` 并写明「必须补回设计」；「恒为算力亏损」「税效比最好」两个旧头条已剔除。判据以等效理论量记，墙钟不进判据。本项尚无独立复核，独立复核未做。"
