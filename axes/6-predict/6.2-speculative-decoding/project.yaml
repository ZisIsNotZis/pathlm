argument: "命题从「一次前向输出几个位置」改成「能否抬高 τ、压低每 token 顺序前向次数，并由质量-代价前沿判值不值」（H-F01）。逻辑链：spec 的硬指标是 τ 与顺序前向次数，不是 FLOPs——R=(1+γ)/(1+τ) ≥ 1 由 τ ≤ γ 解析恒成立，拿它当判据不可证伪（H-F03）；「MTP 免费」已有本地证据（冻结主干挂头 Δbpc = 0.0000），故主线必须走免费路线而非联合训练的付费基线（H-F04）；草稿组合的核心自由度是**用概率加权**（出资人写出的路径概率加权式），固定 λ=0.5 把「好分布」与「坏分布」等权混合在数学上注定退化到 ≈direct，不能据此判「组合无价值」（H-F02/I4）；因此 6.2.2 重立为「概率多候选 / 树」并保留 cross-K「树可能翻转」的预登记判据（H-F05）。"
gaps:
  - "主判据未测（WP 6.2.2）：冻结主干 + 树 / 多候选 + 置信加权组合下 τ 抬多少、质量是否越带，从未端到端跑"
  - "τ 稳健性（H-I1）：只在 γ=2、单一规模（13.4M/53.9M）、单任务（enwik8 char 级强局部先验）、温度 0、batch=1 上测；无低局部先验对照（SCHEMA.md §19）、无温度>0 拒绝采样、无 batch>1"
  - "无 pareto frontier（H-I2）：只有孤立点（γ=2 的 τ/R/税），未沿代价轴（γ、头规模、冻结 vs 联合、树宽度）扫描形成前沿"
  - "无干净的端到端加速证据（H-I3/H-I8）：唯一墙钟读数自我宣告在本机外部占用下不可稳定复现，不作为判据"
  - "更大规模（≥1B）复核缺失：τ 的规模依赖只覆盖 13M/53.9M 两点；100M 只对 probe 式头测过零税，jump head 的 @100M 零税未测（H-S4 的张冠李戴已拆开）"
  - "2510 的 B2 权重已不可得（`.tmp/` 已清），头条税 +0.041 不可重跑、只能引用原件（H-S2）"
  - "「整段（扩散式并行）」原为 H1 的越界选项，已移出本项、归 6.3（H-S5）"
cost_model: "等效理论量：一次前向送 1+γ 个位置、产出 1+τ 个 token ⇒ 每 token 等效 FLOPs = (1+γ)/(1+τ)（以 native 逐 token 的 1 次 width-1 前向为单位；本仓实测 1.07–1.27，两规模都 >1）；tokens-per-forward = 1+τ（本仓实测 2.37–2.40）；草稿头的 layer-passes 只加在头顶部的 d×d 变换上、不重跑主干。考虑 pipelining：验证复用同一次全深度前向、batch 内 1+γ 个位置并行，故每轮的顺序依赖次数 = 生成 token 数 /(1+τ)。"

