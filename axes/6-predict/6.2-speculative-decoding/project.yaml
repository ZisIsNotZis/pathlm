argument: "命题从「一次前向输出几个位置」改成「能否抬高 τ、压低每 token 顺序前向次数，并由质量-代价前沿判值不值」（H-F01）。逻辑链：spec 的硬指标是 τ 与顺序前向次数，不是 FLOPs——R=(1+γ)/(1+τ) ≥ 1 由 τ ≤ γ 解析恒成立，拿它当判据不可证伪（H-F03）；「MTP 免费」已有本地证据（冻结主干挂头 Δbpc = 0.0000），故主线必须走免费路线而非联合训练的付费基线（H-F04）；多候选 / 树的机制是「把位置 N+2 的候选集从 1 个扩到 K 个、用同一次前向精确验证」——它只可能把 α₁ 抬到候选集覆盖率（实测抬 **+0.06…+0.13**，与 2632 探针的 recall@k 同量向），代价是 K 倍并行 FLOPs（边际收益随 K 递减）；而草稿组合的核心自由度是**用概率加权**（出资人写出的路径概率加权式），固定 λ=0.5 把「好分布」与「坏分布」等权混合在数学上注定退化到 ≈direct，**实测也确实不可与路径概率加权区分**（Δα₁ ≤ 0.005、CI 含 0）——但不能据此判「组合无价值」（旧 2631 的该读法已判答非所问，H-F02/I4）。"
gaps:
  - "温度>0（拒绝采样）与 batch>1 的稳健性点未跑：τ 只在温度 0、B=1 上测（H-I1）"
  - "二级条件树未做：位置 N+3 以被接受的 N+2 候选为条件需新条件头 + 重训（共享 `pathlm/**` 改动，已上报 Main；最小 patch 描述见 `.scratch/63-axis6-predict/TICKET.md` §5）"
  - "53.9M 只跑了 3 臂（native / direct1 / tree_direct_k2），是规模点而非完整结论；更大规模（≥1B）无读数，且 100M 只对 probe 式头测过零税、jump head 的 @100M 零税未测（H-S4）"
  - "多候选的代价口径是本实现「K 行平铺」上界（每轮 3K 个主干位置）；节点共享树（≈2K+1）与真树注意力验证未实装量测"
  - "无低局部先验对照（harness/SCHEMA.md §19）：enwik8 char 级强局部先验，τ 水平不得外推（H-I1）"
  - "无 pareto frontier（H-I2）：只有孤立点（γ=2 的 τ/R/税），未沿代价轴（γ、头规模、冻结 vs 联合、树宽度）扫描形成前沿"
  - "无干净的端到端加速证据（H-I3/H-I8）：唯一墙钟读数自我宣告在本机外部占用下不可稳定复现，不作为判据"
  - "2510 的 B2 权重已不可得（`.tmp/` 已清），头条税 +0.041 不可重跑、只能引用原件（H-S2）"
  - "带驱逐（window>0 / anchors>0）的树验证未实装（`2640/spec_tree.tree_forward` 对 window>0 抛 `NotImplementedError`）：门禁 / 失败模式目录里的这一项**未测**，下一步最小实验 = 在实验侧另写驱逐感知的行级掩码并给出与 `decode(window=64)` 的逐位一致性，成本约 20–30 min（CPU 写码 + 单 prompt GPU 复跑）"
  - "对抗臂（`adv_random_k4` / `adv_bottomk4`）只在 13m_s0/13m_s1 跑过；53.9M 的对抗点未跑（单臂 12 prompt × 200 token ≈ 1.5 min GPU）"
  - "K>4 的候选来自同一 `pw_mix.q` 分布族（K 同族），跨头联合只测到 K≈3–6；更大 K 或换分布族的边际曲线未扫"
  - "「整段（扩散式并行）」原为 H1 的越界选项，已移出本项、归 6.3（H-S5）"
cost_model: "等效理论量：一次前向送 1+γ 个位置、产出 1+τ 个 token ⇒ 每 token 等效 FLOPs = (1+γ)/(1+τ)（以 native 逐 token 的 1 次 width-1 前向为单位；本仓实测 1.07–1.27，两规模都 >1）；tokens-per-forward = 1+τ（本仓实测 2.37–2.40）；草稿头的 layer-passes 只加在头顶部的 d×d 变换上、不重跑主干。考虑 pipelining：验证复用同一次全深度前向、batch 内 1+γ 个位置并行，故每轮的顺序依赖次数 = 生成 token 数 /(1+τ)。"

