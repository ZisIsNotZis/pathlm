# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "6.3.2"
axis: "6 预测轴"
title: "一次性批量 pad 填充（填空式）"
dir: "axes/6-predict/6.3.2-pad-fill"

purpose: "一段文本里若已知布局、只有少数位置待生成（补全 / 填空场景），逐 token 自回归仍要按左到右顺序生成，顺序前向次数等于待生成数。本项要判定：训练成「一次前向把所有待填位置填出来」的填空式模型，能否把顺序前向次数压到 1，以及它相对全因果 AR 的质量代价形状。"
innovation: "相对普通 decoder-only transformer 的逐位置因果 AR 目标，训练时按比例 r 随机把位置替换为 PAD、被 PAD 位置的损失照算，且**被填位置之间在同层互相可见**（填空视图、非因果）；推理时给含 PAD 的序列一次前向把所有 PAD 位置填出。改动量级：只改 attention 可见性与损失位置集，不新增参数（与 6.3.1 的 K=1 特例共享同一目标）。"
expected_effect: "（a）tokens-per-forward = 一次填出的 PAD 数，整段顺序前向次数 ≈ 1；（b）质量代价 = 被填位置无法条件于彼此（同层并行、无左到右条件），须以全因果 AR 为 100% 量化；（c）代价 = 需要预知 PAD 布局（长度 / 掩码），且单步无迭代修正（错一次不能回头），故必须在同 token 预算下与 AR 及 6.3.1 的 K>1 去噪同框。"
sota_baseline: "填空 / 非自回归生成族：Mask-Predict 与非自回归翻译、FIM（fill-in-the-middle）、BERT 式 masked LM，以及掩码扩散在 K=1 时的特例（外部条目来源标 `记忆·未核`，只作设计方向、不作判据；情报入口 `archive/wiki-legacy/axes/H-horizon/PRIOR_ART.md` §H2）。本地锚 = 同尺寸 stock 全因果 AR（归一为 100%）。"
gap: "本仓零经验（MAPPING §2 无旧格）。增量 = 在同尺寸 stock 主干、同 token 预算下，把「一次填空（K=1）」与全因果 AR、以及 6.3.1 的「K 步去噪」放在同一质量-代价前沿上，量化**一次并行填充**的质量代价随 PAD 比例的形状；不是重造 masking 目标本身。"
method: "单因素：固定主干 / 数据 / token 预算，只改「PAD 比例与可见性」。臂 = {stock 因果 AR, 一次性 pad 填空（PAD 比例 r∈{10%,25%,50%}，双向可见）, 因果填空（PAD 只可见左侧，作「可见性」对照）}。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 同尺寸 stock 全因果 AR（归一为 100%）+ 因果填空臂（可见性对照）；客观判据 = 序列级 bpc（质量，该不跌 / 该跌）+ tokens-per-forward（一次填出的位置数，该涨）+ 每 token 等效 FLOPs（代价轴，如实报）+ 每 token 顺序前向次数（该跌）；口径 = matched-step / 同 token 预算，禁墙钟；必须不变 = 未填位置的因果性（不得让被填位置看到未来真值）、评测口径与 AR 同框。"
objective_criteria: "该涨：tokens-per-forward（一次前向填出的位置数）；该跌：每 token 顺序前向次数；该不跌：序列级 bpc（相对全因果 AR，须越 0.014 噪声带才算可排序）；必须报：每 token 等效 FLOPs（随 r 变化）；必须不变：未填位置的因果性、评测口径与 AR 同框。 用哪个带（C1 裁决）：bpc 口径用 0.014 bpc 带（限配对 Δ、≥5 窗口）；tokens-per-forward 等率类指标走配对 bootstrap / Wilson 95% CI、**不跨量纲借用** 0.014。"
falsification: "若在 matched-step、同 token 预算下，一次性 pad 填空的序列级 bpc 相对全因果 AR 越噪声带恶化且随 PAD 比例 r 单调恶化、因果填空臂又救不回 ⇒ 判「一次填充」（K=1 并行填充）在本尺度 / 本任务上不成立。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
failure_analysis: "结论含「手段不成立」成分 ⇒ 归因：**设计/结构为主，不是 baseline 错**。设计 = 「一次前向并行填出全部 PAD」这一出口把被填位置之间的条件依赖整体删除（被填位置互相不可见），在本任务上代价 +1.07…+2.37 bpc（相对 AR 在同一批位置上）；结构 = 双向可见虽有独立正增益（bidir 优于 causal 0.1635 bpc），但**不足以补回删掉的条件依赖**（两种仍远越带）。**保留的正面结论**：可见性的方向性对（双向优于纯因果），且「不受未来泄漏」的仪器可失败、成立。未查清项 = 为什么 r=0.25 的代价小于 r=0.10 与 r=0.50（非单调），登记为下一步最小实验，不作为归因依据。"
conclusion: "本地判决（WP1 = `experiments/2671-padfill-13m`，S = 1500 的**快照口径**、只读臂间增量与排序；同 harness、同 token 预算、唯一变量 = 注意力可见性 + 损失位置集；n≥2 = 模型种子 {0,1}）：(a) **一次性填充的质量代价巨大且可分**——在同一批待填位置 `M_r` 上（bpc 越低越好，Δ = 填空 − 全因果 AR 在同一 `M_r` 上的 teacher-forced bpc），`fill_bidir_r10` **+2.1453** [+2.0400, +2.2500]、`fill_bidir_r25` **+1.0726** [+1.0034, +1.1455]、`fill_bidir_r50` **+2.3735** [+2.2821, +2.4720]、`fill_causal_r25` **+1.2362** [+1.1822, +1.2903] ——block 聚类配对 bootstrap 95% CI **全部不含 0 且全部远越 0.014 bpc 参考带**；参照 = AR 全位置 teacher-forced bpc 2.2704（快照刻度；收敛档 ≈1.4836 见 6.2 的 `2610-frozen-trunk-jumphead-13m`——不同步数档，仅作方向参照）。(b) **r 形状不单调**：Δ 随 r ∈ {10%,25%,50%} 走成 +2.1453 → +1.0726 → +2.3735，**r=0.25 的代价最小** ⇒ 预登记否证条件里「随 PAD 比例单调恶化」这一子条件**未满足**（原因未查清，已入 gaps），故该否证条件整体**未触发**，判词按各臂分判而非一刀切。(c) **可见性有独立增益**：`fill_causal_r25` − `fill_bidir_r25` = **+0.1635** [+0.1096, +0.2140]（CI 不含 0）⇒ 同层互相可见（填空视图）确实换来质量，但**两种都远差于 AR**。(d) **硬门通过**：把 `M` 位置真 token 扰动后该位置 logits 逐位不变（`max|Δ| = 0.0`），且 gate probe 两条均变红（仪器可失败）⇒ 「不受未来泄漏」这条不变量成立。(e) 代价面（如实报、不作判据）：tokens-per-forward = |M| ≈ r·T、每 block 顺序前向次数 = 1（AR 为 T−1）、每生成 token 等效 FLOPs ≈ L/r（AR = L）。(f) 未测：PAD 布局的随机 vs 后段连续、与 6.3.1 的 K≥2 连续过渡、更大规模；`L5` 的**确定性未取得独立验证**（本 revision 未拿到 GPU 锁重跑，`results.json::L5` 的两项为 None，如实登记为「未通过 / 未验证」，不得读成通过）。"
conclusion_review: "自评：本项从「零读数」推到「有判决」——一次性填充在本快照刻度上质量代价 +1.07…+2.37 bpc（CI 不含 0、远越 0.014 带，AR 同位置参照 2.2704），可见性有独立正增益但不足以补回，`不受未来泄漏` 硬门通过；**r 形状不单调**，故预登记否证条件未整体触发、按臂分判。判词只在本设定内成立（S=1500 快照 / char enwik8 / 12.8M 结构 / 双 seed），不外推。**当前（最后一轮）独立复核判词**：`.scratch/63-axis6-predict/REVIEW-C2-FINAL.md`（本轴派发的 fresh 复核、未参与写作、只读、带 shell；判 **VERDICT: PASS**，blocker 0 · normal 1【本指针命名缺陷，即本处修复】· info 2；其独立复算见该报告）。**残余缺口（如实登记）**：`L5` 确定性未获独立验证（未取得 GPU 锁重跑，两项为 None）；r 非单调原因未查；PAD 布局只测随机位置；与 6.3.1 的 K≥2 过渡、更大规模未测——见 `gaps`。"
experiments:
  - "axes/6-predict/6.3.2-pad-fill/experiments/2671-padfill-13m"
argument: "填空式生成把「条件依赖」全部删掉：被填位置互相不可见，质量只能靠上下文与位置先验补；因此它的质量代价必然随 PAD 比例 r 上升，而代价面（每 token 等效 FLOPs = L/r）随 r 下降。这条「质量-代价」权衡曲线正是本项要测的东西，而不是只报一次填充的 bpc。与 6.3.1 的关系是 K=1 的特例边界：K 从 1 增加即从一次填空变成迭代去噪。"
gaps:
  - "r 形状不单调（r=0.25 代价最小）的原因未查清：下一步最小实验 = 用同一 harness 扫更密 r 网格（0.05–0.75）并同时报训练 mask 密度与评测位置密度的分解，成本 ≈3 min/点 GPU"
  - "`L5` 确定性未获独立验证（未取得 GPU 锁重跑，`results.json::L5` 两项为 None）；补做成本 = 一次同 seed 重跑 ≈3 min GPU"
  - "本项在 **S = 1500 快照口径**可判，与仓库既有 6000 步档不可比；收敛刻度下代价是否缩小未测"
  - "PAD 布局的两种情形（随机位置 vs 后段连续）未分开"
  - "与 6.3.1（K≥2 去噪）的连续过渡未在同一实验里扫"
cost_model: "等效理论量：一次前向处理全段 T 个位置（layer-passes = L × T），一次填出 N = r·T 个 PAD 位置 ⇒ tokens-per-forward = N、每生成 token 等效 FLOPs = L × T / N = L / r（以 AR 每 token 的 L 为单位）；每 token 顺序前向次数由 1 降到 1/N。考虑 pipelining：被填位置在全段一次前向内互相并行，整段顺序依赖只剩 1 段。"

