argument: "位置相关宽度与窗口/可见结构是两件事：窗口改「位置能看到谁」，本项改「位置用多少通道」，因此本项不改 attention mask、只改每位置的宽度子网络，判据须与时间轴分开记。窄段等于给该位置减容量，可能专挑长程关键位置下手，故必须同时报长程召回，否则会把「局部平滑」误当成无损。"
gaps:
  - "本仓零经验：需先做最小判决（13M、{同宽, 前宽后窄, 前窄后宽, 位置 gate} 四臂，对齐总预算，报 clean bpc + 每 token 平均激活通道数 + 长程召回）"
  - "「位置」的定义未定（绝对位置 vs 距离近端/远端 vs 内容分区），需在最小判决里定一个默认再扫"
  - "与 `3.1.2`（沿深度分配）的记账重叠须由 integrator 核一遍"
cost_model: "等效理论量：layer-passes 每 token 仍为 L；每 token 平均激活宽度 d̄ < d ⇒ 每 token 等效 FLOPs 按 (d̄/d)² 缩放；tokens-per-forward 每步 1。考虑 pipelining：同层内位置宽度不同属同一前向内的掩码/gather 差异，不引入额外顺序依赖；按位置段报每段每 token 的 FLOPs（不用任何时间量）。"

