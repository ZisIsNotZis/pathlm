# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "3.1.3"
axis: "3 宽度轴"
title: "同层内位置相关宽度：前 1024 与后 1024 意义不同"
dir: "axes/3-width/3.1.3-position-width"

purpose: "普通 decoder-only transformer 在同一层里对**每个位置**用同样宽度，不管该位置在序列中的角色（近端/远端、query/被查）。本项要判定：在同一层内按位置给不同宽度（如前 1024 位置用宽通道、后 1024 用窄通道，或反过来），能否在给定质量下降低每 token **平均**等效算力，并放进以 stock 同层同宽为 100% 的质量-代价前沿。"
innovation: "相对普通 decoder-only transformer 的同层同宽，令同一层内不同位置走不同宽度的子网络：按位置分段的宽度 schedule，或位置相关的 gate 选宽度。改动量级：按位置分段后每 token 平均激活通道数下降（每 token 平均 FLOPs 随之下降），层数与可见集合不变。"
expected_effect: "（a）按位置分配宽度 ⇒ 每 token 平均等效算力下降；（b）代价是异质位置的容量差，须放进以 stock 等宽为 100% 的前沿；（c）本项只改宽度、不改可见集合（与时间轴 `1.1`/`1.2` 正交），也不改层数（与深度轴 `2.1` 正交）。"
sota_baseline: "位置相关容量 / 分段处理（local-global 分段模型、条件计算的位置版）。本地零经验（`.scratch/56-restructure/MAPPING.md` §2 无旧格）。本地锚 = stock 同层同宽全位置（归一为 100%）。"
gap: "本仓零经验。边界：本项只改**宽度**（每位置激活多少通道），不改**可见集合**（那是时间轴 `1.1`/`1.2`）、也不改**层数**（深度轴 `2.1`）；本项与 `3.1.2` 的区别是沿**位置**（同一层内）而非沿**深度**分配宽度。相对 SOTA 的增量在固定总预算下给「位置→宽度」映射的前沿读数。"
method: "单因素：固定层数与总 token 预算，只改同层内「位置→宽度」的映射。臂 = {stock 同宽, 前宽后窄, 前窄后宽, 位置 gate 选宽度}。基底恒为 stock decoder-only；各臂总参数/总等效算力口径对齐。"
validation: "端到端：对照 = stock 同层同宽全位置（归一为 100%）；客观判据 = clean bpc（该不跌 / 可排序，越 0.014 噪声带）+ 每 token 平均激活通道数与等效算力（该跌）+ 长程召回（防窄段丢信息，该不变 / 该跌）；口径 = 每 token 等效算力（FLOPs），**墙钟不进判据**；必须不变 = 因果性。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
objective_criteria: "该跌：每 token 平均激活通道数与等效算力；该不跌/可排序：clean bpc；必须报：长程召回（窄段损伤对照列）；必须不变：因果性与层数。"
falsification: "若位置相关宽度省下等效算力但 clean bpc 或长程召回越噪声带退化 ⇒ 判该手段在本尺度不划算；若窄段位置恰是长程关键位置、召回退化吃掉全部算力收益 ⇒ 否证。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
failure_analysis: ""
conclusion: ""
conclusion_review: "本项无旧格、本仓零经验，尚无本地判决，故 `status: 未开始`。判据与基线按 `docs/research-schema.md` 预登记（对照 + 客观判据 + 口径 + 否证条件），并把「长程召回」列为必须报的损伤对照列，以防只报 bpc 掩盖窄段丢信息。独立复核未做。"
