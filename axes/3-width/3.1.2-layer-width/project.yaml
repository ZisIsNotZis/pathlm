# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "3.1.2"
axis: "3 宽度轴"
title: "逐层宽度变化：金字塔 / 沙漏"
dir: "axes/3-width/3.1.2-layer-width"

purpose: "普通 decoder-only transformer 每一层的宽度相同，把每 token 的算力/参数均匀摊在各层上；但浅层与深层承担的角色不同。本项要判定：在总参数与总等效算力固定的前提下，把宽度按深度非均匀分配（金字塔：逐层收窄；沙漏：中段大）能否提高质量-代价前沿（以同尺寸 stock 等宽为 100%）。"
innovation: "相对普通 decoder-only transformer 的等宽层，令第 l 层的 d_model 或 FFN 隐藏宽随深度变化：金字塔（d_l 递减）、沙漏（先增后减）、倒金字塔（递增）。改动量级：总参数量按 schedule 在层间重分配，layer-passes 每 token 仍为 L。"
expected_effect: "（a）同总预算下把宽度放到最需要的深度，clean bpc 相对等宽可排序下降；（b）暴露「逐层宽度」是否是独立于「深度形状」的设计维度；（c）代价放进以 stock 等宽为 100% 的前沿，而不是只报单点 Δbpc。"
sota_baseline: "金字塔 / hourglass / 深度方向宽度 schedule 的 transformer 变体（EfficientNet 式逐段缩放思想的 transformer 版）。本地零经验（`.scratch/56-restructure/MAPPING.md` §2 无旧格）。本地锚 = stock 等宽全深度（归一为 100%）。"
gap: "本仓零经验。与 `2.3.1` 逐层容量变化（深度轴）在实现上重叠（都是「哪层大哪层小、总参数固定」），须由 integrator 核一遍表述不矛盾；本项按**宽度轴**读法（金字塔 / 沙漏）记，纯深度形状读数归 `2.3.1`。相对 SOTA 的增量不在重造 schedule，而在固定总预算下的同框前沿读数。"
method: "单因素：固定总参数与训练预算，只改每层宽度随深度的分布。臂 = {stock 等宽, 金字塔（递减）, 沙漏（中段大）, 倒金字塔（递增）}。各臂总参数逐位对齐，否则比的是参数多少而非分配方式。基底恒为 stock decoder-only。"
validation: "端到端：对照 = stock 等宽全深度（归一为 100%）+ 各臂总参数逐位对齐；客观判据 = clean bpc（序列级，该跌 / 可排序，须越 0.014 噪声带）+ 每层宽度分布（作对照列）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变 = 总参数量（各臂逐位相等）与因果性。"
objective_criteria: "该跌：clean bpc（序列级，相对 stock 等宽）；必须不变：总参数量（所有臂逐位相等）与因果性；必须报：每层宽度分布（作对照列）。"
falsification: "若非均匀宽度在固定总参数下相对等宽的 clean bpc 不越噪声带（0.014）⇒ 判逐层宽度变化在本尺度不是独立有增益的维度，本读数并入 `2.3.1` 的深度形状结论。"
failure_analysis: ""
conclusion: ""
conclusion_review: "本项无旧格、本仓零经验，尚无本地判决，故 `status: 未开始`。判据与基线按 `docs/research-schema.md` 预登记（对照 + 客观判据 + 口径 + 否证条件），把「总参数量逐位对齐」钉死以防把参数优势误读为分配优势；与 `2.3.1` 的边界写进 `gap`，待 integrator 统一。独立复核未做。"
experiments: []
argument: "等宽默认「所有深度同等重要」；本项检验该假设。判据必须钉在「固定总参数」上，否则无法把「重分配」与「单纯加参数」区分开。它与深度轴的 `2.3.1` 是同一族问题的两个记账面（宽度轴 vs 深度轴），故把边界写进 `gap`、由 integrator 统一，避免两轴对同一读数各记一遍结论。"
gaps:
  - "本仓零经验：需先做最小判决（13M、同总参数、{等宽, 金字塔, 沙漏, 倒金字塔} 四臂，clean bpc）"
  - "与 `2.3.1` 逐层容量变化的边界未整合（两研究项实现重叠）"
  - "逐层宽度 schedule 与 `2.1.1` 早退的联合（浅层宽度是否影响可截断性）未测"
cost_model: "等效理论量：各臂总参数量固定，每 token 的 layer-passes 仍为 L；若第 l 层宽 d_l，则该层 attention 与线性层 FLOPs 按 d_l² 缩放，Σ_l d_l² 与等宽臂对齐；tokens-per-forward 每步 1。考虑 pipelining：层宽不等使各层计算量不同，层间流水的最慢层决定节拍，须以每层 FLOPs 分布（而非任何时间量）评估。"

