argument: "「只激活一部分通道」是「保容量减计算」的通道粒度版：总参数不变、每 token FLOPs 下降，与减宽（3.1.1，减容量）方向相反。它必须与 MoE 区分：MoE 在专家粒度上按 token 路由，本项在通道粒度上按 token 选通道，两者记账口径（专家 vs 通道）不同，故边界写进 gap、由 integrator 统一。活性（通道使用率）是必须报的对照列，否则无法区分「真稀疏」与「坍缩到少数通道」。"
gaps:
  - "**换规模点**是本格唯一可能翻方向的动作：53.9M 档重跑 `D`/`F50`/`K50`/`L50` 四臂 × 2 seed（按分诊表 §1.1 的 ×2.5 GPU 时间换算 ≈3 h GPU + 评测），且必须**重新预登记**（0.014 带是 13M 口径）；`atlas/playbook.md` 定律 8 已记录「规模会翻转方向」的先例"
  - "**更强的选择器形态未测**：本格两轮只覆盖「无参数 `|pre|` 规则」与「低秩（r=8）乘性打分器 + 直通梯度」；Switch 式软门（`Σ p_j g_j W2[:,j]`，会改前向数值）、更大秩、Gumbel 采样都没测。最小实验 ≈10 min GPU/臂 × 2 seed，但「软门算不算只改选择信号」属框架性取舍，须先由轴 lead 裁决"
  - "`K25` 仍只有 seed 0（`2644` 留下的加和项）：补 seed 1 ≈7 min GPU/臂，只把那一档补成 n=2，不改任何判词"
  - "纸面 MACs 不是实测：`lin1` 全算的实现下不换核时真稀疏核的算力/显存收益未验（同一陷阱见 `atlas/cost-table.md` 定律 11 一节）"
  - "与专家轴 `4`（MoE）的边界未整合（专家粒度 vs 通道粒度）；本项只作 MoE 线的 13M 代理前哨，专家路由的容量与均衡代价不在本项"
cost_model: "等效理论量：总参数不变，每 token 激活通道比例 ρ < 1 ⇒ 每 token 等效 FLOPs 按 ≈ρ 缩放；layer-passes 每 token 仍为 L（层数不变）；tokens-per-forward 每步 1。考虑 pipelining：按通道 gather 属同一前向内的稀疏选择，不引入额外顺序依赖（与 MoE 的 token 级专家路由区分）。"

