# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "3.1.5"
axis: "3 宽度轴"
title: "通道极化 / 稀疏激活：只激活部分通道"
dir: "axes/3-width/3.1.5-channel-sparsity"

purpose: "普通 decoder-only transformer 每 token 激活全部通道，不管该 token 难不难。本项要判定：让每 token 只激活一部分通道（通道极化 / 稀疏激活，按 token 条件选通道子集）能否在**总参数不变**的前提下降低每 token 等效算力（保容量减计算的小尺度版），并放进以 stock 全通道 dense 为 100% 的质量-代价前沿。"
innovation: "相对普通 decoder-only transformer 的全通道激活，加一个按 token 条件选通道的机制（通道级 top-k 激活 / 门控稀疏 / 极化：一半通道常开、一半条件开），使每 token 只有部分通道参与前向。改动量级：总参数不变，每 token 激活通道数下降 ⇒ 每 token 等效 FLOPs 按激活比例下降，层数不变。"
expected_effect: "（a）每 token 等效算力下降（激活通道数下降）；（b）代价是「只激活一部分」可能掉质量，须放进以全通道 dense 为 100% 的前沿；（c）与专家轴 `4`（MoE）划界：MoE 是 FFN 层的 token 级专家路由，本项是**通道粒度**稀疏激活。"
sota_baseline: "稀疏激活 / 条件计算（MoE 的细粒度激活、Mixture-of-Depths 类条件计算、可选激活的稀疏化）。本地零经验（`.scratch/56-restructure/MAPPING.md` §2 无旧格）。本地锚 = stock 全通道激活 dense（归一为 100%）。"
gap: "两轮已出本地读数（`2644` 四臂、`2687` 四臂），本仓不再是零经验；相对 SOTA 的增量在固定总参数下给「激活比例 × 选择信号 → (算力, 质量)」的两档前沿读数。边界：与专家轴 `4`（MoE）区分——MoE 是**专家粒度**的 token 级路由（归 `4.1`/`4.3`），本项是**通道粒度**稀疏激活；两项须由 integrator 核不重叠、不重复表达。"
method: "单因素：固定总参数与训练预算，只改每 token 激活的通道比例。实跑臂 = {`D`（stock 全通道 dense 锚，复用 `2641` 的 `U4-s0`）, `K50`/`K25`（按 `|pre-activation|` 逐 token 选 512/256 通道，选择器无参数）, `F50`（固定常开前 512 通道，无条件性对照）}；预声明的「门控稀疏」与「真极化」未测，替换关系与判词范围见 `conclusion`（e）。基底恒为 stock decoder-only；各臂总参数逐位对齐 6 962 688。"
validation: "端到端：对照 = stock 全通道 dense（归一为 100%）；客观判据 = clean bpc（该不跌 / 可排序，越 0.014 噪声带）+ 每 token 平均激活通道比例与等效算力（该跌）+ 活性（通道使用率分布，防坍缩）+ 第二轮的选择器活性（打分器相对位移与逐位置选择翻转率，含 Wilson 95% CI）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变 = 总参数量与因果性。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；通道使用率 / 选择翻转率等率类指标走配对 CI、不跨量纲借用 0.014。第二轮另加三支：G1 活性门 → G2 主判 Δ(可学习选择器 − 无参数规则) → G3 前沿门 Δ(可学习选择器 − dense / 固定前缀)；预登记映射按 G1/G2/G3 落三支标签，实测 G2 落带内 ⇒ 映射输出 =「本尺度不可判」（`results.json::verdict_branch.code` = `inconclusive_at_this_scale`），「机制不成立 = 是」是 G3 支配面的映射外补充判读。"
objective_criteria: "该跌：每 token 平均激活通道比例与等效算力；该不跌/可排序：clean bpc；必须报：通道使用率分布（活性 / 坍缩对照列）；必须不变：总参数量与因果性。"
falsification: "若通道稀疏激活相对 dense 的质量代价吃掉全部算力收益（等参数下不占前沿优势）⇒ 判在本尺度不成立；若通道使用率坍缩到少数通道（活性消失）⇒ 判该机制失效（`harness/SCHEMA.md` 的活性判据）。 用哪个带（C1 裁决）：clean bpc 差用 0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；通道使用率 / 激活比例等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
conclusion: "可学习通道选择器本地结论（实验 `2687`，13M / L=8 / 12k 步 = 98 304 000 token / matched-step；四臂 `D`/`K50`/`F50`/`L50` 都带同一个低秩打分器模块（每层 `A[d,8]`+`B[8,H]`，B 零初始化）⇒ 总参数逐臂逐位 7 044 608、每 token MACs 逐位（`L50` = `K50` = 6 426 112 = dense 的 ×0.860）；`L50` 两 seed，`D`/`K50`/`F50` 复用 `2641`/`2644` 的 checkpoint 并在本实验同一代码路径（= 最终绑定代码）上重评、五个读数与落盘值 4dp 相同，七份臂级读数同 `run.py` 哈希 `2e87bc…` 且都晚于最后一次绑定）：**上一轮判的「条件性有害」不是「无参数选择器」这个实现的毛病——给选择器参数、给它训练信号与负载均衡项、并让选择几乎全部位置都改选之后，条件选通道仍然不在等预算前沿上。**（a）**G1 活性门过（两 seed）**：打分器相对 L2 位移 4.0768 / 3.9599（门槛 0.01），与初始打分器相比的逐位置选择翻转率 0.998228 / 0.999979（门槛 0.05，Wilson 95% CI [0.998124, 0.998327] / [0.999964, 0.999987]）⇒ 「它没被训练动所以没用」这条解释被排除；`B ≡ 0` 起步使初始选择集与 `K50` 逐位相同（单测钉住），所以这一臂确实是「同一份预算、只是被训练」。（b）**G2 主判（`L50` − `K50`，同 k=512、同每 token 6 426 112 MACs、同 7 044 608 参数）**：s0 **+0.0087**、s1 **+0.0028**，两 seed 同号但都落 0.014 带内（0.62× / 0.20× 带）⇒ 按预登记这一档**不可排序**：可学习选择器既没有把条件性从负收益救回来，也没有可分辨地更差。（c）**G3 前沿门**：`L50` 相对 dense 锚（1.5314）= **+0.1068**（s0；s1 用同一锚算 +0.0977，是臂间差、不是配对差，口径见实验 `analysis.md` §3.3）、相对固定前缀 `F50` = **+0.0704 / +0.0666** ⇒ 4.8–7.6 倍带、两 seed 同向。（d）**三个标签的归属（哪一支是预登记映射的输出、哪一支是映射外补充）**：**预登记映射给出的是「本尺度不可判」（只对两实现排序）**——映射的 `mechanism_refuted` 分支要求 G2 可排序更差，实测 G2（`L50`−`K50`）两 seed 都落 0.014 带内 ⇒ `results.json::verdict_branch.code` = `inconclusive_at_this_scale`，这是映射唯一的输出；**「本实现不成立」= 否**（换实现后选择被改写 99.8%、前沿位置没变 ⇒ 上一轮的负结论不是「无参数」这一个实现的毛病）；**「机制不成立」= 是（本尺度、等预算前沿意义上）是 G3 支配面的映射外补充判读**（不是映射的输出；n=2、两 seed 同向，`L50` 相对固定前缀 `F50` 越带 5.0×/4.8×，而 `F50` 同 7 044 608 参数、每 token 更省算力；相对 dense 锚亦越带，其中含 14% 算力的容量税）⇒ 这条路径在本尺度不值得继续，且**不外推**到更大规模（`2644` 的 `gap` 与 `atlas/playbook.md` 定律 8 都提醒规模会改方向）；**「本尺度不可判」= 只对 `L50` 与 `K50` 的排序**，所需条件**不是更多 seed**（按 σ 外推 `n_seeds_needed` = 1，正说明 0.014 是本仓 13M 跨 run 的漂移界而不是标准误），而是换带（预登记的配对 CI，需新契约）或换规模（53.9M 八臂 ≈3 h GPU）。（e）**坍缩门未命中**：`L50`/`K50` 的逐 token 选择一致率 `mode_set_share` = 0.0（Wilson 95% CI 上界 6e-06）、使用熵 `H/logH` = 0.988–0.993（坍缩端 0.900）⇒ 两臂都确实逐 token 换通道，上表的更差不是「选了个寂寞」。（f）**负载均衡项活着但弱**：`aux` 在已训权重上 1.0493 / 1.0265（完美均匀 1.0），加权到 loss 上 0.0105 / 0.0103 ⇒ 选择的改写主要来自直通的任务梯度，本条**不把 `aux` 当独立可归因因素**。判据带：clean bpc 用 0.014 带（限配对 Δ）；选择翻转率/一致率/熵走 Wilson 95% CI 与 batch 聚类 bootstrap，不跨量纲借用。装置披露：`L50` s0 的 12k 步训练跑完后、评测端连撞三处缺陷（设备对齐 ×2、键名适配 ×1），逐条修好并显式重绑后重跑读数，**判据线与判据常数一字未改**（见实验 `analysis.md` §7）。验收并列读法（C2 裁决）：milestone 预登记文字（各臂总参数逐位相等；稀疏相对 dense 的质量代价与算力节省同框可分、或明确「不可分」；通道使用率齐备且非坍缩；结论不越尺度）**字面成立**（参数逐臂 7 044 608、Δ(`L50`−`D`) +0.1068 越带、Δ(`L50`−`K50`) +0.0087/+0.0028 明确落带内、`mode_set_share` 0.0 且 `H/logH` 0.988–0.993、外推限制写在本字段与 `gaps`）；其实质（不被同算力最强基线支配）**否证**——`L50` 被 `F50`（同 7 044 608 参数、无条件固定前缀）**支配**：`F50` 每 token 5 377 536 MACs（dense 的 ×0.719433，比 `L50` 的 ×0.859716 再少 16.3%）而 Δ(`L50`−`F50`) = +0.0704 / +0.0666（5.0× / 4.8× 带、两 seed 同向，正 = `L50` 更差）⇒ 本格不满足「不被同算力的朴素方案支配」这条实质验收。"
conclusion_review: "自评：四臂的唯一差别是「选择信号」以及「这份选择器预算是否被训练」（同一个打分器模块四臂都在，总参数逐臂逐位 7 044 608、每 token MACs 逐位；`L50` 从 `|pre|` 规则起步且这一点由单测与评测期两列翻转率交叉钉住）；判据线 G1/G2/G3 与判决映射预登记在读数之前（`prereg_binding.json`），且三次装置修复都没碰判据线与判据常数。局限：主判 n=2、matched-step（`L50` 末窗斜率 +0.0040～+0.0059 /1k 步，与 `2644` 的 `K50`/`F50` 同量级）、打分器形态受限、负载均衡项实际很弱 ⇒ 「可学习选择器」这一族的强形态（软门/更大秩/Gumbel）未被覆盖；`L50` vs `D` 的 s1 差是臂间差（dense 锚只有一条 s0 读数）不是配对差。`results.json::verdict_branch.text` 是 `aggregate()` 里预登记时就写好的模板句，它把「带内」说过头了（带内只适用于 `L50` vs `K50`；`L50` vs `D`/`F50` 越带 4.8–7.6 倍）——`verdict_branch.code` 与预登记映射一致，实质读法以实验 `analysis.md` §3.3 / §5 为准；`conclusion`(d) 已把「机制不成立 = 是」标成 G3 支配面的映射外补充判读（映射本身只给「本尺度不可判」），两处不冲突。独立复核：已做（fresh 上下文、未复用执行侧上下文，按 `harness/SCHEMA.md` §14b 排在执行之后），判 `OK with notes`；发布前须修的两条 P1（判词归属、五支复用读数的定序）已处置——归属见本字段上一条（d），定序见实验 `analysis.md` §1 / §7（五支在最终绑定代码上重跑、与第一遍读数逐字段相同）。"
failure_analysis: "**`WP2` 的假设（给选择器参数与训练信号就能把「条件选通道」救回等预算前沿）在 13M / 12k 步这一格被本地证据否证**，归因按三类分开：① **结构问题（主因）**：把每 token 参与的通道砍到一半，等于把 FFN 的有效宽度砍半——`2644` 已记录「FFN 隐藏比减半」本身要 +0.0395 bpc、它的 `F50`（保参数、固定前缀）也要 +0.0364 ⇒ 本格四臂都先继承了这笔容量税；而「选哪一半」的杠杆（`K50` vs `L50` = +0.0087/+0.0028，带内）远小于「是否保留全部通道」（+0.07～+0.11，越带 5～7.6 倍）。② **设计问题（次因，已量化）**：本条的打分器是低秩（r=8）、无偏置、乘性作用于 `|pre|` 的形态，梯度只经直通 top-k 与负载均衡项；均衡项在近均匀使用下几乎无梯度（`aux` 1.03–1.05、加权 0.010）⇒ 可测的只是「低秩乘性打分器 + 直通梯度」这一族，不是「任意可学习选择器」。③ **innovation 本身失败（在本尺度）**：条件性没有独立收益——两种条件实现相对固定前缀（同参数、更省算力）都越带更差、相对 dense 锚也越带更差（其中含 14% 算力的容量税）⇒ 这条路径在本尺度不值得继续。**不是实现问题**：等值门、变异门、参数同量、嵌套恒等（`L50` 初始选择集 = `K50` 逐位相同）、直通前向精确、键名适配、因果性、复现门（五支复用臂在最终绑定代码上重跑，与第一遍读数逐字段相同、唯一差异是 `code_hash_run_py`）八道门全绿，活性门显示选择被改写 99.8%。"
