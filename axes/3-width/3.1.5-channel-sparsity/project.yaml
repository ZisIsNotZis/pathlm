# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "3.1.5"
axis: "3 宽度轴"
title: "通道极化 / 稀疏激活：只激活部分通道"
dir: "axes/3-width/3.1.5-channel-sparsity"

purpose: "普通 decoder-only transformer 每 token 激活全部通道，不管该 token 难不难。本项要判定：让每 token 只激活一部分通道（通道极化 / 稀疏激活，按 token 条件选通道子集）能否在**总参数不变**的前提下降低每 token 等效算力（保容量减计算的小尺度版），并放进以 stock 全通道 dense 为 100% 的质量-代价前沿。"
innovation: "相对普通 decoder-only transformer 的全通道激活，加一个按 token 条件选通道的机制（通道级 top-k 激活 / 门控稀疏 / 极化：一半通道常开、一半条件开），使每 token 只有部分通道参与前向。改动量级：总参数不变，每 token 激活通道数下降 ⇒ 每 token 等效 FLOPs 按激活比例下降，层数不变。"
expected_effect: "（a）每 token 等效算力下降（激活通道数下降）；（b）代价是「只激活一部分」可能掉质量，须放进以全通道 dense 为 100% 的前沿；（c）与专家轴 `4`（MoE）划界：MoE 是 FFN 层的 token 级专家路由，本项是**通道粒度**稀疏激活。"
sota_baseline: "稀疏激活 / 条件计算（MoE 的细粒度激活、Mixture-of-Depths 类条件计算、可选激活的稀疏化）。本地零经验（`.scratch/56-restructure/MAPPING.md` §2 无旧格）。本地锚 = stock 全通道激活 dense（归一为 100%）。"
gap: "本仓零经验。边界：与专家轴 `4`（MoE）区分——MoE 是**专家粒度**的 token 级路由（归 `4.1`/`4.3`），本项是**通道粒度**稀疏激活；两项须由 integrator 核不重叠、不重复表达。相对 SOTA 的增量在固定总参数下给「激活比例 → (算力, 质量)」的前沿读数。"
method: "单因素：固定总参数与训练预算，只改每 token 激活的通道比例。臂 = {stock 全通道, 通道 top-k 激活, 门控稀疏, 极化（一半常开/一半条件开）}。基底恒为 stock decoder-only；各臂总参数逐位对齐。"
validation: "端到端：对照 = stock 全通道 dense（归一为 100%）；客观判据 = clean bpc（该不跌 / 可排序，越 0.014 噪声带）+ 每 token 平均激活通道比例与等效算力（该跌）+ 活性（通道使用率分布，防坍缩）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变 = 总参数量与因果性。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；通道使用率等率类指标走配对 CI、不跨量纲借用 0.014。"
objective_criteria: "该跌：每 token 平均激活通道比例与等效算力；该不跌/可排序：clean bpc；必须报：通道使用率分布（活性 / 坍缩对照列）；必须不变：总参数量与因果性。"
falsification: "若通道稀疏激活相对 dense 的质量代价吃掉全部算力收益（等参数下不占前沿优势）⇒ 判在本尺度不成立；若通道使用率坍缩到少数通道（活性消失）⇒ 判该机制失效（`SCHEMA.md` 的活性判据）。 用哪个带（C1 裁决）：clean bpc 差用 0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；通道使用率 / 激活比例等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
conclusion: "通道稀疏激活本地结论（实验 `2644-channel-sparsity-13m`，13M / L=8 / 12k 步 = 98 304 000 token / seed 0 / matched-step，总参数逐臂逐位相同 6 962 688）：**「保参数、每 token 只算部分 FFN 通道」在本尺度是真实但很贵的旋钮，而把「算哪部分」交给逐 token 内容选择比固定砍一半更差**。（a）质量代价全部越 0.014 带：`F50`（固定前缀常开 512 通道，每 token 总 MACs 5 295 616 = `D` 的 ×0.716）clean bpc 1.5678、Δ vs dense 锚 `U4-s0`（1.5314）= **+0.0364**（2.6× 带）；`K50`（按 `|pre-activation|` 逐 token 选 512，总 MACs 6 344 192 = ×0.858）1.6295、**+0.0981**（7.0× 带）；`K25`（选 256，总 MACs 5 819 904 = ×0.787）1.6417、**+0.1103**（7.9× 带）⇒ 三个稀疏臂都省下了实打实的每 token 算力（−14.2%～−28.4%），但都在「省算力不吃质量」的区间之外。（b）**预登记的主判（条件性）方向为负**：Δ(`K50` − `F50`) = **+0.0617**（4.4× 带），且 `K50` 的每 token MACs 比 `F50` 还高 19.8% ⇒ 「按内容挑哪一半」在本实现下**又贵又差**，H1（条件性可排序更优）被否证；H0（不可排序）亦不成立（差距远大于带）。（c）**坍缩门未命中**：`K50` 的逐 token 选择一致率 `mode_set_share` = 0.0（Wilson 95% CI [0.0, 6e-06]）、选择熵 `H/logH` = 0.980（坍缩端 0.900、均匀端 1.0），`K25` 同理（0.0 / 0.938，坍缩端 0.800）⇒ 内容臂确实逐 token 换通道，上表的更差不是「退化成固定前缀」造成的；`F50` 的 1.0 是构造性上界。（d）**保参数 vs 减参数在同算力位点不可分辨**：`F50`（5 295 616 MACs，1.5678）对 `2641` 的 `U2-s0`（FFN 参数也减半，同 5 295 616 MACs，1.5709）差 0.0031，落在 0.014 带内 ⇒ 参数留在账上但不参与前向，换不到可测的质量收益。验收并列读法（C2 裁决）：**字面成立**——四臂读数齐备、总参数逐臂逐位相等、活性列有落盘、结论停在该尺度；**实质不成立**——按 §5「用更少算力拿类似质量」的实质验收（不被同算力的朴素方案支配），三个稀疏臂都用越带的 0.036～0.110 bpc 换 −14%～−28% 算力，且被「干脆减 FFN 参数」（`U2-s0`）在同一算力位点追平 ⇒ 本项**判失败（被否证）**。判据带（C1 裁决）：clean bpc 用 0.014 带；选择一致率/熵走 Wilson 95% CI 与 batch 聚类 bootstrap，不跨量纲借用。"
conclusion_review: "自评：臂间唯一的差别是 FFN 前向的通道子集（`SparseFFN` 是无参数包装，总参数逐臂逐位 6 962 688）；`mask ≡ 1` 时前向与 stock 逐位相同的等值门由单测钉住、变异门钉住它不是恒真；四条主判读数各有一条落盘 `results_<臂>_s0.json`；坍缩门与质量门分开定带。局限：n=1（seed 0）单点快照、matched-step 而非渐近（末窗 loss 斜率仍为 +0.0042～+0.0050 /1k 步）、算力是纸面 MACs（`lin1` 全算的实现下，真稀疏核的收益未验）、选择器开销未计入 MACs（对内容臂是宽容方向）、`|pre|` 选择器无参数也无辅助损失 ⇒ 否证覆盖的是「用既有激活幅度当选择信号」这一形态。独立复核：未做（本轮产出属执行侧；按 `SCHEMA.md` §14b 排在执行之后另派 fresh 上下文复核）。"
failure_analysis: "**主假设（保参数、每 token 只算部分 FFN 通道能换到不亏质量的算力下降；且「按内容选哪部分」比「固定砍一半」更强）在 13M / enwik8 / 12k 步快照这一格被本地证据否证**，失败归因按三类分开：① **设计问题（主因）**：选择器是**无参数**的 `|pre-activation|` top-k，没有任何训练信号教它「该选谁」，也没有负载均衡项；`K25` 臂末层只有 688/1024 个通道在全程拿到过梯度 ⇒ 幅度小的通道被自强化地压死。同时「按内容选」必须先算全部 pre-activation，`lin1` 的 `d·H` MACs 省不掉 ⇒ 相对固定前缀，它的真实省幅只有一半却多付 0.0617 bpc、还多 19.8% MACs。② **结构问题**：13M / L=8 / 1.1 epoch 的 matched-step 快照里，FFN 容量本身很紧——把每 token 参与的通道砍掉一半，等于把有效宽度砍半，而 `2641` 已测「FFN 隐藏比减半」本身就要 +0.0395 bpc ⇒ 本格的稀疏臂先继承了这笔容量税，剩下的空间不足以让「条件性」表现。③ **innovation 本身失败**：不是全部——被否证的是「无参数、用既有激活幅度做逐 token 选择」这一形态；带可学习选择器或辅助损失的形态未被本实验覆盖，属 `gaps`。**不是实现问题**：等值门（`mask ≡ 1` 逐位相同）、变异门、参数同量、因果性、重评逐位一致五道门全绿，坍缩门显示选择确实逐 token 变化。"
