# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "3.1.4"
axis: "3 宽度轴"
title: "前馈隐藏比：FF/MLP 的 hidden ratio，及其逐层变化"
dir: "axes/3-width/3.1.4-ffn-ratio"

purpose: "普通 decoder-only transformer 的前馈隐藏比（FFN 中间维 / d_model）是全局常数，而 FFN 又是每 token 参数与 FLOPs 的大头。本项要判定：调 FFN 隐藏比、并让它在层间变化，能否在给定质量下降低每 token 等效算力/参数（把 FFN 容量花得更省），并放进以 stock 常数隐藏比为 100% 的质量-代价前沿。"
innovation: "相对普通 decoder-only transformer 的常数隐藏比 r，令 FFN 中间维 = r_l·d，r_l 随层变化（浅层小/深层大，或反之），或用 GLU 式门控等价地改 r 的有效值。改动量级：FFN 参数量与每 token FLOPs ≈ 2·d·(r·d)（GLU 式门控 3 矩阵则 3·d·r·d）随 r 线性缩放；attention 不变。"
expected_effect: "（a）FFN 是 FLOPs/参数主项 ⇒ 隐藏比下降直接降每 token 等效算力；（b）层间重分配可把 FFN 容量放到需要处；（c）须放进以 stock 常数比 100% 的前沿，并给等参数对照。"
sota_baseline: "FFN 隐藏比的经验配方与 GLU 变体（SwiGLU 等；r = 4 或 8/3 的等价取舍，Shazeer 2020）；深度方向 FFN 宽 schedule。本地零经验（`.scratch/56-restructure/MAPPING.md` §2 无旧格）。本地锚 = stock 常数隐藏比（归一为 100%）。"
gap: "本仓零经验。边界：本项判 FFN 隐藏比这一宽度读数及其逐层 schedule；与 `3.1.2`（逐层宽度变化，金字塔 / 沙漏）在「逐层变化」上重叠，须由 integrator 核不矛盾——`3.1.2` 判整体宽度的金字塔 / 沙漏读数，本项判 FFN 隐藏比本身。相对 SOTA 的增量在固定 d_model/层数下给隐藏比的前沿读数，不重造 GLU。"
method: "单因素：固定 d_model 与层数，只改 FFN 隐藏比。臂 = {stock r=4（U4，代价 100% 锚）, 常数横扫 r∈{1,2,3,6,8}, 层间变化 r_l（PYR/APYR）, GLU 式门控等价}。**层间变化臂必须与等宽臂对齐 Σ_l r_l**——FFN 参数与每 token FFN 等效算力都只依赖 Σ_l r_l ⇒ 「Σr 相等」= 「FFN 参数逐位相等 + 每 token FFN 等效算力逐位相等」，否则比的是 FFN 容量而不是分配方式。基底恒为 stock decoder-only。"
validation: "端到端：对照 = stock 常数隐藏比 r=4（归一为 100%）+ **等 FFN 预算对照（同 Σr 的等宽臂，剪枝类按 `SCHEMA.md` §15 例外取同算力位点）**；客观判据 = clean bpc（该不跌 / 可排序，越 0.014 噪声带）+ FFN 参数量与每 token 等效 FLOPs（该跌）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变 = d_model 与层数。"
objective_criteria: "该跌：FFN 参数量与每 token 等效 FLOPs（相对 stock r=4）；该不跌/可排序：clean bpc；必须不变：d_model、层数与因果性，且**等预算臂（U2/PYR/APYR）之间 Σ_l r_l、FFN 参数量、每 token FFN 等效算力逐位相等**；必须报：每层 r_l 分布 + 每层计算量分布（对照列，因层间流水节拍由最宽层决定）。"
falsification: "若隐藏比下降带来的质量损失与算力节省相对同预算 stock 不占前沿优势 ⇒ 判该手段在本尺度不产生新知识；**若层间 schedule 与同 Σr 的等宽臂的 clean bpc 差 |Δ| < 0.014（噪声带）⇒ 判「逐层 FFN 分配」在本尺度不是独立于 FFN 总量的设计维度**（该读数并入 `3.1.2` 的深度形状结论，本项不再单独主张）；若 schedule 臂越带更差 ⇒ 判非均匀分配反向有害。"
failure_analysis: ""
conclusion: ""
conclusion_review: "本项无旧格、本仓零经验，尚无本地判决，故 `status: 未开始`。判据与基线按 `docs/research-schema.md` 预登记（对照 + 客观判据 + 口径 + 否证条件），把「d_model 与层数不变」钉死，使隐藏比是本项唯一变量。独立复核未做。"
experiments:
  - "axes/3-width/3.1.4-ffn-ratio/experiments/2641-ffn-ratio-frontier-13m"
argument: "FFN 是 per-token 参数与 FLOPs 的主项，因此隐藏比是宽度轴上最直接的「算力-质量」旋钮；判据必须是「同 d_model/层数下隐藏比 → (算力, 质量)」的前沿，而不是只报单点 bpc。层间 schedule 若相对常数比无越带差异，则说明该自由度在等参数下无效，须如实记。"
gaps:
  - "本仓零经验：需先做最小判决（13M、固定 d_model/层数，常数隐藏比横扫 + 层间 schedule + GLU 等价臂，报 clean bpc + FFN FLOPs/参数）"
  - "GLU 式门控与常数隐藏比的等参数对照未定（需对齐三者参数量）"
  - "与 `3.1.2` 逐层宽度变化的记账重叠须由 integrator 核一遍（边界已写死：本项判 FFN 隐藏比，`3.1.2` 判整体 d_model 的逐层 schedule）"
  - "**实现边界**：引擎 `pathlm/depth_ar.py` 无「逐层 FFN 宽」开关（`mlp_mult` 为全局标量）⇒ 本项 WP1 把逐层 schedule 实现在**实验目录内**（构造后对 FFN 做前缀切片，见 2641/README.md §2.1），不碰共享 `pathlm/**`；把该开关收编进引擎的最小 patch 描述记在 `.scratch/64-axis3-width/TICKET.md`，由 Main 裁决"
  - "13M/12k 快照 + 单任务（enwik8 字符级）；规模与任务外推未做"
cost_model: "等效理论量：FFN 每 token 每层 FLOPs ≈ 2·d·(r·d)（GLU 式门控 3 矩阵则 3·d·r·d），隐藏比 r 线性缩放 FFN 参数量与 FLOPs，attention FLOPs 不变；layer-passes 每 token 仍为 L；tokens-per-forward 每步 1。考虑 pipelining：各层 FFN 规模不同时以每层 FLOPs 分布评估最慢层节拍（不用任何时间量）。"

