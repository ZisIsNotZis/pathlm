# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "3.1.4"
axis: "3 宽度轴"
title: "前馈隐藏比：FF/MLP 的 hidden ratio，及其逐层变化"
dir: "axes/3-width/3.1.4-ffn-ratio"

purpose: "普通 decoder-only transformer 的前馈隐藏比（FFN 中间维 / d_model）是全局常数，而 FFN 又是每 token 参数与 FLOPs 的大头。本项要判定：调 FFN 隐藏比、并让它在层间变化，能否在给定质量下降低每 token 等效算力/参数（把 FFN 容量花得更省），并放进以 stock 常数隐藏比为 100% 的质量-代价前沿。"
innovation: "相对普通 decoder-only transformer 的常数隐藏比 r，令 FFN 中间维 = r_l·d，r_l 随层变化（浅层小/深层大，或反之），或用 GLU 式门控等价地改 r 的有效值。改动量级：FFN 参数量与每 token FLOPs ≈ 2·d·(r·d)（GLU 式门控 3 矩阵则 3·d·r·d）随 r 线性缩放；attention 不变。"
expected_effect: "（a）FFN 是 FLOPs/参数主项 ⇒ 隐藏比下降直接降每 token 等效算力；（b）层间重分配可把 FFN 容量放到需要处；（c）须放进以 stock 常数比 100% 的前沿，并给等参数对照。"
sota_baseline: "FFN 隐藏比的经验配方与 GLU 变体（SwiGLU 等；r = 4 或 8/3 的等价取舍，Shazeer 2020）；深度方向 FFN 宽 schedule。本地零经验（`.scratch/56-restructure/MAPPING.md` §2 无旧格）。本地锚 = stock 常数隐藏比（归一为 100%）。"
gap: "本仓零经验。边界：本项判 FFN 隐藏比这一宽度读数及其逐层 schedule；与 `3.1.2`（逐层宽度变化，金字塔 / 沙漏）在「逐层变化」上重叠，须由 integrator 核不矛盾——`3.1.2` 判整体宽度的金字塔 / 沙漏读数，本项判 FFN 隐藏比本身。相对 SOTA 的增量在固定 d_model/层数下给隐藏比的前沿读数，不重造 GLU。"
method: "单因素：固定 d_model 与层数，只改 FFN 隐藏比。臂 = {stock r=4（U4，代价 100% 锚）, 常数横扫 r∈{1,2,3,6,8}, 层间变化 r_l（PYR/APYR）, GLU 式门控等价}。**层间变化臂必须与等宽臂对齐 Σ_l r_l**——FFN 参数与每 token FFN 等效算力都只依赖 Σ_l r_l ⇒ 「Σr 相等」= 「FFN 参数逐位相等 + 每 token FFN 等效算力逐位相等」，否则比的是 FFN 容量而不是分配方式。基底恒为 stock decoder-only。"
validation: "端到端：对照 = stock 常数隐藏比 r=4（归一为 100%）+ **等 FFN 预算对照（同 Σr 的等宽臂，剪枝类按 `SCHEMA.md` §15 例外取同算力位点）**；客观判据 = clean bpc（该不跌 / 可排序，越 0.014 噪声带）+ FFN 参数量与每 token 等效 FLOPs（该跌）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变 = d_model 与层数。等 FFN 预算 / 等算力位点为剪枝类实验的标准对照口径（64-F1 裁决确认，见 docs/research-schema.md §12.2）。预算不足时部分臂允许 n=1（64-F3 裁决），按既定递减、结论如实记 n。判据带（C1 裁决）：本格以配对 Δ、≥5 窗口条件下的 0.014 bpc 带为主判；同臂换 seed 散列只作参考、不作 |Δ| 上界。"
objective_criteria: "该跌：FFN 参数量与每 token 等效 FLOPs（相对 stock r=4）；该不跌/可排序：clean bpc；必须不变：d_model、层数与因果性，且**等预算臂（U2/PYR/APYR）之间 Σ_l r_l、FFN 参数量、每 token FFN 等效算力逐位相等**；必须报：每层 r_l 分布 + 每层计算量分布（对照列，因层间流水节拍由最宽层决定）。"
falsification: "若隐藏比下降带来的质量损失与算力节省相对同预算 stock 不占前沿优势 ⇒ 判该手段在本尺度不产生新知识；**若层间 schedule 与同 Σr 的等宽臂的 clean bpc 差 |Δ| < 0.014（噪声带）⇒ 判「逐层 FFN 分配」在本尺度不是独立于 FFN 总量的设计维度**（**限定：仅就该多重集两条单调阶梯；同臂换 seed 散列不是 |Δ| 上界；通道子集 × 深度位置交互不可识别**；该读数并入 `3.1.2` 的深度形状结论，本项不再单独主张）；若 schedule 臂越带更差 ⇒ 判非均匀分配反向有害。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）；同臂换 seed 散列只作参考、不作 |Δ| 上界。"
failure_analysis: "**设计问题（主因）+ 结构问题（次因）**。① 设计问题：把「FFN 预算在层间怎么分」当作独立设计维度，在 13M / 8 层 / 12k 快照上没有头寸 —— 四条等预算读数（PYR/APYR × 2 seed）相对等宽的差落在 −0.0139…+0.0065，全部在 0.014 带内。（**口径更正**：不得表述为「小于同臂换 seed 的散布 0.0098」——PYR-s1 的 0.0139 大于它，且约等于项目自认的种子散布上界 0.0138；因此判 H0 是阈值规则的判词，不等于效应被排除。）② 结构问题两条：本实验只覆盖**单调阶梯的两个极端**（同多重集 {4,3,2,2,2,1,1,1} 的排序共 1120 种，非单调 schedule 未搜索）⇒「非均匀分配一律无用」超出本证据；且在 Σr=16 档 attention 已占总每 token MACs 的 59.4%，FFN 只占 39.6% ⇒ 可重分配的算力份额本来就窄。③ **innovation 本身失败：不适用**（本项未引入新机制，FFN 隐藏比是业界既有旋钮）⇒ 这是「本尺度不产生新知识」的读数，而非机制被否证。"
conclusion: "**总量是旋钮，分配不是**。① 总量（可排序）：FFN 宽度 4→2（Σr 32→16）在 13M/12k matched-step 上 clean bpc 1.5314 → 1.5709（**+0.0395 = 2.8× 噪声带**），换来每 token 等效算力 −28.4%、参数 −30.2% ⇒ 每省 1% 每 token 算力 ≈ +0.0014 bpc。② 分配（不可排序）：把同一份 FFN 预算在 8 层间重排 —— PYR（前宽后窄）相对等宽 Δ_up = −0.0021（seed0）/ −0.0139（seed1），APYR（后宽前窄，PYR 镜像）Δ_down = +0.0065 / +0.0010，四个值**全在 0.014 带内** ⇒ 判 **逐层 FFN 分配在本尺度不是独立于 FFN 总量的设计维度**（预登记 H0 成立）。**结论的限定（必须一起读）**：① 只覆盖同多重集 {4,3,2,2,2,1,1,1} 的 1120 种排序里的**两条单调阶梯**（PYR/APYR），「非均匀分配一律无用」超出本证据；② PYR-s1 的 |Δ| = 0.0139 已贴在项目自认的种子散布上界（`docs/methodology.md` §2：≤0.0138）⇒ 判 H0 是**阈值规则**的判词，**不等于效应已被排除**（本实验同臂换 seed 的散列 U2 0.0098 / APYR 0.0043 / PYR 0.0020 不能当 |Δ| 的上界）；③ 全部臂共享同一次初始化且窄臂只保留前 r·d 个通道 ⇒ 「通道子集 × 深度位置」的交互不可识别，不排除换抽样/换子集后出现 0.01–0.014 量级（负向或零）的效应。**没有任何 seed 显示非均匀分配更优**（PYR 两 seed 都更差、APYR 两 seed 都更好但最大 +0.0065）；方向可复现但不足以支撑采纳。本读数并入 `3.1.2` 的深度形状结论时应带上述限定。③ 副产品（不作判据）：非均匀分配**确实改变层间表征质量分布** —— PYR 的中间深度 bpc 明显更低（第 6 层 1.9727 vs 等宽 2.3338、第 7 层 1.7492 vs 1.7887）而最终深度更差；该信号对早退（`2.1.1`）可能有用，本项未测。证据：`experiments/2641-ffn-ratio-frontier-13m`（7 臂 × 12k、n=2 于三个等预算臂、U4 锚 n=1）。 验收并列读法（C2 裁决）：milestone 预登记文字（隐藏比 → (算力, 质量) 前沿点可分）**字面成立**；其实质（不被同算力位点支配）在**总量维度成立**（4→2 省 28.4% 算力、只付 +0.0395 bpc）、在**分配维度否证**（层间 schedule 相对等宽 Δ 全在 0.014 带内）。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
conclusion_review: "**当前（最后一轮）独立复核 = PASS**（fresh 有 shell 的复核者，`.scratch/64-axis3-width/REVIEW-2B.md`，2026-10-14T21:3x+08:00）：派单的 6 项执行类检查**全部实跑且与期望一致**——`pytest test_2641_ffn_ratio.py -q` 13 passed；从 7 个 `results_<arm>_s<seed>.json` 自算的 Δ_up/Δ_down 与 `results.json::P1_P2_deltas_by_seed`、`P1_verdict_by_seed`、`equal_ffn_budget_check` 逐位一致；第 1 轮 3 处 blocker 核为已改（B1 伪命题已删除并改述为「H0 是阈值规则判词、不等于效应已被排除」、B2 APYR-s1 第 6 层落盘 2.4684、B3 参数差余项 4,096 与落盘 `params_ffn` 2,103,296 相符）；T5 初始化控制实跑 6 组（seed 0/1 × U2/PYR/APYR：trunk 与 U4 逐位相同、FFN 为同一次抽样的前缀切片）全 True；T6 三份契约文件与 `49f697f` 的 sha256 逐位相同、mtime 17:58:24 / 17:59:41 / 18:00:10 早于起跑 18:00:37；T9 本轴越界扫描 = 0、`python3 tools/summary.py --check` = OK（46 份）。**自评**：结论停在本尺度实验本体上（等 FFN 预算位点逐位成立、判 H0 由预登记阈值规则得出），并带三条限定（只覆盖同多重集两条单调阶梯；|Δ| 贴种子散布上界 ⇒ 阈值判词不等于效应排除；共享前缀初始化使「通道子集 × 深度位置」不可识别）。残留不确定（复核者自述）：被审 revision 的定位受并发其它轴写入影响；契约冻结由 sha256 + mtime 一对证据支撑。历轮判词与处置过程见 `.scratch/64-axis3-width/TICKET.md` §9 / §10.8 与 `REVIEW-1.md` / `REVIEW-2.md`。"
