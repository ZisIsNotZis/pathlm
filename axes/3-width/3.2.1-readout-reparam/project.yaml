argument: "判「读出重参数化是否有用」不能只看 bpc 降幅：必须给等参数纯线性对照，否则把重参数化 / 容量记成非线性（`harness/SCHEMA.md` §15）；用 12k→24k 收敛对账区分「收敛加速」与「最终质量」（§16）；用 stock dense 上的不可迁移性区分「补本形态缺陷」与「通用改进」。逐深度读出用等参数「共享宽变换」对照否证，说明「一个共享读出服务所有深度」不是缺陷。结构性切分（只读前 r 维）的负结果（能量迁出读出子空间）物理证据在本轴 `3.1.1` 的 experiments 目录（`.scratch/56-restructure/MAPPING.md` §0/§1 一格一份家），本项只作**指针引用**、不复制文件。"
gaps:
  - "单 seed、单配置（13M / 8L）：量级与规模外推未做（按 `harness/methodology.md` §10 需多档次小实验拟合）"
  - "24k 两臂仍未收敛 ⇒ 最终质量未定；更长训练点未测"
  - "纯 MLP 读出（vocab×hidden）不可 scale（真词表 100k+ 是瓶颈）⇒ 只作对照臂，不采纳"
  - "与 `3.2.3` tied vs untied 的边界（本项测在 tied 桥上加的重参数化，不测单纯解绑）须由 integrator 核一遍"
  - "结构性切分的完整裁决在 `3.1.1`（指针），本项只引用其负结果"
cost_model: "等效理论量：读出重参数化加 2·d² 参数与每 token 约 2·d² 的出口 FLOPs（相对主干总计约 L·d² 量级可忽略）；layer-passes 每 token 不增加（读出只在出口，不重跑主干）；tokens-per-forward 每步 1。考虑 pipelining：读出变换在每步出口对已算出的隐藏态做一次 d×d 变换，不引入额外顺序依赖。"

