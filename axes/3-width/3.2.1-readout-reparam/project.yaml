# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "3.2.1"
axis: "3 宽度轴"
title: "读出的重参数化：加非线性 / GLU 式 / 线性"
dir: "axes/3-width/3.2.1-readout-reparam"

purpose: "普通 decoder-only transformer 的读出是一张 tied 线性表（U = Eᵀ，即「概率 = 隐藏状态在 embedding 基下的坐标」）。本项要判定：给读出加一层可学重参数化（线性或非线性 / GLU 式）能否解耦「计算空间」与「读出可见空间」，带来可排序的质量提升，还是收益只来自额外容量——即把增益**归因清楚**（重参数化 / 容量 vs 非线性本身），并放进以 tied 线性读出为 100% 的质量-代价前沿。"
innovation: "相对普通 decoder-only transformer 的线性 tied 读出，在读出前加一个可学变换：线性重参数化 h' = h + P·(Q h)，或 GLU 式 g(h) = h + silu(W1 h) ⊙ (W2 h)（保住线性桥 h·Eᵀ，prob0/软提交/线性传输仍走线性路径）。改动量级：+2·d² 参数（本仓 13M d=256 时 131072），非 vocab×hidden；层数与主干不变。"
expected_effect: "（a）质量：读出重参数化若把 clean bpc 降下来，增益应能归到「重参数化 + 容量」而非非线性本身；（b）解耦：宽度的结构性约束下（只读部分维度）读出不再把状态能量逼出被约束子空间；（c）代价 = 小的额外参数（2·d²），须放进以 tied 线性读出为 100% 的前沿，并给等参数纯线性对照（`harness/SCHEMA.md` §15）。"
sota_baseline: "权重绑定（Press & Wolf 2017 / Inan 2017：输入/输出 embedding 共享省参数）与门控线性单元 GLU / SwiGLU（Shazeer 2020：读出重参数化与 GLU 同族）。外部条目标 `记忆·未核`（本环境检索不可用，只作设计方向、不作判据；见 `archive/wiki-legacy/axes/W-width/PRIOR_ART.md` §W4，该文件已随旧树退役归档）。本地锚 = tied 线性读出（stock，归一为 100%）。"
gap: "业界少见「为解耦计算空间与读出可见空间」而改读出几何的工作；本仓增量是**受控归因**：等参数纯线性对照证明增益来自「读出重参数化 / 容量」而非非线性本身，且**不可迁移到普通 dense**（dense 上模型主动不用该自由度）⇒ 补的是本形态读出缺陷而非通用改进。复核提醒：读出重参数化与 GLU 同族、「加 2d² 参数使 bpc 降」本身是平凡结果，故本项判据必须落在「等参数对照下的归因」与「可迁移性」上，而不是「bpc 降了」。"
method: "单因素：固定主干与训练预算，只改读出形态。臂 = {tied 线性（stock）, 解绑线性, 线性重参数化 h+P(Qh)（等参数对照）, GLU 式 gated 残差读出, 逐深度读出}。基底恒为 stock decoder-only。"
validation: "端到端：对照 = tied 线性读出（stock，归一为 100%）+ 等参数纯线性对照（`harness/SCHEMA.md` §15）；客观判据 = clean bpc（该跌，须越 0.014 噪声带才可排序）+ 出口资产 tf@k 与校准 ECE（该不跌）；口径 = matched-step / 同 token 预算 + 12k→24k 收敛对账（`harness/SCHEMA.md` §16），**墙钟不进判据**；必须不变 = prob0 / 软提交 / 线性传输仍可用。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；tf@k / 校准 ECE 类指标不跨量纲借用 0.014。"
objective_criteria: "该跌/可排序：clean bpc（GLU 式与等参数纯线性对照须能相互排序，否则归因为容量 / 重参数化）；该不跌：出口资产 tf@4 / tf@6 与 ECE；必须不变：prob0 校准、软提交凸包、线性传输的可用性；必须报：12k 与 24k 两训练点（防把收敛加速记成最终质量）。"
falsification: "若等参数纯线性对照与 GLU 式读出的 Δbpc 不可排序（差 < 0.014）⇒ 判非线性本身无贡献，收益只能记为「读出重参数化 / 容量」；若增益随训练缩减（12k→24k 缩小）或不可迁移到 stock dense ⇒ 判该增益是补本形态缺陷、不是通用改进；若 24k 下质量掉出噪声带外 ⇒ 判不成立。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；tf@k / 校准 ECE 类指标不跨量纲借用 0.014。"
failure_analysis: "**创新本身失败（主因）+ 结构问题（次因）**。① 创新本身失败：本项的对准机制是「读出非线性重参数化解耦计算空间与读出可见空间 ⇒ 质量提升」，但等参数纯线性对照（h+P(Qh)，同 2·d² 参数）Δ = −0.0888 与 GLU 式 Δ = −0.0812 不可排序（差 0.0076 < 0.014）⇒ **非线性无额外贡献**，机制核被否证（证据：`experiments/2611-equalparams-linear-control-13m` vs `experiments/2610-gated-readout-13m-depthar`）。② 结构问题：同一读出重参数化在 stock dense 上 Δ = −0.0055 / −0.0026（远小于 0.014，差距 16×），机制证据显示 dense 上读出变换相对幅度仅 0.6–1.2%、Q 的 fro 从 5.13 收缩到 0.86（模型主动不用该自由度）⇒ 原增益是**补本 depth-AR 形态的读出缺陷**，不是通用改进（证据：`experiments/2613-readout-reparam-dense-13m`）。③ 次要：增益随训练缩减（12k −0.0812 → 24k −0.0463，缩 43%）且两臂 24k 仍未收敛 ⇒ 更像收敛加速而非最终质量。"
conclusion: "已有本地读数（旧格 W4 迁入，旧口径已修正）：读出重参数化 gated 在 12k 下 Δ clean bpc −0.0812，但等参数纯线性对照 Δ −0.0888 ⇒ 二者不可排序（差 0.0076 < 0.014）⇒ 增益归**读出重参数化 / 容量**，**非线性本身无额外贡献**；24k 复测 Δ = −0.0463（缩 43%）⇒ 更像收敛加速；同一读出重参数化在 stock dense 上 Δ = −0.0055 / −0.0026（远小于 0.014，模型主动不用该自由度）⇒ **只在本 depth-AR 形态有效、补本形态读出缺陷，不是通用改进**；逐深度读出被等参数「共享宽变换」对照否证（Δ −0.0759 vs −0.1313，差 0.0554 ≫ 0.014）⇒「一个共享读出服务所有深度」不是缺陷。副判据不越带：tf@4 0.9694→0.9680、tf@6 0.9938→0.9933、ECE 0.0066→0.0051。故**不采纳为通用质量机制**，保留为「读出重参数化」候选，待更长训练与更大尺寸确认。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；tf@k / 校准 ECE 类指标不跨量纲借用 0.014。"
conclusion_review: "结论看上去成立但有边界：单 seed、单配置（13M / 8L）、24k 两臂仍未收敛 ⇒ 最终质量未定；故本项判「不采纳为通用质量机制」，不判「读出一律无用」。复核提示 gated 读出与 GLU 同族、「加 2d² 参数使 bpc 降」本身平凡，本项已把判据落在「等参数对照的归因」与「可迁移性」上，不再是「bpc 降了」。复核指出本项问题域只属本项目 depth-AR 形态、按「不能改变判断的删」应删或降工程 note——本项按冻结结构保留为研究项，但结论明确「非通用改进」。独立复核未做。"
