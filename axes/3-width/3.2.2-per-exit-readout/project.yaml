    boundary: 绝对前沿更好：末层 seed 1 = −0.0811，且 4 层 1.7567 已优于共享表用满 8 层 1.8370；同一对臂的浅出口 tf@2..4
      两 seed 同向下降只否证「相对接受率」这条读数，不得读成「逐出口读出让早退不可用」。代价是读出参数 +589,824
      （相对 T +8.5%）与每 token 训练算力 +589,824 MACs（+7.5%）；等参数对照臂未跑 ⇒ 不得当作采纳理由
    source: axes/3-width/3.2.2-per-exit-readout/experiments/2645-per-exit-readout-13m/analysis.md
experiments:
  - "axes/3-width/3.2.2-per-exit-readout/experiments/2645-per-exit-readout-13m"
argument: "多出口模型里，读出是最容易被忽略的耦合点：共享一张 tied 表时所有出口被同一条「概率 = 状态在 embedding 基的坐标」约束；逐出口读出正是解这个耦合的候选。判据必须看**浅出口**（早退真正用到的那个），而不是只看末层；独立表虽可能有效但 vocab×d 不可 scale，故单列参数量并把「是否能 scale」当采纳门槛。跑层数归深度轴 `2.1.1`，本项只判出口→词表的形态。"
gaps:
  - "等参数对照臂未跑：「末层 +0.086 bpc」在把这笔 +589,824 参数（相对 T +8.5%）给主干后还剩多少未测 ⇒ 质量增益的归因未隔离"
  - "`IND`（每出口独立表）与 `LR`（每出口低秩校正）两臂未跑 ⇒ 预登记否证线的第二条（只有不可 scale 的独立表能提升）无本地读数"
  - "真词表（100k+）不可判：V > d 时 `PE` 的表达力优势消失，本项结论只覆盖 V=206"
  - "出口数与出口位置固定为「每层 + 全深度」（9 个）：出口数对结论的影响未测；「跑哪几层 / 退不退」归 `2.1.1`"
  - "推理期早退调度（真实 tokens-per-forward 与墙钟）不在本项：本项只判「出口 → 词表」的形态"
cost_model: "等效理论量：每出口加 d×d 变换 ⇒ 每 token 每出口约 +2·d² 出口 FLOPs（在出口处，不重跑主干，layer-passes 每 token 不增加）；独立表参数量 = 出口数 × vocab × d（不可 scale，单列）；tokens-per-forward 每步 1。考虑 pipelining：出口读出在每步结束时对该出口已算出的隐藏态做一次映射，不引入额外顺序依赖。"

