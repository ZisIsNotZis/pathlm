milestone:
  output: "一份「逐出口读出」判决包：{共享 tied, 共享 + 每出口 d×d, 每出口独立表, 逐出口低秩} 在 13M matched-step 下的各出口 tf@k + 末层 clean bpc + 读出参数量，对照共享 tied 线性读出（stock），**再加一支等参数对照臂（把读出参数额给主干）与原始两臂同入口同判据比**，含 n≥2。"
  acceptance: "各出口 tf@k 齐备；逐出口读出相对共享表让浅出口 tf@k 可分（越噪声带）或明确「不可分」；独立表参数量单列并给出可否 scale 判定；末层质量不越带；**等参数对照臂把「参数总量」这个解释分开，结论明确回答参数是不是全部解释（若不是，报残余与是否越 0.014 带；若不可判，报所需样本量）**；结论不越尺度外推。"

work_packages:
  - id: "WP1"
    what: "逐出口读出最小判决（含末层质量与参数量对照列）"
    goal: "判定多出口时每个出口是否需要独立/轻量的读出映射"
    means: "13M、固定主干与出口数，{共享 tied, 共享+d×d, 独立表, 低秩} 四臂，报各出口 tf@k + 末层 bpc + 读出参数量"
    acceptance: "四臂预算对齐；浅出口 tf@k 有/无越噪声带差异，二选一明确；末层质量与参数量列齐备"
    evidence: "axes/3-width/3.2.2-per-exit-readout/experiments/"
    review: "跑完另派 fresh 复核（`harness/SCHEMA.md` §14/§14b）"
    status: "被否证"
  - id: "WP2"
    what: "等参数对照臂：把 `PE` 多出的读出参数（589,824，相对 `T` +8.5%）改为给主干 FFN 隐藏宽，回答「参数是不是全部解释」"
    goal: "把「多给容量」与「读出结构本身」分开：同一笔参数花在主干上能不能复现 `PE` 的末层增益"
    means: "新臂 `WIDE` = stock tied 读出 + 每层 FFN 隐藏宽 1024 → 1168（`mlp_hidden_sched`，引擎既有开关）；seed 0/1 各一臂，同入口（`run.py`）、同电池、同 0.014 带与同 n=2 规则；预登记 P5 四分支规则（`config.json::p5_rule`）与其实现（`run.py::equal_param_branch`）在 `WIDE` 任何读数之前已提交（`c199446`），最终重绑之后再用最终代码重跑同一读数"
    acceptance: "判据先于读数（`prereg_binding.json`）：P5 四分支规则与实现由 `c199446`（12:28:38）落盘，早于 `WIDE` 全部读数（冒烟 12:28:40 起）；最终绑定（`1058485`，13:09:51）晚于 `WIDE` 读数，其后用最终 `run.py` 重跑同一读数；`WIDE` 参数增量 590,976（比 `PE` 多 1,152 = +0.015% 总参数）且训练期每 token MACs 与 `PE` 逐位相等（单测 `T9`）；两 seed 读数齐备，判词只由 0.014 带与符号定；结论明确回答「参数是不是全部解释」，否则报残余与是否越带，分支不一致时报所需样本量"
    evidence: "axes/3-width/3.2.2-per-exit-readout/experiments/2645-per-exit-readout-13m"
    review: "与 WP1 同一轮 fresh 复核（`harness/SCHEMA.md` §14/§14b，复核排在 writer 停止之后）"
    status: "已完成"

