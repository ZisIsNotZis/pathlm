argument: "多出口模型里，读出是最容易被忽略的耦合点：共享一张 tied 表时所有出口被同一条「概率 = 状态在 embedding 基的坐标」约束；逐出口读出正是解这个耦合的候选。判据必须看**浅出口**（早退真正用到的那个），而不是只看末层；独立表虽可能有效但 vocab×d 不可 scale，故单列参数量并把「是否能 scale」当采纳门槛。跑层数归深度轴 `2.1.1`，本项只判出口→词表的形态。第二轮再补一环：本项第一轮的增益在等参数对照缺位下只能记成「多给容量」，而「多给容量」本身有两种来源（参数总量 vs 容量摆放位置）——用「把同一笔参数给主干」的臂把两者分开（`harness/SCHEMA.md` §15 的等参数对照，引擎已有的 `mlp_hidden_sched` 开关，0 新码），再按预登记的 0.014 带对 `Δ_W` 与残余 R 出判：`|Δ_W| ≤ 带` 即「参数总量买不到」。"
gaps:
  - "等参数对照臂只覆盖一种放法：`WIDE` 把同一笔参数花在每层 FFN 等宽加宽（+144 隐藏宽）；加层、加宽 `d_model`、加宽 attention 未测，故「参数不是全部解释」不得读成「主干多参数一律无用」（≈ 2 臂 × 12 min GPU，须新契约）"
  - "`WIDE` 的跨 seed 散布 0.0245 大于种子散布上界 0.0138 ⇒「主干花这笔钱落带内还是更差」这一膝要更多 seed（补 seed 2/3 ≈ 2 臂 × 12 min GPU）；它不影响「参数不是全部解释」（残余 R 两 seed 同向越带、`n_req = 1`）"
  - "`IND`（每出口独立表）与 `LR`（每出口低秩校正）两臂未跑 ⇒ 预登记否证线的第二条（只有不可 scale 的独立表能提升）无本地读数"
  - "真词表（100k+）不可判：V > d 时 `PE` 的表达力优势消失，本项结论只覆盖 V=206"
  - "出口数与出口位置固定为「每层 + 全深度」（9 个）：出口数对结论的影响未测；「跑哪几层 / 退不退」归 `2.1.1`"
  - "推理期早退调度（真实 tokens-per-forward 与墙钟）不在本项：本项只判「出口 → 词表」的形态"
cost_model: "等效理论量：每出口加 d×d 变换 ⇒ 每 token 每出口约 +2·d² 出口 FLOPs（在出口处，不重跑主干，layer-passes 每 token 不增加）；独立表参数量 = 出口数 × vocab × d（不可 scale，单列）；tokens-per-forward 每步 1。考虑 pipelining：出口读出在每步结束时对该出口已算出的隐藏态做一次映射，不引入额外顺序依赖。"

