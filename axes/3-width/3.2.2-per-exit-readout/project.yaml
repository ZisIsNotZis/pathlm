# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "3.2.2"
axis: "3 宽度轴"
title: "逐出口读出：early exit 或多出口时，每个出口怎么映射到词表"
dir: "axes/3-width/3.2.2-per-exit-readout"

purpose: "普通 decoder-only transformer 只有一个出口（末层）。一旦模型有多个出口（early exit / 多出口），每个出口都要把该深度的隐藏状态映射到整张词表，于是「共享一张读出表还是每个出口一张」直接决定各出口资产（浅层出口的质量）与参数开销。本项要判定：逐出口读出的形态（共享 / 每出口轻量变换 / 每出口独立表）如何影响各出口的质量与早退可用性，并放进以共享 tied 线性读出为 100% 的质量-代价前沿。"
innovation: "相对普通 decoder-only transformer 的单出口线性读出，为每个出口设计到词表的映射：共享 tied 表 + 每出口 d×d 轻量变换、每出口独立 unembed 表、或逐出口低秩变换。改动量级：每出口加 d²（轻量变换，可 scale）或 vocab×d（独立表，不可 scale）；主干与层数不变。"
expected_effect: "（a）浅出口质量（tf@k）提升 ⇒ 早退更可用（tokens-per-forward / 平均 layer-passes 更省的前提更稳）；（b）每出口独立表不可 scale ⇒ 只作对照臂；（c）须放进以共享 tied 线性读出为 100% 的前沿，并给等参数对照。"
sota_baseline: "early exit 的多出口读出一族（CALM / LayerSkip / MoD，见参照台账 `axes/7-references/`）与逐深度输出头。本地最近邻 = 深度轴 `2.1.1`（跑不跑这层）与本轴 `3.2.1`（单出口的重参数化）。本地零经验（`.scratch/56-restructure/MAPPING.md` §2 无旧格）。本地锚 = 共享 tied 线性读出（归一为 100%）。"
gap: "本仓零经验。边界：`3.2.1` 判**单出口读出**的重参数化；本项判**多出口**时每个出口到词表的映射；「跑不跑这层 / 退不退」归深度轴 `2.1.1`，本项只判「出口 → 词表」的形态。相对 SOTA 的增量在固定主干与出口数下给「出口数 → (各出口质量, 参数)」的前沿读数，不重造早退。"
method: "单因素：固定主干与出口数，只改各出口到词表的映射。臂 = {共享 tied 表（stock 式）, 共享表 + 每出口 d×d 变换, 每出口独立线性表, 逐出口低秩变换}。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 共享 tied 线性读出（归一为 100%）+ 等参数对照；客观判据 = 各出口的 tf@k 与各出口 clean bpc（浅出口该涨 / 该不跌，越 0.014 噪声带）+ 读出参数量（独立表 vocab×d 单列）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变 = 末层（全深度）质量不劣于 stock、prob0 可用。 判据带（C1 裁决）：tf@k 等率类指标走配对 bootstrap / Wilson 95% CI 为主判；clean bpc 差用 0.014 bpc 带（限配对 Δ、≥5 窗口）、不跨量纲借用。"
objective_criteria: "该涨：各出口 tf@k（尤其浅出口）；该不跌：末层 clean bpc；必须报：读出参数量（独立表 vocab×d 单独列）；必须不变：prob0 / 软提交仍可用、末层质量不越带；该分开：末层增益归「参数总量」还是「读出结构」——由等参数对照臂（同一笔参数花在主干）按残余 R 与 0.014 带出判"
falsification: "若逐出口读出相对共享 tied 表不能让浅出口 tf@k 可排序提升（越 0.014 噪声带）⇒ 判逐出口读出在本尺度不必要（共享表够用）；若只有不可 scale 的独立表能提升 ⇒ 判该手段在本形态不实用；若逐出口读出反而损末层质量 ⇒ 判不成立。**等参数对照（P5，第二轮预登记）**：若把同一笔参数给主干能追平逐出口读出（`|Δ_W| > 0.014` 且残余 `|R| ≤ 0.014`）⇒ 判「参数是全部解释」，逐出口读出没有额外收益；若 `|Δ_W| > 0.014` 且 `R > +0.014` ⇒ 判「这笔钱花在主干上更好」；若 `|Δ_W| ≤ 0.014` ⇒ 判「参数不是全部解释」且残余越带。 用哪个带（C1 裁决）：tf@k 等率类指标走配对 bootstrap / Wilson 95% CI 为主判；clean bpc 差用 0.014 bpc 带（限配对 Δ、≥5 窗口）、不跨量纲借用。"
failure_analysis: "三件事分开记：①**判据定义（判据设计缺陷，不是实验缺陷）**：`tf@k` 是相对全深度出口的接受率，`PE` 把末层加固得最多 ⇒ 即使浅出口绝对质量也变好，相对接受率仍会下降。本项主判因此不能读成「`PE` 让模型变差」，也不能读成「逐出口读出对早退有害」：按早退本义（少跑层换质量），`PE` 的 4 层绝对 bpc 已优于 `T` 的 8 层 ⇒ 可用性变好。本项被否证的是「浅出口的**相对**接受率」，`objective_criteria` 里的「各出口 `tf@k` 该涨」这一条本身就问错了量。②**设计/结构**：本尺度 V=206 < d=256 ⇒ `PE` 的头族（`E·M`）包含任意线性头（单测 T5），`IND` 与它的差别只剩参数化与参数量，不是表达力；因此「换一种出口映射形态」在这条轴上本来就几乎没有额外自由度，可用的杠杆只剩「多给容量」。③**innovation 本身**：逐出口读出的两个承诺——「浅出口更可用」被两 seed 否证（深度 2–4 同向更差）；「值它多付的读出参数与算力」已由第二轮的等参数对照臂回答（参数不是全部解释，残余 −0.0818 / −0.1059 两 seed 同向越带），即增益是「读出位置上的容量」，不是出口 → 词表形态；因此本项按预登记判「不成立」，而不是「机制无效」。④**判据定义（第二轮新增，判据设计缺陷）**：P5 的四分支规则对 `Δ_W` 取了**绝对值** ⇒ 把「等参数对照臂更差」与「参数解释一部分增益」归到同一分支（s1 的 `Δ_W = +0.0248` 落在 `params_explain_part`，而它实际说明这笔钱在主干上什么都没买到）。正确写法是带符号（`Δ_W ≥ −band` 一律归「参数不是解释」），但那要下一轮预登记，本轮按原规则判「分支不可判」，不改判据线。"
conclusion: "本尺度判「逐出口读出不是**相对接受率**（`tf@k`）的杠杆，而且绝对层数—质量前沿更好」（契约的绑定时刻晚于旧读数，定序不可判，见本文件 `conclusion_review` 与 `prereg_binding.json::readings_existing_at_bind`；判据线文字在：`axes/3-width/3.2.2-per-exit-readout/experiments/2645-per-exit-readout-13m/README.md` §4 与同目录的 `prereg_binding.json`；两 seed 的判词规则是同目录 `config.json::n2_rule`）。两臂只改「出口 → 词表」：`T` = 共享 tied 表（stock），`PE` = 共享表 + 每个出口一个 256×256 变换（`M_k = I` 起步，起步逐位等于 `T`）；主干逐位相同。**末层质量 `PE` 更好**：clean bpc 1.7513 vs 1.8370（seed 0）、1.7517 vs 1.8328（seed 1），Δ = PE − T = **−0.0857 / −0.0811**（两 seed 同向、各自越 0.014 带 6 倍以上）；**相对接受率 `PE` 更低**：`tf@2 / tf@3 / tf@4` 两 seed 同向下降（−0.0468 / −0.0159、−0.0278 / −0.0207、−0.0204 / −0.0219，每条配对 CI 不含 0；深度 1 只在 seed 0 上升 +0.0082、seed 1 不可分）⇒ 预登记的「浅出口可分且为正」不成立（n=2 的读法是「可分且为负」）。**但 `tf@k` 是相对全深度出口的接受率，不是早退的可用性本义**：按「少跑层换质量」读，`PE` 的 4 层 1.7567 bpc 已优于 `T` 用满 8 层的 1.8370（seed 1 同形 1.7595 vs 1.8328）⇒ 绝对前沿是变好的，被否证的是「相对接受率」这条读数。代价：读出参数 +589,824（9 × 65,536，相对 `T` 的总参数 +8.5%）、每 token 训练算力 +589,824 MACs（9 个出口都算 logits，+7.5%，分母 = `T` 的训练总 7,814,656）、推理期 +65,536 MACs（+0.9%，7,392,768 → 7,458,304）。校准与软提交仍可用（prob0 ECE 0.0028 / 0.0073，容差 0.003 内；出口 argmax 与 tied 基坐标的一致率 0.71 / 0.70 是 `PE` 出口头含 `M_k` 的构造性后果）。按 `atlas/playbook.md` 定律 9 必须与绝对质量一起读：`PE` 在 9 个出口里几乎每一层都更好（唯一例外 seed 0 深度 2 差 0.011、落带内），而末层进步更大 ⇒ **相对**接受率下降。所以它买到的是「多给读出容量」，不是「出口 → 词表形态」的好处；把 `tf@k` 当早退可用性的主判是本判据的设计缺陷（`failure_analysis` ①），不是 `PE` 让模型变差。**参数是不是全部解释：不是**（第二轮等参数对照臂 `WIDE` 已跑，n=2）。`WIDE` = 读出一侧一个参数都不多、把同一笔参数给主干（每层 FFN 隐藏宽 1024 → 1168，+590,976 参数；比 `PE` 的 +589,824 多 1,152 = +0.015% 总参数，方向对对照臂有利；每 token 训练 MACs 8,404,480 与 `PE` **逐位相等**）。读数：末层 clean bpc 在 s0 为 1.8331（只比 `T` 低 **0.0039**，落 0.014 带内）、在 s1 为 1.8576（比 `T` **高 0.0248**，1.8× 带）；`PE` 相对这个等参数对照的残余 R = **−0.0818 / −0.1059**（两 seed 同向、各自越带 **5.8 / 7.6 倍**）⇒ 没有任何一个 seed 显示「同样这笔参数花在主干上能追平 `PE`」，所以**增益只能记在「读出位置上的容量」名下**，不能记成「参数总量是旋钮」（那条旋钮由 `3.1.1` / `3.1.4` 判定；`3.1.4` 的总量斜率外推 +8.5% 只能买到约 0.010 bpc，实测 −0.0039 还在它之内）。**按预登记规则的那一半判词是「分支不可判」**：四分支里 s0 落 `params_not_the_explanation`、s1 落 `params_explain_part`（两 seed 不一致）；所需样本量按预登记近似式算：决定分支的 `Δ_W` 两 seed 均值 +0.0104 落在带内 ⇒ **不存在有限 n** 能把「参数解释」这一读法判成立，而残余 R 的 `n_req = 1`（n=2 已足够）。**必须一起读的限定**：`WIDE` 自己的跨 seed 散布 **0.0245** 是 `T`（0.0042）/ `PE`（0.0004）的 5.8 / 61 倍、也大于种子散布上界 0.0138 ⇒ s1 的 +0.0248 **不得**读成「加宽 FFN 有害」，能说的只有「没有一个 seed 追平 `PE`」；`WIDE` 只代表「FFN 等宽加宽」这一种放法。副判据不越带：`WIDE` 的 prob0 ECE 0.0069 / 0.0064（`T` 0.0062 / 0.0056，差 ≤0.003）、出口 argmax 与 tied 表基一致率 1.0（构造性）、评测重跑逐位一致。**未测**：`IND` / `LR` 两臂、真词表；不外推到 100k 词表（V > d 时 `E·M` 只有 d 维自由度）。"
conclusion_review: "自评：两臂同批同 seed 同构造路径训练（单测 T1/T3 钉住 `PE` 起步逐位等于 `T`、四臂主干逐位相同），12k 步读数与重测电池（`reeval_bitwise_identical`）逐 seed 落盘。**「契约先于读数」对本项不可判**：`prereg_binding.json::readings_existing_at_bind` 显示绑定那一刻实验根的 `results.json`、四条臂读数（`runs/{T,PE}-s{0,1}-12k/results.json`）与四份 smoke 读数都已存在 ⇒ 判据线与判词规则都写在读到数字之后，`tools/prereg_bind.py --check` 只要求判序锚重跑过。本项的结论成立与否不靠这个定序（判词由 `run.py --aggregate-all` 按 `config.json::n2_rule` 机械生成），但定序本身不成立。读数之后动过的只有判据应用代码的一处单一之家修整（`VARIANCE_BOUND` / `ECE_TOLERANCE` 改读 `config.json`，值未变）。`IND` / `LR` 未跑，故 P4 的第二条否证分支标「未测」而不是「否证」。**第二轮（等参数对照臂）成立的是「判据先于读数」，不是「最终绑定的字节先于读数」**：P5 的四分支规则与实现同由提交 `c199446`（`2026-10-21T12:28:38+08:00`；`git log -S equal_param_branch` 只命中它）落盘，早于 `WIDE` 冒烟（`run_log.txt` 12:28:40 取锁）、12k 训练（12:30:07–12:51:55）与臂级评测（12:57:43–13:04:24）⇒ 判据写在读数之前。`prereg_binding.json` 的 `bound_at` 是**最终**重绑（`1058485`，13:09:51），所以 `readings_existing_at_bind` 里确实含 `results_WIDE_s{0,1}_12k.json`、`runs/WIDE-s{0,1}-12k/results.json` 与 `results.json`——`WIDE` 读数**早于最终重绑约 18 分钟**（此前那句「里只有第一轮的四条臂与四份 smoke」是错的，已按快照改正）。两次重绑都只动 `run.py`（`ed34313` 把 Δ 方向声明改对、`1058485` 加代码哈希），`equal_param_branch` 在三个绑定版本里逐字节相同（sha256 `5bb41742…`），`README.md` / `config.json` 自 `c199446` 起 sha256 未变（三次绑定都是 `3fdd6101…` / `f66c7d25…`）⇒ 判据与规则未被事后调整。最终绑定后 13:09:56–13:15:29 用最终 `run.py` 重跑全部臂级读数：四条非 `WIDE` 臂对 `ed34313` 那版逐键比对，只有 `code_hash_run_py` 变、并新增 `mlp_hidden` 字段，数值逐位相同；`WIDE` 两臂重跑前的字节只留下 `readings_existing_at_bind` 里的 sha256、内容不在仓内 ⇒ 它「重跑前后数字相同」这一句不可从仓内证明（不影响上一条：判据先于读数）。另外四条**训练产物**（`runs/{T,PE}-s{0,1}-12k/results.json`）自绑定以来字节未变 ⇒ 按工具语义属 `predate`（定序不可判），它们无代码哈希、也不是判词用的臂级读数（判词只用 `results_<臂>_s<种子>_12k.json`），已逐条登记在 `harness/prereg_debt.tsv`。**两 seed 分支不一致已按规则判「不可判」**，没有取平均掩盖，也没有把 `WIDE` s1 的 +0.0248 当成「加宽 FFN 有害」；判据缺陷（分支取绝对值）已写进 `failure_analysis` ④ 并列入 roadmap 的下一轮预登记。**自评的保留**：`WIDE` 的跨 seed 散布 0.0245 大于种子散布上界 0.0138，所以「主干花这笔钱」这一膝只到「没有一个 seed 追平 PE」为止；「参数不是全部解释」这条由残余 R 两 seed 同向越带支撑，`n_req = 1`。独立复核未做（执行方不自评）。"
