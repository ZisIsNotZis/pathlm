argument: "判定「宽度分配值不值」的判据形态必须是「质量-代价前沿」而非单点 Δbpc 对一个绝对门槛（55-review W-09）：横轴 = 每 token 等效算力/参数，纵轴 = clean bpc，以 stock 全宽为 100%。且必须给等参数对照，否则无法把「减宽」与「单纯减参数/容量」分开（`SCHEMA.md` §15）。`2525-tax-attribution` 按 `.scratch/56-restructure/MAPPING.md` §0/§1 物理迁入本目录（旧格 W1 的实验整目录，一格一份家），但它测的是读出切片、属 `3.2.1` 域：本项只把它登记为**背景证据**（读出约束的负结果），`3.2.1` 以指针引用它。"
gaps:
  - "本仓零经验：需先做最小判决（13M、{全宽, uniform 减宽, width dropout} 三臂 + 等参数对照，matched-step，报 clean bpc + 参数量 + 每 token 等效 FLOPs）"
  - "width dropout 的「一次训练多档」性质未测（需报各档质量-宽度曲线并检单调）"
  - "造轮子风险最高项（55-review W-04）：须在最小判决里明确「相对结构化剪枝 SOTA 的增量」是什么，否则结论无新知识"
  - "55-review W-14：旧格引用的「用户本地独立实验（减宽）」无可核实 artifact，已剔除；若确有该实验，需补落盘证据才能引用"
  - "「同 FLOPs 稠密前沿点」这一对照在 13M 上尚未实测（需先有前沿：`3.1.4` 的 2641 已给出 d_model 固定下的 FFN 预算-质量斜率，可先借它当量纲参照）"
cost_model: "等效理论量：uniform 减宽把 hidden 维 d→d' ⇒ 每 token 参数量与每层 FLOPs 按 (d'/d)² 缩放，layer-passes 仍为 L；width dropout 不额外加参数，每步只激活通道子集，每 token 等效 FLOPs 按激活比例缩放；tokens-per-forward 每步 1。考虑 pipelining：宽度子集选择属同一前向内的掩码/gather 差异，不引入额外顺序依赖；不同档宽度对应不同的每 token FLOPs，按档位报（不用任何时间量）。"

