# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "3.1.1"
axis: "3 宽度轴"
title: "uniform 减宽 / width dropout"
dir: "axes/3-width/3.1.1-uniform-narrowing"

purpose: "普通 decoder-only transformer 的宽度是全局常数（hidden 维、头维、激活通道数对所有 token 一样），于是每 token 的算力/参数被均匀摊在所有 token 上。本项要判定：把宽度整体压小（uniform 减宽），或用 width dropout 训出一个「一次训练、多档宽度可部署」的弹性模型，能否在给定质量（以全宽 stock 为 100%）下降低每 token 等效算力/参数量，并在质量-代价前沿上占到一个比同预算 stock 更优的点。"
innovation: "相对普通 decoder-only transformer 的全局常数宽度：① uniform 减宽——统一缩小 d_model / 头维，使每 token 参数量与 FLOPs 按 (d'/d)² 下降；② width dropout——训练期每步随机保留一个宽度子集（不额外加参数），一次训练得到一个宽度可调的模型族。核心改动是「宽度」由常数变成「可按档位调节的分配量」，不改变层数与可见集合。"
expected_effect: "（a）弹性宽度：一次训练覆盖多档成本（width dropout 的收益是「多档可部署」，不是单点质量）；（b）uniform 减宽按定义掉容量，须把质量代价放进以全宽 stock 为 100% 的前沿，而不是只报「掉/没掉门槛」；（c）判据须同时给质量（该不跌/可排序）与每 token 等效算力/参数量（该跌），且必须给等参数对照（`SCHEMA.md` §15）。"
sota_baseline: "结构化剪枝一系（LLM-Pruner / Sheared LLaMA / Minitron：通道/宽度剪枝换更小参数与算力，付质量）与弹性宽度一系（MatFormer 式嵌套宽度、width dropout / stochastic depth 式正则）。外部条目标 `记忆·未核`（本环境检索不可用，只作设计方向、不作判据；见 `archive/wiki-legacy/axes/W-width/PRIOR_ART.md` §W1，该文件已随旧树退役归档）。本地锚 = 同尺寸 stock 全宽（归一为 100%；13M B0 = 1.5074 bpc 快照）。"
gap: "本仓**零本地判决**：没有任何实验测过「uniform 减宽 / width dropout」本身。边界：**d_model / 头维**整体缩小归本项，**FFN 隐藏比 r**（含其逐层变化）归 `3.1.4`（`d_model` 固定）——两格不得对同一读数各记一遍。旧格 W1 迁入的 `2525-tax-attribution` 实测的是**读出可见子空间切片**（把 unembed 与出口头只读 h[:360]，trunk/embedding 仍全宽 720），按 55-review W-06 它属**读出域**（本轴 `3.2.1`），既不减算力也不减参数 ⇒ **不是减宽**，不构成本项结论。相对 SOTA 的增量：不重造结构化剪枝，而是把「减宽 / width dropout」放进以 stock 全宽为 100% 的质量-代价前沿，并用等参数对照判定它是否只是「减容量」（55-review W-04 的造轮子风险是本项最高风险）。"
method: "单因素：固定数据/训练预算，只改宽度分配。臂 = {全宽 stock, uniform 减宽（d_model / 头维按比例缩小）, width dropout（训练期随机保留宽度子集）, 弹性宽度（一次训练多档）}；减宽属**剪枝类**（参数与算力同时下降）⇒ 按 `SCHEMA.md` §15 的例外取**同 FLOPs 的稠密前沿点**作对照（不是等参数量：等参数量在减宽臂上不可得），并报参数量与 FLOPs 两列。基底恒为 stock decoder-only。边界：本项只判 d_model / 头维整体缩小；**FFN 隐藏比 r 及其逐层变化归 `3.1.4`**，两者不得对同一读数各记一遍。等 FFN 预算 / 等算力位点为剪枝类实验的标准对照口径（64-F1 裁决确认，见 docs/research-schema.md §12.2）。"
validation: "端到端：对照 = 同尺寸 stock 全宽（归一为 100%）+ 等参数对照臂；客观判据 = clean bpc（质量，该不跌 / 代价可排序，须越 0.014 噪声带）+ 参数量与每 token 等效算力（该跌）+ width dropout 各档质量随宽度的单调性（该单调）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变 = 因果性与训练/评测口径一致。预算不足时部分臂允许 n=1（64-F3 裁决），按既定递减（先砍非核心臂 seed1）、结论如实记 n。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
objective_criteria: "该跌：参数量与每 token 等效算力（FLOPs）；该不跌/可排序：clean bpc（须越 0.014 噪声带）；该单调：width dropout 各档宽度的质量随宽度单调（防「一次训练多档」名不副实）；必须不变：因果性；必须报：参数量（作对照列，防把减参数记为减宽度）。"
falsification: "若 uniform 减宽在等参数对照下相对 stock 的 clean bpc 不越噪声带而算力/参数量下降可测 ⇒ 记为一档可用前沿点；若减宽只按参数量下降比例掉质量、等参数对照下无优势（即只是「减容量」）⇒ 判 uniform 减宽在本尺度不产生新知识（与业界共识一致）；若 width dropout 训出的各档质量不随宽度单调、或任一档显著掉出前沿 ⇒ 判弹性宽度不成立。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
failure_analysis: ""
conclusion: ""
conclusion_review: "本项按 55-review W-06/W-07/W-14/W-17 修正：旧格 W1 的判决「减宽 = 减容量」是**照抄业界共识**，且其唯一本地证据 `2525-tax-attribution` 测的是**读出切片**（读出域，不测减宽）⇒ 旧结论无本地支撑，**不迁入本项**。旧格引用的「用户本地独立实验（减宽）」仓内**无可核实 artifact**（W-14），已不作为证据。故本项命题仍无本地判决，`status: 未开始`、`conclusion` 为空。无独立复核（未做）。"
