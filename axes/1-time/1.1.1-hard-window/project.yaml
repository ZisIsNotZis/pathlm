argument: "用 KV 消融（真删位置）而非窗口外答对率测保留，排除了「局部统计补全」这一替代解释；锚点通道的提升被反过来当作长程信息可达的证据；窗口代价随 T 的子线用同 step（6000）统一口径，避免把「收敛度不等」误读成「代价随 T 消失」。"
