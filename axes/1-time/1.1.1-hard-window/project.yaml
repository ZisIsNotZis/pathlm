argument: "用 KV 消融（真删位置）而非窗口外答对率测保留，排除了「局部统计补全」这一替代解释；锚点通道的召回提升**没有**在本仓口径上复现（2662：两 seed 未达预登记门槛 ⇒ 不可判），因此**不**把它当作「长程信息可达」的证据；锚点的作用被限定为「锚区恒可见 + 小幅质量收益（−0.006/−0.007 bpc）」；窗口代价随 T 的子线用同 step（6000）统一口径，避免把「收敛度不等」误读成「代价随 T 消失」。"
gaps:
  - "**窗口臂仍为复用**：k∈{16,17,18,24,32,128} 的读数来自 2634/2638（未在本目录自包含复算）；本目录已自包含复算的是**锚点臂**（2662，seed 0/1）"
  - "累计预算与单距离两列未拆（WP2）"
  - "per-head 平均注意距离分布未报"
  - "长 T 子线只覆盖 1.1.1 迁入的 8 个目录；T=1024/2048 无 seed 复本"
  - "**锚点召回腿在 n=2 下不可判**（seed 1 的两套 CI 都含 0）⇒ 下一步最小实验 = 补 seed 2/3（每臂 1 × 98.3M token + 复用 `2662/run.py` 评测 ≈3 min），或换更低先验地板重造针位"
  - "**评测期锚点消融已做，归因仍不可分（形态更精确）**：`2679` 量到关掉锚点掉 +0.035490 / +0.023958（n=2、CI 不含 0、越 0.014 带），而反向给纯窗臂加锚点掉 +1.882186 / +1.527625 ⇒ 两向都破坏分布，「训练时多见键」与「推理期可见」拆不开。下一步最小实验 = 等键数对照臂（窗口 24、无锚点，同样 24 个最近键；1 臂 × 12k 步 ≈10 min GPU + 复用 `2679/run.py` 评测）；把消融变成分布内操作需要训练期 anchor dropout（改共享训练入口那一档，另立项）"
cost_model: "等效理论量：窗口把每 token 的可见键数从 T 压到 k，attention 的 QKᵀ 与加权项由 O(T²) 降到 O(T·k)（layer-passes 不变、每层 FLOPs 按 k/T 缩放）；锚点 s 个时键数为 k+s。考虑 pipelining：prefill 段可按 chunk 流水，decode 段每步只算新增 query 对 k+s 个键。长 T 子线按同 step 记 tokens-per-forward 与每 token 等效 FLOPs。"

