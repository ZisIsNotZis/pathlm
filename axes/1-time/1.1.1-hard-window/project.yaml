# 研究项 SSOT 示例：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "1.1.1"
axis: "1 时间轴"
title: "hard 窗口"
dir: "axes/1-time/1.1.1-hard-window"

purpose: "把可见范围压到硬性上限（滑动窗口 / sink / 锚点槽），使前缀可以被真正丢掉、长上下文成本可解析，同时尽量少掉序列级质量。"
innovation: "相对普通 decoder-only transformer 的全因果 attention，把每个 token 的可见集合裁成「最近 k + 少数锚点/sink」。改动量级：只改 attention mask 与位置保留策略，不新增参数（除非加锚点槽）；算力从 O(T²) 降到 O(T·k)。"
expected_effect: "（a）推理期前缀可丢、KV 缓存可截断，长 T 的算力/显存随 T 线性而非平方；（b）解码器免重 prefill（ring-buffer）；（c）代价是长程检索能力受限，需量化它到底掉了多少。"
sota_baseline: "StreamingLLM（attention sink + 驱逐）与 Longformer/Sliding-Window 一族；本地锚 = 全因果注意力基线（A2，13M B0 = 1.5074 bpc 快照）。见 axes/7-references/README.md。"
gap: "业界给了「窗口几乎无损」的说法；本项要补的是**在真正的长程召回判据上量化损失**，并区分「评测期丢前缀」与「训练期累计预算」两种口径——两者在本仓被实测证明不是一回事。"
method: "单因素：只改 attention 可见掩码。臂 = {full, 窗口 k∈{16,32,64,128,192}, 窗口+anchors, 窗口+sink, 窗口+稀疏全局}。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 同尺寸 stock 全因果基线（A2/7-references）；客观判据 = clean bpc（质量税）+ KV 消融保留曲线（真删位置 j 的 KV 测损伤，不是窗口外答对率）；口径 = matched-step / 同 token 预算，禁墙钟。该涨：锚点/sink 臂的远距离召回；该跌：无（窗口臂长程召回应停在 chance）。"
objective_criteria: "该涨：锚点通道的 needle 召回；该跌：无；必须不变：被删位置数（作对照列）、同位置 logits 的因果性单测。"
falsification: "若窗口臂在真正的长程任务上召回等于 chance（已观测到 beyond-window 0.4%），且加锚点/sink 也救不回 ⇒ 硬窗口作为「信息右移」手段失败；若软衰减只把局部统计补全能力训强、bpc 改善但与长程召回同时退化 ⇒ 判为「假保留」，本项手段不成立。"
cost_model: "等效理论量：窗口把每 token 的可见键数从 T 压到 k，attention 的 QKᵀ 与加权项由 O(T²) 降到 O(T·k)（layer-passes 不变、每层 FLOPs 按 k/T 缩放）；锚点 s 个时键数为 k+s。考虑 pipelining：prefill 段可按 chunk 流水，decode 段每步只算新增 query 对 k+s 个键。（代价一律按等效理论量计）。"

