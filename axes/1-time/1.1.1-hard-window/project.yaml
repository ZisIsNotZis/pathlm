milestone:
  output: "一份自包含的「硬窗口保留曲线」：k∈{16..192} × {无锚点, anchors, sink} 的 clean bpc 与 KV 消融保留曲线，对照 stock 全因果；并附 T∈{256..2048} 同 step 的窗口代价曲线；含 n≥2 复本。"
  acceptance: "k 全曲线的累计预算列与单距离列分开报；锚点通道召回相对同掩码地板有可排序提升（跨过本格自测噪声门限）；长 T 子线按同 step 报且不外推；结论表述为「该尺度/该任务下窗口值不值」，不越界。"

