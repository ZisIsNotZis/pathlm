  - "无仓内自包含复算（WP1：旧证据仍是 .scratch 摘要 + 旧格 stub）"
  - "累计预算与单距离两列未拆（WP2）"
  - "per-head 平均注意距离分布未报"
  - "长 T 子线只覆盖 1.1.1 迁入的 8 个目录；T=1024/2048 无 seed 复本"
  - "**锚点召回腿在 n=2 下不可判**（seed 1 的两套 CI 都含 0）⇒ 下一步最小实验 = 补 seed 2/3（每臂 1 × 98.3M token + 复用 `2662/run.py` 评测 ≈3 min），或换更低先验地板重造针位"
  - "**缺评测期锚点消融** ⇒ 质量收益（−0.006/−0.007 bpc）无法区分「锚点槽本身」与「训练见过更多键」；下一步最小实验 = 对已训锚点臂做评测期 mask 反事实（把 anchors 置 0，0 训练 token）"
  - "`2662` 目录 `MODEL.md` 未落盘（权重 sha256 在 `results.json::checkpoints` 与 `driver_all.log`）；下一步 = 由 `make_config`/run 侧补生成（0 GPU）"
cost_model: "等效理论量：窗口把每 token 的可见键数从 T 压到 k，attention 的 QKᵀ 与加权项由 O(T²) 降到 O(T·k)（layer-passes 不变、每层 FLOPs 按 k/T 缩放）；锚点 s 个时键数为 k+s。考虑 pipelining：prefill 段可按 chunk 流水，decode 段每步只算新增 query 对 k+s 个键。长 T 子线按同 step 记 tokens-per-forward 与每 token 等效 FLOPs。"

