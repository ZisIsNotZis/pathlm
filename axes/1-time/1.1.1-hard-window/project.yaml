# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "1.1.1"
axis: "1 时间轴"
title: "hard 窗口"
dir: "axes/1-time/1.1.1-hard-window"

purpose: "把可见范围压到硬性上限（滑动窗口 / sink / 锚点槽），使前缀可以被真正丢掉、长上下文成本随序列线性而非平方增长，同时把掉的质量与长程可达性压到最小。"
innovation: "相对普通 decoder-only transformer 的全因果 attention，把每个 token 的可见集合裁成「最近 k + 少数锚点/sink」。改动量级：只改 attention mask 与位置保留策略，不新增参数（除非加锚点槽）；attention 的 QKᵀ 与加权项由 O(T²) 降到 O(T·k)。"
expected_effect: "（a）推理期前缀可丢、KV 缓存可截断，长 T 的算力/显存随 T 线性而非平方；（b）解码器免重 prefill（ring-buffer）；（c）代价是长程检索能力受限——需要量化它到底掉了多少，并把窗口代价放到「质量-代价前沿」上（横轴 = 每位置可见键数 / 每 token 等效 FLOPs，纵轴 = 相对全因果的 clean bpc 与长程召回）。"
sota_baseline: "StreamingLLM（attention sink + 驱逐）与 Longformer / Sliding-Window 一族；本地锚 = 全因果注意力基线（A2 → axes/7-references，13M B0 = 1.5074 bpc 快照）。见 axes/7-references/README.md。"
gap: "业界给了「窗口几乎无损」的说法；本项要补的是**在真正的长程召回判据上量化损失**，把「评测期丢前缀」与「训练期累计预算」两种口径拆开（两者在本仓被实测证明不是一回事），并把窗口代价放进同预算前沿（含「代价是否随 T 消失」的同 step 曲线），而不是只报孤立 Δbpc。"
method: "单因素：只改 attention 可见掩码。臂 = {full, 窗口 k∈{16,32,64,128,192}, 窗口+anchors, 窗口+sink, 窗口+稀疏全局}。另一子线是「窗口代价随 T」：T∈{256,512,1024,2048}，位置窗口 = T/2，同 step=6000 口径。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 同尺寸 stock 全因果基线（A2 / axes/7-references，归一为 100%）；客观判据 = clean bpc（质量税，该跌）+ KV 消融保留曲线（真删位置 j 的 KV 测损伤，不是窗口外答对率）+ 长程召回（该涨/该跌）+ 窗口代价随 T 的 Δbpc 曲线；口径 = matched-step / 同 token 预算，禁墙钟。该跌：窗口臂 clean bpc 不越 0.014 噪声带即算不亏；该涨：锚点/sink 臂的远距离召回；必须不变：因果性（无未来泄漏）与训练/评测掩码一致。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
objective_criteria: "该跌：clean bpc（窗口 vs stock 全因果，须越 0.014 噪声带才算可排序）；该涨：锚点通道的 needle 召回；该跌：窗口臂的 beyond-window 召回应停在 chance（作负对照）；必须不变：被删位置数（作对照列）、同位置 logits 的因果性单测。"
falsification: "若窗口臂在真正的长程任务上召回等于 chance（已观测 beyond-window 0.4%、win16 0.92× chance），且加锚点/sink 也救不回 ⇒ 硬窗口作为「信息右移」手段失败；若局部先验只把 bpc 训好而长程召回同时退化 ⇒ 判为「假保留」。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
failure_analysis: "按 `harness/research-schema.md` §7：本项 `conclusion` 含「手段不成立」型判断——**「硬窗口/锚点作为信息右移手段」已被仓内证据否证**（窗口臂窗外召回停在同掩码地板；锚点臂的窗外桶两种子也停地板、对锚点槽之外的前缀逐位不敏感），故必填失败归因。三分归类（并列）：**① 设计问题（主因）**：窗口/锚点按定义只改「谁可见」，不改「谁在近处」——把远处信息搬到当前行的能力不属于可见集裁剪，本项把「窗口便宜不便宜」与「窗口能不能搬远」写在同一个 falsification 里，后半句必然触发。**② 结构问题（次因）**：锚点在引擎里就是「最前面 N 个位置恒可见」（`window_anchor_keep_mask` 的 anchors），它与「sink」是同一根杠杆 ⇒ 「窗口+sink」不是独立于「窗口+anchor」的第二档，milestone 里并列的三档实际是两档。**③ innovation 本身失败：不适用**（本项不提出新机制，只是裁剪可见集）。证据锚点：`2662/results.json` 的 `quality_leg.price`（−0.005583/−0.007294）、`needle_leg`（锚点桶 +2.592/+1.097pp、beyond 桶 CI 含 0）、2634 的 beyond 桶读数、2636 的同 step 四点 Δ。"
conclusion_review: "自评：本项的两条腿都有**仓内自包含**证据，且判词都停在它自己的层上。**锚点召回腿在种子层可判**（`2681`，n=4）：四个 seed 的 anchor 桶 Δ_pp = +2.592 / +1.097 / +0.997 / +2.393pp、4/4 同向、均值 +1.76975pp、两个跨 seed 区间下界均 > 0（t 区间 [0.434109, 3.105391]、两级 bootstrap [0.698, 2.841]），且判据①复现门逐位成立 ⇒ 同一仪器。**质量腿 n=4**：四个同 seed 配对价格 −0.005583 / −0.007294 / −0.005658 / −0.009707、t 区间 [−0.010136, −0.003985] 不含 0。**窗口侧 k 曲线与两列口径**由 `2682` 自包含复算（见 `work_packages` 的 WP2）。**本轮（`2682`）只有执行方自评，独立复核未派**：四条验收的落盘证据都在（`2682` 的 k 全曲线两列 + `2681` 的召回 n=4 + `2636` 的 T 子线 + 本字段的不越界表述），但 `harness/SCHEMA.md` §14/§14b 的 fresh 复核仍待研究级主 Agent 另派，复核之前不得把本格当作「已复核通过」。风险点：① 逐 seed 的 `passes_both` 仍全 false —— 这不是反例，是同一事实的另一面（1,003 针/seed 的未配对两比例差半宽 ±4.37pp，对本格 1–3pp 的效应功效近 0），故只能写「种子层可判」，不得写「每个 seed 单独显著」，也不得写「无信号」；② 剩下的缺口是**尺度的**（更大规模、更长 T、别的分词口径），不是样本量的；③ 锚点的质量收益**已做评测期消融（2679）**，它证明的是「锚点通道被模型用起来」（去掉掉 +0.017–0.025 bpc），而不是把 0.0056 拆成「推理期可见 / 训练时多见键」两半——两向消融都破坏分布 ⇒ 归因仍不可分，下一步写在 `gaps`；④ 2662 目录 `MODEL.md` 未落盘（权重 sha256 已在 `results.json::checkpoints`）。本项此前的冻结块经独立复核判过（范围窄，证据在 `.scratch/doc-log/**`）；`2681` 的独立复核已完成一次（fresh 上下文，判 OK with notes），其 P1 缺陷已按盘上证据修正：四次绑定的时间线见 `2681/analysis.md` §1a，SSOT 里按 n=2 写的旧事实已清除。**本轮（`2682`）的 fresh 复核已派并判回**：四条验收 ①②③ 成立、④ 不成立，两处 P1 都在 `conclusion`——「窗口 k≥128 的训练税 ≈0」把一个 `undecidable` 档写成了结论，「实质（这个手段值不值）成立且方向已定」缺代价侧。两处已按盘上读数改正（「实质」子句改成三分类、k≥128 写不可判、k≤64 写确定越带；字段末加 `2636` 的代价侧四条腿），顺带把同字段的两处口径写实（44.8 倍是「删 224 个 vs 删 4 个」的计数效应乘以每键代价比 0.80、而非远键强替代；T 子线四点分别引用 0.009459 / 0.006231 与工程带 0.014），并把本字段里残留的复核编号换成实质描述。**改正后 `conclusion` 仍需 fresh 复核重核一次**；两条「不可判」的补种（判据② 的 k=128、判据⑥ 的 k=64）由 `2686` 出读数。"
conclusion: "**窗口的价格已定，且「锚点」不是把远处搬近的手段**。① **主曲线（本目录首次自包含）**：`experiments/2662-hard-window-anchor-13m`（rc=0）给出锚点臂（窗口 16 + 锚点 8，seed 0/1）相对同 seed 纯窗臂（窗口 16 + 锚点 0）的 clean bpc 差 = **−0.005583 / −0.007294**（两种子同向 = **质量收益**，越本格自测带 σ_cell=0.000983、**不越** 0.014 跨格带；代价 = 可见键 16→24、每位置多 98,304 B KV）⇒ 人话：**用 50% 更多的可见键换约 0.4% 的质量改善，不是免费改善**（把「窗口 16→全量」差距 0.125421 缩小 4.45%）。**n=4 复核（2681）**：同 seed 配对价格补到四个 seed = −0.005583 / −0.007294 / −0.005658 / −0.009707，4/4 同向、均值 −0.00706、跨 seed t 区间（df=3）[−0.010136, −0.003985] 不含 0 ⇒ 质量收益在种子层也可判（仍不越 0.014 跨格带）。② **召回腿在种子层已判（n=4）：锚点抬高锚区召回是真的**。`experiments/2681-anchor-recall-seeds23-13m` 的判据①复现门逐位成立（5 个复用臂 bpc 与锚点臂 anchor/beyond 桶计数全部与 2662 相同 ⇒ 同一仪器），其四个 seed 的 anchor 桶 Δ_pp = **+2.592 / +1.097 / +0.997 / +2.393pp**（4/4 同向），均值 **+1.76975pp**，跨 seed 两个区间下界均 > 0（t 区间 df=3 **[0.434109, 3.105391]**、两级 bootstrap（重采 seed + seed 内重采针）**[0.698, 2.841]**）⇒ 按预登记的 n=4 主判**可判**。人话：锚点区植入召回 ≈47–50%、地板同水位，**+1.77pp ≈ 相对地板 +3.8%**，小但方向稳定。**旧门不是矛盾而是同一事实的另一面**：逐 seed 的合取式（1,003 针/seed、未配对两比例差半宽 ±4.37pp）对本格 1–3pp 的效应功效近 0，四个 seed 的 `passes_both` **仍全为 false**（要过需 2,850–15,900 针/seed，功效表见该实验 README §2）⇒ 只能写成「种子层可判」，不得写成「每个 seed 单独显著」，也不得写成「无信号」。③ **锚点不搬远**：窗外（beyond）桶两种子都停在地板（CI 含 0），且锚点臂对**锚点槽之外**的前缀被毁逐位不敏感（判据④变体）⇒ **锚点锁定的是「最前面 8 个位置恒可见」，不是信息右移通道**。⑤ **锚点通道在推理期真的被用起来了，但那条 0.0056 的收益拆不成「推理 vs 训练」两半**：`experiments/2679-anchor-eval-ablation-13m`（同一 checkpoint、只改评测期掩码、0 训练 token）量到——把锚点关掉，锚点臂掉 **+0.024600 / +0.016607** bpc（两 seed 同向、配对 bootstrap CI [0.023128, 0.026104] / [0.015452, 0.017793] 不含 0），是被解释收益（−0.005583 / −0.007294）的 **2.3–4.4 倍**；反向给纯窗臂白加 8 个锚点掉 **+1.304632 / +1.058869** bpc ⇒ 两个模型都只在自己的训练可见集上工作，评测期换掩码是分布外操作。人话：**锚点不是白给的 8 个键（模型把它当通道用，通道价值 0.017–0.025），但它换成 8 个最近键的净差额只有 0.0056；「训练时多见键」与「推理期可见」在本仓是同一根杠杆，评测期消融拆不开**（下一步见 `gaps`）。④ 窗口的价格由本目录自包含复算（`2682`，k∈{16,32,64,128,192}）：逐 seed 配对的窗口税 = **0.124061 / 0.082197 / 0.052907 / 0.011208 / −0.000387** bpc，四段方向全降（单调不增、无平滑）；按预登记的三分类，k≤64 三档**确定越本格自测带**，k=128 与 k=192 在本 n 下**不可判**（区间跨带；所需样本量按预登记功效式 1 / 32）。k=128 已由 `2686` 补到 n=3：税 0.012607 / 0.009808 / **0.002762**、均值 +0.008392、`sd` 0.005073、区间 **[−0.004211, +0.020995]** ⇒ 仍 `undecidable`（功效式 `n_req = 4`）⇒ **「补 1 个 seed 即判」这个推断本身已被否定**：「k 到哪一档就免费」这句话在本 n 下没有任何一档支持。旧 `2638` 的 k∈{17,18,24,128} 现值不再进入这条曲线。锚点杠杆在第二个 k（`win64a`，窗口 64 + 锚点 8）价格 −0.007652 / −0.008982 / **−0.003166**（第三个数来自 `2686` 的 seed 2）、均值 **−0.0066**、`sd` 0.003047、n=3 的 t 区间 **[−0.014171, +0.000971]** 仍含 0 ⇒ **补到 n=3 仍不可判**；三个 seed 同向为负、与 k=16 的 n=4 均值 −0.00706 同量级，但同向不等于可判。T 子线仍由 `2636` 承接：T∈{256,512,1024,2048} 同 step 四点 Δ = −0.003542 / −0.004528 / +0.009264 / +0.004186，其中 T=256/512 两点落在本格实测判据量噪声内（0.009459 / 0.006231 是两个不同的估计）、T=1024/2048 两点按工程带 0.014 读（无 seed 复本）⇒「窗口代价随 T 消失」在本 n 下不可判定。⑤ **累计预算列与单距离列是两个数，不许互相换算（`2682`）**：同一批权重上，「只留最近 32」（累计配置）在 `full` 臂上掉 **0.211679** bpc，而「删掉距离恰为 32/64/128/255 那四个键」加起来只有 **0.004720** bpc，比值 **44.8** ⇒ 它几乎全是**计数效应**：整批删 224 个键 vs 单删 4 个键 = 56 倍，再乘每键代价比 0.80（0.211679/224 = 0.000945 vs 0.004720/4 = 0.001180 ⇒ 联合代价**次可加**）；真正的超可加在**近端**：距离 16–31 这 16 个键的联合贡献 = cum(16) − cum(32) = 0.593507 − 0.211679 = **0.381828**，而 16 × 单点 d=16（0.014910）= 0.2386 只是它的 0.63 ⇒ **近端超可加 1.6 倍**；**单点读数不得求和、不得外推到别的预算**（`harness/SCHEMA.md` §17.11 记的入账错误在同一批数据上复现）。同一批数据还量到：给只在窗口 16 下训过的模型「只留最近 32」评，质量从 1.628110 崩到 3.937197（+2.309087）⇒ **评测期放出训练时未见过的键是重伤不是加分**，所以累计预算列每一行都带 `relation_to_arm_budget`（identity / narrower / wider_than_training），三条 identity 行的 Δ 逐位为 0。验收两读法（C2）：**字面**（k 全曲线 × {无锚点/锚点} + 两列分开 + T 子线 + n≥2）**成立的部分与不成立的部分必须分开读**——**成立**：k∈{16,32,64,128,192} 的纯窗曲线在本目录自包含（k∈{32..192} 各 2 seed 本目录训练、k=16 的 4 个种子由 2634/2681 的跨项复本经判据① 复现门 9/9 逐位核到同一仪器）、累计预算列与单距离列分开报且不相换算、T 子线由 2636 承接、锚点侧有两个 k（k=16 的 n=4 与 k=64 的 n=3，见 `2686`）；**不成立**：判据⑥ 的 k=64 补到 n=3 后仍不可判（区间 [−0.014171, +0.000971] 含 0）、`sink` 与「锚点」在本仓是**同一根杠杆**（`window_anchor_keep_mask` 的 anchors = 最前面 N 个恒可见位置 = StreamingLLM 式 sink）故不是独立档、KV 消融保留曲线未在本目录复算（本项的保留读数在 2679/2662，且 1.1.4.2 另有专门格）；**实质**（这个手段值不值）**价格这一侧方向已定、量级部分不可判，代价侧见 `2636`（见本字段末）**：窗口 k≥128 的训练税在本 n 下**不可判**（k=128 补到 n=3 后均值 +0.008392、区间 [−0.004211, +0.020995]；k=192 仍 n=2、均值 −0.000387、区间 [−0.024091, 0.023316]）、k≤64 三档**确定越带**；两条不可判的共同原因是**带的量纲**：配对差 `sd` 实测 0.005073（k=128）与 0.003047（k=64 锚点杠杆），是冻结单臂噪声带 0.000983 的 **3–5 倍** ⇒ 继续补 seed 磨不出一条正确的区间，「补 1 个 seed 即判」这个推断已被 `2686` 否定，收口要把带换成配对差散布（新契约，需用户裁决）；k=16 的代价可由完备显式状态补回 80.1%（见 1.1.4.1），而「硬窗口/锚点把远处信息搬近」这一读法**被否证**（召回停地板）。旧读数「锚点通道是真产物 needle 76.8%→93.3%」**不可直接引用**：那是另一台仪器（合成口径、无配对地板）上的绝对召回跳变，且其跳变可归因于「距离惩罚」而非锚点槽本身（`.scratch/07-x1-x3/evidence/SUMMARY.md`）⇒ 本项现已用仓内自包含口径取代它。判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。**代价侧在本实装下为负（`2636` 实测，与本字段的价格并列读）**：同 step 的整模型一步墙钟比 r_time（窗/全，两轮）= T=256 **1.028 / 0.992**、T=512 **0.984 / 0.915**、T=1024 **1.076 / 1.069**、T=2048 **1.273 / 1.784**（T≥1024 两轮一致更慢 ⇒ 无稳定墙钟收益），峰值显存比 r_mem = **1.169 / 1.487 / 2.036 / 3.305** 倍（窗口臂物化稠密 T×T 掩码，T 越大越费），只有**解析** FLOPs 省（注意力 −50%、整层 all-in −7.1%/−12.5%/−20.0%/−28.6%）⇒ **本项的判词只覆盖质量价格；「值不值」在算力侧取决于实装**（源：`experiments/2636-longT-unified/analysis.md` §5 的四条腿表）。**禁外推**：enwik8 / T=256（T 子线见 2636）/ 13M / 12k 步 / 该可见性快照。"
