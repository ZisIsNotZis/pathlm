# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "1.1.1"
axis: "1 时间轴"
title: "hard 窗口"
dir: "axes/1-time/1.1.1-hard-window"

purpose: "把可见范围压到硬性上限（滑动窗口 / sink / 锚点槽），使前缀可以被真正丢掉、长上下文成本随序列线性而非平方增长，同时把掉的质量与长程可达性压到最小。"
innovation: "相对普通 decoder-only transformer 的全因果 attention，把每个 token 的可见集合裁成「最近 k + 少数锚点/sink」。改动量级：只改 attention mask 与位置保留策略，不新增参数（除非加锚点槽）；attention 的 QKᵀ 与加权项由 O(T²) 降到 O(T·k)。"
expected_effect: "（a）推理期前缀可丢、KV 缓存可截断，长 T 的算力/显存随 T 线性而非平方；（b）解码器免重 prefill（ring-buffer）；（c）代价是长程检索能力受限——需要量化它到底掉了多少，并把窗口代价放到「质量-代价前沿」上（横轴 = 每位置可见键数 / 每 token 等效 FLOPs，纵轴 = 相对全因果的 clean bpc 与长程召回）。"
sota_baseline: "StreamingLLM（attention sink + 驱逐）与 Longformer / Sliding-Window 一族；本地锚 = 全因果注意力基线（A2 → axes/7-references，13M B0 = 1.5074 bpc 快照）。见 axes/7-references/README.md。"
gap: "业界给了「窗口几乎无损」的说法；本项要补的是**在真正的长程召回判据上量化损失**，把「评测期丢前缀」与「训练期累计预算」两种口径拆开（两者在本仓被实测证明不是一回事），并把窗口代价放进同预算前沿（含「代价是否随 T 消失」的同 step 曲线），而不是只报孤立 Δbpc。"
method: "单因素：只改 attention 可见掩码。臂 = {full, 窗口 k∈{16,32,64,128,192}, 窗口+anchors, 窗口+sink, 窗口+稀疏全局}。另一子线是「窗口代价随 T」：T∈{256,512,1024,2048}，位置窗口 = T/2，同 step=6000 口径。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 同尺寸 stock 全因果基线（A2 / axes/7-references，归一为 100%）；客观判据 = clean bpc（质量税，该跌）+ KV 消融保留曲线（真删位置 j 的 KV 测损伤，不是窗口外答对率）+ 长程召回（该涨/该跌）+ 窗口代价随 T 的 Δbpc 曲线；口径 = matched-step / 同 token 预算，禁墙钟。该跌：窗口臂 clean bpc 不越 0.014 噪声带即算不亏；该涨：锚点/sink 臂的远距离召回；必须不变：因果性（无未来泄漏）与训练/评测掩码一致。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
objective_criteria: "该跌：clean bpc（窗口 vs stock 全因果，须越 0.014 噪声带才算可排序）；该涨：锚点通道的 needle 召回；该跌：窗口臂的 beyond-window 召回应停在 chance（作负对照）；必须不变：被删位置数（作对照列）、同位置 logits 的因果性单测。"
falsification: "若窗口臂在真正的长程任务上召回等于 chance（已观测 beyond-window 0.4%、win16 0.92× chance），且加锚点/sink 也救不回 ⇒ 硬窗口作为「信息右移」手段失败；若局部先验只把 bpc 训好而长程召回同时退化 ⇒ 判为「假保留」。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
failure_analysis: "按 `docs/research-schema.md` §7：本项 `conclusion` 含「手段不成立」型判断——**「硬窗口/锚点作为信息右移手段」已被仓内证据否证**（窗口臂窗外召回停在同掩码地板；锚点臂的窗外桶两种子也停地板、对锚点槽之外的前缀逐位不敏感），故必填失败归因。三分归类（并列）：**① 设计问题（主因）**：窗口/锚点按定义只改「谁可见」，不改「谁在近处」——把远处信息搬到当前行的能力不属于可见集裁剪，本项把「窗口便宜不便宜」与「窗口能不能搬远」写在同一个 falsification 里，后半句必然触发。**② 结构问题（次因）**：锚点在引擎里就是「最前面 N 个位置恒可见」（`window_anchor_keep_mask` 的 anchors），它与「sink」是同一根杠杆 ⇒ 「窗口+sink」不是独立于「窗口+anchor」的第二档，milestone 里并列的三档实际是两档。**③ innovation 本身失败：不适用**（本项不提出新机制，只是裁剪可见集）。证据锚点：`2662/results.json` 的 `quality_leg.price`（−0.005583/−0.007294）、`needle_leg`（锚点桶 +2.592/+1.097pp、beyond 桶 CI 含 0）、2634 的 beyond 桶读数、2636 的同 step 四点 Δ。"
conclusion_review: "自评：本项的两条腿现在都有**仓内自包含**证据（2662 的锚点臂 rc=0 复算 + 2636 的 T 子线 + 2634/2638/2639 的窗口臂），旧「未经本口径复现」的缺口已消。风险点：① 主正面主张（锚点召回）在 n=2 下**不可判**，只有质量腿与「不搬远」两条是确定的；② 锚点的质量收益**已做评测期消融（2679）**，但它证明的是「锚点通道被模型用起来」（去掉掉 0.024–0.035），而不是把 0.0056 拆成「推理期可见 / 训练多见键」两半——两向消融都破坏分布 ⇒ 归因仍不可分，下一步写在 `gaps`；③ 2662 目录 `MODEL.md` 未落盘（权重 sha256 已在 `results.json::checkpoints`）。**本轮（2661/2662 的判读）的独立复核由 fresh 复核者承担**；本项此前的冻结块复核为 REVIEW-8（PASS 窄范围）。"
conclusion: "**窗口的价格已定，且「锚点」不是把远处搬近的手段**。① **主曲线（本目录首次自包含）**：`experiments/2662-hard-window-anchor-13m`（rc=0）给出锚点臂（窗口 16 + 锚点 8，seed 0/1）相对同 seed 纯窗臂（窗口 16 + 锚点 0）的 clean bpc 差 = **−0.005583 / −0.007294**（两种子同向 = **质量收益**，越本格自测带 σ_cell=0.000983、**不越** 0.014 跨格带；代价 = 可见键 16→24、每位置多 98,304 B KV）⇒ 人话：**用 50% 更多的可见键换约 0.4% 的质量改善，不是免费改善**（把「窗口 16→全量」差距 0.125421 缩小 4.45%）。② **召回腿在本 n 下不可判**：锚点桶（针植入 p<8）植入 vs 配对无针地板 = **+2.592pp**（seed 0；两比例差 CI（正态近似/未 pooling） 含 0、**配对 bootstrap CI [1.196, 4.187] 不含 0**）与 **+1.097pp**（seed 1；两套 CI 都含 0）⇒ 按预登记「两个 seed 都过才算有区分力」**未达成**（非否证）。③ **锚点不搬远**：窗外（beyond）桶两种子都停在地板（CI 含 0），且锚点臂对**锚点槽之外**的前缀被毁逐位不敏感（判据④变体）⇒ **锚点锁定的是「最前面 8 个位置恒可见」，不是信息右移通道**。⑤ **锚点通道在推理期真的被用起来了，但那条 0.0056 的收益拆不成「推理 vs 训练」两半**：`experiments/2679-anchor-eval-ablation-13m`（同一 checkpoint、只改评测期掩码、0 训练 token）量到——把锚点关掉，锚点臂掉 **+0.035490 / +0.023958** bpc（两 seed 同向、配对 bootstrap CI [0.033367, 0.037660] / [0.022293, 0.025670] 不含 0），是被解释收益（−0.005583 / −0.007294）的 **4.9–6.4 倍**；反向给纯窗臂白加 8 个锚点掉 **+1.882186 / +1.527625** bpc ⇒ 两个模型都只在自己的训练可见集上工作，评测期换掩码是分布外操作。人话：**锚点不是白给的 8 个键（模型把它当通道用，通道价值 0.024–0.035），但它换成 8 个最近键的净差额只有 0.0056；「训练时多见键」与「推理期可见」在本仓是同一根杠杆，评测期消融拆不开**（下一步见 `gaps`）。④ 窗口的价格与 T 子线（旧读数 + 2636 复算）：k=16→128 降 0.114785 bpc（= 补掉「窗口 16→全量」差距的 91.5%）、k=192+8 锚点的训练税 ≈ −0.0028（24×16 口径）、T∈{256,512,1024,2048} 同 step 四点 Δ 全在本格判据量噪声（0.009459）内 ⇒ 「窗口代价随 T 消失」在本 n 下不可判定。验收两读法（C2）：**字面**（k∈{16..192} × {无锚点/锚点} 曲线 + T 子线 + n≥2）**部分成立**——锚点臂 n=2、窗口臂 k∈{16,17,18,24,32,128} 为复用（2634/2638），`sink` 与「锚点」在本仓是**同一根杠杆**（`window_anchor_keep_mask` 的 anchors = 最前面 N 个恒可见位置 = StreamingLLM 式 sink），KV 消融保留曲线未在本目录复算；**实质**（这个手段值不值）**成立且方向已定**：窗口 k≥128 的训练税 ≈0、k=16 的代价可由完备显式状态补回 80.1%（见 1.1.4.1），而「硬窗口/锚点把远处信息搬近」这一读法**被否证**（召回停地板）。旧读数「锚点通道是真产物 needle 76.8%→93.3%」**不可直接引用**：那是另一台仪器（合成口径、无配对地板）上的绝对召回跳变，且其跳变可归因于「距离惩罚」而非锚点槽本身（`.scratch/07-x1-x3/evidence/SUMMARY.md`）⇒ 本项现已用仓内自包含口径取代它。判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。**禁外推**：enwik8 / T=256（T 子线见 2636）/ 13M / 12k 步 / 该可见性快照。"
laws: [9, 10]
