# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "1.1.3"
axis: "1 时间轴"
title: "可见量上限"
dir: "axes/1-time/1.1.3-visibility-cap"

purpose: "给每个 token 的可见量设一个硬上限（最多能看 k 个键），把「前缀可丢」变成结构事实，同时回答「上限设在哪，质量与长程可达性的代价才最小」。"
innovation: "相对普通 decoder-only transformer 的全因果 attention，给每个 token 一个可见键数预算 k（与窗口/锚点如何取无关）。改动量级：只改可见集合的基数上限，不新增参数；attention 的 QKᵀ 与加权项由 O(T²) 降到 O(T·k)。"
expected_effect: "（a）把每 token 的注意力代价钉成常数，长 T 的算力/显存随 T 线性；（b）暴露出「可见量上限」这一维度本身是否独立于「按什么规则选可见位置」而影响质量。"
sota_baseline: "StreamingLLM / Longformer 一族的固定预算可见性；本地锚 = 全因果注意力基线（A2 → axes/7-references，13M B0 = 1.5074 bpc 快照）与 1.1.1 的窗口/锚点保留曲线。"
gap: "1.1.1 测的是「窗口 k / 锚点 / sink 这些具体可见集合」；本项只问「可见量上限 k 本身（不指定选法）」在质量-代价前沿上落在哪——这一维度在本仓未被单独判决，旧格 A3 把两类问题混在一格里。"
method: "单因素：固定可见规则（如滑动窗口或锚点），只变每 token 的可见量上限 k。臂 = {full, k∈{16,32,64,128,192}}。基底恒为 stock decoder-only。证据**只指针到 1.1.1**，本项不另收实验文件。"
validation: "端到端：对照 = 同尺寸 stock 全因果基线（归一为 100%）+ 1.1.1 的窗口/锚点保留曲线；客观判据 = clean bpc（该跌）+ KV 消融保留曲线 + 长程召回；口径 = matched-step / 同 token 预算，禁墙钟。"
objective_criteria: "该跌：clean bpc（可见量上限越小越贵，须越 0.014 噪声带才算可排序）；该涨：可见量上限越大时长程召回（作剂量曲线）；必须不变：每 token 可见键数 ≤ k（结构约束）、因果性单测。"
falsification: "若可见量上限在 k 的一个宽区间内对 clean bpc 与长程召回都无可排序影响 ⇒ 「可见量上限」不构成独立研究维度，应并入 1.1.1（见 1.1.1 的窗口保留曲线）。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014；T 子线借用 1.1.1 的**本格自测带 0.009459**（2636 的判据量跨 seed 极差；四点 |Δ| 全在其内，亦全 < 0.014 ⇒ 两种带下结论方向相同，不混用成同一门槛）。"
failure_analysis: "按 `docs/research-schema.md` §7：本项 `conclusion` 含「手段不成立」型判断——① 「可见量上限」不构成独立维度；② 预登记 `objective_criteria` 的「该涨」腿（k 越大长程召回越高）**未成立**——故必填失败归因。三分归类（并列）：**① 设计问题（主因）**：本项按 MAPPING §3 被设计成 1.1.1 的「拆分位」（只收判据与选项叙述、不接收文件、不另收实验文件），它从来没有过自己的实验判据；而它问的「上限本身（不指定选法）」在本仓**不存在可单独操纵的机制**：限基数的开关只有 `window_anchor_keep_mask`（含 k 与锚点，属 1.1.1）与 `--attn-sparse-k`（属 1.2.3），且两者互斥 ⇒ 「独立维度」这一前提是被**设计**排除的，不是被数据否掉的。**② 结构问题（次因，作用于「该涨」腿）**：可见量上限在本仓只能经「按位置」或「按内容」两种选法实现，而两种选法都把**选谁**的偏好一起带进来 ⇒ 「只加宽上限、不改变选法」的结构性对照不存在；实测因此只能读成「加宽可见量对 clean bpc 有剂量效应（局部统计受益）、对窗外召回无效应（信息确实不在）」。**③ innovation 本身失败：不适用**（本项没有提出新机制，与 1.1.1 共用同一根掩码杠杆）。证据锚点：2638/2639 的 6 个纯窗口臂 bpc、2616 §5.3 的两族评测期剂量曲线、2634 的 beyond 桶植入 vs 配对地板、2616 的「整段窗外 494 根针差恰好 0.000」。"
conclusion: "**「可见量上限」不构成独立于 1.1.1 / 1.2.3 的第三根杠杆**：本仓能限制「每 token 最多看多少」的开关只有两个——**按位置**的 `--train-window` k 与 `--train-anchors` a（同一根可见掩码杠杆，`pathlm/depth_ar.py::window_anchor_keep_mask`，属 1.1.1）与**按内容**的 `--attn-sparse-k` k（top-k 算子，属 1.2.3）；没有「只限基数、不指定选法」的独立旋钮 ⇒ 按本项预登记 acceptance 的「若否」分支：**按预登记走「若否」分支：可见量上限不是本仓的独立旋钮**——位置类子问题归属 `1.1.1`（同一根 `window_anchor_keep_mask` 杠杆）、内容类子问题归属 `1.2.3`（`--attn-sparse-k`）；**Main 已裁（2026-10-14）：不并入、不删除本项，保留为独立条目**（`docs/structure.md` §12 是冻结 SSOT、目录完备性是本项目目的，且本发现改变判断，按 `AGENTS.md` §5 不得删），按内容分支由 1.2.3 承载，本项不另收实验文件（MAPPING §3）。但「上限本身」这一子问题有数据答案，两个方向必须一起读：**（质量腿）该跌成立且可排序** —— 12L/8H/d256/mlp6/T=256/12k 步/seed0 训练口径（2638/2639 的纯窗口 K 臂，目录家 = 1.1.4.1、已列入本项 `experiments`）：k = 16 → 1.628110、17 → 1.624104、18 → 1.619953、24 → 1.599856、32 → 1.595823、128 → 1.513325、全因果 256 → 1.502689（k 16→128 降 0.114785，越 0.014 带）；24×16 评测口径（2616）：另给一条「不重训、评测期只留最近 k」的剂量曲线（`recent` 族，基线 = full 自己的 release 1.483569）：k = 192 → +0.004175、128 → +0.020065、64 → +0.080508、32 → +0.211815（同族 `anchored`（+8 锚点）为 +0.002851 / +0.014677 / +0.059563 / +0.149528；**两族不得混引**，此处取 `recent`＝无锚点族，与「只限基数、不指定选法」的读法一致）。**（召回腿）该涨不成立** —— k=16 时窗外的针停在同掩码地板（2634：植入 vs 配对地板 +0.049pp、95% CI [−1.48, +1.58]pp，无区分力）；把 k 放大到 192+8 锚点，整段落在窗外的 494 根针的差恰好 0.000（2616）⇒ **加宽可见量换来的质量增益来自局部统计，不是把远处信息搬近**。T 子线（2636；7.16M/8L/mlp4/bs8/6000 步、w=T/2）四点 Δ 全落在本格自测噪声内（−0.003542 / −0.004528 / +0.009264 / +0.004186）⇒ 「窗口代价随 T 消失」在本 n 下不可判定。验收两读法（C2）：milestone 字面（k∈{16..192} 的剂量曲线 + 与 1.1.1 对照）**成立**（曲线由 1.1.1 的臂承载）；其实质（是否独立维度 / 有无可与之竞争的同预算方案）按本项自己的 conditional 判 **并入 1.1.1**——同一根杠杆，不存在第二方案。判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。适用范围：该数据 / 该可见性 / 该尺度 / 该快照，禁外推。"
conclusion_review: "自评：结论只由 1.1.1 的臂与 2616/2634/2636 的现成证据推出，未新跑实验、未改判据；「并入 1.1.1」是预登记 acceptance 的 conditional 分支，不是事后改判。风险点：本项 status 由「未开始」改为「已完成」的依据是「问题已被数据回答」，而非「本项自有实验」——若复核认为拆分位不应单独记 `已完成`，应改为「进行中 + 指针」而非改结论。本轮独立复核：**REVIEW-8 = PASS（窄范围）**（fresh 独立上下文、非本项作者；R1 的 P1 与 7 条 P2 逐条复核为真修、16 个数字与盘上原始值逐个对平、12/12 带声明仍在、5 条证据路径全在；无 P0/P1）；历轮判词与处置见 `.scratch/doc-log/axes/1-time/1.1.3-visibility-cap/CHANGELOG.md`。**树级处置已裁（Main，2026-10-14）：不并入、不删除本项**——保留独立条目并在 `conclusion`/`gaps` 记录「不是独立旋钮 + 两个子问题的归属指针」。"
