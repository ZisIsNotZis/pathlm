argument: "本项与 1.1.1 的分工：1.1.1 = 具体可见集合（窗口/锚点/sink）的价格上界；本项 = 可见量上限这一维度是否独立成立。判据链：①机制的同一性——本仓限制「每 token 最多看多少」的只有「按位置的 `window_anchor_keep_mask`（1.1.1）」与「按内容的 `--attn-sparse-k`（1.2.3）」两条既有线，没有第三根可单独操纵的旋钮；②质量腿用两条不同口径的剂量曲线（训练期窗口 k；评测期只留最近 k）证明 k 对 clean bpc 可排序、单调；③召回腿用两件独立仪器在两点（k=16 与 k=192+8 锚点）上证明 k 对窗外召回无区分力，排除「加宽可见量 = 搬近远处信息」；④T 子线用同 step 四点 + 换 seed 复本定出「本 n 下不可判定」。证据只指针到 1.1.1 与 1.1.4.1 的臂（`axes/1-time/1.1.1-hard-window/experiments/`、`axes/1-time/1.1.4.1-explicit-memory/experiments/`）。"
gaps:
  - "无自有实验（按 MAPPING §3：1.1.3 仅取判据/选项叙述，指针 see 1.1.1）——本项 conclusion 的全部数字都引自 1.1.1/1.1.4.1 的臂，不是本项自己测的"
  - "k 的中间点缺：k∈{34..127} 只在评测口径（2616：192/128/64/32）有，训练口径只有 {16,17,18,24,32,128}；下一步最小实验 = 训练口径补 k∈{48,64,96}（3 臂 × 98.3M token，复用 2638 的 train_arms.sh 配方，按 §20 逐臂取放锁）"
  - "「只限基数、不指定选法」的第三个开关不存在 ⇒ 本项无法在架构上独立于 1.1.1（按位置）与 1.2.3（按内容）；若要真正独立收口「上限本身」，最小实验 = 在**同 k** 下直接对撞「按位置窗口 k」与「内容 top-k k」（这正是 1.2.3 的 WP2：复用 2614 的 topk32/topk64/full 臂 + 补 {win32, win64} 两臂 = 2 臂 × 98.3M token），届时本项可与 1.2.3 共用仪器重开；**交叉指针**：位置类子问题 → `1.1.1-hard-window`（窗口/锚点掩码），内容类子问题 → `1.2.3-content-topk`（top-k 基数上限）"
cost_model: "等效理论量：可见量上限 k 把每 token 的可见键数从 T 压到 k，attention 的 QKᵀ 与加权项由 O(T²) 降到 O(T·k)（layer-passes 不变、每层 FLOPs 按 k/T 缩放）。考虑 pipelining：prefill 段按 chunk 流水，decode 段每步只算新增 query 对 k 个键。"

