    boundary: "保留 identity、只改注意力权重 ⇒ 近免费；该读数按 55-review P10 判口径不全（丢 per-head slope 与长度外推），只作旧观测，−0.0068 不得称「改善」"
    source: "axes/1-time/1.1.2-soft-decay/experiments/2507-x1-x3-distance-penalty/README.md"
experiments:
  - ".scratch/07-x1-x3/evidence/attn_dist_telemetry.json @7b47555"
  - "axes/1-time/1.1.2-soft-decay/experiments/2507-x1-x3-distance-penalty"
argument: "旧读数用 clean bpc（税）+ per-head 距离遥测，但没做长度外推、没给 per-head slope；因此只能证明「全头共用固定偏置下同分布 bpc 中性」，不能证明 soft 衰减这一手段本身不成立——这正是 55-review P10 指出的「无目的 + 用错口径」。"
gaps:
  - "per-head 可学习 slope 的判决未做（下一步最小实验：13M、T=256、{per-head slope vs 固定 w} 两臂 × 2 seed；成本按等效 FLOPs 与 token 预算计）"
  - "长度外推（训练短测长）判决未做"
  - "per-head 平均注意距离分布未报（旧遥测只在 .scratch）"
  - "旧格 stub 无仓内 results.json/analysis.md，不能当基线用"
cost_model: "等效理论量：soft 衰减把距离偏置加到 attention logits 上，attention 的 QKᵀ 与加权项仍是 O(T²)（FLOPs 与 layer-passes 不变）；相比硬窗口不省可见量，只改权重分布。固定偏置零新增参数、每 head 1 个 slope 的参数量 O(n_heads)。考虑 pipelining：prefill/decode 均为 dense attention，可按 chunk 流水。"

