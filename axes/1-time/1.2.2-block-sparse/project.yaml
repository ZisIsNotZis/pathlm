# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "1.2.2"
axis: "1 时间轴"
title: "块稀疏 / 条带 / 局部+全局混合（Longformer 式）"
dir: "axes/1-time/1.2.2-block-sparse"

purpose: "用「非均匀但预先固定的可见/合并模式」（块稀疏、条带、局部窗口 + 少数全局 token）在每 token 可见量远小于 T 的前提下覆盖全序列，既避开全注意力的 T² 成本，又保住对少数全局位点的可达性。"
innovation: "相对普通 decoder-only transformer 的全因果 attention，把可见集合从「全部历史」替换为一个固定的非均匀掩码：块稀疏（按块取可见块）、条带（对角线带宽）、局部窗口 + 少数全局 token（Longformer 式）。改动量级：不新增参数，attention 的 QKᵀ 与加权项按非零键数稀疏化（O(T·可见键数)）；迁移入本项的算子侧证据是线性核算子（φ(q)·φ(k) 归一化线性核，O(T) 分块实装，参数量增量为 0）。"
expected_effect: "（a）固定非均匀掩码在更少可见量下保住局部质量，并借全局 token 保住对关键位点的可达；（b）线性核算子把每层算力/缓存压到长度线性、理想推理缓存常数；（c）把这两类点放进「质量-代价前沿」（横轴 = 每 token 等效 FLOPs / 每位置缓存字节，纵轴 = 相对全因果的 clean bpc 与长程召回），与硬窗口、dilated、内容 top-k 同预算比较。"
sota_baseline: "Longformer（local window + global token）、BigBird（块稀疏 + 条带 + 全局）、ETC；线性注意力（Katharopoulos et al. 2020 Linear Transformers、Performer）；本地锚 = stock 全因果注意力基线（A2 → axes/7-references，13M B0 = 1.5074 bpc 快照）。业界条目按 `记忆·未核` 标注。"
gap: "旧格 A6 把「块稀疏 / 线性算子」当选项罗列、无假设；迁移入本项的两个实验（2616、2637）测的是**线性核算子**（一个 O(T) dense-kernel 算子，属算子族而非块稀疏掩码族），**真正的块稀疏 / 条带 / 局部+全局掩码未实装**。且旧「线性更差」的读数取自数值退化（2616 停摆、2637 带伤）或已换算子（QK-Norm 后核被改）的配置，不能当算子规范质量数（2637）。本项增量 = (a) 真块稀疏 / 局部+全局掩码的同预算质量，(b) 线性核在无伤配置下的规范质量点。"
method: "单因素：只改 attention 的可见/合并算子。臂 = {stock 全因果, 块稀疏 / 条带 / 局部+全局掩码（Longformer 式）, 线性核（φ=elu+1，O(T) 分块）}；对齐全序列每 token 可见键数（或每位置缓存字节）。基底恒为 stock decoder-only。"
validation: "端到端：对照 = stock 全因果基线（归一为 100%）；客观判据 = clean bpc（该跌/该不变）+ 每 token 等效注意力 FLOPs 与每位置缓存字节（该跌）+ 长程召回（该涨）；口径 = matched-step / 同 token 预算，禁墙钟。"
objective_criteria: "该跌：每 token 等效注意力 FLOPs 与每位置缓存字节（同预算下）；该涨/该不变：clean bpc 不得越 0.014 噪声带（越界即该可见/合并模式在该尺度有害）；必须不变：因果性（无未来泄漏）、可见掩码在训练与评测一致、参数量相等。"
falsification: "若块稀疏 / 条带 / 局部+全局掩码在同每 token 可见量预算下，clean bpc 相对全因果越 0.014 噪声带且长程召回不越无记忆地板 ⇒ 该可见模式在本尺度不成立；若线性核在无伤配置下仍远差于全因果、且不省等效 FLOPs / 每位置缓存 ⇒ 线性算子在本尺度不成立。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
failure_analysis: ""
conclusion: "紧预算下的非均匀性已判（WP1 的质量腿，n=2，三个固定模式）：同样花 24 个可见键，「最近 16 + 最前 8 恒可见全局槽」（Longformer 式）比「最近 24」**差 0.023 bpc**（Δ = bpc_条带 − bpc_局部+全局：-0.023257 / -0.023168，t = -14.04 / -12.95，两 seed 同向且各自越 0.014 配对带）⇒ 把键预算切一块给全局槽在本尺度**不划算**；参照线：少看的窗口税在条带臂为 -0.096581/-0.095942、在局部+全局臂为 -0.119838/-0.119110，而 200 键的宽剂量点（192+8，**n=1**）与全因果 **不可分辨**（+0.001784，落带内）⇒ 不是掩码实装坏了，是这笔交易不划算。对齐已核：两臂逐行可见键数逐行相等（都 = min(24, i+1)、`n_visible_pairs` 同为 5868）、参数量逐位相等（13,536,768）、六臂模型前向与显式掩码前向逐位相同、复用臂 bpc 逐位复现 2662。 **第三个固定模式（BigBird 式块粒度的确定性成员：最近 16 + 滞后 4 块的一块对齐 8 键）也已判（`2683`，n=2）：Δ = bpc_均匀条带 − bpc_块条带 = −0.011552 / −0.010784（se 0.0016–0.0018、t = −7.35 / −6.05），两 seed 同向但都落 0.014 带内 ⇒ 判「无质量增量」——同字节（294,912 B/位置）下块粒度买不到质量，方向与「键挪得越远越差」的剂量排序一致（条带 1.5986–1.5993 < 块条带 1.6094–1.6108 < 局部+全局 1.6218–1.6225），但按预登记不可排序为「更差」。块条带臂的训练/评测同源三道全过（掩码调用 4,608,048 次、指纹相等、前向逐位相同）⇒ 属定律 10 的「本设计下无信号」，不是实装坏了。评测期反事实（0 训练 token、同一 checkpoint 只换可见集，契约外归因）给出的是一条**可观察事实**：拆掉远块会让该 checkpoint 变差 0.028888 / 0.027640 bpc（两 seed 同向、越带，`experiments/2683-block-stripe-vs-band-13m/attribution.json::per_seed.block8l4_s0.far_block_off.delta_bpc`）；但该操作是评测期换掩码的分布外操作，**同时兼容「远键承载可用信息」与「任何换掩码都要付的分布外罚项」两种解释**，且同一实验里把 8 个远键换成 8 个近键（最近 24，可见键一个都没少、是严格超集）反而掉到 2.0096 / 2.5487（Δ −0.398799 / −0.939319，是 0.028 的 13.8× / 34.0×）——「超集更差」这一不对称未解释 ⇒ **「远键是否承载可用信息」本轮不可判**，与 2679 的反向对照同处理；能区分两者的对照（同形本地键删除、保留远块）记入 `gaps`，本轮不做。合起来只能写：**同 24 键下块粒度不赚；「为什么」不在本实验的可判范围内**——不能写「远块被模型用上」，也不能写「远键没用」。两个反事实读数都在判词之后取得，只作归因、不进判据，且它们本身是分布外操作，量级不可外推。 **WP2 的线性核无伤质量点已取得（`2685`，n=2）**：只把 φ 的求值方式换成无消去形式（`exp(min(x,0)) + relu(x)`，与 `elu(x)+1` 同一个函数）、把分母 guard 的 eps 从 `1e-6` 降到 `1e-30`，核形式、归一化式、参数量、配方都不变；四条健康门全过（跳步 0、`gnorm_max` 9.87 / 10.73 在健康带 9.39–10.80 的 1.2× 上界内、评测前向 `den < 1e-30` 行占比 0、φ 零占比 0，而同一审计里引擎默认档 φ 零占比逐层最大 0.2202 / 0.2447）。质量读数 Δ = bpc_全因果 − bpc_线性 = **−0.076059**（se 0.002228、t −34.14）/ **−0.071275**（se 0.002149、t −33.16），两 seed 同向且都越 0.014 带 5.1–5.4 倍 ⇒ **线性核在本尺度更差**，且这一次的差不是数值塌陷造成的假象。 **召回腿（`2685`，与 `2662` 同一台针仪器、同一判据，每臂 8192 针）**：全因果臂高于地板 24.341 / 25.903pp，线性臂 8.936 / 9.180pp（约全因果的三分之一），三个 24 键模式在 `beyond` 桶上贴地板（−0.056 ~ +0.574pp，两比例差 CI 全含 0）⇒ 率类收益只属于「能看见全长」的那一档。远块专桶 `far_slot`（只有块条带的远块能看见的针，n=33）上 `block8l4_s0` 高于地板 +27.273pp（Newcombe [4.480, 50.066] 与配对 bootstrap [9.091, 45.455] 都过下界），`block8l4_s1` 只过 bootstrap（+21.212pp，Newcombe [−2.319, 44.744]，按 R4 需 `n*`=83），均匀条带与局部+全局在该桶上不高于地板（R3 负对照未被破坏）⇒ 记「一个 seed 立住、另一个样本不足」的**未判出**，既不写成「远块被用上」，也不写成「远块没用」。 **成本腿（`2685`，在产生 bpc 的同一次前向里计数）**：三个 24 键模式的每 token 等效注意力 MAC **逐位相等**（11,736 MAC/token/层），为全因果（65,792）的 **0.178381 倍**（与解析预期 22.922/128.5 一致）；线性臂 33,280 = **0.506 倍**（T=256 一点、对 T 线性）；而三个掩码臂的**实耗** MAC 仍是 65,792（稠密 bool 掩码）⇒ 定律 11 的「纸面省幅不兑现」在这里是一个数。落盘的 `equiv_macs_per_token` 是每层平均每 token（×12 层为整模型量），判的全是臂间比值，与这一口径无关。 **三支分开写**：**本实现不成立 = 否**（掩码活、复用臂等值门 6/6 逐位复现、线性臂四条健康门全过、φ 零占比 0）；**机制不成立 = 是（本尺度、等预算前沿意义上）**——四个点各自出判（局部+全局越带更差 0.023、块粒度落带内无质量增量、线性核越带更差 0.071–0.076、三个 24 键模式率类贴地板）⇒ 省钱的更差、不多花钱的没更好，没有一条在本尺度的质量-代价前沿上占到便宜；**本尺度不可判 = 三条**（「远键是否承载可用信息」——评测期反事实是分布外操作、分布内率类腿只有一个 seed 立住；宽预算 / 更长 T 上的排序——200 键剂量点 n=1、T 只测 256；换真块稀疏核后的省幅与质量——本实装只把 24 个键里的远端 8 个做成块对齐，整张掩码不是块常量）。 旧读数（迁移自旧格 A6，均有伤、禁外推）：线性注意力（归一化线性核 φ=elu+1）在 T=256 / 13M 上不比全因果好——**原实装·带伤** Δbpc = −0.214（den 自 step 800 贴 clamp、gnorm_max 899385、25 次跳步），**稳定化·核已改**（QK-Norm）Δbpc = −0.624（该档把 φ 输入钉在有界区间 ⇒ 核被改、是另一个算子）；这两档只作负观测，规范质量点由 `2685` 的无伤档给出。成本侧：T=256 整模型 2.58×/2.78× 慢、训练峰值显存 1.41×/1.27×（理论推理缓存 −93.6%@T=256，T 越大越接近 −100%）。条带、局部+全局、块粒度三个固定非均匀模式与线性核已在 T=256（掩码臂每位置 24 键）上各自出判决，里程碑的四条验收（各臂每 token 可见量对齐、前沿位置明确、线性核无伤质量点、matched-step 口径且禁墙钟）全部有落盘证据：十臂同为 12k 步 / 98.3M token，墙钟只申报不作判据。"
conclusion_review: "看上去这几条读数站得住：局部+全局对条带两 seed 独立、同向、各自越带（t ≈ 13–14）；块条带对条带两 seed 同向但都落带内（t −7.35 / −6.05，配对标准误 0.0016–0.0018）⇒ 按预登记只能判「无质量增量」，点估计方向不能当「更差」用，也不能当「无差别」用；线性核对全因果两 seed 同向、各自越带 5.1–5.4 倍，且这次是在四条健康门全过的**无伤档**上取的 ⇒ 可以当规范质量点用。三条 24 键模式的质量单调随「键被挪走多远」下降，且与宽预算剂量点（200 键与全因果不可分辨）拼成一个自洽的图：模式本身没坏、紧预算下把键挪出最近处不赚。召回腿的读数与质量腿同向且能自证仪器：全因果 24–26pp 高于地板（阳性对照）、三个 24 键模式贴地板、看不见 `far_slot` 针的均匀条带臂 CI 含 0（R3 负对照未破）。上限清楚：只有 T=256、三个固定模式各一个设定（块粒度只测 LAG=4）+ 一个宽剂量点，n=2 只覆盖主判两臂；`far_slot` 只有 33 针 ⇒ 远块那一条只在一个 seed 上立住（另一个 `n*`=83）；每 token 等效 MAC 落盘的是每层平均量（判的全是臂间比值）。**三支分开写**：本实现不成立 = 否（掩码活、等值门 6/6、健康门四条全过、φ 零占比 0）；机制不成立 = 是（本尺度、等预算前沿意义上）；本尺度不可判 = 「远键是否承载可用信息」（分布外反事实 + 只有一个 seed 的分布内读数）、宽预算 / 更长 T 的排序、换真块稀疏核后的省幅与质量。「块稀疏机制无效」这句仍未取得证据，只能记「本设计下无信号」。旧读数的评价不变：只能作「线性核算子在退化/已改配置下的负观测」，不能当作这一类可见模式的结论。故 status 已完成（里程碑四条验收全部有落盘证据）；独立复核未做。"
