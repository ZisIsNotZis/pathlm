argument: "把「可见模式」与「合并算子」分开，再把「少看键的代价」与「非均匀本身的价值」分开：同 24 个可见键下，全给最近位置的条带臂比「16 最近 + 8 全局槽」好 0.023（两 seed、越带），比「16 最近 + 一块对齐的 8 键远块」好 0.011（两 seed 同向、落带内 ⇒ 不可排序）；而 200 键时同一模式与全因果不可分辨 ⇒ 模式可以工作、只是紧预算下把键挪出最近处这笔交易不划算，且挪得越远越差（全局槽 0.023 > 远块 0.011）。线性核那一路同理只是更彻底：在数值无伤的规范档上仍差 0.071–0.076 bpc（两 seed、越带 5.1–5.4 倍），而它省下的等效 MAC 在 T=256 只有 0.506 倍、三个 24 键掩码臂的等效 0.178 倍根本不兑现为实耗 ⇒ 本尺度上「省算力的低预算注意力」都是拿可测的质量去换纸面的算力。"
gaps:
  - "块粒度的非均匀性只测了一个设定（LAG=4、单块、确定性块，见 experiments/2683）：LAG 扫描（远块离得更近/更远）、随机块、多块、跨块条带都未实装、无读数；下一步最小实验 = 扫 LAG ∈ {1,2,3,4} 的 4 臂同 24 键对照（4 × ≈9 min GPU + 一次评测），问「远块放近一点能不能补回那 0.011」"
  - "引擎默认 φ 求值档的规范质量点未取得：该档在 2616 的 12k 步里数值塌陷（den 自 step 800 贴 clamp、gnorm_max 899385、25 次跳步），而 2685 的 300 步冒烟两档都健康（gnorm_max 9.87 对 9.87、跳步 0）⇒ 冒烟只证明「前 300 步无差别」，不证明「默认档会塌」；要拿到该档的规范点得先让它健康，而那要改核或改配方（= 换算子，2637 的 QK-Norm 档即此）"
  - "线性核的每位置缓存字节（流式状态常数）未实测：2685 只报等效 MAC，byte_axis 那一列如实空着；下一步最小实验 = 在同一个 linear checkpoint 上量单步 decode 的状态字节与 T≥1024 的等效 MAC 比值"
  - "真稀疏/真窗口核把纸面 FLOPs 兑现为等效成本节省未测：2685 把两列数出来了（24 键臂 equiv 0.178381 倍、executed 1.000 倍；线性臂 0.506 倍@T=256），但要在墙钟与显存上兑现仍需真稀疏核实装"
  - "T≥2048 的 n≥2 与第二个规模点未做"
  - "「远键是否承载可用信息」缺一个能区分两种解释的对照：在同一个 block-stripe checkpoint 上只删 8 个**同形本地键**（保留远块）、或在 LAG 内换一块，两 seed 各一遍（0 训练 token，≈3 min GPU）；本轮没做 ⇒ 评测期反事实按「不可判」处理（与 2679 的反向对照同处理），不得读成机制结论"
  - "`far_slot` 专桶只有 33 针：2685 的分布内率类读数在 block8l4_s0 立住、s1 只过配对 bootstrap（Newcombe 下界 −2.319），按 R4 需 `n*`=83；下一步最小实验 = 在同一批 checkpoint 上把该桶补到 ≥83 针（针配置不变、0 训练 token、≈1 min GPU）⇒ 才能把「远块这条路径在率类上可被利用」判到两个 seed"
  - "`flops_count.py::count_attention` 的 `formula.per_token` 字面写「每层 macs / (B·T) 后对层求和」，而实现除以的是 B·T·层数（每层平均）⇒ 落盘 `equiv_macs_per_token` 是每层平均每 token 的量（×12 层才是整模型量）；判的全是臂间比值，与口径无关，但字面要改须动已绑定的契约文件（重绑 + 重跑计数，0 训练 token、≈1 min GPU），本轮只在 analysis.md §6 披露"
cost_model: "等效理论量：块稀疏 / 局部+全局掩码把每 token 可见键数压到 k（局部窗口 + 全局 token），attention 的 QKᵀ 与加权项由 O(T²) 降到 O(T·k)，layer-passes 不变；线性核把每层每头注意力降到 O(T·d)（分块实装常数因子更大），推理缓存从 O(T·d) 降到 O(d_φ²) 常数。考虑 pipelining：prefill 段按 chunk 流水，decode 段线性核每步只更新并读一个常数大小状态，块稀疏掩码每步只对新 query 算 k 个键。"

