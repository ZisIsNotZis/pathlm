# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "1.2.2"
axis: "1 时间轴"
title: "块稀疏 / 条带 / 局部+全局混合（Longformer 式）"
dir: "axes/1-time/1.2.2-block-sparse"

purpose: "用「非均匀但预先固定的可见/合并模式」（块稀疏、条带、局部窗口 + 少数全局 token）在每 token 可见量远小于 T 的前提下覆盖全序列，既避开全注意力的 T² 成本，又保住对少数全局位点的可达性。"
innovation: "相对普通 decoder-only transformer 的全因果 attention，把可见集合从「全部历史」替换为一个固定的非均匀掩码：块稀疏（按块取可见块）、条带（对角线带宽）、局部窗口 + 少数全局 token（Longformer 式）。改动量级：不新增参数，attention 的 QKᵀ 与加权项按非零键数稀疏化（O(T·可见键数)）；迁移入本项的算子侧证据是线性核算子（φ(q)·φ(k) 归一化线性核，O(T) 分块实装，参数量增量为 0）。"
expected_effect: "（a）固定非均匀掩码在更少可见量下保住局部质量，并借全局 token 保住对关键位点的可达；（b）线性核算子把每层算力/缓存压到长度线性、理想推理缓存常数；（c）把这两类点放进「质量-代价前沿」（横轴 = 每 token 等效 FLOPs / 每位置缓存字节，纵轴 = 相对全因果的 clean bpc 与长程召回），与硬窗口、dilated、内容 top-k 同预算比较。"
sota_baseline: "Longformer（local window + global token）、BigBird（块稀疏 + 条带 + 全局）、ETC；线性注意力（Katharopoulos et al. 2020 Linear Transformers、Performer）；本地锚 = stock 全因果注意力基线（A2 → axes/7-references，13M B0 = 1.5074 bpc 快照）。业界条目按 `记忆·未核` 标注。"
gap: "旧格 A6 把「块稀疏 / 线性算子」当选项罗列、无假设；迁移入本项的两个实验（2616、2637）测的是**线性核算子**（一个 O(T) dense-kernel 算子，属算子族而非块稀疏掩码族），**真正的块稀疏 / 条带 / 局部+全局掩码未实装**。且旧「线性更差」的读数取自数值退化（2616 停摆、2637 带伤）或已换算子（QK-Norm 后核被改）的配置，不能当算子规范质量数（2637）。本项增量 = (a) 真块稀疏 / 局部+全局掩码的同预算质量，(b) 线性核在无伤配置下的规范质量点。"
method: "单因素：只改 attention 的可见/合并算子。臂 = {stock 全因果, 块稀疏 / 条带 / 局部+全局掩码（Longformer 式）, 线性核（φ=elu+1，O(T) 分块）}；对齐全序列每 token 可见键数（或每位置缓存字节）。基底恒为 stock decoder-only。"
validation: "端到端：对照 = stock 全因果基线（归一为 100%）；客观判据 = clean bpc（该跌/该不变）+ 每 token 等效注意力 FLOPs 与每位置缓存字节（该跌）+ 长程召回（该涨）；口径 = matched-step / 同 token 预算，禁墙钟。"
objective_criteria: "该跌：每 token 等效注意力 FLOPs 与每位置缓存字节（同预算下）；该涨/该不变：clean bpc 不得越 0.014 噪声带（越界即该可见/合并模式在该尺度有害）；必须不变：因果性（无未来泄漏）、可见掩码在训练与评测一致、参数量相等。"
falsification: "若块稀疏 / 条带 / 局部+全局掩码在同每 token 可见量预算下，clean bpc 相对全因果越 0.014 噪声带且长程召回不越无记忆地板 ⇒ 该可见模式在本尺度不成立；若线性核在无伤配置下仍远差于全因果、且不省等效 FLOPs / 每位置缓存 ⇒ 线性算子在本尺度不成立。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
failure_analysis: ""
conclusion: "紧预算下的非均匀性已判（WP1 的质量腿，n=2）：同样花 24 个可见键，「最近 16 + 最前 8 恒可见全局槽」（Longformer 式）比「最近 24」**差 0.023 bpc**（Δ = bpc_条带 − bpc_局部+全局：-0.023257 / -0.023168，t = -14.04 / -12.95，两 seed 同向且各自越 0.014 配对带）⇒ 把键预算切一块给全局槽在本尺度**不划算**；参照线：少看的窗口税在条带臂为 -0.096581/-0.095942、在局部+全局臂为 -0.119838/-0.119110，而 200 键的宽剂量点（192+8）与全因果 **不可分辨**（+0.001784，落带内）⇒ 不是掩码实装坏了，是这笔交易不划算。对齐已核：两臂逐行可见键数逐行相等（都 = min(24, i+1)、`n_visible_pairs` 同为 5868）、参数量逐位相等（13,536,768）、六臂模型前向与显式掩码前向逐位相同、复用臂 bpc 逐位复现 2662。 旧读数（迁移自旧格 A6，均有伤、禁外推）：线性注意力（归一化线性核 φ=elu+1）在 T=256 / 13M 上不比全因果好——**原实装·带伤** Δbpc = −0.214（den 自 step 800 贴 clamp、gnorm_max 899385、25 次跳步），**稳定化·核已改**（QK-Norm）Δbpc = −0.624（该档把 φ 输入钉在有界区间 ⇒ 核被改、是另一个算子）；**无伤原核质量点未取得**。成本侧：T=256 整模型 2.58×/2.78× 慢、训练峰值显存 1.41×/1.27×（理论推理缓存 −93.6%@T=256，T 越大越接近 −100%）。**块稀疏 / 条带 / 局部+全局掩码本身未实装、无读数**。"
conclusion_review: "看上去非均匀性这条读数站得住：两 seed 独立、同向、各自越带（t ≈ 13–14）、逐行可见键数相等且参数一致，而且它与宽预算剂量点（200 键不可分辨）拼成一个自洽的图：模式本身没坏、只是紧预算下全局槽不值。上限清楚：只有 T=256、两个固定模式 + 一个宽剂量点、n=2 仅覆盖主判两臂；BigBird 式块稀疏未实装，率类召回腿未跑。 旧读数的评价不变：只能作「线性核算子在退化/已改配置下的负观测」，不能当作块稀疏这一类可见模式的结论，也不是算子规范质量数。故 status 进行中；块稀疏掩码的判决实验未做，线性核的无伤质量点未取得。独立复核未做。"
