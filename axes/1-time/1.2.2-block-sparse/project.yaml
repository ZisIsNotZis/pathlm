experiments:
  - "axes/1-time/1.2.2-block-sparse/experiments/2616-linear-attention-13m/analysis.md @76a07a8"
  - "axes/1-time/1.2.2-block-sparse/experiments/2637-linear-attn-quality/analysis.md @76a07a8"
argument: "把「可见模式」与「合并算子」分开：块稀疏/局部+全局改的是**看见谁**（掩码），线性核改的是**怎么合并**（算子）——两者都可压成本但判据不同（前者应省每位置缓存字节，后者只把每层算力降到 O(T)、推理缓存常数）。旧格把两者塞进同一张选项表、无假设（55-review P11），本项把它们作为同预算下的并列臂各自判决；线性臂的旧结论因数值带伤只作负观测。"
gaps:
  - "真块稀疏 / 条带 / 局部+全局掩码未实装、无读数（下一步最小实验：13M、T=256/512、{全因果, Longformer 式 local+global, BigBird 式 block+stripe} 对齐可见键数）"
  - "线性核无伤质量点未取得（数值稳定化会改核，是另一个算子，见 2637）"
  - "真稀疏/真窗口核把纸面 FLOPs 兑现为等效成本节省未测（旧实测为稠密 bool 掩码）"
  - "T≥2048 的 n≥2 与第二个规模点未做"
cost_model: "等效理论量：块稀疏 / 局部+全局掩码把每 token 可见键数压到 k（局部窗口 + 全局 token），attention 的 QKᵀ 与加权项由 O(T²) 降到 O(T·k)，layer-passes 不变；线性核把每层每头注意力降到 O(T·d)（分块实装常数因子更大），推理缓存从 O(T·d) 降到 O(d_φ²) 常数。考虑 pipelining：prefill 段按 chunk 流水，decode 段线性核每步只更新并读一个常数大小状态，块稀疏掩码每步只对新 query 算 k 个键。"

