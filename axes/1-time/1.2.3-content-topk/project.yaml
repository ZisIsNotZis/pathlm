# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "1.2.3"
axis: "1 时间轴"
title: "内容选择 top-k"
dir: "axes/1-time/1.2.3-content-topk"

purpose: "让每个 token 只与「内容上最相关」的少量键交换信息（按 q·kᵀ 选 top-k，不看位置），以在长上下文里省注意力算力、并保住需要内容匹配才能召回的远距离信息。"
innovation: "相对普通 decoder-only transformer 的全因果 attention，只改注意力算子：算出完整 q·kᵀ 分数后只保留分数最大的 k 个键（其余置 −inf 再 softmax），选择只看内容相似度、不看位置远近。改动量级：参数量增量为 0；理论上省掉后半段 P·V 混合（保留键数 −87.5%/−75%，k=32/64），但 q·kᵀ 仍需完整计算。"
expected_effect: "（a）长上下文下把注意力的 P·V 混合部分压到 k/T；（b）在需要内容匹配的长程任务上相对位置窗口更有机会召回远端相关信息；（c）把内容 top-k 点放进「质量-代价前沿」（横轴 = 每 token 等效 FLOPs / 每位置缓存字节，纵轴 = 相对全因果的 clean bpc 与长程召回）判断值不值。"
sota_baseline: "NSA / MoBA（块级内容选择）、H2O（注意力质量选择）；本地锚 = stock 全因果注意力基线（A2 → axes/7-references，13M B0 = 1.5074 bpc 快照）。业界条目按 `记忆·未核` 标注。"
gap: "旧格 A6 的 top-k 实验（2614）判据统计口径含混——配对 t 只量评测批内配对差、不含训练重跑方差（55-review P19），且判据用的 0.014 全局带其来源自否（来源明说「排序声明需要逐格复本」）、按两臂差应约 √2×0.0138≈0.0195（55-review P6）；实测在 T=256 上为负且收益口径（缓存/显存）结构性拿不到（见 conclusion）。本项增量 = (a) 在长 T（≥2048）判「按内容选是否随 T 回本」，(b) 把「按内容选」与「按位置窗口」在同每 token 可见量下正面对撞。"
method: "单因素：只改注意力算子。臂 = {stock 全因果, 内容 top-k（k∈{32,64}），另置「按位置取最近 k」臂作对照}；对齐全序列每 token 可见键数。基底恒为 stock decoder-only。"
validation: "端到端：对照 = stock 全因果基线（归一为 100%）+ 同可见键数的「按位置取最近 k」臂；客观判据 = clean bpc（该跌/该不变）+ 长程召回（该涨）+ 每 token 等效 FLOPs 与每位置缓存字节（该跌）；口径 = matched-step / 同 token 预算，禁墙钟。"
objective_criteria: "该跌：每 token 等效注意力 FLOPs 与每位置缓存字节（同预算下，须真正下降，不能只纸面下降）；该涨/该不变：clean bpc 不得越噪声带（越界即该算子在该尺度有害）；必须不变：因果性、可见键数对齐、参数量相等。"
falsification: "若内容 top-k 在同每 token 可见量下相对「按位置取最近 k」的 clean bpc 与长程召回都不越噪声带（即内容选择相对位置窗口无净增量），或每位置缓存字节结构性无法下降（按内容选必须保留全部 KV 才能筛选）⇒ 内容选择这一算子在本尺度不成立/无收益。（旧 2614 已报 T=256 净亏，见 conclusion。）"
failure_analysis: ""
conclusion: "旧读数（迁移自旧格 A6 的 2614，T=256 / 13M / 12k 步）：内容 top-k 在 T=256 上**净亏**——质量侧 k=32 Δbpc = −0.0166、k=64 Δbpc = −0.0095（配对 20/20、16/20 批同向，t = −7.7 / −4.1；剂量单调，k 越小越差）；成本侧实测上升（整模型一步 ×2.22/×2.25、进程峰值显存 ×1.7），**每位置缓存字节结构性 −0%**（按内容选必须先算出完整 T×T 分数矩阵才能筛键，因此省不了 QKᵀ 与 KV）。交叉点只有公式外推（注意力占比 14.3%@256 → 72.7%@4096），**长 T 端未实测**。判据口径警告：−0.0166 相对旧 0.014 带只是一次单点越界，而该带来源自否、两臂差界约 0.0195（55-review P6），故「k=32 越界」属边缘判定，不作为强结论。"
conclusion_review: "看上去旧读数可信但口径偏软：净亏方向（质量更差 + 实测更慢 + 缓存不省）由配对方向与结构性论证共同支持，站得住；但「越 0.014 即有害」的阈值判定按来源自否的带读属边缘（55-review P6），且配对 t 未含训练重跑方差（P19）。整体是「本尺度本实装下净亏」的负观测，不是内容选择这一思想的普遍否证。故 status 进行中；长 T 与位置对照判决未做。独立复核未做。"
experiments:
  - "axes/1-time/1.2.3-content-topk/experiments/2614-topk-sparse-attn-13m/analysis.md @3597039"
argument: "把「按内容选」与「按位置选」在同可见键数下对撞，才能判断「内容相似度」这一信号本身是否有价值；并指出按内容选的结构性代价（必须先算完整分数矩阵）使其拿不到缓存/显存收益——收益只可能来自 P·V 混合那一半，而它在 T=256 时只占整模型一小部分（注意力占比 14.3%），故实测净亏。旧结论的阈值判读按来源被重新校准（55-review P6），不照抄「越 0.014」的强表述。"
gaps:
  - "长 T（≥2048）的 n≥2 是否回本未测（交叉点只有公式外推）"
  - "与「按位置取最近 k」的同预算正面对照未做"
  - "真稀疏核（自定义 gather，而非稠密打分 + 掩码）把纸面 FLOPs 兑现为等效成本节省未测"
  - "第二个规模点未做"
cost_model: "等效理论量：内容 top-k 保留键数 k（相对 T=256 时 −87.5%/−75%），attention 的 P·V 混合由 O(T²) 降到 O(T·k)，但 q·kᵀ 仍需 O(T²)（按内容选必须算完整分数矩阵），layer-passes 不变；整模型每 token 等效 FLOPs 按注意力占比缩放（T=256 时 −6.25%/−5.36%），每位置缓存字节结构性不变。考虑 pipelining：decode 段每步仍需对全 KV 打分再筛 k，故等效访存不随 k 下降。"

