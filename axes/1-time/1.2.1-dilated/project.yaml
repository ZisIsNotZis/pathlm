argument: "dilated 把「感受野」与「每 token 可见量」这两个常被混同的量分开：硬窗口下二者同增同减，dilated 用固定的可见键数覆盖更远。因此判据必须钉在「同可见键数」上，否则无法把「扩感受野」与「单纯加宽」区分开——这正是旧 A6 把 dilated 列为「同预算对照」想要的东西。长 T 那一轮把同一对照推到 T=1024/2048（同 token 预算、同参数量、同评测仪器，T=256 的四支复用臂逐批复现 2678 的落盘值）之后，「摊开」从带内变成越负带；同时把「远处点怎么分布」当成变量加了一条臂（逐层递增），它相对每层平铺越正带。两条合起来给出本项现在的判词：固定 k 下摊开**挤出近端键的代价随 T 变大**，而**分布方式**（浅层留连续窗口）能把这笔代价抵掉一部分——所以这个设计在长 T 上不是「无效」，而是「默认的那种摊法在长 T 上亏」。"
gaps:
  - "T ≥ 1024 上没有全因果参照臂：`full` 臂需要长度条件的逐头 q/k L2 归一才稳（`1.1.1` 的长 T 线），加了就是第二个因素 ⇒ 「长 T 上摊开相对全因果贵多少」未测（最小实验：4 支臂 ≈ 26 min GPU，须新契约）"
  - "T=1024 只有 seed 0（Δ = -0.01142 只作趋势点）：补 n=2 要再训 1 对臂（`win32-t1024-s1` + `dil32-t1024-s1`）≈ 8 min GPU"
  - "逐层递增臂只有 seed 0（+0.02947 只见一次）：补 n=2 要 1 支 `lad32-t2048-s1` ≈ 4.3 min GPU + 评测"
  - "远处点加密（n_dil 16 → 128）仍未答：`2690` 三次训练-评测共六个臂次里只有两次过预登记入场门（gnorm_max 23.50 / 74.64，其余 119.49 / 495.50 / 524.79 / 44332.79），这两次过门分属不同 seed、方向相反（Δ = +0.02347 / -0.11563）⇒ 按契约「破门作废 + n=1 不落判词」，本轮未取得可用读数。最小实验 = 加长度条件 qk-norm 重做 4 支臂（2 支 144 键 + 2 支 32 键同配方）≈ 20 min GPU，须新契约（预登记后不能改配方补跑）"
  - "合成任务的长 T 复本未做：`2678` 的多查询关联回忆只在 T=256（查询距离 107–240）；长 T 上「掩码能不能搬更远的信息」未测（最小实验：复用同一天 task、T=2048、2 支臂 ≈ 12 min GPU）"
  - "真稀疏核未做：纸面 O(T·k) 未兑现为实测省算力（与 `1.2.2` 共用该缺口）"
  - "单尺寸 13M / k=32 / enwik8 字符级：不外推到 53.9M 及以上、真词表、更大 k（k 的窗口侧由 `1.1.1` 覆盖，内容选择由 `1.2.3` 覆盖）"
cost_model: "等效理论量：dilated 掩码把每 token 可见键数压到 k（近端窗口 k_local + 空洞取的 k_dilated），attention 的 QKᵀ 与加权项由 O(T²) 降到 O(T·k)，layer-passes 不变。考虑 pipelining：prefill 段可按 chunk 流水，decode 段每步只算新增 query 对 k 个键；dilation 只改键的索引集合，不改变每步键数，故 decode 每步等效 FLOPs 与同宽硬窗口相同。"

