# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "1.2.1"
axis: "1 时间轴"
title: "dilated / 空洞"
dir: "axes/1-time/1.2.1-dilated"

purpose: "在每 token 可见量固定（远小于 T）的前提下，让可见集合覆盖到比「最近 k 个」远得多的上下文，从而在省算力的同时尽量少丢远距离可达性。"
innovation: "相对普通 decoder-only transformer 的全因果 attention，只把可见掩码从「最近 k 个位置」换成「近端窗口 + 每隔 dilation 步取一个的稀疏位置」（空洞 / 跨步采样），不改变量、不新增参数。改动量级：可见键数仍固定（如 k_local + k_dilated），attention 的 QKᵀ 与加权项仍为 O(T·可见键数)，相对全因果 O(T²) 省算力；每 token 的可见键数与硬窗口同量级，但有效感受野随 dilation 按层数指数放大。"
expected_effect: "（a）同每 token 可见量下，dilated 掩码比同宽的硬窗口覆盖更远的上下文，长程召回相对硬窗口应抬升；（b）把 dilated 点放进「质量-代价前沿」（横轴 = 每 token 可见键数 / 等效 FLOPs，纵轴 = 相对全因果的 clean bpc 与长程召回），与硬窗口、soft 衰减、块稀疏同预算比较。"
sota_baseline: "Longformer 的 dilated-window 变体与 LongNet 的 dilated attention（跨步采样扩感受野）；本地锚 = stock 全因果注意力基线（A2 → axes/7-references，13M B0 = 1.5074 bpc 快照）。旧格 `原 A5-dilated-window` 已被删除并入 archive（`archive/dropped/axes/A-mixing/A5-dilated-window/`），本项承接其概念。业界条目按 `记忆·未核` 标注。"
gap: "本仓零经验（MAPPING §2「无旧格」）；旧 A6 曾把「位置式稀疏（跨步/膨胀，原 A5-dilated-window）」列为同预算对照选项但从未实装。本项增量 = 把 dilated 掩码真正实装，并在「同每 token 可见键数」下与硬窗口正面对撞，回答「扩感受野是否比单纯加宽窗口更值」。"
method: "单因素：只改 attention 可见掩码。臂 = {stock 全因果, 硬窗口 k, 硬窗口 k + 空洞（dilation∈{2,4}, 每 d 步取一个位置）, 全序列空洞（不保留近端窗口）}。对照时把「每 token 可见键数」对齐（同预算）。基底恒为 stock decoder-only。"
validation: "端到端：对照 = stock 全因果基线（归一为 100%）+ 同可见键数的硬窗口臂；客观判据 = clean bpc（该跌/该不变）+ 长程召回（该涨，相对同宽硬窗口）+ 每 token 可见键数与等效 FLOPs（作对照列，必须与硬窗口相等）；口径 = matched-step / 同 token 预算，禁墙钟。"
objective_criteria: "该涨：dilated 臂的长程召回（相对同可见键数的硬窗口臂）；该跌/该不变：clean bpc（不得越 0.014 噪声带）；必须不变：每 token 可见键数（与硬窗口严格相等，否则不是同预算比较）与因果性。"
falsification: "若 dilated 掩码在同可见键数下相对硬窗口的长程召回不越噪声带，且 clean bpc 无改善 ⇒ dilated 这一可见结构在本尺度无净增量、不成立；若 dilated 掩码的召回相对全因果退到 chance ⇒ 扩感受野在此规模未能搬运远距离信息。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
failure_analysis: "三件事分开记：①**设计/结构**：可见范围确实变远（每行最远可达距离 31 → 255），但 enwik8 字符级的局部先验足以补上这片上下文（`atlas/playbook.md` 定律 9 的「模型不需要」），12k 步没有任何压力迫使它去用远处那 16 个点；②**判据/仪器**：长程召回电池在 13M / 12k 步上四臂全贴 chance（仪器在本尺度无分辨力，`analysis.md` §1 的 ②/③ 两行），所以「远距离信息能不能被搬」这件事本身不能靠这件仪器回答（换成合成关联回忆后已回答：机制搬得动，见结论②）；③**实现**：稠密 bool 掩码只改可见集，纸面的 O(T·k) 省算力一点没兑现，因此这条也不构成「空洞不省算力」的证据。⇒ 本项按两半结：真实文本这一半判「无质量增量」（据预登记否证线成立），需要远处信息这一半判「机制可用」（据合成关联回忆成立），两半的读数与限定见 `conclusion`，不得读成「空洞采样没有价值」。按预登记否证线的字面条件与 `run.py` 实际使用的规则之间的差异见 `2678.../analysis.md` §1 的声明。**长 T 那一轮的归因（本轮新增，写在长 T 的结论旁）**：①**设计/结构**：远处位置的覆盖率随 T 塌缩（16 个远处点在 2048 长的前缀上间距 ≈ 136、整行覆盖 1.6%），挤出 16 个近端键的代价在长 T 上超过远处信息的收益——但**不是**「模型不需要远处信息」：判据③ 显示去掉远处点会更痛（D 从 0.10204 涨到 0.31570）；②**判据/仪器**：长 T 那轮本仪器在三个 T 上 1.96·SE 都 < 0.014（0.00484–0.00945），带内不是仪器侧结论，所以 T=2048 的越负带是可判的；③**实现**：`2690` 的 144 键臂在无 qk-norm 时训练不稳（三次训练-评测共六个臂次里只有两次过 `gnorm_max < 100` 的门：23.50 / 74.64 对 119.49 / 495.50 / 524.79 / 44332.79；同一 seed 重训一次就能从 119.49 → 495.50 → 23.50）⇒ 「加密远处点」这条补救路在本配方下先撞稳定性门；结构 / 参数量 / 等值门三条都过，所以那也不是掩码写错。**本轮没有失败实现上的事**：三族掩码的结构核查、转换核对与等值门在重绑后的重跑中全部通过。"
conclusion: "尺度依赖的三条判决 + 一条仍开着的岔口。①**T=256：无质量增量（n=2，沿用 `2678` 并逐批复现）**：13M / 12k 步 / enwik8 字符级下，同 32 个可见键把位置摊开（近端 16 + 16 个按行铺满前缀的空洞点）相对取最近 32 个，clean bpc 差 Δ = bpc_win − bpc_dil = **+0.01195 / +0.00696**（两 seed 同向但都落 0.014 配对带内）⇒ 无质量增量；相对全因果的少看键代价：窗口臂 −0.09462、空洞臂 −0.08267（只回收 0.0120）。②**T=2048：摊开明确更差（n=2，本轮改判）**：同 token 预算（98.3M）、同参数量（7,421,440）、同评测仪器下 Δ = **−0.02794 / −0.03147**，两 seed 同向且各自越**负**带 2.0 / 2.2 倍（20 批配对，1.96·SE = 0.00492）；T=1024（单 seed）的 Δ = −0.01679，但该点**跨带边界**——三次独立训练-评测在同一点给 −0.01142 / −0.01142 / −0.01679，所以只作趋势点、不写「越带」也不写「带内」。⇒ 「真实文本上摊开不换质量」在长 T 上收紧成「有质量损失」，作用域 = 13M / dense / enwik8 字符级 / 98.3M token / k=32；零点在 T=256 与 T=1024 之间（每翻一倍 T 约降 0.013，仅按观测点描述）。③**逐层递增 dilation 买到 +0.02947（n=1）**：`lad32`（第 ℓ 层 stride 2^ℓ、第 0 层因此逐位等于窗口 32）相对「每层都摊满前缀」的 `dil32` 便宜 +0.02947 bpc（t = 19.33、20/20 批同向、越正带 2.1 倍；只见一次）⇒ **远处点的分布方式本身值钱**：浅层保持连续窗口、只让深层摊远，与窗口臂的差缩到 −0.00153（未配对检验的描述量、落带内）。④**远处键的边际价值随 T 上升（判据③，描述量）**：把某支空洞臂的远处点全去掉、只留近端 16 个重评测，D(T) = +0.10204（T=256）→ +0.20217（T=1024）→ +0.31570（T=2048），D(2048) − D(256) = +0.21366 ⇒ 模型在长 T 上确实**更依赖它读到的那些远处位置**；但它仍然输给最近 32 个 ⇒ 远处位置有信息，而摊开这 16 个点的覆盖率代价（32/2048 = 1.6%）更大。⑤**「加密远处点能不能买回」仍开着**：`2690` 三次训练-评测共六个臂次里只有两次过预登记入场门（`gnorm_max` 23.50 / 74.64，其余 119.49 / 495.50 / 524.79 / 44332.79），而这两次过门分属不同 seed、方向还相反（Δ = +0.02347 与 −0.11563）⇒ 按契约「破门作废 + n=1 不落判词」，**本轮未取得可用于判词的读数**（该实验 `results.json` 里的机械判词不得当结论读）。**与 `2678` 的关系是尺度依赖不是矛盾**：两轮的 T=256 读数是同一条（本实验仪器 4 支复用臂逐批 bpc 与 `2678` 逐位相同），变的是 T；不得用长 T 的反向结果改写 T=256 的判词，也不得把两轮的「无增量 / 更差」合并成一句跨尺度结论。**不外推**：无 T ≥ 1024 的全因果参照臂、T=1024 与逐层臂各只有 1 个 seed、稠密 bool 掩码没把纸面 O(T·k) 兑现成实测算力。"
conclusion_review: "自评：判据线（同可见键数、0.014 配对带、配对表、判词分支、入场门 100）写在各实验的 `README.md` §4 与 `config.json`，应用它们的 `run.py` 一起被 `tools/prereg_bind.py` 绑定。**本轮的定序是成立的那种**：修完三处汇总阶段的缺陷（`2689/run.py:499` 的 TypeError、`main_verdict.answer` 不分正负方向、`delta_directions` 漏声明四个 Δ 字段）后依次重绑到 15:06:13 → 15:07:11 → 15:57:45（最终 `run.py` 哈希 `73c27847…`），每次重绑后都把 7 支臂全部重训、评测重跑，使进入判据的每一份读数都由绑定后的代码产出（`prereg_bind --check`：与绑定不符 0、本实验读数全部「分提交有先后」）。**三次独立训练-评测给出同一方向的判词**（T=2048 的 Δ 依次 −0.02768/−0.03252、−0.02938/−0.03357、−0.02794/−0.03147，三次都越负带），这比单次更像真效应而不是种子噪声；代价是**同一批臂的最新读数不是第一次跑出来的那份**，所以本文件一律引用最后一轮的落盘值，并把三轮对照写在 `2689.../analysis.md` §6。**一处必须收窄的表述**：T=1024 单 seed 的带分类在三次重训里不稳（−0.01142 / −0.01142 / −0.01679），所以它只作趋势点，不写成「越带」也不写成「带内」。**仍缺**：① 独立复核（fresh 上下文）本轮**未跑**，判词应由 `axis1-reviewer` 按落盘产物复核（执行方不自评）；② `2678` 那批读数的定序仍不可判（`harness/prereg_debt.tsv` 有存量条目：bind-window / same-commit / no-hash），本轮不替它补绑、不新增基线行；③ `2690` 的机械判词与预登记入场门冲突时以入场门为准，这一点只在它的 `analysis.md` 与人话里声明，`results.json` 本身不重写。"
