# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "1.2.1"
axis: "1 时间轴"
title: "dilated / 空洞"
dir: "axes/1-time/1.2.1-dilated"

purpose: "在每 token 可见量固定（远小于 T）的前提下，让可见集合覆盖到比「最近 k 个」远得多的上下文，从而在省算力的同时尽量少丢远距离可达性。"
innovation: "相对普通 decoder-only transformer 的全因果 attention，只把可见掩码从「最近 k 个位置」换成「近端窗口 + 每隔 dilation 步取一个的稀疏位置」（空洞 / 跨步采样），不改变量、不新增参数。改动量级：可见键数仍固定（如 k_local + k_dilated），attention 的 QKᵀ 与加权项仍为 O(T·可见键数)，相对全因果 O(T²) 省算力；每 token 的可见键数与硬窗口同量级，但有效感受野随 dilation 按层数指数放大。"
expected_effect: "（a）同每 token 可见量下，dilated 掩码比同宽的硬窗口覆盖更远的上下文，长程召回相对硬窗口应抬升；（b）把 dilated 点放进「质量-代价前沿」（横轴 = 每 token 可见键数 / 等效 FLOPs，纵轴 = 相对全因果的 clean bpc 与长程召回），与硬窗口、soft 衰减、块稀疏同预算比较。"
sota_baseline: "Longformer 的 dilated-window 变体与 LongNet 的 dilated attention（跨步采样扩感受野）；本地锚 = stock 全因果注意力基线（A2 → axes/7-references，13M B0 = 1.5074 bpc 快照）。旧格 `原 A5-dilated-window` 已被删除并入 archive（`archive/dropped/axes/A-mixing/A5-dilated-window/`），本项承接其概念。业界条目按 `记忆·未核` 标注。"
gap: "本仓零经验（MAPPING §2「无旧格」）；旧 A6 曾把「位置式稀疏（跨步/膨胀，原 A5-dilated-window）」列为同预算对照选项但从未实装。本项增量 = 把 dilated 掩码真正实装，并在「同每 token 可见键数」下与硬窗口正面对撞，回答「扩感受野是否比单纯加宽窗口更值」。"
method: "单因素：只改 attention 可见掩码。臂 = {stock 全因果, 硬窗口 k, 硬窗口 k + 空洞（dilation∈{2,4}, 每 d 步取一个位置）, 全序列空洞（不保留近端窗口）}。对照时把「每 token 可见键数」对齐（同预算）。基底恒为 stock decoder-only。"
validation: "端到端：对照 = stock 全因果基线（归一为 100%）+ 同可见键数的硬窗口臂；客观判据 = clean bpc（该跌/该不变）+ 长程召回（该涨，相对同宽硬窗口）+ 每 token 可见键数与等效 FLOPs（作对照列，必须与硬窗口相等）；口径 = matched-step / 同 token 预算，禁墙钟。"
objective_criteria: "该涨：dilated 臂的长程召回（相对同可见键数的硬窗口臂）；该跌/该不变：clean bpc（不得越 0.014 噪声带）；必须不变：每 token 可见键数（与硬窗口严格相等，否则不是同预算比较）与因果性。"
falsification: "若 dilated 掩码在同可见键数下相对硬窗口的长程召回不越噪声带，且 clean bpc 无改善 ⇒ dilated 这一可见结构在本尺度无净增量、不成立；若 dilated 掩码的召回相对全因果退到 chance ⇒ 扩感受野在此规模未能搬运远距离信息。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
failure_analysis: "三件事分开记：①**设计/结构**：可见范围确实变远（每行最远可达距离 31 → 255），但 enwik8 字符级的局部先验足以补上这片上下文（`atlas/playbook.md` 定律 9 的「模型不需要」），12k 步没有任何压力迫使它去用远处那 16 个点；②**判据/仪器**：长程召回电池在 13M / 12k 步上四臂全贴 chance（仪器在本尺度无分辨力，`analysis.md` §1 的 ②/③ 两行），所以「远距离信息能不能被搬」这件事本身不能靠这件仪器回答（换成合成关联回忆后已回答：机制搬得动，见结论②）；③**实现**：稠密 bool 掩码只改可见集，纸面的 O(T·k) 省算力一点没兑现，因此这条也不构成「空洞不省算力」的证据。⇒ 本项按两半结：真实文本这一半判「无质量增量」（据预登记否证线成立），需要远处信息这一半判「机制可用」（据合成关联回忆成立），两半的读数与限定见 `conclusion`，不得读成「空洞采样没有价值」。按预登记否证线的字面条件与 `run.py` 实际使用的规则之间的差异见 `analysis.md` §1 的声明。"
conclusion: "两半结论，强度不同。①**真实文本上无质量增量（这一半被否证，n=2）**：13M / T=256 / 12k 步 / enwik8 字符级下，同 32 个可见键把可见位置摊开（近端窗口 16 个 + 16 个按行铺满前缀的空洞点）相对取最近 32 个，clean bpc 差 Δ = bpc_win − bpc_dil = **+0.01195**（seed 0，t = 2.48、15/20 批同向）与 **+0.00696**（seed 1，t = 1.69、13/20 批同向），两 seed 同向但**都落 0.014 配对带内** ⇒ 无质量增量；可达距离 31 → 255 是结构事实、换不到质量（相对全因果的少看键代价：窗口臂 −0.09462、空洞臂 −0.08267，只回收 0.0120）。②**需要远处信息时掩码可用（这一半成立，n=2）**：多查询关联回忆（key 全在序列最前 16 个位置、查询距离 107–240，窗口臂根本够不到）上，空洞臂 **0.36121 / 0.36853** 对窗口臂 **0.0155 / 0.01611**（chance 0.0156 ⇒ 23.1× / 23.6× chance），配对 Δ = acc_win − acc_dil = −0.3457（95% CI −0.3524…−0.3387）/ −0.3524（−0.3589…−0.3460），两 seed 同向且都不含 0 ⇒ 「空洞搬不动远处信息」不成立。**两条限定必须与结论一起读**：(a) **构造性差异**——这对合成臂的差别是「能不能覆盖到」（窗口臂看不到 key），所以它只支持「掩码确实交付了远处信息」，**不得**读成「同等可见键下 dilation 是更优的取样方式」，后者在真实文本读数上恰恰是被否证的那一半；(b) **仪器侧**——召回电池（判据②③）在本尺度**无分辨力**（每档加密到 64 批 × 32 样本 = 2048 样本/臂后，所有臂在所有档的准确率都 ≤ 0.94× chance；8 批那版「CI 不含 0」的 d64/d128 在 8 倍样本下退成 +0.005~+0.013 的系统偏置），所以「判据②给不出正向证据」的正当理由是仪器不够，**不是**「无信号」。判词不外推到长 T、逐层递增 dilation、真稀疏核与更大规模；稠密 bool 掩码没有把纸面的 O(T·k) 省算力兑现成实测省算力。"
conclusion_review: "自评：判据线（同可见键数、0.014 配对带、率类走 CI、四臂对齐核查）写在 `README.md` §4 与 `config.json`，应用判据的 `run.py` 与它们一起被 `tools/prereg_bind.py` 绑定；但**「契约先于读数」对本项不可判**：`prereg_binding.json::readings_existing_at_bind` 显示绑定那一刻实验根的 `results.json` 与两条空洞臂读数（`runs/dil32-s{0,1}/results.json`）都已存在 ⇒ 判据线与判词规则都写在读到数字之后，`tools/prereg_bind.py --check` 只要求判序锚重跑过。结论成立与否不靠这个定序：复用的 `win32` / `win32_s1` 读数逐批复现 `2676` 的落盘值（口径未漂移），判词由 `run.py` 按 `config.json::verdict_rules` 机械生成。判词规则与 `README.md` §4 字面否证线的差异、判据③的 d=32 前提不成立、判据⑤的「同 seed 逐位相同」只有构造路径同源这一类证据，都逐条声明在 `analysis.md` §1。独立复核对上一版判 BLOCK（读数站得住，阻塞在文档与判词推导）；本轮按它逐条修正，修正后的版本尚无独立复核。"
