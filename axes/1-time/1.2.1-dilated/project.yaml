    change: 同可见键数（32）下把可见位置摊开（近端 16 + 16 个空洞点）对取最近 32 个
    touches_trunk: true
    metric: clean bpc Δ（连续窗口 − 空洞；正 = 空洞更好；两 seed 都未越 0.014 带 = 无质量增量）
    delta: '+0.01195'
    delta_direction: comparator_minus_arm
    comparator: 最近 32 个位置的连续窗口（每行可见键数逐行相等）
    scale: 13M / L=8 / T=256 / 12k 步 / 98.3M token / 20 批配对 / seed 0 与 seed 1
    boundary: 真实文本：落 0.014 配对带内（seed 1 = +0.00696）⇒ 无质量增量，可达距离 31 → 255 不构成质量收益；
      召回电池在本尺度无分辨力（2048 样本/档仍 ≤0.94× chance）。需要远处信息时机制可用（合成关联回忆 n=2：空洞臂
      23.1× / 23.6× chance、窗口臂贴 chance），但那对臂的差别是「能不能覆盖到」而非「同等覆盖下谁更省」；
      稠密 bool 掩码未兑现纸面省算力
    source: axes/1-time/1.2.1-dilated/experiments/2678-dilated-vs-window-13m/analysis.md
experiments:
  - "axes/1-time/1.2.1-dilated/experiments/2678-dilated-vs-window-13m"
argument: "dilated 把「感受野」与「每 token 可见量」这两个常被混同的量分开：硬窗口下二者同增同减，dilated 用固定的可见键数覆盖更远。因此判据必须钉在「同可见键数」上，否则无法把「扩感受野」与「单纯加宽」区分开——这正是旧 A6 把 dilated 列为「同预算对照」想要的东西。"
gaps:
  - "长 T（≥2048）上「摊开可见位置」是否回本未测：本项只有 T=256、k=32 一点"
  - "逐层递增 dilation（LongNet 式）未测：本实验各层用同一张掩码"
  - "真稀疏核未做：纸面 O(T·k) 未兑现为实测省算力（与 `1.2.2` 共用该缺口）"
  - "真实文本 + 长 T 下「摊开可见位置」值不值未测：合成关联回忆已证明远处信息搬得动（n=2），但那是「能不能覆盖到」，不是「真实语料上会回本」"
  - "两个 seed、单尺寸 13M：不外推到 53.9M 及以上；k=32 之外只由 `1.2.2` / `1.2.3` 的臂覆盖"
cost_model: "等效理论量：dilated 掩码把每 token 可见键数压到 k（近端窗口 k_local + 空洞取的 k_dilated），attention 的 QKᵀ 与加权项由 O(T²) 降到 O(T·k)，layer-passes 不变。考虑 pipelining：prefill 段可按 chunk 流水，decode 段每步只算新增 query 对 k 个键；dilation 只改键的索引集合，不改变每步键数，故 decode 每步等效 FLOPs 与同宽硬窗口相同。"

