# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "1.1.4.5"
axis: "1 时间轴"
title: "implicit（掩码/窗口，已证退化）vs **explicit**（有希望的方向）"
dir: "axes/1-time/1.1.4.5-implicit-vs-explicit"

purpose: "对「把前缀信息搬到右侧」这件事正面对撞 implicit（靠掩码/窗口逼模型）与 explicit（给写通道 + 迫使使用的训练目标），判定 implicit 是否已证退化、explicit 是否是有希望的方向。"
innovation: "相对普通 decoder-only transformer：对比两类右移机制——implicit = 只改可见掩码（窗口/衰减），逼模型自己把信息留在近处；explicit = 加显式写通道（delta/plain）+ 迫使使用的训练目标。改动量级：implicit 零新增参数；explicit 见 1.1.4.1。"
expected_effect: "（a）给出「implicit 是否已证退化」的本地判决；（b）给出 explicit 相对 implicit 在同任务/同预算/同仪器下是否有可排序优势。"
sota_baseline: "explicit 记忆：Compressive Transformer（compression loss）、Memorizing Transformer、RMT、AutoCompressors、ICAE；implicit：StreamingLLM / Sliding-Window；本地锚 = stock 全因果基线（A2 → axes/7-references，13M B0 = 1.5074 bpc 快照）。业界条目按 `记忆·未核` 标注。"
gap: "55-review P14 指出旧格 A9 与 1.1.1 实质重复（同族同判据）；55-review §6 缺「implicit vs explicit 同仪器/同预算正面对撞」。本项增量 = 同一任务、同一物理预算、同一保留仪器下的正面对撞。"
method: "单因素：同一任务、同一预算、同一保留仪器下比 {implicit（掩码/窗口，只看最近 k）, explicit（加 delta 写通道）}。基底恒为 stock decoder-only；explicit 的实现与读数见 1.1.4.1（本项只做对撞与判决）。"
validation: "端到端：对照 = stock 全因果基线（归一为 100%）+ 同掩码无记忆地板；客观判据 = 窗口外针召回（该涨/该停在 chance）+ KV 消融保留曲线 + clean bpc；口径 = matched-step / 同 token 预算，禁墙钟。"
objective_criteria: "该涨：窗口外针召回（explicit 相对同掩码无记忆地板；implicit 应停在 chance）；该跌：无；必须不变：训练/评测掩码一致、因果性。"
falsification: "若 implicit 臂的窗口外召回等于同掩码地板（已观测 beyond-window 0.4%、win16 0.92× chance），且 explicit 臂相对地板也不越噪声带 ⇒ 两类都搬不动、本项「explicit 是有希望的方向」被否证。 用哪个带（C1 裁决）：长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014；bpc 差用 0.014 bpc 带（限配对 Δ、≥5 窗口）。"
failure_analysis: ""
conclusion: "对撞已判（`experiments/2661-implicit-vs-explicit-recall-13m/`，6 臂纯推理、预登记 8 条判据线逐条过；`full rc=0`）：**「完备显式机制（逐层独立状态 + 内容写门，γ=1）能把窗口 16 丢掉的信息搬回来；只压缩可见性的 implicit 路完全搬不动」**。① 质量腿：`carrypl16_s0` clean bpc = 1.527595 vs 同窗口 implicit `win16_s0` = 1.628110，配对 Δ = **+0.100515**（CI [0.094630, 0.106286]；= 60.5× 本格 σ_cell 0.001661、7.2× 跨格 0.014），补回「窗口 16 → 全量」差距 0.125421 的 **80.1%**。② 可检索性腿（needle v3；同索引硬子集 n=2699 = 六臂无针控制全答不出的针）：`carrypl16_s0` 召回 **10.226%**（276/2699，Wilson [9.139%, 11.426%]），implicit 两臂 0.704% / 1.000%，对撞差 **+9.522pp**（两比例差 CI（正态近似/未 pooling） [8.336, 10.708]；对 seed 1 为 +9.226pp）；该子集盲猜 ≈0.49% ⇒ explicit ≈21× 盲猜，但**只答出约十分之一**。③ 仪器前提：无通道臂对被毁前缀逐位不敏感（max|Δlogit| = 0.0），完备机制敏感 **Δbpc_far = +0.032965**（逐簇配对 CI [0.026986, 0.038727]，为 2634 退化实现 +0.0158 的 2.1×）、关掉通道后精确归零 ⇒ 前缀只能经显式状态到达被评行。④ 负对照：implicit 两臂整体 beyond 桶相对配对地板 +0.049pp / −0.135pp（CI 均含 0），逐位复现 2634 的「无区分力」。⑤ 分层结论：成立的是「这一类机制能搬回来」；不成立的是「随便配都行」——同机制 γ=0.99（T=256 下只留 7.6% 历史）与退化的单共享槽实现，整体 beyond 桶召回都停回地板（+0.709 / +0.049 / +0.159pp，CI 均含 0）。验收两读法（C2）：**字面**（同任务/同预算/同仪器下 {implicit, explicit} 的窗口外召回 + KV 保留曲线 + clean bpc，对照 stock 全因果、n≥2）**大部分成立**：三类臂同批同窗口序同针位、delta 写这一类有 n=2（`carry16_s0/s1`；完备变体 `carrypl16_s0` 为 n=1），对照的 stock 全因果锚（1.502689）取自同族 2638/2639（本实验未含 `full` 臂）；**实质**（「explicit 是有希望的方向」）**成立**——该命题的预登记否证条件（implicit 与 explicit 都停在同掩码地板）**未触发**。边界（两条必须一起读）：① **判据① 是必要条件门**——该同索引硬子集地板 ≡ 0，任何召回 >≈0.2% 的臂都会过（退化的 `carry16_s0` 1.593% 也过）⇒ 有判别力的是 **①b 的跨臂差（+9.522pp）与 ② 的负对照**；② 另有一个**口径不同的机械聚合** `needle_leg.judgement.intervention_arms_all_pass = false`（臂集 = 所有带通道臂、统计在**整体 beyond 桶 n=8178**、而非判据①的硬子集 n=2699）⇒ 按它读**不过线**；但本项预登记的主对撞是 `carrypl16_s0` vs `win16_s0`（`needle_leg.criterion_rule`），γ=0.99 与退化实现在预登记里是**对照组**、本就不应越地板 ⇒ 以主对撞为准、并列登记（见 gaps；口径归因裁决与复核判词见 ticket 62 §10.26/§10.28）。判据带（C1 裁决）：长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014；bpc 差用本格自测带 σ_cell 为主判、0.014 为参考。禁外推：enwik8 / T=256 / 13M / 12k 步 / 该可见性快照。"
conclusion_review: "自评：读数全部来自已有 checkpoint 的纯推理，预登记契约（`README.md` §4 的 8 条判据线）写下后未改，六臂同批、同窗口序、同针位；过线的核心是「质量腿 + 可检索性腿同向 + 仪器前提兜住」三条同时成立（判据⑤另给出与 2638/2639 记录值**逐位复现**的强证据）。弱点（已进 gaps）：①完备臂只有 seed 0 ⇒ 主对撞无训练种子重复，而 γ=1 vs γ=0.99 在硬子集召回上是 10.226% vs 2.853%（3.6×）⇒ 配置敏感度大于 CI；②对撞的是「类」，`carrypl16` 相对 `carry16` 的三个自由度（逐层状态 / 写入源 / chunk 64→256）不可归因（与 1.1.4.1 的 F8 同一缺口）；③单一窗口序、纯推理快照、T=256；④更严的聚合口径 `intervention_arms_all_pass=false` 与主对撞口径的差异已并列登记。**本轮独立复核**由 ticket 62 §10.26 的 fresh 复核承担（判词落盘后回填本字段）。"
