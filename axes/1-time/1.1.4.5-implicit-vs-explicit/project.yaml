argument: "用 KV 消融保留曲线与同掩码无记忆地板把「局部统计补全」与「真搬动」分开：implicit 臂的窗口外召回等于地板说明信息没被搬走；explicit 臂的正面证据（毁源敏感度 + 跨种子 delta 优势）在 1.1.4.1。"
gaps:
  - "**本实验未含 `full` 臂**：对照的 stock 全因果锚（1.502689）取自同族 2638/2639，并由判据⑤的逐位复现兜住等值性；若要在同一进程内直接对撞全因果，需补一臂（0 训练 token，复用 2610 trunk）"
  - "缺「前缀可丢」的端到端协议（训练期右移 → 推理期真丢前缀 KV → 目标仍可测）"
  - "缺 AR 仍 causal 的验收条件（丢前缀后是否长出非因果捷径）"
  - "**完备臂的种子重复缺失**：`carrypl16_s0` / `carrypl16d_s0` 都只有 seed 0 ⇒ 主对撞的 CI 里没有训练种子方差（σ_cell 只由 win16/carry16 两对算出，外推到 carrypl16 无依据）；下一步最小实验 = 训 `carrypl16_s1`（1 臂 × 98.3M token）+ 复用本实验 `run.py` 评测（纯推理）"
  - "**γ 只测 {1.0, 0.99} 两点**（0.99 在 T=256 下只留 7.6% 历史）⇒ 「要多少保留才够」未扫；下一步最小实验 = γ ∈ {0.999, 0.9999} 两臂"
  - "**召回增益不可归因**到「逐层独立状态」还是「内容写门 / 当前 hidden 写入」还是「chunk 64→256」——E1 把前两者绑在同一开关（与 1.1.4.1 的 F8 同一缺口）"
  - "**更严的聚合读法未采用（已并列登记）**：`needle_leg.judgement.intervention_arms_all_pass=false`（四条带通道臂全过）与本项主对撞口径（`carrypl16_s0` vs `win16_s0`，见 `needle_leg.criterion_rule`）不一致；本项按预登记的主对撞口径判，更严读法留给复核者与 Main 裁"
cost_model: "等效理论量：implicit 零新增参数、attention 可见键数由 T 降到 k（O(T²)→O(T·k)）；explicit 每 token 额外 O(d·d_state) 写读、状态与 T 无关（见 1.1.4.1）。两者在同 token 预算下比。考虑 pipelining：implicit 走 chunk 流水；explicit 状态更新并入 decode 流水。"

