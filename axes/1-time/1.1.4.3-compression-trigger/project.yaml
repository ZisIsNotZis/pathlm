experiments:
  - "axes/1-time/1.1.4.3-compression-trigger/experiments/2615-priority-shootout-13m/analysis.md @4d4ecb0"
  - "axes/1-time/1.1.4.3-compression-trigger/experiments/2615-priority-shootout-13m"
argument: "用「同可见性对数预算」对齐把「删得更省」与「删得更聪明」分开——旧格的字面优势被证明来自前者；并指出「LRU 式增量搬运」更严谨的对应物是写入算子（delta，见 1.1.4.1），不是驱逐调度。"
gaps:
  - "判据错配未修：需在固定 ρ 下报重建质量 + ρ-质量曲线（下一步最小实验：13M、固定 ρ∈{2,4,8}，三规则 × 保留/重建）"
  - "未测流式（只看过去）LRU 与 >13.5M/T=256 规模"
  - "旧 notes「业界无人占位」与 PRIOR_ART 矛盾（P23），随旧格退役"
  - "召回腿的**判据不可判（C1 细分）**：2615-priority-shootout 的 `results.json` **未存**逐针配对记录/CI，而本项 `falsification` 声明的率类带是「配对 bootstrap / Wilson 95% CI 不含 0」⇒ 「+1.71pp 算不算越带」用现盘证据答不了（实验早于 §12.1 的率类口径）。**再分析已做（0 训练 token）**：`experiments/2615-priority-shootout-13m/{recompute_pair_ci.py,pair_ci_report.json,PAIR-CI-NOTE.md}` —— 结论 = **配对判据在现盘证据上不可复原**（只有聚合计数、无逐针命中向量；`retention_log.jsonl` 的 32 条 `needle_batch` 只含 full/lru 两列与 `n_so_far` 累计），配对二值差方差里的 `n10+n01` 不可得 ⇒ 配对 SE 不可定为唯一值 ⇒ **本项召回腿仍不可判（如实悬空）**。补充读法（**非预登记口径**、非配对近似）：同索引硬子集（n=2322）上三规则相对 `distance` 的差在 N∈{8,32,64} 上**全部落在含 0 的 Newcombe 95% CI 内**（最大正向 = N=8 的 `lru:k=64` +2.7563pp，CI [−0.1026, +5.6088]pp）⇒ 与「无可排序差异」一致，但该近似一般比配对区间更宽，**不足以支撑否定结论**。下一步最小实验（0 训练 token）= **重跑 2615 的评测腿一次并把逐针命中落盘**（`needle_raw.json`），之后按 §12.1 做配对 bootstrap。"
cost_model: "等效理论量：优先级调度只改删除顺序，删除预算（删除位置数或可见性对数）与压缩率 ρ 不变，故每位置内存字节与每 token FLOPs 与对照臂相同；调度本身是每位置一个标量打分。考虑 pipelining：调度可逐 token 递推并入 decode 流水。"

