# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "1.1.4.1"
axis: "1 时间轴"
title: "显式记忆槽 / 线性状态 / 递归状态（delta 规则族：DeltaNet / GLA / Mamba-2）"
dir: "axes/1-time/1.1.4.1-explicit-memory"

purpose: "把远处已看过的信息主动写入一个与序列长度无关的固定状态，使前缀可以被真正丢掉、长上下文账单有界，同时让长程质量与可检索性尽量贴近全量 attention（信息右移）。"
innovation: "相对普通 decoder-only transformer，在主干上（每层 attention 输出侧）加一个显式状态 S：写 S←S(I−βk̂k̂ᵀ)+βvk̂ᵀ（delta）或 S←S+βvk̂ᵀ（plain），读 S q 加回每层 attention 输出。**每层一个独立状态**（写门 β、键、值都取自该层当前 hidden），可选遗忘 `S←γS+write`。改动量级：真实文本实现 +264,296 参数（13.54M→13.80M，+1.95%）；状态 **12 × 8192 = 98,304 floats**（fp16 = 每位置等效 196,608 B），状态更新与 T 无关。"
expected_effect: "（a）把跨窗历史搬进固定成本的状态，使前缀可物理丢弃；（b）长程召回相对同掩码无记忆地板可排序提升；（c）把「每位置内存字节 / 每 token 额外 FLOPs」这个预算点的质量放进与全量/窗口/量化同一张质量-代价前沿图。"
sota_baseline: "DeltaNet / Gated DeltaNet（门控 delta + 线性读）、GLA、Mamba-2 / SSD、混合架构 Jamba / Samba；MQAR（Zoology）为容量判据。本地锚 = stock 全因果基线（A2 → axes/7-references，13M B0 = 1.5074 bpc 快照）。业界条目按 `记忆·未核` 标注。"
gap: "业界已证 delta / 线性读这一族（Gated DeltaNet / GLA / Mamba-2 / SSD）；本项增量 = (a) 真实文本 clean bpc + 毁源敏感度的受控单因素读数、(b) **把状态放进质量-代价前沿**（横轴 = 每位置等效 KV 字节 / 每 token 额外 FLOPs，纵轴 = 相对全量的质量 + 长程召回）、(c) 容量否证。本轮的增量读数是：**完备机制（逐层独立状态 + 内容写门）在等字节点上不被同预算纯窗口支配、且补回 80.1% 的窗口→全量差距**（实验 2639）；仍未补齐的部分（可检索性轴、量化点同图、业界实现对齐、归因拆分、等参数/多 scale）列在 `gaps`，不得当已达成。"
method: "单因素：在 stock 主干的 attention 输出上加 carry 状态通道，唯一变量 = 更新式 {none, plain, delta}，读出 = S q；载体类型臂 = {显式记忆槽, 递归/线性状态, KV}。基底恒为 stock decoder-only。完备度开关（E1）：`carry_per_layer`（逐层独立状态；写门/键/值取自该层当前 hidden）、`carry_decay`（可选遗忘 γ）。代价主轴 = 每位置等效 KV 字节（与 R1 量化点同轴），每 token 额外 FLOPs 为副轴（62-F2 裁决确认）。**主判据的形态 = 等字节点直接点比**：完备机制的总字节（窗口 16 的 196,608 + 逐层状态 196,608 = 393,216 B）与 `win32` 逐字节相等 ⇒ 同一预算点的直接对撞，不依赖插值。"
validation: "端到端：对照 = stock 全因果基线（归一为 100%）+ 同预算窗口/量化点；客观判据 = 质量-代价前沿（横轴 = 每位置等效 KV 字节 / 每 token 额外 FLOPs，纵轴 = 相对全量的 clean bpc + 长程召回）+ 毁源敏感度（必要条件探针）；口径 = matched-step / 同 token 预算，禁墙钟。该涨：通道臂跨窗召回（相对同掩码无记忆地板）；必须不变：无通道臂对被毁前缀逐位不敏感、因果性。判据带（C1 裁决）：本格以本格自测带 σ_cell＝0.00166（同配置换种子）为主判、跨格 0.014 bpc 带（限配对 Δ、≥5 窗口）为参考；两带并列报出、不得混用。"
objective_criteria: "该涨：远处信息被搬动后的长程召回（相对同掩码无记忆地板）；该跌：每位置内存字节 / 每 token 额外 FLOPs（前沿相对全量左移）；必须不变：前缀被物理丢弃后预测仍严格因果（无未来泄漏——实测 12/12 掩码臂「只改后半段 token ⇒ 前半段 logits 逐位不变」）、无通道臂对被毁前缀逐位不敏感（前提①）。主判据（C2 实质验收）：在**同一每位置等效字节**上不被同预算纯窗口支配。"
falsification: "若在真实文本/合成长程任务上，通道臂的长程召回相对无通道地板不越噪声带（且毁源敏感度为 0），或该通道点被同预算窗口/量化点支配（前沿上不占优）⇒ 判显式记忆槽 / 线性状态 / 递归状态作为信息右移手段不成立。 用哪个带（C1 裁决）：本格自测带（σ_cell＝0.00166 / 同臂换种子极差）为主判，跨格 0.014 bpc 带（限配对 Δ、≥5 窗口）为参考；两带并列报出、不得混用。"
failure_analysis: ""
conclusion: "主问题（『显式状态把自身内存折算成每位置等效 KV 字节后，能不能改善质量-代价前沿』）在**完整机制**（逐层独立状态 + 内容写门，γ=1；E1 开关）下已判：**能**。等字节点上 `carrypl16`（窗口 16 + 12×8192 floats 状态 = 393,216 B，k_eff=32）的 clean bpc = **1.527595**，优于同字节纯窗口 `win32` 的 **1.595823** 达 **+0.068228**（= 41×σ_cell、4.9×0.014 带；换评测窗口序（seed 7）为 +0.071912，同号同量级），**在 (每位置等效字节, clean bpc) 下包络上**（包络 = win16→win17→win18→win24→win32→**carrypl16**→win128→full），并补回「窗口 16 → 全量」差距 0.125421 的 **80.1%**；人话量级 = 质量约等于窗口 111 的纯注意力，而只花窗口 32 的内存。对照：同一项的单共享槽实现（12 层共用一个 8192-float 状态、只从 h₀ 写、无门控）仍被 `win17` 支配（2.5%），两者相差 **0.0974 bpc** ⇒ 前沿贡献来自机制完备度；γ=0.99（T=256 下仅存 7.6%）得 1.585531（仍优于等字节窗口 0.010292）但比 γ=1 差 0.0579（只测了一个 γ）。验收两读法（C2）：**实质（不被同预算点（每位置等效字节）朴素方案支配）在本预算点成立**；**milestone 字面（每个预算点质量 + 可检索性两轴、与业界实现对齐）仍未达成**——本轮只交付质量轴 + 窗口点 + full 锚，召回轴与量化点仍未叠加（见 gaps）。**必须不变项**：12 个带掩码臂全部严格因果（只改后半段 token ⇒ 前半段 logits 逐位不变）；掩码非退化断言 12/12；复用臂 bpc 与 2638 逐位相同。**归因缺口**：E1 把「逐层独立状态」与「写门/键/值取自本层当前 hidden」绑在一个开关 ⇒ 不能归因到其中哪一半（见 gaps 首条）。**适用范围**：enwik8 / T=256 / 13M / 12k 步 / seed 0 快照（状态是固定成本，真实长上下文 T≫256 的优势未测）。 **召回轴（本轮补上）**：完备机制（逐层独立状态 + 内容写门，γ=1）的窗外可检索性由 `1.1.4.5` 的 `2661` 对撞补上——同索引硬子集（n=2699，六臂无针控制全答不出）召回 **10.226%**（Wilson [9.139%, 11.426%]），相对同窗口无通道臂 **+9.522pp**（两比例差 CI（正态近似/未 pooling） [8.336, 10.708]）；毁源敏感度 `Δbpc_far = +0.032965`（逐簇配对 CI [0.026986, 0.038727]）且关通道后精确归零；负对照（implicit 两臂）停在配对地板（CI 含 0）。仍未补：量化点同图、真实长上下文（T ≫ 256）摊平、完备臂种子重复与 γ 扫描（见 gaps）。"
conclusion_review: "自评：主判据的证据链自包含且可复核（13 臂、sha256 断言、同 96×16 窗口序、预登记判据、等字节直接点比不依赖任何插值），并在三个独立方向做过鲁棒性（换评测窗口序 +0.071912 同号；chunk 实现细节量级 0.004 ≪ 0.068；摊平口径 +0.100 同号）；「必须不变」项（严格因果）逐臂单独探过；复用臂与 2638 逐位相等 ⇒ 换引擎未扰动基线。最大的弱点是**归因不可分**（逐层状态 vs 写入源绑在一个开关）**单一 seed / 单一尺度 / 单一训练长度**，已写入 gaps。本轮独立复核（`REVIEW-6.md`，fresh 上下文，对象 `6f42ed5`）：**PASS（带 notes），blocking = 0**——B1（`experiments` 未登记 2639）已真修、P2-1/P2-2 已修、**返工零数值回归**（与返工前的独立复核件逐位对拍）、主判据独立复算复现（`+0.068228`、同字节、`r=0.801429`），且**枚举 13 臂确认不存在 `total_bytes ≤ 393,216` 而 bpc < 1.527595 的臂** ⇒ 无支配臂；4 条 non-blocking 已按 `.scratch/62-axis1-time/TICKET.md` §9.13 处置。历轮判词（`REVIEW-5.md` 的 FAIL（窄范围）+ B1）与代跑检查见该 ticket §9.10–§9.12、§9.15。 **本轮新增**：召回轴由 `1.1.4.5` 的 2661 补上（对撞 +9.522pp、`Δbpc_far` +0.032965、判据⑤逐位复现），其独立复核见 ticket 62 §10.26。"
