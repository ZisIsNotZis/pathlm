argument: "用毁源敏感度探针（删/毁 ≥180 位置前的前缀，看被评行 logits 是否变）把「信息被搬到现在」与「注意力看见」分开——这是必要条件而非收益；合成腿上用同掩码无记忆地板 + 毁源对照把「搬动」与「局部先验」分开；递归载体用步数对账区分「日志停写」与「进程停摆」。"
gaps:
  - "完整机制（逐层状态 + 门控衰减 + 内容相关写入门）未测：需改共享引擎 `pathlm/depth_ar.py::CarryChannel`（从单共享槽扩到逐层）；最小 patch 描述与理由见 `.scratch/62-axis1-time/TICKET.md` §4 F5，本轴不擅自改，已上报 Main"
  - "量化点（R1 的 int8/int4 KV）未叠加到同一 (每位置字节, bpc) 图上；本轮只放了窗口点与全因果锚（下一步最小实验：复用 run.py 的 `cost_axis` 加量化点，0 GPU）"
  - "同参数量对照未做：carry 臂多 264,296 参数（+1.95%），容量归因未与等参数纯窗口对照分开"
  - "第二规模点 / 更长训练未做（12k → 24k 步，验增益是否只是快照/收敛加速，SCHEMA §16）"
  - "合成任务（assoc-mqar）上的同预算前沿未做（SCHEMA §19 要求真实文本 + 合成两组并报）"
  - "业界实现（真实 DeltaNet/GLA/Mamba-2）对齐未做：本仓无检索、无外部代码（M-04）"
  - "撤销两处错误归因：『长程检索能力≈chance』（零样本 OOD，M-08）与『真实文本 +0.2% 说明有用』（种子方差 > 臂间差，M-09）"
  - "组合实验（carry×depth、carry×量化、carry×GQA×窗口）违反单轴单格，应移出本项 scope（M-14）"
  - "实验编号在同格内不唯一（2617×3、2624×2、2630×2），复现锚点无法唯一定位（M-16）"
  - "『窗口 + 线性载体』组合因引擎硬互斥不可测（M-06）"
cost_model: "等效理论量：状态 S 大小固定（8192 floats），读/写各一次与 T 无关的 matvec，每 token 额外 FLOPs O(d·d_state)；相对全因果 attention 每层 O(T·d)，在 T 大时该预算点在前沿上左移。考虑 pipelining：状态更新是逐 token 递推，可并入 decode 流水、与 attention 并行。"

