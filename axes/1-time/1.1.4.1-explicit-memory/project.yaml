argument: "用毁源敏感度探针（删/毁 ≥180 位置前的前缀，看被评行 logits 是否变）把「信息被搬到现在」与「注意力看见」分开——这是必要条件而非收益；合成腿上用同掩码无记忆地板 + 毁源对照把「搬动」与「局部先验」分开；递归载体用步数对账区分「日志停写」与「进程停摆」。"
gaps:
  - "**归因不可分（本轮最大缺口）**：E1 的 `carry_per_layer` 把「逐层独立状态」与「写门/键/值取自本层当前 hidden」绑在同一个开关里 ⇒ 0.0974 bpc 的完备度增益**不能**归因到两者中哪一个（下一步最小实验：{逐层状态 + h₀ 写} 与 {单共享槽 + 当前 hidden 写} 两臂，GPU ≈ 2×30 min）；「逐层独立写投影」也未做（会改参数量）"
  - "**milestone 字面仍差两件（召回轴本轮已补）**：完备臂的可检索性读数已由 2661 补上（同索引硬子集 10.226%、对撞 +9.522pp、`Δbpc_far` +0.032965）；残留 = 只有**一个预算点**（393,216 B）有召回轴数字、其余预算点（win16/17/18/24/32/128/192）只有质量轴，以及量化点（R1 int8/int4）未同图与「与真实 DeltaNet/GLA 实现对齐」（后者本仓无外部代码，F4）"
  - "量化点（R1 的 int8/int4 KV）未叠加到同一 (每位置字节, bpc) 图上；下一步最小实验 = 复用 run.py 的 `cost_axis` 加量化点（0 GPU）"
  - "同参数量对照未做（**只影响「完备机制 vs 纯窗口」这一条**）：完备臂比纯窗口多 264,296 参数（+1.95%）；而「完备 vs 单共享槽」的 0.0974 bpc 对照本身**参数完全相同**（13,801,064 = 13,801,064，见 results.json.checkpoints[*].n_params）⇒ 那一半归因不受参数量解释（下一步最小实验：等参数纯窗口臂 ≈10 min）"
  - "单 seed（完备臂仅 seed 0）与单一 chunk：chunk 实现细节在本格造成 ≈0.004 bpc 差异（已量化、远小于主判据 0.0682）；种子重复最小实验 ≈30 min"
  - "单一训练长度/规模（12k 步 / 13M / enwik8）；第二规模点或 24k 步未做（SCHEMA §16）"
  - "合成任务（assoc-mqar）上的同预算前沿未做（SCHEMA §19 要求真实文本 + 合成两组并报）"
  - "真实长上下文（T ≫ 256）未测：状态是固定成本，其摊平优势只在 `results.json.sensitivity` 里作敏感性报数（非判据）"
  - "γ 只测了 {1.0, 0.99} 两点（0.99 在 T=256 下仅存 7.6% ⇒ 忘得太狠）；γ ∈ {0.999, 0.9999} 未扫"
  - "业界实现（真实 DeltaNet/GLA/Mamba-2）对齐未做：本仓无检索、无外部代码（M-04）"
  - "撤销两处错误归因：『长程检索能力≈chance』（零样本 OOD，M-08）与『真实文本 +0.2% 说明有用』（种子方差 > 臂间差，M-09）——属 WP3"
  - "组合实验（carry×depth、carry×量化、carry×GQA×窗口）违反单轴单格，应移出本项 scope（M-14）"
  - "实验编号在同格内不唯一（2617×3、2624×2、2630×2），复现锚点无法唯一定位（M-16）"
  - "「形态税」不作为判据项（62-F3 裁决）：只报前沿位置与支配关系，不把「显式状态点相对同预算纯窗口的质量差」写成结论（本项 conclusion 已按此执行）"
  - "**召回轴已补、milestone 字面仍差量化点与业界对齐**：完备臂的可检索性读数见 2661（同索引硬子集 10.226%、对撞 +9.522pp、`Δbpc_far` +0.032965、关通道归零）；但 milestone 要「每个预算点质量与可检索性两轴」+「与真实 DeltaNet/GLA 实现对齐」，量化点（R1 int8/int4）与 2639 的其它预算点仍未叠加 ⇒ 字面仍未达标（量化点属纯再分析、0 训练 token；对齐无外部代码，见 F4）"
  - "**完备臂种子重复缺失（新增）**：2661 的 `carrypl16_s0` / `carrypl16d_s0` 都是 seed 0，主对撞无种子重复；同机制 γ=1 vs γ=0.99 的硬子集召回是 10.226% vs 2.853%（3.6×）⇒ 配置敏感度大于 CI（下一步最小实验：训 `carrypl16_s1` 1 臂 × 98.3M token + 复用 2661 的 `run.py` 评测）"

cost_model: "等效理论量：状态 S 大小固定（8192 floats），读/写各一次与 T 无关的 matvec，每 token 额外 FLOPs O(d·d_state)；相对全因果 attention 每层 O(T·d)，在 T 大时该预算点在前沿上左移。考虑 pipelining：状态更新是逐 token 递推，可并入 decode 流水、与 attention 并行。"

