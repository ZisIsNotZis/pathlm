# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "1.1.4.1"
axis: "1 时间轴"
title: "显式记忆槽 / 线性状态 / 递归状态（delta 规则族：DeltaNet / GLA / Mamba-2）"
dir: "axes/1-time/1.1.4.1-explicit-memory"

purpose: "把远处已看过的信息主动写入一个与序列长度无关的固定状态，使前缀可以被真正丢掉、长上下文账单有界，同时让长程质量与可检索性尽量贴近全量 attention（信息右移）。"
innovation: "相对普通 decoder-only transformer，在主干上（旧实现为全局单槽 + 逐层读出增益）加一个显式状态 S：写 S←S(I−βk̂k̂ᵀ)+βvk̂ᵀ（delta）或 S←S+βvk̂ᵀ（plain），读 S q 加回每层 attention 输出。改动量级：真实文本实现 +264,296 参数（13.54M→13.80M，+1.95%），状态 8192 floats，状态更新与 T 无关。"
expected_effect: "（a）把跨窗历史搬进固定成本的状态，使前缀可物理丢弃；（b）长程召回相对同掩码无记忆地板可排序提升；（c）把「每位置内存字节 / 每 token 额外 FLOPs」这个预算点的质量放进与全量/窗口/量化同一张质量-代价前沿图。"
sota_baseline: "DeltaNet / Gated DeltaNet（门控 delta + 线性读）、GLA、Mamba-2 / SSD、混合架构 Jamba / Samba；MQAR（Zoology）为容量判据。本地锚 = stock 全因果基线（A2 → axes/7-references，13M B0 = 1.5074 bpc 快照）。业界条目按 `记忆·未核` 标注。"
gap: "业界已证 delta / 线性读这一族；本项增量应为 (a) 真实文本 clean bpc + 毁源敏感度的受控单因素读数、(b) **把状态放进质量-代价前沿**（横轴 = 每位置等效 KV 字节 / 每 token 额外 FLOPs，纵轴 = 相对全量的质量 + 长程召回）、(c) 容量否证。旧格只测了「加通道的臂间增量」、从未把自己放进前沿（55-review M-03/M-12）；机制被降级为单共享槽、对照只有自写 plain、无业界实现对照（M-04/M-05）——这些是本项必须补的缺口，而不是已达成的结论。"
method: "单因素：在 stock 主干的 attention 输出上加 carry 状态通道，唯一变量 = 更新式 {none, plain, delta}，读出 = S q；载体类型臂 = {显式记忆槽, 递归/线性状态, KV}。基底恒为 stock decoder-only。修复项：逐层状态（非单共享槽）、门控衰减、内容相关写入门。"
validation: "端到端：对照 = stock 全因果基线（归一为 100%）+ 同预算窗口/量化点；客观判据 = 质量-代价前沿（横轴 = 每位置等效 KV 字节 / 每 token 额外 FLOPs，纵轴 = 相对全量的 clean bpc + 长程召回）+ 毁源敏感度（必要条件探针）；口径 = matched-step / 同 token 预算，禁墙钟。该涨：通道臂跨窗召回（相对同掩码无记忆地板）；必须不变：无通道臂对被毁前缀逐位不敏感、因果性。"
objective_criteria: "该涨：远处信息被搬动后的长程召回（相对同掩码无记忆地板）；该跌：每位置内存字节 / 每 token 额外 FLOPs（前沿相对全量左移）；必须不变：前缀被物理丢弃后预测仍严格因果（无未来泄漏）、无通道臂对被毁前缀逐位不敏感（前提①）。"
falsification: "若在真实文本/合成长程任务上，通道臂的长程召回相对无通道地板不越噪声带（且毁源敏感度为 0），或该通道点被同预算窗口/量化点支配（前沿上不占优）⇒ 判显式记忆槽 / 线性状态 / 递归状态作为信息右移手段不成立。"
failure_analysis: "设计/实现问题为主因 + 结构问题为次因，**非 innovation 本身失败**。① **设计/实现（主因）**：被测的显式状态是**单共享槽**（`shared_slots=true`：8192 floats 覆盖全部 12 层、只从输入流 h0 写、无门控衰减、无内容相关写入门）——正是 55-review M-05/M-06 指出的、被引擎/墙钟开销逼出的退化实现；业界主流（Gated DeltaNet / GLA）为**逐层**状态 + 门控 + delta。② **结构（次因）**：固定 8192-float 状态在 13M / 12k 步快照下的容量与收敛度；本实验的对照是**同 token 预算 / 同窗口**而非同参数量（carry 臂多 264,296 参数 = +1.95%）⇒ 不能把全部差异归给容量。③ **非 innovation 本身失败**：完整 delta 族机制（逐层、门控、内容相关写入门）**未测**，不得据此判「delta / 线性状态不可能」。"
conclusion: "本项从未测过的自身目的（质量-代价前沿）已由实验 2638 判：显式状态点（单共享槽 delta，窗口 16）在 (每位置等效 KV 字节, clean bpc) 前沿上**被同预算纯窗口严格支配**——`win17`（208,896 B < carry16 的 212,992 B）的 bpc 1.624104 优于 carry16_s0 的 1.624979（两 seed：1.624979 / 1.626640）；前沿下包络全是纯窗口点（win16/17/18/24/32/128/full），carry16 不在其上。其全部收益 = 窗口→全量差距（0.125421 bpc）的 2.5% / 1.2%，小于把窗口加宽 1 格（win17 补 3.2%）；窗口 24 补 22.5%、窗口 128 补 91.5%、全因果锚 bpc 1.5027。必要条件成立：carry 相对同窗无通道 Δbpc 两 seed 皆 >0，且 2634 的毁源 Δbpc_far +0.0158/+0.0141 >0 ⇒ 状态确实被读、确实搬了窗外信息（不是死开关）。结论**只覆盖**「本实现（单共享槽）在 13M / 12k / 真实文本上不占优」，不得推广为 delta / 线性状态机制不可能。"
conclusion_review: "自评：主判据的证据链是自包含的（8+2 臂、同 96×16 口径、预登记判据、前沿下包络可复核），且强读法与弱读法给出同一决策（收益 ≤ 1 个窗口位置、花费 1.33 个位置）⇒ 判定方向可靠；「严格支配」在 σ_cell 读法下为边缘（0.000875 ≈ 0.9σ）、在 0.014 带读法下不显著，两读法已并列报出（analysis §3）。
独立复核（`.scratch/62-axis1-time/REVIEW-1.md`）：见该文件判词。复核前**未改**本 `project.yaml` 的判据或数字；若有缺陷按 SCHEMA §14/§14b 返工。"
