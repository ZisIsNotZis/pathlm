experiments: []
argument: "把「合并已处理位置」与「减少可见量」分开：前者减少的是**到深层的 token 数**（每 token 等效 FLOPs 与 layer-passes 随深度下降），后者减少的是**每层每 token 看多少**——两者在同预算下未必等价，故须用「每 token 等效总 FLOPs」对齐后比较质量。这正是 PROPOSED-STRUCTURE §4 点名的缺口（T.4 dynamic merging），在本仓从未立项。"
gaps:
  - "本仓零经验：需先做最小判决（13M、T=256、{stock, 金字塔合并 r=2/4/8} 三臂，对齐每 token 等效总 FLOPs；clean bpc + 长程召回）"
  - "合并打分（固定相似度 vs 可学习权重）未定"
  - "「必须不变」的长程召回是否随合并率退化未测"
cost_model: "等效理论量：第 l 层处理 T_l 个 token 且 T_l 随深度递减（合并率 r），该层 attention 与 FFN 的每 token FLOPs 仍为 O(T_l·d)，但**处理 token 数**从 T 降到 T_l ⇒ 每 token 等效总 FLOPs（对全部层求和）随深度下降，layer-passes 相对 stock 下降；合并算子本身每层 O(T_l·d)。考虑 pipelining：prefill 段可按层流水，decode 段合并只能作用于已存的过去位置、每步新增 token 数不变。"

