conclusion_review: "本项无旧格、本仓零经验，无本地判决，故 `status: 未开始`。判据按 `docs/research-schema.md` 预登记（对照 + 客观判据 + 口径 + 否证条件），横轴统一为「每位置 KV 字节」、纵轴两腿（clean bpc + 长程召回），并给等参数对照与头共享同字节对照（`SCHEMA.md` §15/§17.12）。与 `5.1`（量化）、`7-references`（GQA/MQA 参照）的边界写进 `gap`。独立复核未做。"
laws: []
