argument: "低秩压缩与头共享（GQA/MQA）是两种不同的省 KV 机制，必须放在**同一「每位置字节」横轴**上比较才公平（`harness/SCHEMA.md` §17.12；`2617` §3 记业界缺统一字节轴）。MLA 的独有代价是「须从零训练 + 上投影计算」，必须以每 token 等效解码 FLOPs 入账（不用时间量），否则会把「省内存」记成「免费」。低秩不改变可见位置集合，故可见性对数必须不变（与窗口/驱逐类不同，二者是两条账）。"
gaps:
  - "低秩的失效 rank 未测到：潜维 128（3072 B）仍是带内无损（相对同 seed fp16 −0.003167），低秩从哪一档开始伤质量落在 `d_c < 128`；下一步最小实验 = `mla_c64`（1536 B、8× 压缩）2 seed，其余字段与 `mla_c144` 逐字段相同，等效成本约 20 min GPU（2 臂训练）+ 3 min 评测"
  - "3072–6528 B 之间的点位没有实测：`mla_c256`（6144 B）未训，故「低秩的 bpc 在 6144–6528 之间是否单调」不可判；2 seed 约 20 min GPU"
  - "低秩 × 量化的叠加（潜向量再走 int8 块标尺）未测（组合默认留白，`harness/SCHEMA.md` §4）；纯评测可做，约 3 min GPU（复用已训 checkpoint）"
  - "长上下文未测：T > 256。低秩压的是位置轴，省幅随 T 不变但质量代价可能随 T 变化 ⇒ T=512/1024 同配方两臂（每点 25–40 min GPU）"
  - "第二腿的距离开支在地板上：`var_recall` 全臂 `at_floor = true`（地板 0.025831，各臂 0.0072–0.0267）⇒ 距离分量在本尺度不区分臂；要判「远距离召回是否被压缩吃掉」，须换更难的合成任务（多跳 / 干扰项）或加入 `recon` 重建目标，先做 1 臂冒烟"
  - "字节账是解析价签，不是实测显存峰值：评测期 int8/int4 立刻反量化、潜向量立刻上投影 ⇒ 真实实现的峰值下降本实验不测；要测须改成分块 cache 的延迟反量化（工程改动，非本格判据）"
  - "等参数臂归属（66-F4 裁决）：与 `5.1` 共用同一 WP（`5.1` 的 `WP3`，同一臂服务两格，不重复建格）——本项 WP1 的「低秩 vs 头共享同字节判决」用之"
cost_model: "等效理论量：每位置 KV 值数由 MHA 的 L·2·n_heads·d_head 降到 L·(d_latent + d_rope)（低秩潜向量 + decoupled RoPE 分量），每值字节 fp16；每位置部署字节 = 值数 × 每值字节（可与 `5.1` 的 KV 量化叠加，另计）。解码期每 token 额外计算 = 上投影（d_latent → n_heads·d_head）；layer-passes 每 token 仍为 L；tokens-per-forward 每步 1。考虑 pipelining：上投影只依赖当前已生成位置的潜向量，严格前缀不变、不引入额外顺序依赖（按解析字节与等效 FLOPs 报，不用时间量）。"

