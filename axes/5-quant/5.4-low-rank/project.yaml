# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "5.4"
axis: "5 量化轴"
title: "低秩压缩（MLA 式）"
dir: "axes/5-quant/5.4-low-rank"

purpose: "普通 decoder-only transformer 为每个头独立存一份 K/V，KV cache 随头数×头维线性增长。低秩压缩（MLA 式）把每位置的 K/V 联合压成一个低秩潜向量（维度远小于头数×头维），推理时再上投影回每头的 K/V。本项要判定：低秩压缩能否在给定质量（以 fp16 全因果 MHA 基线为 100%）下显著降低每位置 KV 字节，并在「每位置部署字节 → 序列级质量」的代价前沿上占优，且代价（额外投影计算、需从零训练）可接受。"
innovation: "相对普通多头注意力（每头独立 K/V）：把 K/V 联合投影到一个低秩潜向量并缓存该潜向量，推理时由潜向量上投影重建每头的 K/V；RoPE 需解耦到单独的小分量以免破坏低秩结构。改动量级：KV cache 每位置字节由 n_heads×d_head×2 降到潜维 + RoPE 分量；训练侧新增下/上投影矩阵；解码期新增上投影计算。"
expected_effect: "（a）每位置 KV 字节下降（该跌）；（b）序列级质量代价小到可接受（该不跌/可排序，须越 0.014 噪声带）；（c）代价必须与收益同框：上投影带来的额外解码计算、RoPE 解耦、以及「不能像 GQA 那样轻量 uptrain、须从零训练」的收敛代价。"
sota_baseline: "DeepSeek-V2 的 MLA（KV 联合低秩压缩 + decoupled RoPE；arXiv:2405.04434，标题本轮联网核实 HTTP 200；同报告 `head_dim`=128），机制细节只作设计方向、不作判据；本地整理见 `axes/5-quant/5.6-window-quant-retrieval/experiments/2617-prior-art-hybrid-kv/PRIOR_ART.md` §2；与 `axes/7-references/` 的头共享（GQA/MQA）作同轴对照。本地锚 = 同尺寸 stock fp16 MHA 全因果基线（归一为 100%）。"
gap: "本仓零经验（无旧格；MAPPING §2 的「缺」项）。业界 MLA 已工程化（DeepSeek-V2/V3，本轮核实 arXiv:2405.04434 标题），**本项最高风险是造轮子**。相对 SOTA 的增量 = 在 13M 受控设定下把「每位置部署字节 → 序列级两腿质量」的前沿与 GQA/MQA（头共享）放在**同一字节轴**上比较（跨家族统一字节轴是业界缺口，见 `2617` §3），并把 MLA 的独有代价（须从零训练 + 上投影计算，业界多在已训好的大模型上做 uptrain/推理包装）入账。`2617` 明确记 `未找到`「同一 KV 字节预算下的最优分配」的公开前例。"
method: "单因素：固定主干形状与训练预算，只改 KV 的压缩方式。臂 = {MHA（基线）, GQA/MQA（头共享对照）, MLA 式低秩压缩（潜维扫描）, 低秩 + 分层共享}；每臂给等参数对照（投影矩阵与头共享改变的参数量须拆开）。基底恒为 stock decoder-only；须从零训练（不做 uptrain）。"
validation: "端到端：对照 = 同尺寸 stock fp16 MHA 全因果基线（归一为 100%）+ 等参数对照臂 + 头共享（GQA/MQA）同字节对照；客观判据 = 每位置 KV 部署字节（该跌）+ clean bpc（该不跌/可排序，须越 0.014 噪声带）+ 合成长程召回（第二腿，该不塌）+ 解码期额外计算（必须报，上投影的每 token 等效 FLOPs）；口径 = 解析每位置 KV 字节 + clean bpc，**墙钟不进判据**；必须不变 = 因果性与可见性对数（低秩不改变可见位置集合）。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
objective_criteria: "该跌：每位置 KV 部署字节（潜维 + RoPE 分量）；该不跌/可排序：clean bpc（相对同字节头共享臂与 stock 基线，须越 0.014 噪声带）；该保持：合成长程召回（第二腿不塌）；必须不变：因果性与可见性对数；必须报：上投影的每 token 等效解码计算、等参数对照。"
falsification: "若 MLA 式低秩压缩在等参数对照下相对同字节头共享臂的 clean bpc 不占优（越噪声带变差或持平）⇒ 判低秩压缩在本尺度不产生新知识；若「从零训练」的收敛代价吃掉全部 KV 收益（等字节下不占优）⇒ 判该路线在本尺度不划算；若上投影额外计算使每 token 等效 FLOPs 显著上升且未被 KV 收益补偿 ⇒ 判代价记账不利。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
failure_analysis: "机制层被否证的那一支 = 「低秩相对同字节头共享（GQA2）产生新知识」。等字节 3072 B 上低秩对按预算训练的 GQA2 是 −0.015594 / −0.018157（两 seed 同向越带），但把 GQA2 的参数补齐（`gqa2_eq`，13,536,516 对 MHA 少 252）之后差距缩到 −0.013947 / −0.003484，两条都落 0.014 带内 ⇒ 表观优势来自「头共享少 8.75% 参数 + FFN 加宽的那一笔」，不是「低秩机制本身」。这不是实现问题：同一批读数里低秩的活性、前缀不变性、仪器自检全过（`results.json::instrument.gate_passed = true`），且等参数这一步确实有效（`gqa2_eq − gqa2` = −0.001647 / −0.014673）⇒ 归因到设计：在 13M / T=256 这副骨架上，KV 的**维度冗余**已经被「少几个 KV 头」这条更便宜的路吃掉，低秩再压一遍买不到额外的质量；它真正买到的是「不需要按头数共享」的部署自由度，本实验不测后者。另一条代价侧的不利：6528 B 档低秩与 int8 量化不可分（+0.002876 / −0.001582），而低秩要多付 17.7083% 单层 FFN 的上投影 MACs 并须从零训练 ⇒ 该档按代价记账不利（`README.md` §8 的第三行判据）。"
conclusion: "低秩压缩（MLA 式）本地结论（实验 `2664-lowrank-vs-quant-13m`：13M / L=12 / d=256 / H=8 / T=256，7 支新训臂各 12k 步 98.3M token + 5 个臂的 8 支复用 checkpoint，逐 seed 配对 n=2，判据带 0.014 只用于 clean bpc 的配对 Δ）。（a）**三个同字节格各有裁决，无「不可判」**：6528 B 上 `mla_c272` − `mha@int8` = +0.002876 / −0.001582（均值 +0.000647，两条落带内 ⇒ 不可分）；3456 B 上 `mla_c144` − `mha@int4` = −0.016676 / −0.026159（越带 ⇒ 低秩更好，且低秩一侧还少 1.86% 参数）；3072 B 上 `mla_c128` − `gqa2` = −0.015594 / −0.018157（越带 ⇒ 低秩更好，对照一侧是两次 seed 0 运行、`seed_aligned = false`）。（b）**等参数夹逼把方向和归属定住**：格 A 的 `mla_c272_eq` − `mha@int8` = +0.002395 / +0.006275（符号一致偏向 int8、仍落带内）；格 C 的 `mla_c128` − `gqa2_eq` = −0.013947 / −0.003484（**两条都落带内**）⇒ 按 `falsification` 第一条，「低秩相对同字节头共享产生新知识」在本尺度**被否证**（归因见 `failure_analysis`）。（c）**两族的失效模式不同，而且低秩的失效点没被摸到**：量化 int8 相对 fp16 +0.000017（无损），int4 +0.021180（越带 1.5 倍）⇒ 量化在 8 位与 4 位之间开始伤质量；低秩 c272 +0.000664、c272_eq +0.004352、c144 −0.000237、c128 −0.003167，**全在带内** ⇒ 4 倍压缩（3072 B）仍不付质量，低秩的失效 rank 在 `d_c < 128`（`mla_c64` 未测）。（d）**代价已入账**：上投影每 token 1,671,168 / 884,736 / 786,432 MACs（潜维 272 / 144 / 128）= 单层 FFN 的 17.7083% / 9.375% / 8.333%，且低秩改的是 K/V 投影矩阵本身、没有轻量 uptrain 路径，全部臂同预算从零训练；量化侧 `params_added = 0`、解码算力不变。（e）**第二腿给了 bpc 看不见的信号**：6528 B 档低秩在 copy / induction 上高于 int8（+0.037760 / +0.066406，配对 bootstrap 95% CI 均不含 0）⇒ 8 位量化在 bpc 无损的那一档、召回腿上有可测损伤；3456 B 档低秩 bpc 更好但 var_recall 略低（−0.010417，CI [−0.018229, −0.002604]）⇒ 「bpc 好 ⇒ 召回好」不成立，两腿必须分开报；3072 B 档低秩 copy 低 −0.031576、induction 高 +0.039062，而对照 `gqa-12k-s0` 的 induction = 0.027344 已在局部先验地板 0.030999 之下 ⇒ 这一列不构成「低秩 induction 更强」的证据；var_recall 整条腿所有臂都在地板（`at_floor = true`）⇒ 距离分量在本尺度不区分臂。（f）**护栏全绿**：`results.json::instrument.gate_passed = true`（`bpc_of` 与 `masked_bpc` 逐位相等 1.482026、`MLABlock` 前向与 `masked_logits` 差 0、在 `5.1` 的 trunk 上逐位复现 `2632` 三点 1.483571 / 1.483672 / 1.506093）、29 条读数前缀不变性两条全 True、每位置字节解析式与实测张量形状逐条相等（`12·272·2 = 6528 = 12·2·8·32·1.0625` 一类等式不使用插值）。（g）**该字节值不值的判词**：3456 B 这一档低秩值得（比 4 位量化好 0.017–0.026 bpc，代价是 9.375% 单层 FFN 当量算力）；6528 B 这一档不值得（与 int8 不可分，却要付 17.7083% 与从零训练）；对头共享（本格原问题）在等参数下无净增量。结论停在该尺度该字节，不外推到 T > 256、>13M 或 `d_c < 128`。"
conclusion_review: "自评。①**契约先于读数**：`prereg_binding.json::bound_at = 2026-10-21T20:52:28+08:00`（初绑 `c0a5a0c`、改跨实验路径后于 `53e69d3` 重绑，现值为后者）早于 7 份训练读数（`runs/*/results.json` 的 mtime 21:00:28–21:55:59）与 29 份评测读数（22:28:52–22:29:49），`prereg_bind.py --require` 通过、`--check` 全树无新增红项；`README.md` / `config.json` 在重绑后**一个字节未改**（`prereg_binding.json::contract_files` 两个哈希与盘上现值相同）。29 条评测读数是在 `run.py` 最后一次改动（`9ccbfa0`，22:25:40）之后重跑的，每份读数记的 `code_hashes.run.py = 6cf8d59e…` 就是当前盘上哈希；重跑原因是 §3.1 校验分支改完后要让 29 条出自同一次运行，两次运行载荷逐字段相同（复核比对 payload identical）。②**改过 `run.py`，已披露**：跨 3 个提交 / 12 个 hunk（`150b2f6` 的 `pooled_task` 批拼接 + `.get` 守卫 + 方向字段单一化、`9ccbfa0` 的 `ckpt_sha256_check` 两分 + `ckpt_identity` 聚合 + `recall_pairs` 取键、`874932e` 的 `delta_directions` 补两项，明细见 `analysis.md` §3.2）；其中对身份语义的只有「校验失败时的处置」：`config.json::model_arms[gqa2_eq].runs[1].sha256` 是转写错字（记 `…b58012`、盘上 `…b58024`，全仓无任何文件哈希成前者，文件 mtime `2026-10-15 00:08:39`、54,192,907 B 自 `2656` 训完未被触碰），契约冻结不动、改成「自训臂硬拦 / 复用臂降级为记录」（`sha256_verified = false` + 两个哈希值，聚合点名 `results.json::ckpt_identity.mismatches`），区分由 `tests/test_2664_ckpt_sha256_gate.py` 四条钉住；判据线与臂表未动。③**派生量只有三处**（格 A / 格 C 的等参数 Δ 与 `gqa2_eq − gqa2` 的参数效应），都是同一份读数里两个数相减、算式写在 `analysis.md` §4 与本节指针处，其余数字逐条带键路径。④局限：n=2 只给方向一致性（格 C 等参数的一条 Δ = −0.013947 距带边仅 0.000053，是本实验最脆的一处，但不改变「落带内 ⇒ 不占优」）；单尺度 13M / T=256；字节账是解析价签不是实测峰值；`var_recall` 整条腿在地板上；低秩失效点未测到；`gqa2-eq-s1` 的身份凭证按上条降级支撑。⑤**独立复核未做**——本项 `status: 已完成` 按「writer 自评 + 读数落盘」读，fresh 复核排在 writer 停止之后（`RESEARCH.md` §4 的 `WP1-review`）。"
