experiments: []
argument: "低秩压缩与头共享（GQA/MQA）是两种不同的省 KV 机制，必须放在**同一「每位置字节」横轴**上比较才公平（`SCHEMA.md` §17.12；`2617` §3 记业界缺统一字节轴）。MLA 的独有代价是「须从零训练 + 上投影计算」，必须以每 token 等效解码 FLOPs 入账（不用时间量），否则会把「省内存」记成「免费」。低秩不改变可见位置集合，故可见性对数必须不变（与窗口/驱逐类不同，二者是两条账）。"
gaps:
  - "本仓零经验：需先做最小判决（13M、从零训练，{MHA, GQA/MQA, MLA 式潜维扫描} 三臂 + 等参数/同字节对照，报 clean bpc + 每位置字节 + 长程召回 + 上投影等效 FLOPs）"
  - "与 5.1（KV 量化）是否可叠加（低秩 + 量化）未测（组合默认留白，`SCHEMA.md` §4）"
  - "造轮子风险最高项：须明确「相对 DeepSeek-V2 MLA 的增量」是什么（本仓只做 13M 受控同字节前沿）"
  - "MLA 的确切质量/KV 公开数字 `记忆·未核`（`2617` §2），不作判据"
  - "等参数臂归属（66-F4 裁决）：与 `5.1` 共用同一 WP（`5.1` 的 `WP3`，同一臂服务两格，不重复建格）——本项 WP1 的「低秩 vs 头共享同字节判决」用之"
cost_model: "等效理论量：每位置 KV 值数由 MHA 的 L·2·n_heads·d_head 降到 L·(d_latent + d_rope)（低秩潜向量 + decoupled RoPE 分量），每值字节 fp16；每位置部署字节 = 值数 × 每值字节（可与 `5.1` 的 KV 量化叠加，另计）。解码期每 token 额外计算 = 上投影（d_latent → n_heads·d_head）；layer-passes 每 token 仍为 L；tokens-per-forward 每步 1。考虑 pipelining：上投影只依赖当前已生成位置的潜向量，严格前缀不变、不引入额外顺序依赖（按解析字节与等效 FLOPs 报，不用时间量）。"

