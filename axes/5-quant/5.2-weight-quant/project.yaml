experiments:
  - "axes/5-quant/5.2-weight-quant/experiments/2651-weight-quant-13m"
argument: "权重量化的收益是**每参数字节/权重访存**，与 KV 量化（每位置字节）和激活量化（中间张量字节）是三类不同的账，必须分开记（本轴 `5.1`/`5.2`/`5.3`）。判定值不值要看「每参数部署字节 → 序列级质量」的前沿，且字节必须含标尺开销——本仓曾因逐值标尺把「省内存」反算成「占内存」（`5.1` 的 `2631`），本项不重蹈。"
gaps:
  - "`int4_per_channel`（解析 0.5 + 2/n_in ≈ 0.508 B/参数，本模型最省的解析点）与 `int4 group-8`（0.5 + 2/8 = 0.75）未测；最小实验 = 加两个臂重跑同一套四臂，等效算力 = 13M × 2 臂纯推理"
  - "离群通道保护（LLM.int8() 式：amax 超阈值的通道留 fp16）未测；它是最可能把 `int4` 代价压回带内的改动，最小实验 = 在 `wq_arms` 上加一条分支重跑四臂"
  - "`int4_group32` 越带**贴边**（仅超带 +0.000904，逐窗 Δ 均值 0.013946 落在带内）⇒ 结论对聚合口径与窗口组成敏感，已如实标注；宜补更多窗口 seed 或换配对均值口径复测"
  - "与 `5.1`（KV 量化）/ `5.3`（激活量化）的三类账未在同一张图上并报（由 integrator 核不重复）；本项只回答权重这一类"
  - "单 checkpoint / 单 seed / 单 T=256 / CPU 设备且行宽固定 ⇒ 不外推到别的 `in_features`（`2/n_in` 会变小）或别的尺度"
cost_model: "等效理论量：每参数部署字节 = 位宽/8 + 每分组标尺与零点的摊薄（如 int8 per-channel + 2·2 B/组、int4 分组 + 2·2 B/组）；权重与 KV/激活精度独立。layer-passes 每 token 仍为 L、tokens-per-forward 每步 1；每 token FLOPs 不变（反量化是逐元素乘加，不计入主 FLOPs）。考虑 pipelining：权重量化是同一前向内的逐矩阵反量化，不引入额外顺序依赖（按解析字节报，不用时间量）。"

