# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "5.2"
axis: "5 量化轴"
title: "权重量化"
dir: "axes/5-quant/5.2-weight-quant"

purpose: "普通 decoder-only transformer 的权重以 fp16 存放在显存里，模型越大越放不下、每次前向的权重访存带宽越紧张。本项要判定：把权重矩阵以低位宽（int8/int4，含分组标尺）存放、推理时反量化用，能否在给定质量（以 fp16 权重 stock 基线为 100%）下降低每参数字节与权重访存，并在「每参数部署字节 → 序列级质量」的代价前沿上占优。"
innovation: "相对普通 decoder-only transformer 的 fp16 权重：把线性层（attention 投影、FFN、读出）的权重矩阵量化到 int8/int4，按 per-channel / 分组（group-wise）保存标尺与零点，推理时反量化。改动量级：参数量不变，每参数字节从 2 B 降到 ≈1 B（int8）或 ≈0.5 B（int4）+ 标尺开销；每 token FLOPs 不变（除反量化开销）。"
expected_effect: "（a）每参数部署字节下降（该跌，含标尺）；（b）序列级质量代价小到可接受（该不跌/可排序，须越 0.014 噪声带）；（c）与 `5.1`（KV 量化）/`5.3`（激活量化）划界：本项只压权重，KV 与激活不动，便于把三类量化的代价分开记账。"
sota_baseline: "GPTQ / AWQ / SmoothQuant / LLM.int8() 等训练后权重量化（`记忆·未核`，只作设计方向、不作判据）与 fp16 权重 stock 基线（本地归一为 100%；13M B0 = 1.5074 bpc 快照）。"
gap: "本仓零经验（无旧格；MAPPING §2 的「缺」项）。业界权重量化成熟（GPTQ/AWQ），**本项最高风险是造轮子**。相对 SOTA 的增量 = 在 13M 受控设定下把「每参数部署字节（含标尺）→ 序列级质量」的前沿量化，并把**权重 vs KV vs 激活**三类量化的代价在**同一质量-代价框架**下分开报（业界多单报一类或只报 ppl）——本项只回答权重这一类。"
method: "单因素：固定被测量模型/checkpoint/数据流/评测窗口，只改权重精度。臂 = {fp16（基线）, int8 per-channel, int8 分组, int4 分组}；不训练、不改 KV/激活精度、不新增参数。基底恒为 stock decoder-only。"
validation: "端到端：对照 = fp16 权重 stock 基线（归一为 100%）；客观判据 = 每参数部署字节（该跌，含标尺）+ clean bpc（该不跌/可排序，须越 0.014 噪声带）+ 长程召回（第二腿，该不塌）；口径 = 解析每参数字节（含标尺）+ clean bpc，**墙钟不进判据**；必须不变 = 因果性与非量化臂逐位不变。"
objective_criteria: "该跌：每参数部署字节（含标尺；int8 ≈1 B/参数、int4 ≈0.5 B/参数 + 标尺）；该不跌/可排序：clean bpc（须越 0.014 噪声带）；该保持：合成长程召回（第二腿不塌）；必须不变：因果性与非量化臂逐位不变；必须报：标尺/零点开销与分组大小。"
falsification: "若权重量化的 clean bpc 代价越噪声带且吃掉全部内存收益（每参数字节相近的点位上不占优）⇒ 判该档在本尺度不成立；若分组标尺的字节开销使 int4 反占内存（每参数字节 ≥ fp16）⇒ 判该实现在该分组下不可用；若非量化臂不能逐位还原 ⇒ 判实现有误（对照失效）。"
failure_analysis: ""
conclusion: ""
conclusion_review: "本项无旧格、本仓零经验，无本地判决，故 `status: 未开始`。判据按 `docs/research-schema.md` 预登记（对照 + 客观判据 + 口径 + 否证条件），判据形态是「每参数部署字节 → 序列级质量」的前沿（55-review W-09），字节含标尺（防逐值标尺式口径错误，55-review W-08）。与 `5.1`/`5.3` 的边界写进 `expected_effect`。独立复核未做。"
experiments: []
argument: "权重量化的收益是**每参数字节/权重访存**，与 KV 量化（每位置字节）和激活量化（中间张量字节）是三类不同的账，必须分开记（本轴 `5.1`/`5.2`/`5.3`）。判定值不值要看「每参数部署字节 → 序列级质量」的前沿，且字节必须含标尺开销——本仓曾因逐值标尺把「省内存」反算成「占内存」（`5.1` 的 `2631`），本项不重蹈。"
gaps:
  - "本仓零经验：需先做最小判决（13M、纯推理，{fp16, int8 per-channel, int8 分组, int4 分组} 四臂，报 clean bpc + 每参数部署字节含标尺）"
  - "与 5.1（KV 量化）/ 5.3（激活量化）的三类账未在同一框架下并报（由 integrator 核不重复）"
  - "造轮子风险最高项：须明确「相对 GPTQ/AWQ 的增量」是什么（本仓只做 13M 受控前沿）"
  - "分组大小 / 标尺字节开销未扫（决定 int4 是否反占内存）"
cost_model: "等效理论量：每参数部署字节 = 位宽/8 + 每分组标尺与零点的摊薄（如 int8 per-channel + 2·2 B/组、int4 分组 + 2·2 B/组）；权重与 KV/激活精度独立。layer-passes 每 token 仍为 L、tokens-per-forward 每步 1；每 token FLOPs 不变（反量化是逐元素乘加，不计入主 FLOPs）。考虑 pipelining：权重量化是同一前向内的逐矩阵反量化，不引入额外顺序依赖（按解析字节报，不用时间量）。"

