# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "5.6"
axis: "5 量化轴"
title: "组合：窗口 + 量化 + 检索"
dir: "axes/5-quant/5.6-window-quant-retrieval"

purpose: "长上下文的「现成组合拳」——窗口注意力 + KV 量化 + 检索增强——是生产系统的默认答案，也是任何「信息右移 / 压缩」主张必须打败的对手。本项要判定：这三者在给定内存/字节预算下，长上下文质量与检索召回能达到什么水平，并把该组合落在同一「每位置字节 → 序列级质量 + 长程召回」的天平上，为信息右移类研究提供可比较的跑分线。"
innovation: "相对普通 decoder-only 全注意力：① 窗口注意力只保留最近 W 个位置（连同 sink / 锚点槽，丢掉更远的前缀）；② KV 量化把保留的 KV 压到 int8/int4（块标尺）；③ 检索增强从外部/历史取回相关内容。三者组合后，每位置字节与「可见性对数」由窗口 + 量化 + 检索共同决定。改动量级：可见位置数与每值字节同时下降；不新增主干参数。"
expected_effect: "（a）每位置字节 / 可见位置数下降（该跌）；（b）序列级质量与合成长程召回代价小到可接受（该不跌/可排序，须越 0.014 噪声带）；（c）「低损伤 ≠ 保住了」——必须同时报 bpc 与长程召回两腿，只看 bpc 会漏掉窗口造成的长程召回崩塌。"
sota_baseline: "生产系统的默认答案（滑动窗口 + sink/锚点 + KV 量化 + RAG，`记忆·未核`）；量化腿的业界 SOTA 口径 = KIVI（arXiv:2402.02750）/ KVQuant（arXiv:2401.18079）/ Atom（arXiv:2310.19102）（标题本轮联网核实 HTTP 200，只作设计方向）。本地锚 = 同尺寸 stock 全因果基线（归一为 100%）；已落实的本地对手 = 窗口/锚点（`.scratch/07-x1-x3/evidence`）、M2 保留曲线 `axes/1-time/1.1.4.2-compression/experiments/2614-kv-ablation-retention-13m/analysis.md`、GQA/MQA 与 KV 量化（见 `5.1`）。头共享（GQA/MQA）与量化基线台账见 `axes/7-references/README.md`。"
gap: "业界各家族各报各的压缩（量化按比特、头共享按头、驱逐按 token），**没有把「窗口 + 量化 + 检索」放在同一「每位置字节」预算下统一比较**（来源 `2617` §3，外部条目 `记忆·未核`）。本仓增量 = 把三条腿（窗口保留曲线、KV 量化、头共享）接到同一字节轴与同一检索腿上，给出组合的前沿读数。**最高风险**：把「兄弟线的点值重绘」当成新发现（本项须自己跑组合臂，不能只重绘他线单点）。"
method: "单因素：固定模型/数据/评测窗口，只改保留预算与压缩组合。臂 = {全因果（基线）, 窗口 W（保留预算扫描）, 窗口 + sink/锚点, 窗口 + int8, 窗口 + 锚点 + int8, 上述 + 检索腿}；量化臂用 `5.1` 的块标尺口径（不得用已作废的逐值标尺数字）。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 同尺寸 stock 全因果基线（归一为 100%）；客观判据 = 每位置字节（该跌，含标尺）+ clean bpc（该不跌/可排序，须越 0.014 噪声带）+ 合成长程检索召回（该显著 > chance 且不塌）；口径 = 解析每位置 KV 字节（含标尺）+ clean bpc + 检索召回，**墙钟不进判据**；必须不变 = 同拓扑 fp16 基线、严格因果。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程检索召回等率类指标走配对 bootstrap / Wilson 95% CI、不跨量纲借用 0.014。"
objective_criteria: "该跌：每位置字节随保留预算单调下降（窗口 bpc 损伤随预算单调：keep32→192 从 +0.212 到 +0.004）；该涨：检索腿召回显著 > chance(0.0156) 且 > 同掩码地板；该不跌/可排序：clean bpc（须越 0.014 噪声带）；必须不变：T=256 净亏结论、同拓扑 fp16 基线、严格因果。"
falsification: "若「就用个窗口」的 bpc 代价在按保留预算的曲线上不可忽略（keep32 ≈ +0.212、keep64 ≈ +0.081，与旧「代价几乎为零」判读冲突）⇒ 旧「窗口几乎零代价」判读被否证；若检索腿召回不显著 > chance ⇒ 判检索腿在本尺度无效；若窗口+量化组合在等字节下不优于单用其一 ⇒ 判该组合无增益。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）为主判；长程检索召回等率类指标走配对 bootstrap / Wilson 95% CI（对照 chance = 0.0156 与同掩码地板）、不跨量纲借用 0.014；本格无自测在力带。"
failure_analysis: ""
conclusion: "本地仅覆盖窗口/锚点腿（税 +0.058~0.121 bpc；锚点通道 76.8%→93.3%）；**检索腿与按保留预算的完整窗口曲线未跑**，故组合结论未定，`status: 进行中`。旧「窗口代价几乎为零」判读与 M2 ERRATA（keep32=+0.212、keep64=+0.081）冲突，已按修正口径记为「bpc 损伤随预算单调」。量化部分须用 `5.1` 的块标尺口径（不得引用已作废的逐值标尺数字）。"
conclusion_review: "本项按复核意见修正：旧格 R4 的「窗口几乎零代价」与其自家 ERRATA 冲突（OPERATIONS.md R4 行），已改记为曲线随预算单调；量化部分继承旧格 R1 的逐值标尺错口径会带偏，故本项一律指向 `5.1` 的块标尺口径。本项本地证据多为他线指针（`.scratch/07-x1-x3/evidence` 与 `1.1.4.2` 的 M2 保留曲线），并非本项自跑的组合臂 ⇒ 组合前沿仍缺，独立复核未做。"
