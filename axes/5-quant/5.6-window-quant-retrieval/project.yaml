argument: "组合的判据形态必须是「每位置字节 → 两腿质量」的前沿，而不是单点 bpc 对一个绝对门槛。「低损伤 ≠ 保住了」是本仓合成天平上的已复现现象（窗口 192 的 bpc 只掉 0.0042 但长程召回掉 25%，`5.1` 的 `2632` 口径），故必须两腿并报。跨家族在同一字节轴上比（`SCHEMA.md` §17.12），且量化腿须用 `5.1` 的块标尺口径——旧组合图的跨家族 int4 数字建立在已作废的逐值标尺上，不得引用。`2617` 明确记业界缺「同一 KV 字节预算」的统一比较，本项即补该组合点。"
gaps:
  - "检索腿零本地经验：需跑检索增强臂，报召回是否显著 > chance(0.0156) 且 > 同掩码地板"
  - "按保留预算的完整窗口曲线未跑（keep32→192），组合前沿缺"
  - "量化腿须用 `5.1` 块标尺口径重测（旧组合数字为逐值标尺/非因果口径，已作废）"
  - "跨家族同字节水平已由 `5.1` 的 `2642` 给出 7 个（432/768/816/864/1536/1632/3072 B/位置，含两腿读数）：本项的组合臂应落在这些水平上（或明确另立水平并说明理由），否则组内不可直接比（禁插值）"
  - "本项的高风险是把兄弟线单点重绘当新发现：须自跑组合臂（窗口 × 量化 × 检索）才算数"
  - "「窗口+锚点」不是通用召回救援（只救锚区内源，锚区外仍趴地板，见 `5.1` 的 `2632` 口径）"
cost_model: "等效理论量：每位置 KV 部署字节 = 保留位置数 × 每位置值数 × 每值字节（含标尺）；窗口把保留位置数由 T 降到 W（+ 锚点数），量化把每值字节由 2 B 降到 int8 1.0625 B / int4 0.5625 B（块标尺，`5.1` 口径），检索把部分内容移出 KV（外部取回，按检索侧算力单列）。layer-passes 每 token 仍为 L；tokens-per-forward 每步 1。考虑 pipelining：窗口是环形缓冲（ring-buffer）免重 prefill，块标尺严格前缀不变，二者组合不引入额外顺序依赖；检索是独立的旁路取回（按等效算力单列，不用时间量）。"

