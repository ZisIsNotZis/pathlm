argument: "判定「KV 量化值不值」的判据形态必须是「每位置部署字节 → 序列级质量」的**前沿**，而不是单点 Δbpc 对一个绝对门槛（55-review W-09）。横轴必须统一为**每位置解析 KV 字节（含标尺与 staging）**，禁止用「比特数 / 压缩率」直接互比（`SCHEMA.md` §17.12）；跨家族比较须在同一字节轴上（55-review W-08），且**头共享族的旧数字已随逐值标尺口径作废，不得引用「同 −75% 档 GQA 便宜 3.2×」**。严格前缀不变性是流式部署可用的硬前提：沿 `head_dim` 分块可保持严格因果且把标尺开销摊到 2/G B/值；沿 token 轴分块做不到，须 staging。逻辑链：标尺粒度决定每位置字节（逐值 = 值字节 ×1 + 每值一个 fp16 标尺 ⇒ 反占内存；块标尺 = 值字节 + 2/G）⇒ int8 块标尺每位置 6528 B（×0.53）且近无损，故成为参照线；int4 越噪声带，故有损。"
gaps:
  - "int4 分组 / 按 token 方案（group-wise、per-token K 侧）未测"
  - "fp8 KV 质量未测（归 `5.5`）"
  - "更大 head_dim 点未测（G=32 在 head_dim>32 时标尺开销更小、省幅趋近 50%；归 `5.5`）"
  - "等参数对照缺：头共享族参数量少 8.75%（GQA）/10.21%（MQA），已由 `2642` 精确拆开，但「同字节纯机制」读数仍需一个等参数臂（把 Δparams 还给 FFN/宽度；`2642` §7 登记了等效算力成本），否则 7/7 同字节组的最优臂都带参数混杂"
  - "`mqa_int4`/`gqa_int4` 换块标尺后变差的归因待核（`2632` §7；两臂为不同 checkpoint，参数量混杂已量化但仍未做等参数隔离）"
  - "跨家族同字节重画已完成（`2642`：7 个同字节水平、两腿齐备、禁插值）；仍未覆盖的字节水平（如 1920/6144 附近缺量化档）需补臂才能扩充分组"
  - "内存数字是解析 KV 占用；评测期实现立即反量化，GPU 实测峰值不随档下降（未当作实测内存下降上报）"
  - "66-F2 裁决：头族在原始 Pareto 上支配大量 trunk 臂**不算机制发现**（记为「参数混杂的可见后果」）；纯机制读数须补等参数臂（见上条）"
  - "66-F4 裁决：等参数头共享臂作为 `5.1` 与 `5.4` 共用的 **WP**（本项 `WP3`，同一臂服务两格，不重复建格）；`5.4` 以指针引用"
cost_model: "等效理论量：每位置 KV 值数 = L·2·n_kv·d_head（K+V），fp16 = 2 B/值。块标尺 int8 = 1 B/值 + 2/G B/值 ⇒ G=32 时 1.0625 B/值；int4 = 0.5 + 2/G = 0.5625 B/值；每位置部署字节 = 值数 × 每值字节。layer-passes 每 token 仍为 L、tokens-per-forward 不变（纯推理数值改动，不加前向）。考虑 pipelining：沿 `head_dim` 的块标尺只依赖已生成位置，严格前缀不变、不需 staging，故不引入额外顺序依赖或重算；沿 token 轴的块须持整块（staging），流式解码要延迟 G−1 个位置。未使用任何时间量。"

