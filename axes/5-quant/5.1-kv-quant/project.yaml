milestone:
  output: "一份「KV 量化」判决包：{fp16, int8, int4} × {逐值标尺, 块标尺} 在 13M 上的每位置部署字节（含标尺/staging）+ clean bpc + 合成长程召回，对照 fp16 全因果基线（归一为 100%），含严格前缀不变性两条测试与 n≥2。"
  acceptance: "每位置部署字节与 clean bpc 同框（越噪声带才算可排序；本格在力带 0.036324，见 `2632::ranking_band`）；严格前缀不变性两条为 True；非量化臂逐位不变；块标尺与逐值标尺的字节账分开报；结论停在「该尺度该标尺下值不值」，不外推。 实质验收（C2 裁决）：不被同字节最强基线支配（相对同字节头共享臂超出量 ≤ 0）。"

