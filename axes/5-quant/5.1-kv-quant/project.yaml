# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "5.1"
axis: "5 量化轴"
title: "KV 量化"
dir: "axes/5-quant/5.1-kv-quant"

purpose: "自回归解码时模型要把每个历史位置的 key/value 存进 KV cache 回头查询，cache 随序列长度线性增长，成为长上下文推理的显存/带宽瓶颈。本项要判定：把 KV cache 以低位宽（int8/int4）存放、用时反量化，能否在给定质量（以 fp16 KV 的全因果基线为 100%）下降低每位置 KV 字节，并在「每位置部署字节 → 序列级质量」的代价前沿上占优。"
innovation: "相对普通 decoder-only transformer 用 fp16 存 KV：在推理读注意力缓存那一步把 K/V 量化到 int8/int4，用**块标尺**（标尺沿 `head_dim` 每 G 个值摊一把，G=32）而非逐值标尺——每位置值字节从 2 B/值降到 ≈1 B/值（int8）或 ≈0.5 B/值（int4），质量代价随标尺粒度与位宽变化。权重与训练全部不动（`params_added = 0`）。改动量级：仅推理期数值改动，无参数量/FLOPs 变化。"
expected_effect: "（a）每位置 KV 部署字节下降（该跌，含标尺与 staging）；（b）序列级质量代价小到可接受（该不跌/可排序，须越噪声带（本格**在力带** = 自测单臂跨窗口极差 **0.036324**，见 `2632::ranking_band`；跨格标准带 0.014 要求配对 Δ、≥5 窗口，本批只有 3 个 ⇒ 取更保守者，两者不得混用））；（c）严格前缀不变（必须不变）——量化不能用未来 token 的统计量，否则流式解码不可用（需 staging 到整块）。"
sota_baseline: "工业界 KV 量化：KIVI（Liu et al. 2024，arXiv:2402.02750，K 侧 per-channel / 按 token 分块 + V 侧 per-token，免调优 2 bit）、KVQuant（Hooper et al. 2024，arXiv:2401.18079，per-channel K + 离群/稀疏处理，宣称 1000 万上下文）、Atom（Zhao et al. 2023，arXiv:2310.19102，低比特 KV 服务系统）——三篇标题本轮联网核实（`curl https://arxiv.org/abs/<id>` HTTP 200、标题一致）；机制细节只作设计方向、**不作判据**。与 fp16 KV 全因果基线（本地归一为 100%）。**同价诚实对手** = fp8（解析 1 B/值 = ×0.50，比 int8+块标尺更省，质量归 `5.5` 测）；头共享（MQA/GQA，`axes/7-references/`）与窗口/驱逐（`1.1.1` / `1.1.4.2`）是独立杠杆。本地锚 = fp16 KV 全因果基线（13M = 1.483571 bpc 快照）。"
gap: "业界普遍做 KV 量化（KIVI/KVQuant/Atom，本轮核实 arXiv 编号），**本项最高风险是造轮子**。先划清机制归属：本项实测的 `block` 臂（标尺沿 `head_dim` 每 G=32 个值一把）在机制上等同业界的 per-channel / 分块标尺，`block_tok`/`kivi` 臂对应 KIVI 的 K 侧按 token 分块 ⇒ **机制本身不是增量**。相对 SOTA 的增量 = ①把「每位置**部署**字节（值 + 标尺 + staging）→ 序列级两腿质量」的前沿在 13M 受控设定下量化（业界按比特位宽/压缩率报，少报含标尺的部署字节）；②把**严格前缀不变性**列为独立硬不变量并给可失败单测（业界按最终质量报，少把「流式因果下过去位置的读数不被未来 token 改写」单独设门禁——KIVI 式沿 token 分块正违反这一条，须 staging）；③把跨家族（量化 / 头共享 / 窗口）放在同一「每位置字节」横轴上给出公平前沿。本仓曾用自造的**逐值标尺**把「量化省一半」反算成「量化占内存」（int8 = 3 B/值 = ×1.50），该口径已按块标尺撤回（55-review W-08 / R8）。相对 SOTA 的第二个增量：把跨家族（量化 / 头共享 / 窗口）放在同一「每位置字节」横轴上，给出公平前沿（旧跨家族图建立在已作废的逐值标尺 int4 上，须用块标尺口径重画）。"
method: "单因素：固定被测量模型/checkpoint/数据流/评测窗口，只改 KV cache 的数值精度与标尺方案。臂 = {fp16（基线）, int8, int4} × 标尺方案 = {逐值（per-channel）, 块标尺（沿 `head_dim`，G=16/32）, 沿 token 轴的块（block_tok / KIVI 的 K 侧）}。不训练、不改权重、不新增参数（`params_added = 0`）。基底恒为 stock decoder-only（12 层 × 256 宽 × 8 头 × head_dim 32、mlp6、tied 读出）。"
validation: "端到端：对照 = fp16 KV 全因果基线（归一为 100%）+ 同价对手 fp8（解析字节，质量另测）；客观判据 = 每位置 KV 部署字节（该跌，含标尺/staging）+ clean bpc（该不跌/可排序，须越噪声带（本格在力带 0.036324））+ 合成长程召回（第二腿，该不塌）；口径 = 解析每位置字节（含标尺）+ clean bpc（enwik8 字符级，fp16 基线 1.483571），**墙钟不进判据**；必须不变 = 严格前缀不变性两条（改未来 token / 改同批邻居，过去位置反量化值与 logits 不变）、非量化臂逐位不变。"
objective_criteria: "该跌：每位置 KV 部署字节（含标尺；块标尺 G=32 下 int8 ≈1.0625 B/值、int4 ≈0.5625 B/值）；该不跌/可排序：clean bpc（须越噪声带（本格在力带 0.036324））；该保持：合成长程召回（第二腿不塌）；必须不变：严格前缀不变性两条、非量化臂逐位不变；必须报：staging 成本（非因果 token 轴块持整块）。"
falsification: "若某低位宽方案的 clean bpc 代价越噪声带且吃掉全部内存收益（每位置字节相近的点位上不占优）⇒ 判该档在本尺度不成立；若块标尺不满足严格前缀不变性（须 staging 到整块才能反量化）⇒ 判该实现在流式部署下不可用；若「8 位近无损且省约一半」在块标尺下不成立（掉出噪声带或省幅远小于一半）⇒ 判该参照线被否证。 用哪个带（C1/66-F1 裁决）：本格在力带 0.036324（自测单臂跨窗口极差）为主判；跨格 0.014 bpc 带（限配对 Δ、≥5 窗口，本批仅 3 窗口不满足）只作参考；两带不得混用。"
failure_analysis: ""
conclusion: "KV 量化本地结论（块标尺口径，源 `2632`；旧逐值标尺口径已撤回）：（a）块标尺（沿 `head_dim`，G=32）下 int8 KV = 1.0625 B/值 ⇒ 6528 B/位置 = fp16 的 ×0.53（省 46.875%），Δbpc vs fp16 = **+0.000101**（3 窗口配对 Δ 逐 seed +0.000101/+0.000013/+0.000009，全为正、远低于任何可排序带（本格在力带 0.036324））⇒ **8 位 KV 量化近无损且省约一半内存**，写进参照线；（b）int4 块标尺 = 3456 B/位置（省 71.875%），Δbpc **+0.022522**（有损，越本格在力带 0.036324）；（c）严格前缀不变性成立、块标尺**不需 staging**（`block` g16/g32 = True/True），token 轴块（`block_tok` / KIVI 的 K 侧）不满足前缀不变、需 staging；（d）逐值标尺实现（`2631`）给出的「int8 = 3 B/值 = ×1.50、int4 ×1.25，量化是内存负收益」**已被撤回**——那是标尺粒度的产物；（e）头共享 × 4 位换块标尺后变差（`mqa_int4` Δ=+0.054794 可排序、`gqa_int4` Δ=+0.009642 不可排序），归因待核。结论：**8 位 KV 量化（块标尺）是本仓省内存参照线；4 位是唯一两腿都掉的档位**。fp8 KV 质量与大 head_dim 点归 `5.5`（未测）。（f）跨家族同字节重画（WP2，实验 `2642`，纯再分析）：独立重算的 27 臂部署字节与 `2632::deployment_caliber` **逐位相等**（`max|Δ| = 0`），且 `points[*].bytes_per_position` 系**仅值口径**（int8: 6144 vs 部署 6528）⇒ 两口径不得混用；跨家族**恰好同字节**分组共 **7 个**（432/768/816/864/1536/1632/3072 B/位置），组内 bpc 极差全部越在力带（可排序）、**不需插值**；7/7 组的最优臂都是头共享族，但头共享族参数量少 **8.75%（GQA）/10.21%（MQA）**（解析式 `L·(2·d_model+2)·(H−n_kv)·head_dim` 与磁盘实测逐位一致）⇒ 该优势**不能**归因为纯机制；fp8 解析 6144 B/位置比 int8+块标尺 6528 省 384 B/位置而质量未测 ⇒ 不得称 int8 是 8 位最优。结论：**8 位 KV 量化（块标尺）是本仓省内存参照线；同字节跨家族比较在 7 个字节水平上可做，但「纯机制」读数须补等参数臂**。 验收并列读法（C2 裁决）：milestone 预登记文字（字节账与质量同框、前缀不变性）**字面成立**；其实质（不被同字节最强基线支配）**成立**——8 位块标尺近无损省 46.875%；但「同字节纯机制」读数仍须补等参数臂（7/7 同字节组最优臂带参数混杂）。"
conclusion_review: "本项按 55-review W-08 / R8 修正：旧格 R1 的逐值标尺口径把「量化省一半」反算成「内存负收益」，其跨家族「同 −75% 档 GQA 便宜 3.2×」建立在已作废的逐值标尺 int4 上 ⇒ 该口径与数字一律不迁入。本项结论统一用块标尺（含标尺/staging 的部署字节）口径，并把「严格前缀不变性」列为硬不变量。仍未解的混杂：头共享族的参数量差（实测 −8.75%（GQA）/ −10.21%（MQA））**已由 WP2 精确拆开**（解析式与磁盘实测逐位一致），但「同字节纯机制」读数仍缺等参数臂；`mqa_int4`/`gqa_int4` 变差的归因待核（gaps）。独立复核（`.scratch/49-adversarial-review/REPORT.md`、`.scratch/38-auto-parallel/evidence/REVIEW.md`）已随实验落盘。WP2（`2642`）把参数量混杂从「未拆」推进到**精确拆开**（解析 = 实测），并把同字节跨家族读数摆到统一口径上；其结论强度上限 = 落盘读数在统一口径下的重排（不产生新质量证据），且 7/7 同字节组的最优臂带参数混杂 ⇒ 纯机制读数仍待等参数臂。WP2 的独立复核见 `.scratch/66-axis5-quant/REVIEW-1.md`。"
