# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "5.3"
axis: "5 量化轴"
title: "激活量化"
dir: "axes/5-quant/5.3-activation-quant"

purpose: "普通 decoder-only transformer 前向时的中间激活（attention 与 FFN 的输入/输出张量）是动态的、每个 token 不同，且体量随 batch×序列长度增长，推理时构成显存/带宽与（若用低位 matmul 内核）算力瓶颈。本项要判定：把中间激活以低比特存放（并用低位/整型矩阵乘）能否在给定质量（以 fp16 激活 stock 基线为 100%）下降低激活字节/访存，并在「激活字节 → 序列级质量」的代价前沿上占优。"
innovation: "相对普通 decoder-only transformer 的 fp16 中间激活：在 attention/FFN 的 matmul 输入输出上做激活量化（W8A8 或 W4A8 等低位组合），并按 token/通道做动态标尺。改动量级：参数量不变，激活张量字节从 2 B/元素降到 ≈1 B（8 位）或更低；每 token FLOPs 不变（若用整型内核，理论算力上限更高，但按等效算力记账不变）。"
expected_effect: "（a）激活字节/访存下降（该跌）；（b）序列级质量代价小到可接受（该不跌/可排序，须越 0.014 噪声带）；（c）与 `5.1`（KV 量化）/`5.2`（权重量化）划界：本项只压中间激活，KV 与权重不动，三类账分开报。"
sota_baseline: "激活量化 SOTA：SmoothQuant（Xiao et al. 2023，arXiv:2211.10438，把激活离群难度迁移到权重上以做到 W8A8）、LLM.int8()（Dettmers et al. 2022，arXiv:2208.07339，离群通道 fp16 混合精度）、Atom（Zhao et al. 2023，arXiv:2310.19102，W4A4 低比特服务）——标题本轮联网核实（HTTP 200），只作设计方向、**不作判据**。与 fp16 激活 stock 基线（本地归一为 100%；本轴同一横轴宜用与 `5.1` 相同的 13M trunk = 1.483571 bpc；早期 13M `B0` = 1.5074 bpc 只作历史锚，运行时须声明、**不得跨锚比较**）。"
gap: "本仓零经验（无旧格；MAPPING §2 的「缺」项）。业界激活量化成熟（SmoothQuant/LLM.int8()，本轮核实 arXiv 编号），**本项不重造 SmoothQuant 的迁移算法**（那部分是纯造轮子）⇒ 相对 SOTA 的增量 = ①在 13M 受控设定下把「激活字节（含每 token/通道动态标尺）→ 序列级质量 + 逐层离群通道分布」的前沿量化（业界在大尺度报吞吐/ppl，缺小尺度受控的含标尺字节账）；②把激活量化的**动态性**（标尺随 token/通道变化、离群通道吃掉多少位）做成可失败的活性判据，而不是装饰读数。本项只回答激活这一类账。"
method: "单因素：固定被测量模型/checkpoint/数据流/评测窗口，只改中间激活精度。臂 = {fp16 激活（基线）, int8 激活（W8A8）, 4 位激活（W4A8）}；不训练权重、不改 KV 精度、不新增参数。基底恒为 stock decoder-only。"
validation: "端到端：对照 = fp16 激活 stock 基线（归一为 100%）；客观判据 = 激活字节/访存（该跌）+ clean bpc（该不跌/可排序，须越 0.014 噪声带）+ 逐层激活标尺分布（活性，防离群通道吃掉全精度）；口径 = 解析激活字节 + clean bpc，**墙钟不进判据**；必须不变 = 因果性与非量化臂逐位不变。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
objective_criteria: "该跌：中间激活字节/访存（含每 token/通道标尺）；该不跌/可排序：clean bpc（须越 0.014 噪声带）；该稳定：逐层激活标尺与离群通道分布（活性对照列）；必须不变：因果性与非量化臂逐位不变；必须报：标尺粒度与开销。"
falsification: "若激活量化的 clean bpc 代价越噪声带且吃掉全部字节收益（相近字节点位上不占优）⇒ 判该档在本尺度不成立；若离群通道迫使部分层回退到高精度、使省幅远小于标称 ⇒ 判该实现在该粒度下不可用；若非量化臂不能逐位还原 ⇒ 判实现有误（对照失效）。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
failure_analysis: ""
conclusion: "激活量化本地结论（实验 `2652-act-quant-13m`，13.5M trunk 冻结、纯推理不训练、不改 KV/权重、CPU 口径、5 窗口配对 Δ）：（a）**先隔离激活因子**：主因子臂 `A8`（只把激活压到 int8、权重保持 fp16）每 token 激活字节 = **27744 B（×0.5017）**，clean bpc 1.478151，对 fp16 的 `max|配对 Δbpc|` = **0.003530 < 0.014 ⇒ 不越带（不可分辨）**；`A4`（只把激活压到 4 位、权重 fp16）= **13920 B（×0.2517）**，clean bpc **5.040267**，`max|配对 Δ|` = **3.598298 ≫ 0.014 ⇒ 越带**，且 copy 召回掉到 **地板**（0.0202，CI [0.0143, 0.0285]）；预登记的部署组合点 `W8A8`（权重 int8 per-channel + 激活 int8）= 27744 B，`max|配对 Δ|` = **0.002955 ⇒ 不越带**（其字节账与激活字节账**分列**，未混轴）。（b）**结论**：**只压激活到 int8 基本白赚**（激活字节减半、质量代价落在噪声带内不可排序）；**4 位激活在本规模崩溃**（质量与召回同时掉出带与地板）；`W8A8` 与 `A8` 同字节、同量级代价。（c）**离群通道没有迫使回退**（活性判据的可失败结论）：逐层通道峰值/中位数比均值约 3.36（A8）/ 3.73（A4），最坏张量 `L01.qkv` ≈ 11–12.5（远小于大模型常见的 >100 倍）；超 6×中位数的通道只有 8 个（int8）/ 18 个（4 位），若全部留 fp16 只吃掉标称省幅的 **0.03% / 0.07%** ⇒ `verdict_forces_fallback = false`。（d）**口径**：主表用缩口径 `3×16@seed2`（bpc 1.474621），与 `5.1` 的 `24×16@seed2` 历史锚 1.483569 **不可直接比**；补跑的同口径单点 `24×16@seed2` fp16 = **1.483568730**（`bpc_of` 与 `masked_bpc` 逐位相等，与 GPU 历史锚 `|Δ|` = **2.700e-07**）⇒ 8.95e-03 的差异**已实测确认为批数口径差、非实现缺陷**。验收并列读法（C2 裁决）：milestone 预登记文字（激活字节含标尺账齐备、质量代价与字节节省同框可分、离群分布齐备、非量化臂逐位不变、结论停在该尺度）**字面成立**；实质（不被同字节最强基线支配）**成立** —— `A8`/`W8A8` 在半数字节上质量不可分辨，`A4` 因越带且召回落地板而**不**占优。判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口），本批 5 窗口满足；召回等率类走 Wilson 95% CI、不跨量纲借用；本格无自测在力带。"
conclusion_review: "自评：判据是「激活字节（含每 token/通道标尺）→ clean bpc + 长程召回」的前沿，并把「逐层标尺 / 离群通道」做成**可失败**的活性判据（给出 `verdict_forces_fallback` 判定与吃掉省幅的比例），不是装饰读数。局限：单 checkpoint / 单 seed / T=256 / CPU 设备；**主表为缩口径**（`3×16`，预登记的 24×16 只补跑了 fp16 单点）⇒ 结论的对外可比性下降（配对 Δ 的有效性不受影响，已在 `analysis.md` 如实登记为超出预登记裁剪条款的缩口 + 补齐成本）；字节账是解析价签不是实测峰值。当前（最后一轮）独立复核判词：**FAIL（blocker 3 / normal 4 / info 2）**，见 `.scratch/66-axis5-quant/REVIEW-52-53.md`（包 B）；三条 blocker 为：① 未补跑 `24×16@seed2` 单点 ⇒ 预登记硬护栏②未闭；② `config.json::eval.note` 及副本声称「主表 24×16…同口径可比」属不实叙述；③ `bpc_path.anchor_check_applicable` 与自身定义矛盾。三条均已由返工 writer 逐条处置（① 已实测为 1.483568730、|Δanchor| = 2.700e-07；② 已改为与实跑一致的措辞并声明口径不可比；③ 已按 `n_batches` 门控），第 2 轮（新的 fresh 上下文，未参与第 1 轮）判词：**PASS** —— 第 1 轮各 blocker/normal 全部落地、**无新 blocker**（新发现仅 2 条**文本自相矛盾**的 normal，均已在收口前改毕）；三包的数字与判据线均**未被事后改动**，见 `.scratch/66-axis5-quant/REVIEW-ROUND2.md`。（本包：三条 blocker 全部落地，主表数字未动；另 1 条新 normal（`results.json::caliber_note.open_defect` 陈旧矛盾）已在收口前订正；info I1/I2 未修但已登记为局限。）复核者会话无 `exec`/`git` 全视野 ⇒ mtime 顺序与已提交区间其未能核，已如实登记。"
