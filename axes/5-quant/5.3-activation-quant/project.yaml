experiments:
  - "axes/5-quant/5.3-activation-quant/experiments/2652-act-quant-13m"
argument: "激活量化与 KV 量化、权重量化是三类不同的账（激活是每 token 的动态中间张量，KV 是每位置缓存，权重是静态参数），必须分开记（本轴 `5.1`/`5.2`/`5.3`）。激活量化的难点是**动态范围随 token/通道剧烈变化**，故「逐层标尺 / 离群通道分布」必须是可失败的活性判据，否则无法区分「真省字节」与「把高精度藏在少数离群通道」。"
gaps:
  - "**主表为缩口径**（`3×16@seed2`，另 4 个窗口 `2×16`）：预登记的 24×16 只补跑了 `fp16` 单点（1.483568730，|Δ锚|=2.700e-07）；最小补齐实验 = 主窗 24×16 + 附加窗 8×16 重测 `A8`/`A4`/`W8A8` 的配对 Δ，成本约 28 min CPU（CPU 口径已实测 ~3.4 s/批）"
  - "`W4A8`（权重 4 位 + 激活 8 位）与纯 `W4A16` 未测；`int4` 的离群通道保护（把 >6×中位数的通道留 fp16）是本规模最可能救回 4 位的改动，最小实验 = 加一条分支重跑"
  - "激活字节账是**解析**口径（逐张量元素数 × 每元素字节 + 标尺摊薄），未上报实测峰值；「访存/带宽」收益未做端到端实测"
  - "整型 matmul 内核的等效算力记账（低位理论峰值）未定口径；本项按契约声明主 FLOPs 不变"
  - "与 `5.1`（KV 量化）/ `5.2`（权重量化）的三类账未在同一张图上并报（由 integrator 核不重复）"
  - "造轮子风险：本项不重造 SmoothQuant 的迁移算法（`arXiv:2211.10438`）；增量是小尺度受控的含标尺激活字节账 + 把「逐层标尺/离群通道」做成可失败活性判据"
cost_model: "等效理论量：每 token 中间激活字节 = 元素数 × 位宽/8 + 每 token/通道标尺摊薄；与权重/KV 精度独立。layer-passes 每 token 仍为 L、tokens-per-forward 每步 1；主 FLOPs 不变（整型内核按等效位宽记账，不改变主 FLOPs 计法）。考虑 pipelining：激活量化是同一前向内的逐张量标定与反量化，不引入额外顺序依赖（按解析字节报，不用时间量）。"

