# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "5.5"
axis: "5 量化轴"
title: "fp8 / 大 head_dim"
dir: "axes/5-quant/5.5-fp8-head-dim"

purpose: "8 位量化有两条不同的路：定点的 int8 与浮点的 fp8（E4M3/E5M2）。fp8 的动态范围比 int8 大、可能免去分组标尺，但尾数分辨率更低；同时 KV 量化的标尺开销与 `head_dim` 有关（标尺沿 `head_dim` 每 G 个值摊一把，`head_dim` 越大摊得越薄、省幅越接近极限）。本项要判定：fp8 相对 int8+块标尺在「每位置部署字节 → 序列级质量」前沿上如何（更省还是更贵、质量如何），以及 `head_dim` 放大时块标尺的开销如何变化。"
innovation: "相对普通 decoder-only transformer 的 fp16 张量：用浮点 8 位（E4M3/E5M2）存 KV/激活，利用其动态范围免去或简化分组标尺；并在不同 `head_dim` 下改变块标尺的组大小 G，让每值标尺摊薄随 `head_dim` 变化。改动量级：与 int8 同为 8 位，每值 ≈1 B（+ 标尺，若免标尺则纯 1 B）；`head_dim` 只改变标尺摊薄，不改变值字节。"
expected_effect: "（a）fp8 可能免标尺 ⇒ 每位置字节更低（该跌），但质量须与 int8+块标尺同框比较；（b）大 `head_dim` 下标尺摊薄更细 ⇒ 省幅趋近极限（该跌标尺开销）；（c）必须把 fp8 与 int8+块标尺放在**同一「每位置字节」轴**上，不得只比位宽。"
sota_baseline: "fp8 数值格式：FP8 Formats for Deep Learning（Micikevicius et al. 2022，arXiv:2209.05433，定义 E4M3/E5M2 及其动态范围与精度）——标题本轮联网核实 HTTP 200，只作设计方向、不作判据；KV/权重 fp8 推理已工程化（vLLM / TensorRT-LLM 的 fp8 KV cache，`记忆·未核`）。大 `head_dim` 设计点：DeepSeek-V2 MLA `head_dim`=128（arXiv:2405.04434，标题本轮核实）。本地锚 = `5.1` 的块标尺口径（int8 = 1.0625 B/值、int4 = 0.5625 B/值，`head_dim`=32）与 fp16 全因果基线（trunk 1.483571 bpc、12288 B/位置）。`5.1` 明确记「fp8 解析 1 B/值 = 6144 B/位置 = ×0.50，比 int8+块标尺更省，质量未测」——本项即补这个质量点。"
gap: "本仓零经验（无旧格自有实验；MAPPING §2 的「缺」项，承接 `5.1` 的 fp8 质量与大 head_dim 缺口）。业界 fp8 已用于训练/推理（arXiv:2209.05433 定义格式；工程部署 `记忆·未核`），**本项最高风险是造轮子**。相对 SOTA 的增量 = 把 fp8 与 int8+块标尺放在**同一「每位置字节」轴**、同一个 13M 受控设定下比较质量（业界 fp8 质量多在 ≥1B 尺度对各格式分别报，缺同轴小尺度对照），并给出「`head_dim` → 标尺摊薄 → 每位置字节」的解析 + 实测对照（本仓 `head_dim`=32 时 G=32 已是沿 head_dim 的块上限，省幅在 46.875% 处封顶，更大 head_dim 才能更接近 50%）。"
method: "单因素：固定模型/数据/评测窗口，只改 8 位存放的数值格式与大 `head_dim` 设置。臂 = {fp16（基线）, int8 块标尺（对照）, fp8 E4M3, fp8 E5M2} × `head_dim` ∈ {32（现状）, 更大}；不训练、不改权重、不新增参数。基底恒为 stock decoder-only。"
validation: "端到端：对照 = fp16 全因果基线（归一为 100%）+ `5.1` 的 int8 块标尺同轴对照；客观判据 = 每位置部署字节（该跌，含标尺）+ clean bpc（该不跌/可排序，须越 0.014 噪声带）+ 严格前缀不变性（该成立）；口径 = 解析每位置字节（含标尺）+ clean bpc，**墙钟不进判据**；必须不变 = 严格前缀不变性两条、非量化臂逐位不变。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
objective_criteria: "该跌：每位置部署字节（fp8 免标尺时 1 B/值；大 `head_dim` 下标尺摊薄 2/G B/值）；该不跌/可排序：clean bpc（fp8 vs int8+块标尺，须越 0.014 噪声带）；必须不变：严格前缀不变性两条、非量化臂逐位不变；必须报：fp8 是否需分组标尺、大 `head_dim` 下的 G 与省幅。"
falsification: "若 fp8 的 clean bpc 代价越噪声带且其免标尺的字节优势被质量否定（同字节下不占优）⇒ 判 fp8 在本尺度不值得；若 fp8 同样需要分组标尺（免不掉标尺）⇒ 判其「免标尺」前提失败；若大 `head_dim` 下标尺摊薄不改变每位置字节（与解析不符）⇒ 判实测与解析口径不一致、须查明。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
failure_analysis: ""
conclusion: "fp8 / 大 head_dim 本地结论（实验 `2653-fp8-vs-int8-13m`，13.5M trunk 冻结、纯推理不训练、CPU 口径、5 窗口配对 Δ）：（a）WP1 成立：4 主臂在同一「每位置部署字节」轴上可比 —— `fp16` = 12288 B/位置 · `int8` 块标尺 G=32 = **6528 B/位置**（1.0625 B/值，与 `5.1`/`2632` 逐项对上）· `fp8 E4M3` = **6144 B/位置**（1.0 B/值）· `fp8 E5M2` = **6144 B/位置**；其中 `fp8` 实测 **`n_scales = 0`（真免标尺，无隐藏 clip/scale）** ⇒ 比 int8+块标尺每位置省 **384 B（−5.9%）**。质量（clean bpc）：`fp8_e4m3` = 1.486669、`fp8_e5m2` = 1.495192；相对 fp16 的 `max|配对 Δbpc|`：E4M3 在 0.014 带内、**E5M2 越带**。**fp8 相对 int8+块标尺的二选一判定（预登记要求）**：按 `results.json` 的 5 窗口配对读数复算，`fp8_e4m3 − int8_block_g32` 的 `max|配对 Δ| = 0.005363 < 0.014` ⇒ **不越带、质量不可分辨**；`fp8_e5m2 − int8_block_g32` 的 `max|配对 Δ| = 0.014496 > 0.014` ⇒ **越带（E5M2 相对 int8 块标尺确实更差）**。即：**同一「每位置字节」轴上 fp8 E4M3 比 int8+块标尺省 384 B/位置（−5.9%）且质量不可分辨，E5M2 则不成立**（该判定句原缺写，由第 1 轮复核指出、返工补齐并由第 2 轮复核独立复算确认）。严格前缀不变性两条 = True/True（7 臂）。（b）WP2 **仅部分成立**：`head_dim → G → 每位置字节` 的**解析**已给出（`head_dim`=32、G=32 时省幅在 46.875% 封顶；`head_dim`=64、G=64 ⇒ 每值 1.03125 B、每位置 6336 B、省幅 48.4375%），并在 `head_dim`=32 上做了 **G ∈ {8,16,32} 的实测扫描**与解析对账；但 **`head_dim`=64 的实测腿未完成**（GPU 锁被其它轴长期占用 + 训练预算不足，已记 `wp2_hd64_status.json`，含精确复现命令与能力面检查 `engine_change_required=false`）⇒ milestone 验收「大 `head_dim` 省幅与解析一致」**只有解析 + `head_dim`=32 实测支撑，`head_dim`=64 不外推**，故本项**不判** `已完成`，记 `进行中`。验收并列读法（C2 裁决）：milestone 的「四臂同字节轴可比 / fp8 二选一明确 / 前缀不变性两条 / 结论停在该尺度」**字面成立**；其中「大 `head_dim` 省幅与解析一致」**仅解析成立、实测未闭**，实质验收**未完全成立**。判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口），本批 5 窗口满足；召回等率类走 Wilson 95% CI、不跨量纲借用；本格无自测在力带。"
conclusion_review: "自评：横轴统一「每位置部署字节」并与 `5.1` 的 int8 块标尺逐项对账（6144/12288/6528 三个锚在 `5.1` 侧真实存在，非本包自造），字节账每因子可由 `fp8_arms.py` 反推；fp8 真免标尺由 `n_scales=0` + 源码无 clip/scale 双证。局限：单 checkpoint / 单 seed / T=256 / CPU 设备；字节账是解析价签不是实测峰值；`head_dim`=64 只有解析。当前（最后一轮）独立复核判词：**OK with notes（blocker 1 / normal 3 / info 4）**，见 `.scratch/66-axis5-quant/REVIEW-5.5.md`；该 blocker（预登记要求的「fp8 相对 int8 越/不越带，二选一明确」产物未写出）与 normal（E5M2 越带依赖未声明的聚合口径等）已由返工 writer 处置，第 2 轮（新的 fresh 上下文，未参与第 1 轮）判词：**PASS** —— 第 1 轮各 blocker/normal 全部落地、**无新 blocker**（新发现仅 2 条**文本自相矛盾**的 normal，均已在收口前改毕）；三包的数字与判据线均**未被事后改动**，见 `.scratch/66-axis5-quant/REVIEW-ROUND2.md`。（本包：blocker 落地，二选一判定已明文且经复核者**独立复算**确认 `e4m3−int8` max|Δ| = 0.005363、`e5m2−int8` max|Δ| = 0.014496；另 1 条新 normal（本文件 `conclusion` 把 e5m2−int8 误写「均 < 0.014」）已在收口前改毕；N1/N2 未修但已登记为局限。）复核者独立建议 `status = 进行中`（理由是 WP2 实测腿缺位 ⇒ milestone 未闭），本项采纳。复核者会话无 `exec`/`git` 全视野 ⇒ mtime 顺序与已提交区间其未能核，已如实登记。"
