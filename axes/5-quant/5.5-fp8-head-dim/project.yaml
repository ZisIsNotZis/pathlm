argument: "8 位方案里 fp8（浮点）与 int8（定点）的取舍是「动态范围换尾数分辨率」：fp8 动态范围大可能免标尺 ⇒ 每值 1 B；int8 需分组标尺 ⇒ 1 + 2/G B/值。二者必须在**同一每位置字节轴**上比质量，否则「fp8 更省」只是位宽话术（`SCHEMA.md` §17.12）。大 `head_dim` 只影响标尺摊薄（不影响值字节），故它是「int8 块标尺省幅趋近极限」的杠杆；`head_dim`=32 时 G=32 ⇒ 一个标尺/头，`head_dim` 更大时 G 可摊得更细。"
gaps:
  - "**`head_dim`=64 的实测腿未完成**（本项唯一未闭的 milestone 验收项）：最小实验 = 训练 1 个 13M（`--heads 4` ⇒ head_dim 64，命令见 `experiments/2653-fp8-vs-int8-13m/wp2_hd64_status.json`，约 9 min GPU）再跑 {fp16, int8_block G=64, fp8_e4m3} 三臂 CPU 评测，与解析对账（预期每值 1.03125 B、每位置 6336 B、省幅 48.4375%）；阻塞 = 单卡被多轴共享 + GPU 锁长期被占"
  - "`fp8 E5M2` 越带而 `E4M3` 不越带 ⇒ 「用哪个 fp8 格式」的取舍只在这一对点上成立；未扫格式内其它设定（如 RZ 舍入、per-tensor 补偿）"
  - "字节账是解析价签，不是实测峰值（评测期实现立即反量化 ⇒ 峰值不随档下降）；未上报实测内存收益"
  - "与 `5.1` 的 int8 块标尺同轴对照已完成；与 `5.3` 的激活量化组合（fp8 激活）未测（组合默认留白，`SCHEMA.md` §4）"
  - "造轮子风险：本项不重造 fp8 格式/推理框架（`arXiv:2209.05433` 定义格式；vLLM/TensorRT-LLM 的 fp8 KV cache 为 `记忆·未核`），增量只是 13M 受控同轴比较 + `head_dim`→字节的解析×实测对账"
cost_model: "等效理论量：fp8 = 1 B/值（若免标尺）或 1 + 2/G B/值（若分组标尺）；int8 块标尺 = 1 + 2/G B/值；二者同轴。每位置部署字节 = 值数 × 每值字节，值数 = L·2·n_kv·d_head。大 `head_dim` 只改变 G 的摊薄（2/G B/值），不改变 1 B/值 的部分。layer-passes 每 token 仍为 L、tokens-per-forward 每步 1。考虑 pipelining：fp8/块标尺只依赖已生成位置，严格前缀不变、不需 staging，不引入额外顺序依赖（按解析字节报，不用时间量）。"

