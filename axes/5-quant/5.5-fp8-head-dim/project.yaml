# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "5.5"
axis: "5 量化轴"
title: "fp8 / 大 head_dim"
dir: "axes/5-quant/5.5-fp8-head-dim"

purpose: "8 位量化有两条不同的路：定点的 int8 与浮点的 fp8（E4M3/E5M2）。fp8 的动态范围比 int8 大、可能免去分组标尺，但尾数分辨率更低；同时 KV 量化的标尺开销与 `head_dim` 有关（标尺沿 `head_dim` 每 G 个值摊一把，`head_dim` 越大摊得越薄、省幅越接近极限）。本项要判定：fp8 相对 int8+块标尺在「每位置部署字节 → 序列级质量」前沿上如何（更省还是更贵、质量如何），以及 `head_dim` 放大时块标尺的开销如何变化。"
innovation: "相对普通 decoder-only transformer 的 fp16 张量：用浮点 8 位（E4M3/E5M2）存 KV/激活，利用其动态范围免去或简化分组标尺；并在不同 `head_dim` 下改变块标尺的组大小 G，让每值标尺摊薄随 `head_dim` 变化。改动量级：与 int8 同为 8 位，每值 ≈1 B（+ 标尺，若免标尺则纯 1 B）；`head_dim` 只改变标尺摊薄，不改变值字节。"
expected_effect: "（a）fp8 可能免标尺 ⇒ 每位置字节更低（该跌），但质量须与 int8+块标尺同框比较；（b）大 `head_dim` 下标尺摊薄更细 ⇒ 省幅趋近极限（该跌标尺开销）；（c）必须把 fp8 与 int8+块标尺放在**同一「每位置字节」轴**上，不得只比位宽。"
sota_baseline: "fp8 数值格式：FP8 Formats for Deep Learning（Micikevicius et al. 2022，arXiv:2209.05433，定义 E4M3/E5M2 及其动态范围与精度）——标题本轮联网核实 HTTP 200，只作设计方向、不作判据；KV/权重 fp8 推理已工程化（vLLM / TensorRT-LLM 的 fp8 KV cache，`记忆·未核`）。大 `head_dim` 设计点：DeepSeek-V2 MLA `head_dim`=128（arXiv:2405.04434，标题本轮核实）。本地锚 = `5.1` 的块标尺口径（int8 = 1.0625 B/值、int4 = 0.5625 B/值，`head_dim`=32）与 fp16 全因果基线（trunk 1.483571 bpc、12288 B/位置）。`5.1` 明确记「fp8 解析 1 B/值 = 6144 B/位置 = ×0.50，比 int8+块标尺更省，质量未测」——本项即补这个质量点。"
gap: "本仓零经验（无旧格自有实验；MAPPING §2 的「缺」项，承接 `5.1` 的 fp8 质量与大 head_dim 缺口）。业界 fp8 已用于训练/推理（arXiv:2209.05433 定义格式；工程部署 `记忆·未核`），**本项最高风险是造轮子**。相对 SOTA 的增量 = 把 fp8 与 int8+块标尺放在**同一「每位置字节」轴**、同一个 13M 受控设定下比较质量（业界 fp8 质量多在 ≥1B 尺度对各格式分别报，缺同轴小尺度对照），并给出「`head_dim` → 标尺摊薄 → 每位置字节」的解析 + 实测对照（本仓 `head_dim`=32 时 G=32 已是沿 head_dim 的块上限，省幅在 46.875% 处封顶，更大 head_dim 才能更接近 50%）。"
method: "单因素：固定模型/数据/评测窗口，只改 8 位存放的数值格式与大 `head_dim` 设置。臂 = {fp16（基线）, int8 块标尺（对照）, fp8 E4M3, fp8 E5M2} × `head_dim` ∈ {32（现状）, 更大}；不训练、不改权重、不新增参数。基底恒为 stock decoder-only。"
validation: "端到端：对照 = fp16 全因果基线（归一为 100%）+ `5.1` 的 int8 块标尺同轴对照；客观判据 = 每位置部署字节（该跌，含标尺）+ clean bpc（该不跌/可排序，须越 0.014 噪声带）+ 严格前缀不变性（该成立）；口径 = 解析每位置字节（含标尺）+ clean bpc，**墙钟不进判据**；必须不变 = 严格前缀不变性两条、非量化臂逐位不变。 判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
objective_criteria: "该跌：每位置部署字节（fp8 免标尺时 1 B/值；大 `head_dim` 下标尺摊薄 2/G B/值）；该不跌/可排序：clean bpc（fp8 vs int8+块标尺，须越 0.014 噪声带）；必须不变：严格前缀不变性两条、非量化臂逐位不变；必须报：fp8 是否需分组标尺、大 `head_dim` 下的 G 与省幅。"
falsification: "若 fp8 的 clean bpc 代价越噪声带且其免标尺的字节优势被质量否定（同字节下不占优）⇒ 判 fp8 在本尺度不值得；若 fp8 同样需要分组标尺（免不掉标尺）⇒ 判其「免标尺」前提失败；若大 `head_dim` 下标尺摊薄不改变每位置字节（与解析不符）⇒ 判实测与解析口径不一致、须查明。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）。"
failure_analysis: ""
conclusion: "fp8 / 大 head_dim 本地结论（两条实验：`2653-fp8-vs-int8-13m` = WP1 四臂 @ `head_dim`=32，`2655-fp8-hd64-head-dim` = WP2 的实测腿 @ `head_dim`=64；均为 13M trunk 冻结 / 纯推理不训练 / CPU 口径 / 同一评测入口（5 窗口配对 Δ、主表 24×16 seed 2））。（a）**WP1 成立**：4 主臂在同一「每位置部署字节」轴上可比 —— `fp16` = 12288 B/位置 · `int8` 块标尺 G=32 = **6528 B/位置**（1.0625 B/值，与 `5.1`/`2632` 逐项对上）· `fp8 E4M3` = **6144 B/位置**（1.0 B/值）· `fp8 E5M2` = **6144 B/位置**；其中 `fp8` 实测 **`n_scales = 0`（真免标尺）** ⇒ 比 int8+块标尺每位置省 **384 B（−5.9%）**。质量：`fp8_e4m3` 相对 int8+块标尺的 `max|配对 Δ|` = **0.005363 < 0.014** ⇒ 不可分辨；`fp8_e5m2` = **0.014496 > 0.014** ⇒ 越带。（b）**WP2 的 hd64 实测腿成立**：在同一「每位置字节」轴上，`head_dim`=64（`--heads 4`，每位置 KV 值数仍为 6144）实测 `int8` 块标尺 **G=64 = 6336 B/位置、省幅 48.4375%**、`fp8 E4M3` = **6144 B/位置、50%**、辅助 G 阶梯 G=16 = 6912 / G=32 = 6528 逐一落位；实测标尺密度 = `1/G`（G=64 ⇒ 0.015625）与解析 `2/G` 摊薄项**逐位一致（差 0）** ⇒ 判据的否证条件「大 head_dim 摊薄与解析不符」**未命中**。质量：`int8_block_g64` 1.483140（相对 fp16 1.483031 的 `max|配对 Δ|` = **0.000226**）、`fp8_e4m3` 1.484297（**0.002294**），均不越 0.014 带；`fp8_e4m3 − int8_block_g64` 的 `max|配对 Δ|` = **0.002279** ⇒ 两条腿上「fp8 E4M3 与 int8 块标尺质量不可分辨」同向复现。（c）**head_dim 抬高只压薄标尺、不省值**：`fp8` 相对 int8 块标尺的字节优势在 `head_dim`=32 上是 384 B/位置（6528 → 6144）、在 64 上缩到 **192 B/位置**（6336 → 6144），因为省幅的封顶只取决于 G 能取多大（32 → 46.875%、64 → 48.4375%、免标尺 50%）；两条腿的每位置值数恒为 6144 （`2·12·8·32` 与 `2·12·4·64` 同值）。严格前缀不变性两条 = True/True（`2653` 7 臂、`2655` 5 臂全 True）；非量化臂逐位复原（`2653` = 1.470954、`2655` = 1.471526：各自 fp32 恒等臂的 `bpc_of` 与库路径 `masked_bpc` 逐位相等、`abs_diff = 0`，两个数不同是因为被测 checkpoint 不同）。（d）**第二 seed 腿同向复现（n=2）**：`2655` 的 seed 1 腿（`hd64-s1`，同一入口的 `--seed-leg second_seed`、同一臂表与判据线，只换被测权重）上，`int8_block_g64` / `fp8_e4m3` 相对同腿 `fp16` 的 `max|配对 Δ|` = **0.000216 / 0.002129**（均不越带），`fp8_e4m3 − int8_block_g64` 的 `max|配对 Δ|` = **0.002045**（seed 0 同量 0.002279）⇒ 两腿同向、同带内；字节账两腿逐位相同（12288 / 6336 / 6144）。验收并列读法（C2 裁决）：**字面成立**——四臂同字节轴可比、fp8 二选一明确、前缀不变性两条、大 `head_dim` 省幅与解析一致（实测差 0）、结论停在该尺度；**实质成立**——免标尺的 fp8 E4M3 在同字节轴上比 int8 块标尺再省 3.0%（6144 vs 6336）且质量不可分辨，未被「换 G」这一档支配（G=64 已是 `head_dim`=64 的合法上限）。判据带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口），两实验均 5 窗口满足；召回等率类走 Wilson 95% CI、不跨量纲借用；本格无自测在力带。"
conclusion_review: "自评：横轴统一「每位置部署字节」并与 `5.1` 的 int8 块标尺逐项对账（12288 / 6528 / 6336 / 6144 四个锚在 `5.1`、`2632` 与两实验侧真实存在，非本包自造），字节账每个因子可由 `2653/fp8_arms.py::deployment_ledger` 反推；fp8 真免标尺由 `n_scales = 0` + 源码无 clip/scale 双证；hd64 的「实测 = 解析」由实测标尺密度 `1/G` 反推每位置字节、与解析价签差 0（`2655/results.json::wp2_reconciliation.all_consistent = True`），读数各有落盘日志与代码哈希可核（`2655/results.json::code` 三条脚本/配置哈希、`2655/results.json::cost.wall_seconds = 663.23` 为 seed 0 腿的单次 CPU 整程）。跨 run 复现的落盘证据两条：① `2653` 的 `fp16` 臂重跑 `2655/f5-anchor-2653-rerun/results.json`（CPU、24×16@seed2，单臂墙钟 157.75 s、整次重跑 9.1 min，读数 1.483570 与 `2653` 主表逐位相同；12 位精度单点 1.48357047091、144.75 s）；② `2655` 的 seed 1 腿在同一设备上跑两次（首跑 113.36 s / 重跑 106.9 s，落盘 `cost.wall_seconds = 107.03` = 重跑那一次），三主臂 + 两辅助臂的 bpc、每位置字节、标尺密度、召回、前缀不变性**逐位相同**（只差逐臂墙钟与 `hp64_arms.py` 的哈希）。seed 0 主表仍是单次整程跑，没有第二次复现。局限：n=2（`hd64-s0` seed 0 与 `hd64-s1` seed 1 两条腿，各腿只判自己的配对 Δ）、单尺度 13M、T=256、CPU 设备；字节账是解析价签不是实测峰值（评测期立即反量化）；`head_dim` 只有 32 与 64 两点、不外推 128；`fp8 E5M2` 的越带只在 hd32 上测过。复核：WP1 与 WP2 的解析部分经两轮独立复核（判词 PASS）——当时因 hd64 实测腿缺位而建议 `进行中`；**hd64 实测腿（含 seed 1 腿）是在那次复核之后落盘的，尚无独立复核**，本项的 `已完成` 因此按「自评 + 待复核」读，该腿的独立复核仍待派。"
