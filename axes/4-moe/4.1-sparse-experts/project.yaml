argument: "「稀疏激活专家」是「保容量减计算」的专家粒度版：总参数（容量）按 E 放大、每 token 只激活 top-k 个专家 ⇒ 每 token FLOPs 与 dense 同级而容量更大。判定它值不值必须给等 FLOPs 与等参数双对照（`SCHEMA.md` §15），否则无法把「容量增益」与「参数/算力记账」分开。活性（专家使用率）是必须报的对照列，否则无法区分「真扩容」与「路由坍缩」。与 `3.1.5` 通道极化 / 稀疏激活的边界：`3.1.5` 是通道粒度、本项是专家（FFN 块）粒度。"
gaps:
  - "本仓零经验：需先做最小判决（13M、{dense, top-1, top-2} 三臂 + 等 FLOPs/等参数双对照，matched-step，报 clean bpc + 每 token 等效 FLOPs + 专家使用率分布）"
  - "与 4.2（路由与负载均衡）/ 4.3（专家粒度/异构）的边界未整合（由 integrator 核不重复）"
  - "造轮子风险最高项（55-review W-04）：须在最小判决里明确「相对 Switch/Mixtral/DeepSeekMoE 的增量」是什么，否则结论无新知识"
  - "13M 尺度的 MoE 意义存疑（SCHEMA §7）：专家数少，须先证明该尺度仍能改变「某种算力路径值不值」的判断"
  - "65-F1 裁决：本项降为 **Backlog**（不在 13M 花算力做 MoE 判决），保留本仓等效代价口径记录（WP0 记账）；业界标准 MoE（Switch / GShard / DeepSeekMoE）的跑分线登记在 `axes/7-references/README.md`，将来做大 token 预算时以它为外部基线"
  - "65-F2 裁决：GPU 协调事项——取锁期间卡曾被未持锁外部进程占用（12.9GB / 90%），后续训练判决（若重启）须按 `SCHEMA.md` §20 排队协调"
cost_model: "等效理论量：dense FFN 每 token 过 1 个 FFN（FLOPs ≈ 2·d·h_ff/层）；top-k 专家（E 个）每 token 只过 k 个 ⇒ 每 token FFN 等效 FLOPs ≈ k·2·d·h_ff（与 dense 同形），但总参数 ≈ E·2·d·h_ff（容量约 ×E/k 当激活算力固定）。layer-passes 每 token 仍为 L（层数不变）；tokens-per-forward 每步 1。路由器是 d×E 的极小头（计入每 token 计算）。考虑 pipelining：专家路由是同一前向内按 token 的稀疏 gather，不引入额外顺序依赖，但负载不均会使某些专家成为并行气泡（按期望负载报，不用时间量）。"

