# 研究项 SSOT：契约见 harness/research-schema.md，布局见 docs/structure.md §12。
id: "4.1"
axis: "4 专家轴（MoE）"
title: "稀疏激活专家（top-k 路由）"
dir: "axes/4-moe/4.1-sparse-experts"

purpose: "普通 decoder-only transformer 的 FFN 是 dense 的——每个 token 都要过全部 FFN 参数，于是「模型容量（参数量）」与「每 token 计算量（FLOPs）」被绑死：想扩容量就得扩每 token FLOPs。本项要判定：把 FFN 换成稀疏激活专家（每个 token 只按 top-k 路由激活少数专家、其余不参与前向），能否在总参数（容量）远大于 dense 的前提下，把每 token 等效算力压到同尺寸 dense 同级或更低，并在以同 FLOPs dense 为 100% 的质量-代价前沿上占优。"
innovation: "相对普通 decoder-only transformer 的单一大 FFN：每个 FFN 层替换为 E 个专家 FFN + 一个按 token 条件选 top-k（k≪E）的路由器，每个 token 只过 k 个专家。改动量级：总参数 ≈ E·(单个专家参数)（相对 dense 约 ×E/k 当激活算力固定），每 token FFN 等效算力 ≈ k 个专家（相对等容量 dense 约 ×k/E）；路由器只是 d×E 的极小头。主干层数、可见集合、注意力不变。"
expected_effect: "（a）在固定每 token 激活 FLOPs 下抬高总参数/容量（保容量减计算）；（b）代价是路由容量与负载不均衡可能吃掉收益，须放进以同 FLOPs dense 为 100% 的质量-代价前沿；（c）必须报活性（专家使用率分布），否则无法区分「真扩容」与「路由把 token 全塞给少数专家」。"
sota_baseline: "Switch Transformer（top-1 路由 + 负载均衡 aux loss，arXiv 2101.03961）、GShard（top-2 路由 + capacity factor，arXiv 2006.16668）、Expert Choice Routing（专家挑 token，arXiv 2202.09368）、Mixtral（8 专家 top-2，arXiv 2401.04088）、DeepSeekMoE（细粒度 + 共享专家，arXiv 2401.06066）、ST-MoE（router z-loss，arXiv 2202.08906）、DeepSeek-V3（aux-loss-free bias 均衡，arXiv 2412.19437）。出处已于本轮联网核实 arXiv 标题（`.scratch/65-axis4-moe/TICKET.md` §4）；机制系数/超参只作方向引用、不作判据。本地锚 = 同尺寸 stock dense（归一为 100%；本仓 B0 锚 = 1.5074 bpc 快照，13M 基底 = `configs/B0.json`，实测 13,602,304 参数）。"
gap: "本仓零经验：旧格 W2-expertization 无自有 experiments（MAPPING §1），仅一份「业界已做透」的定性情报。MoE 是业界已大规模验证的成熟路线（「同 FLOPs 更多参数」的唯一规模化路线），**本项最高风险是造轮子**；且 13M 尺度上专家数少、意义存疑（SCHEMA §7 规模纪律），须先证明该尺度仍能改变判断。**相对 Switch/GShard 的具体增量**：① 上游报「大尺度吞吐/质量」，本项给**小尺度、单文件数据、单卡**下「每 token 专家激活 MACs → (clean bpc, 总参数, 专家使用率分布)」三列同框，并把**等 FLOPs 与等参数双对照**都钉到数字（`2610` WP0 已给出：等 FLOPs 臂专家 MACs 逐位相等 + 路由税 +0.26%；等参数 dense 对照 mlp_mult 48/24，相对差 <0.2%）；② 上游几乎不报小尺度 `tokens-per-param` 下的**欠拟合混淆**（等 FLOPs top-1 臂 token/param 仅 1.23，dense 为 7.23），本项把它列为必须报的对照列。**不是**把 Mixtral 在 13M 重跑一遍。若给不出相对 SOTA 的实质增量，本项须降为参照、不立项。"
method: "单因素：固定数据/训练预算与主干形状，只改 FFN 的专家化配置。已执行的一轮 = top-1 路由（E=4 / E=8）+ 等激活算力 dense 主对照 + 等参数 dense 旁证（`2611`）；top-2 路由只在 WP0 记账里钉过参数量与 MACs（`2610` 的 moe-top2-E8），未训练，留给 `4.2` 与后续契约。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 同尺寸 stock dense（等 FLOPs 与等参数双对照，归一为 100%）；客观判据 = 序列级 clean bpc（该不跌/可排序，须越 0.014 噪声带）+ 每 token 等效 FLOPs（该跌或持平）+ 专家使用率分布（活性，防坍缩，必须报）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变 = 因果性与总参数记账一致（不把「减参数」记成「减算力」）。 判据带（C1 裁决）：0.014 bpc 带限配对 Δ、≥5 窗口；概率 / 使用率类指标按 prompt 聚类 bootstrap / Wilson CI 主判，不跨量纲借用 0.014。"
objective_criteria: "该涨：同 FLOPs 下的有效容量/参数量；该不跌/可排序：clean bpc（相对同 FLOPs dense，须越 0.014 噪声带）；该均衡：专家使用率分布（防坍缩）；必须不变：因果性；必须报：路由器额外参数与计算、总参数记账。"
falsification: "若在等参数对照下，MoE 相对同 FLOPs dense 的 clean bpc 不占优（越噪声带变差或持平）且无法由使用率分布解释 ⇒ 判本尺度稀疏激活专家不产生新知识；若专家使用率坍缩（少数专家吃掉绝大多数 token）且无法用均衡机制修复 ⇒ 判该机制在本尺度失效。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）；使用率 / 路由类指标走配对 CI、不借用 0.014。"
failure_analysis: "**本项命题（同每 token 激活算力下，成倍参数能兑现成质量）在 13M / 98.3M token 这一格被本地证据否证**，按 `harness/SCHEMA.md` 的三分法归因：① **实现问题：排除**——`E=1,top-1` 灌入 stock `mlp` 权重与 dense 逐位相等（`preflight.json::bitwise_equal = true` + 反恒真单测）、分组前向与朴素前向 `max_abs_diff == 0`、专家 MACs 比值恰 1.0、8/8 臂过入场门（`gnorm_max` 3.87–18.66、`grad_skips` 0）、同 seed 非 FFN 参数逐位拷贝、路由确实在训练（使用率逐层显著偏离均匀）；本轮修掉的三处缺陷都在 eval 段、不碰训练，判词方向在「补丁版预演」与「修好后重训版」两套读数上一致（`analysis.md` §4.3）。② **设计问题：部分成立，已量化**——本格按单因素纪律只有 top-1 且 `aux_weight = 0`（均衡属 4.2），而实测浅层路由已集中（E4-s1 层 1 有一专家只剩 393 个 token、E8-s1 层 1 有一个只剩 10 个）⇒ 「均衡缺位」与「容量兑现不了」在本格读数上分不开；同时 token/param 只有 2.34 / 1.23（dense 7.23）⇒ E8 臂的欠拟合风险最大。但**旁证把「纯容量」这一半答掉了**：等参数（41.97M）而每 token 4× 算力的稠密臂比 MoE-E4 好 0.018（两 seed 同向、越带）⇒ 「参数多但每 token 走狭窄路径」本身不产生收益，不是单纯「没喂饱」。③ **机制在本尺度：只能说「本设计下无信号」**——`laws: [10]` 的口径：本格满足「等激活算力」「配对窗口」「两 seed」「活性可观测」，但**不满足**业界兑现 MoE 的两个前提（大 token 预算、有负载均衡），所以结论只能是「本设计（无均衡、低 token/param、E∈{4,8} 低端两点）下无信号」，**不得**读成「稀疏激活专家机制无效」。"
conclusion: "本项在 13M 尺度上的本地判决已做（`experiments/2611-moe-topk-vs-dense-same-active-macs-13m`，条件全部同预登记：13M 基底 `d=256 / L=12 / H=8`、enwik8 字符级、6000 步 × bs32 × T=512 = 98,304,000 token/臂、seed 0 与 1、20 批 × bs16 配对 clean bpc、0.014 bpc 带、top-1 权重归一、`aux_weight = 0`）：**每 token 专家激活 MACs 与 stock dense 逐位相等（9,437,184，比值恰 1.000000；路由器多花 +0.13% / +0.26%）的前提下，把每层 FFN 换成 E=4 或 E=8 个 top-1 专家，在本尺度买不到可测质量。** ① **主判（等激活算力，Δ = bpc(dense-B0) − bpc(MoE)，正 = MoE 更好）**：E4 **−0.01057 / −0.00186**（两 seed 都落 0.014 带内）、E8 **−0.02280 / −0.01315**（s0 越负带 1.63×、s1 落带内 0.94×）⇒ 按 `verdict_rules` 分别判 **同激活算力下不可排序（买不到质量）** 与 **本 n 下不可排序**；两 seed 方向都是负的（E4 t = −5.71 / −1.71、E8 t = −11.34 / −6.84）⇒ 数据既不支持「MoE 更好」，也没有在两 seed 上同时证到「MoE 更差」。② **专家数（E4 − E8，低端两点、参数 1.9×）**：**−0.01223 / −0.01128**，两 seed 同向（负）但都落带内 ⇒ 专家数买不到质量；**两点都在低端，结论不外推到 E16+ 或细粒度专家**。③ **旁证（`dense-eqparam-E4`，等参数 41.97M、每 token 4× 算力，不参与主判）**：**−0.01806 / −0.01673**，两 seed 同向、越负带 1.29× / 1.20× ⇒ **MoE 劣于同参数稠密，稀疏/路由本身没有可测的独立贡献**。④ **参数限定必须与判词同段读**：dense-B0 13.6M（token/param 7.227）/ moe-top1-E4 42.0M（3.087×，2.341）/ moe-top1-E8 79.8M（5.869×，1.231）⇒ E8 臂的欠拟合风险最大，**E8 的负读数不得读成「专家越多越差」**。⑤ **路由行为（必须报）**：跨 12 层池化的全局归一化熵 0.9853–0.9985 看似均衡，但**逐层**口径下四条 MoE 臂**全部命中坍缩登记**（`moe-top1-E4-s0` 4/12 层最大占比 > 0.5、`moe-top1-E8-s0` 层 0 的 0.6651、`moe-top1-E4-s1` 层 1 熵 0.4094 / 占比 0.8338、`moe-top1-E8-s1` 层 1 的 0.5282），坍缩集中在**浅层 0–3**、深层接近均匀 ⇒ **池化熵不能用来否证坍缩**（`2610/analysis.md` §4 已把这条口径限制写在前面，本次逐层读数把它坐实）。⑥ **代价侧（申报，不进判词）**：峰值显存 2992.3 → 3930.7（1.31×）/ 4645.6 MiB（1.55×），墙钟 4.03 → 8.24 / 12.66 min；E8 实测 0.1266 s/step（低于元级门 0.14 s/step）。⑦ **判词落点与边界**：按 `falsification` 第一条，本格判「**13M / 98.3M token / 无均衡 / 低端两点这个预算下，等激活算力的稀疏激活专家不产生可测质量增益**」，**不写「MoE 无效」**、不外推到更大 token 预算或更大规模；`status: 被否证` 指本项**在这一格**的命题被否证，不是这条路线在大尺度上的否证。⑧ **实现层证据**：`E=1,top-1` 灌入 stock `mlp` 权重与 dense **逐位相等**、分组前向与朴素前向 `max_abs_diff == 0`、8/8 臂过入场门（`gnorm_max` 3.87–18.66、`grad_skips` 0）、同 seed 下非 FFN 参数逐位拷贝 ⇒ 臂间唯一差异是 FFN。⑨ **定序披露**：为修 harness 侧的接线缺陷（`ledger`/`eval` 的键名、设备对齐、自洽门容差、收尾 print、Δ 对账口径），本实验**六次重绑、三次训练**；现存读数全部由第六次绑定的代码产出（`code_hash_run_py = 7cf7c702…`，产物时间晚于 `bound_at`），判据线、0.014 带、臂清单、配对规则、评测口径、token 预算、步数、种子**一字未动**；第三次训练与「同 checkpoint 预演」的并列表在 `analysis.md` §4.3。"
conclusion_review: "本项现在有本地质量判决（`2611`，n=2），终局结论可复核；当前自评的对象是**判词与预登记规则的一致性**：① 所有 Δ 由 `results.json::pairs` 给出、方向 `comparator_minus_arm`、带分类由 `verdict_rules` 机判，未人工挑选；② 「不可排序」的落点与 `config.json::verdict_rules` 的分支逐字对应（E4 两 seed 都带内、E8 未同时越带、专家数两 seed 都带内、旁证两 seed 都越负带）；③ 参数限定（13.6M / 42.0M / 79.8M、7.227 / 2.341 / 1.231）与判词同段出现；④ 坍缩登记逐层给出、并明写「不单独构成否证」；⑤ 三次训练与六次重绑的定序、以及第三次训练与预演读数的并列，都写在 `analysis.md` §3–§4.3，现存读数全部由最终绑定代码产出。**待独立复核（fresh 上下文、排在执行之后，`harness/SCHEMA.md` §14/§14b）**：判词是否越界（尤其 E8 的「本 n 不可排序」是否被读成「更差」）、旁证是否被误当成等算力对照、坍缩与欠拟合两个解释候选的权重是否被夸大、以及「六次重绑 + 三次训练」的定序链是否被完整交代。"
