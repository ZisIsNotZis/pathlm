argument: "「稀疏激活专家」是「保容量减计算」的专家粒度版：总参数（容量）按 E 放大、每 token 只激活 top-k 个专家 ⇒ 每 token FLOPs 与 dense 同级而容量更大。判定它值不值必须给等 FLOPs 与等参数双对照（`harness/SCHEMA.md` §15），否则无法把「容量增益」与「参数/算力记账」分开。活性（专家使用率）是必须报的对照列，否则无法区分「真扩容」与「路由坍缩」。与 `3.1.5` 通道极化 / 稀疏激活的边界：`3.1.5` 是通道粒度、本项是专家（FFN 块）粒度。"
gaps:
  - "判词只到「13M / 98.3M token / 无均衡 / E∈{4,8} 低端两点」这一格：要判「容量买到但没喂饱」，得把 token 预算抬到 token/param ≈ 7（E8 臂 ≈ 560M token、单臂 ≈ 75 min GPU）"
  - "负载均衡缺位：本格按单因素纪律 `aux_weight = 0`，而实测浅层路由已集中（E4-s1 层 1 占比 0.8338、E8-s1 层 1 一专家只剩 10 个 token）⇒ 「均衡能不能把质量救回来」属 `4.2`，需新契约（Switch 式 aux / aux-loss-free bias 各一对臂 ≈ 35 min GPU）"
  - "专家数只有 E4 / E8 两点（参数 1.9×），且都在低端 ⇒ 结论不外推到 E16+、细粒度专家（`4.3`）或 top-2 / top-k>1"
  - "E=16 的第三点未测：分组前向实测 E=16 仍需 0.2075 s/step ⇒ 20.7 min/臂，撞 20 min 单臂 timeout（元级条件 1/4 裁决改用 E=8）；要补需先把单臂 timeout 或步数写进新契约"
  - "与 `4.2`（路由与负载均衡）/ `4.3`（专家粒度/异构）的边界仍未整合：本格只给「无均衡的均匀 top-1」这一族的读数，三个格子的不重复性由 integrator 核"
  - "拓朴外推未做：更大规模（53.9M / 100M+）与真 BPE 词表下的同一对臂；业界标准 MoE（Switch / GShard / DeepSeekMoE / Mixtral）的跑分线登记在 `axes/7-references/README.md`，做大 token 预算时以它为外部基线"
  - "实现层：分组前向按专家号排序 + `index_select` + `index_add` 的 CUDA 原子累加在 k>1 时不保证位级一致（本格全部 k=1）；真稀疏/路由核（不做 gather 的全量 GEMM）未测，峰值显存随参数线性涨（E8 1.55× dense）"

cost_model: "等效理论量：dense FFN 每 token 过 1 个 FFN（FLOPs ≈ 2·d·h_ff/层）；top-k 专家（E 个）每 token 只过 k 个 ⇒ 每 token FFN 等效 FLOPs ≈ k·2·d·h_ff（与 dense 同形），但总参数 ≈ E·2·d·h_ff（容量约 ×E/k 当激活算力固定）。layer-passes 每 token 仍为 L（层数不变）；tokens-per-forward 每步 1。路由器是 d×E 的极小头（计入每 token 计算）。考虑 pipelining：专家路由是同一前向内按 token 的稀疏 gather，不引入额外顺序依赖，但负载不均会使某些专家成为并行气泡（按期望负载报，不用时间量）。"

