# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "4.1"
axis: "4 专家轴（MoE）"
title: "稀疏激活专家（top-k 路由）"
dir: "axes/4-moe/4.1-sparse-experts"

purpose: "普通 decoder-only transformer 的 FFN 是 dense 的——每个 token 都要过全部 FFN 参数，于是「模型容量（参数量）」与「每 token 计算量（FLOPs）」被绑死：想扩容量就得扩每 token FLOPs。本项要判定：把 FFN 换成稀疏激活专家（每个 token 只按 top-k 路由激活少数专家、其余不参与前向），能否在总参数（容量）远大于 dense 的前提下，把每 token 等效算力压到同尺寸 dense 同级或更低，并在以同 FLOPs dense 为 100% 的质量-代价前沿上占优。"
innovation: "相对普通 decoder-only transformer 的单一大 FFN：每个 FFN 层替换为 E 个专家 FFN + 一个按 token 条件选 top-k（k≪E）的路由器，每个 token 只过 k 个专家。改动量级：总参数 ≈ E·(单个专家参数)（相对 dense 约 ×E/k 当激活算力固定），每 token FFN 等效算力 ≈ k 个专家（相对等容量 dense 约 ×k/E）；路由器只是 d×E 的极小头。主干层数、可见集合、注意力不变。"
expected_effect: "（a）在固定每 token 激活 FLOPs 下抬高总参数/容量（保容量减计算）；（b）代价是路由容量与负载不均衡可能吃掉收益，须放进以同 FLOPs dense 为 100% 的质量-代价前沿；（c）必须报活性（专家使用率分布），否则无法区分「真扩容」与「路由把 token 全塞给少数专家」。"
sota_baseline: "Switch Transformer / GShard（top-1/top-2 稀疏路由）、Mixtral（8 专家 top-2）、DeepSeekMoE（细粒度 + 共享专家）、Qwen-MoE。外部条目 `记忆·未核`（本环境检索不可用，只作设计方向、不作判据；来源 `axes/W-width/PRIOR_ART.md` §W2，该文件待 integrator 退役）。本地锚 = 同尺寸 stock dense（归一为 100%；13M B0 = 1.5074 bpc 快照）。"
gap: "本仓零经验：旧格 W2-expertization 无自有 experiments（MAPPING §1），仅一份「业界已做透」的定性情报。MoE 是业界已大规模验证的成熟路线（「同 FLOPs 更多参数」的唯一规模化路线），**本项最高风险是造轮子（55-review W-04）**；且 13M 尺度上专家数少、意义存疑（SCHEMA §7 规模纪律），须先证明该尺度仍能改变判断。相对 SOTA 的增量必须落在：把「每 token 等效算力 → (序列级质量, 专家使用率分布)」的前沿在 13M 受控设定下量化，并把行业少报的「路由容量与负载」作为并列读数——**不是**把 Mixtral 在 13M 重跑一遍。若给不出相对 SOTA 的实质增量，本项须按 55-review W-03/W-04 降为参照、不立项。"
method: "单因素：固定数据/训练预算与主干形状，只改 FFN 的专家化配置。臂 = {dense FFN（stock）, top-1 路由, top-2 路由}，各臂给等参数（dense 扩到同参数量）与等 FLOPs（dense 缩到同激活 FLOPs）双对照。基底恒为 stock decoder-only。"
validation: "端到端：对照 = 同尺寸 stock dense（等 FLOPs 与等参数双对照，归一为 100%）；客观判据 = 序列级 clean bpc（该不跌/可排序，须越 0.014 噪声带）+ 每 token 等效 FLOPs（该跌或持平）+ 专家使用率分布（活性，防坍缩，必须报）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变 = 因果性与总参数记账一致（不把「减参数」记成「减算力」）。"
objective_criteria: "该涨：同 FLOPs 下的有效容量/参数量；该不跌/可排序：clean bpc（相对同 FLOPs dense，须越 0.014 噪声带）；该均衡：专家使用率分布（防坍缩）；必须不变：因果性；必须报：路由器额外参数与计算、总参数记账。"
falsification: "若在等参数对照下，MoE 相对同 FLOPs dense 的 clean bpc 不占优（越噪声带变差或持平）且无法由使用率分布解释 ⇒ 判本尺度稀疏激活专家不产生新知识；若专家使用率坍缩（少数专家吃掉绝大多数 token）且无法用均衡机制修复 ⇒ 判该机制在本尺度失效。"
failure_analysis: ""
conclusion: ""
conclusion_review: "本项无本地判决（旧格 W2 本地零经验、无自有 experiments），故 `status: 未开始`。按 55-review W-03/W-04 把「造轮子」风险写进 `gap`（MoE 是业界成熟路线，增量必须显式声明，否则降参照），按 W-13 不再保留「todo 待补做」与「prior_art 检索不可用」的自相矛盾口径，按 W-17 成本口径改为等效理论量。判据按 `docs/research-schema.md` 预登记（等 FLOPs/等参数双对照 + 客观判据 + 口径 + 否证条件），并把「专家使用率分布」列为必须报的活性对照列。独立复核未做。"
experiments: []
argument: "「稀疏激活专家」是「保容量减计算」的专家粒度版：总参数（容量）按 E 放大、每 token 只激活 top-k 个专家 ⇒ 每 token FLOPs 与 dense 同级而容量更大。判定它值不值必须给等 FLOPs 与等参数双对照（`SCHEMA.md` §15），否则无法把「容量增益」与「参数/算力记账」分开。活性（专家使用率）是必须报的对照列，否则无法区分「真扩容」与「路由坍缩」。与 `3.1.5` 通道极化 / 稀疏激活的边界：`3.1.5` 是通道粒度、本项是专家（FFN 块）粒度。"
gaps:
  - "本仓零经验：需先做最小判决（13M、{dense, top-1, top-2} 三臂 + 等 FLOPs/等参数双对照，matched-step，报 clean bpc + 每 token 等效 FLOPs + 专家使用率分布）"
  - "与 4.2（路由与负载均衡）/ 4.3（专家粒度/异构）的边界未整合（由 integrator 核不重复）"
  - "造轮子风险最高项（55-review W-04）：须在最小判决里明确「相对 Switch/Mixtral/DeepSeekMoE 的增量」是什么，否则结论无新知识"
  - "13M 尺度的 MoE 意义存疑（SCHEMA §7）：专家数少，须先证明该尺度仍能改变「某种算力路径值不值」的判断"
cost_model: "等效理论量：dense FFN 每 token 过 1 个 FFN（FLOPs ≈ 2·d·h_ff/层）；top-k 专家（E 个）每 token 只过 k 个 ⇒ 每 token FFN 等效 FLOPs ≈ k·2·d·h_ff（与 dense 同形），但总参数 ≈ E·2·d·h_ff（容量约 ×E/k 当激活算力固定）。layer-passes 每 token 仍为 L（层数不变）；tokens-per-forward 每步 1。路由器是 d×E 的极小头（计入每 token 计算）。考虑 pipelining：专家路由是同一前向内按 token 的稀疏 gather，不引入额外顺序依赖，但负载不均会使某些专家成为并行气泡（按期望负载报，不用时间量）。"

