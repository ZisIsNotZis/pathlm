# 研究项 SSOT：契约见 docs/research-schema.md，布局见 docs/structure.md §12。
id: "4.2"
axis: "4 专家轴（MoE）"
title: "路由与负载均衡"
dir: "axes/4-moe/4.2-routing-balance"

purpose: "稀疏激活专家靠路由器决定「哪些 token 去哪个专家」。若路由自发集中，少数专家吃掉绝大多数 token（路由坍缩 / 负载不均），有效容量就塌回那几个专家、并行负载倾斜，「保容量减计算」的前提名存实亡。本项要判定：负载均衡与路由稳定机制能否让专家使用率分布接近均匀（或至少不坍缩），使 MoE 的容量增益真实可用。"
innovation: "相对朴素 top-k 路由器：加负载均衡机制——aux loss（对专家使用率加惩罚）/ capacity factor（每专家限流，超出 token 丢弃或重路由）/ router z-loss（稳定路由 logits）/ expert-choice 路由（专家挑 token 而非 token 挑专家），改变路由器的训练目标或指派方式，使每个 batch 内 token 在专家上的分布不塌。改动量级：只改路由器与损失项，不改变专家 FFN 结构与总参数；额外每 token 计算 = d×E 路由 logits + 损失项。"
expected_effect: "（a）专家使用率分布趋于均衡（活性判据，该均衡）；（b）代价是均衡损失可能拉低主任务质量，须放进质量-代价前沿；（c）路由稳定性——不同 seed / 不同 batch 的专家指派不应剧烈翻转（该稳定）。"
sota_baseline: "Switch Transformer aux loss（arXiv 2101.03961）、GShard capacity factor（arXiv 2006.16668）、Expert Choice Routing（arXiv 2202.09368）、ST-MoE router z-loss（arXiv 2202.08906）、DeepSeek-V3 aux-loss-free bias 均衡（arXiv 2412.19437）。出处已于本轮联网核实 arXiv 标题（`.scratch/65-axis4-moe/TICKET.md` §4）；机制系数/超参只作方向引用、不作判据。本地锚 = 同尺寸 stock dense（归一为 100%）与无均衡的朴素 top-k 路由（`4.1`）。"
gap: "本仓零经验（无旧格；MAPPING §2）。业界均衡机制成熟（Switch/GShard/expert-choice），**本项最高风险是造轮子**。**相对 SOTA 的具体增量**：Upstream 多报大尺度吞吐与「均衡后不崩」，本项把「均衡强度 → (序列级质量, 使用率分布, 跨 seed 路由指派翻转率)」的**三元前沿**在 13M/单任务受控量化，并把「**小尺度上均衡是否必要**」做成可失败判据（13M 尺度上专家数少、坍缩是否能观测本身存疑）——小尺度「均衡收益 vs 均衡损失的主任务代价」是行业少报的空白，而不是把 Switch aux loss 再实一遍。前提探针（`4.1` 的 `2610`）：13M、top-1、无 aux loss 下使用率分布是否可观测坍缩。"
method: "单因素：固定专家数、top-k 与主干形状，只改均衡机制。臂 = {无 aux loss（朴素 top-k 路由）, aux loss（λ 扫描）, capacity factor, expert-choice 路由}；各臂共享同一专家数与每 token 激活专家数 k。基底恒为 stock decoder-only，专家本体复用 `4.1` 的最小 MoE。"
validation: "端到端：对照 = 无均衡的朴素 top-k 路由 + 同尺寸 stock dense（归一为 100%）；客观判据 = 专家使用率分布（熵上升 / 最大占比下降，该均衡）+ 序列级 clean bpc（该不跌/可排序，须越 0.014 噪声带）+ 跨 seed 路由指派稳定性（该稳定）；口径 = matched-step / 同 token 预算，**墙钟不进判据**；必须不变 = 总参数与每 token 激活专家数 k。 判据带（C1 裁决）：0.014 bpc 带限配对 Δ、≥5 窗口；使用率 / 路由类指标按 prompt 聚类 bootstrap / Wilson CI 主判，不跨量纲借用 0.014。"
objective_criteria: "该均衡：专家使用率分布（熵上升 / 最大占比下降）；该不跌/可排序：clean bpc（相对朴素路由与 stock dense，须越 0.014 噪声带）；该稳定：跨 seed/batch 的路由指派（翻转率或 JS 散度下降）；必须不变：每 token 激活专家数 k 与总参数。"
falsification: "若加均衡机制后使用率分布仍坍缩到少数专家（熵不升、最大占比不降）⇒ 判该机制在本尺度失效；注：前提探针（`2610`）显示**朴素 top-k 在本尺度（单臂/单 seed/1200 步）不自发坍缩**，故本条的「仍坍缩」分支在**本轮探针口径下尚无先验可触发性**；但探针是**无均衡**的单臂，capacity factor 截断 / expert-choice 指派**自身可制造偏斜**，该分支的前提（加均衡机制后）从未被测 ⇒ 均衡的真候选判据是「它是否提高质量 / 降低偏斜」而非「修复坍缩」。若均衡机制的 clean bpc 代价吃光全部容量收益（等 FLOPs 对照下不占优）⇒ 判均衡在本尺度不划算；若跨 seed 路由指派剧烈翻转、给不出稳定结论 ⇒ 判该尺度下路由不可作硬指标。 用哪个带（C1 裁决）：0.014 bpc 带（限配对 Δ、≥5 窗口）；使用率 / 路由翻转率类指标走配对 CI、不借用 0.014。"
failure_analysis: ""
conclusion: "本项自身命题（均衡机制是否值得）的本地判决尚未做（无 aux loss/capacity factor/expert-choice 四臂读数）。当前已有本地工作：**前提探针**（`4.1` 的 `2610-moe-arm-ledger-13m/probe_collapse_1200.json` + `analysis.md` §4）——13M、top-1、**无 aux loss**、seed 0、1200 步：专家使用率归一化熵全程 **0.952–0.983**（几乎平，斜率 +1.5e-5/步）、最大占比 **0.178–0.214**（均匀值 0.125）、无专家死亡⇒ **在该尺度/该预算下朴素 top-k 路由不自发坍缩**（熵**全程不下移**，斜率 +1.5e-5/步；注：预登记阀值在随机初始化第 1 步即已满足、命中近乎必然，故以斜率与偏斜为主证）；但存在温和持久的偏斜（专家 3/7 长期约 1.3–1.5× 均匀份额）。使用率为**跨 12 层池化**口径（不分辨整层坍缩），逐层活性列已加进 `run.py` 供下一阶段。该探针为**单臂、1200 步快照、无质量对照**，不能当均衡机制判决也不能外推；它指向的意义是：本尺度下均衡的价值必须改从「它是否提高质量」去测，而不再能靠「修复坍缩」立论。"
conclusion_review: "本项无终局结论（`status: 未开始`，65-F1 降为 Backlog）：前提探针（单臂、无质量对照）不能当均衡机制判决。当前自评 + 独立复核对象 = 前提探针的证据与解释；复核判词见 `.scratch/65-axis4-moe/REVIEW-1.md`。判据按 `docs/research-schema.md` 预登记（对照 + 客观判据 + 口径 + 否证条件），「专家使用率分布」与「跨 seed 路由稳定性」为必须报的活性对照列（`SCHEMA.md` 活性判据）。与 `4.1` 的边界：`4.1` 测 top-k 稀疏激活本身，本项只改均衡机制。"
