argument: "路由均衡是「保容量减计算」成立的前提：专家使用率一坍缩，总参数的优势就名存实亡，读到的质量只反映少数专家。因此活性（使用率分布）必须是**可失败的判据**而不是装饰读数（`SCHEMA.md` 活性判据）；「均衡收益」与「均衡损失的主任务代价」必须在同一质量-代价前沿上一起报。与 `4.1` 划界：`4.1` 的臂不含均衡机制（朴素 top-k），本项只改均衡机制、专家本体与 k 固定。"
gaps:
  - "本仓零经验：需先做最小判决（13M、{朴素 top-k, aux loss λ 扫描, capacity factor, expert-choice} 四臂，报 clean bpc + 使用率分布 + 跨 seed 翻转率）"
  - "前提探针（`2610`）显示 13M/top-1/1200 步内朴素 top-k **不自发坍缩** ⇒ 均衡四臂的判据应从「修复坍缩」改为「均衡机制对质量/稳定性的增量」，否则判据无对象（下一步最小实验的成本：四臂 × 同 token 预算）"
  - "探针为 1200 步快照（未收敛）+ 单 seed + 无 aux 对照，不能当结论（§16/§17.11）"
  - "与 4.1（稀疏激活本体）/ 4.3（专家粒度）的边界未整合（由 integrator 核不重复）"
  - "造轮子风险最高项：须明确「相对 Switch aux loss / GShard capacity factor / expert-choice 的增量」是什么"
  - "13M 尺度的负载均衡意义存疑（SCHEMA §7）：专家数少，坍缩是否可观测须先证明"
  - "65-F1 裁决：本项降为 **Backlog**（不在 13M 花算力做 MoE 判决），保留本仓等效代价口径记录（前提探针 `2610`）；业界标准 MoE（Switch / GShard / DeepSeekMoE）的跑分线登记在 `axes/7-references/README.md`，将来做大 token 预算时以它为外部基线"
cost_model: "等效理论量：均衡机制只改路由器与损失项——每 token 额外计算 = d×E 路由 logits + 一个 batch 级 aux/z-loss 归约；专家 FFN 的每 token 等效 FLOPs 与 `4.1` 相同（k 个专家 × 2·d·h_ff）；layer-passes 每 token 仍为 L；tokens-per-forward 每步 1。考虑 pipelining：capacity factor 的截断/重路由是同一前向内的稀疏指派，不引入额外顺序依赖；expert-choice 需要按专家排序 token，仍是同一步内的 gather（按期望负载报，不用时间量）。"

